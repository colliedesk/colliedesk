name: colliedesk

services:
  postgres:
    image: postgres:17-bookworm
    # Every test builds its own schema with all migrations; the default lock table (64 per
    # connection) runs out once many of them run at once ("out of shared memory", 53200).
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_DB: colliedesk
      POSTGRES_USER: colliedesk
      POSTGRES_PASSWORD: colliedesk
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55441}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U colliedesk -d colliedesk"]
      interval: 3s
      timeout: 3s
      retries: 15
  # One-shot: applies migrations before the server starts. The image entrypoint is the binary,
  # so `command` holds only the subcommand.
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://colliedesk:colliedesk@postgres:5432/colliedesk?sslmode=disable
      DATABASE_REQUEST_URL: postgres://colliedesk_request:colliedesk@postgres:5432/colliedesk?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://colliedesk:colliedesk@postgres:5432/colliedesk?sslmode=disable
      # Requests run as a login that can only take the row-level security role; migrate creates it.
      DATABASE_REQUEST_URL: postgres://colliedesk_request:colliedesk@postgres:5432/colliedesk?sslmode=disable
      APP_ORIGIN: http://localhost:${COLLIE_DESK_PORT:-8080}
      OPERATOR_ORIGIN: ${OPERATOR_ORIGIN:-}
      LISTEN_ADDR: :8080
      # Every other setting lives in the database: collie config, or the operator console.
      MAILBOX_TOKEN_KEYS: ${MAILBOX_TOKEN_KEYS:-}
      # Secrets stay readable from .env until a key ring seals them in the database (docs/self-host/environment-variables.md#no-key-ring).
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_INBOUND_SECRET: ${MAIL_FROM_INBOUND_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      AI_SERVER_API_KEY: ${AI_SERVER_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      ATTACHMENTS_DIR: /data/attachments
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
    ports:
      - "127.0.0.1:${COLLIE_DESK_PORT:-8080}:8080"
    volumes:
      - attachments-data:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["serve"]

  # SMTP sink for the end-to-end tests (make e2e): docker compose --profile test up -d mailpit
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["test"]
    ports:
      - "127.0.0.1:55425:1025"
      - "127.0.0.1:55426:8025"

volumes:
  postgres-data:
  attachments-data:
