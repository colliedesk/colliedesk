<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the saved theme while the head is parsed, before first paint, so a dark choice never paints light.
         Same key and rule as src/lib/theme.ts; light is the default whatever the OS prefers. -->
    <script>try{if(localStorage.getItem('colliedesk.theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
    <meta name="theme-color" content="#f5f7fa" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Colliedesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
