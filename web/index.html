<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <!-- Set the saved theme while the head is parsed, before first paint, so a dark choice never paints light.
         Same key and rule as src/lib/theme.ts; light is the default whatever the OS prefers. The theme-color
         tag above is rewritten here, so it must come first. -->
    <script>try{if(localStorage.getItem('colliedesk.theme')==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('meta[name="theme-color"]').content='#0a0a0a'}}catch(e){}</script>
    <link rel="icon" href="/favicon.ico?v=1d13a9925a" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=e701d34e30" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=f845671091" />
    <title>Colliedesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
