        - text: (đổi tên từ
        - code [ref=f2e63]: kb_images
        - text: ", thêm"
        - code [ref=f2e64]: kind
        - text: ). Ảnh dán trong editor tự vào thư viện.
      - listitem [ref=f2e65]:
        - text: "Video không transcode: MP4 (H.264/AV1 + AAC) và WebM (VP8/VP9/AV1 + Opus). Từ chối HEVC kèm hướng dẫn."
        - code [ref=f2e66]: .mov
        - text: H.264 được nhận nếu qua cổng kiểm 3 trình duyệt ở PR 3, không qua thì từ chối.
      - listitem [ref=f2e67]:
        - text: 200 MiB/video (≈10 phút ghi màn hình 1080p), tính quota như ảnh; self-host đổi bằng
        - code [ref=f2e68]: KB_VIDEO_MAX_BYTES
        - text: .
      - listitem [ref=f2e69]: Upload chia mảnh 8 MiB, resume được (4 route riêng, không dùng tus); có tiến độ, Pause/Resume, tự thử lại.
      - listitem [ref=f2e70]:
        - text: Server tự đọc box MP4/EBML (không cần ffmpeg) để nhận diện file, lấy thời lượng, kích thước, codec. Box metadata ở mọi cấp đổi thành
        - code [ref=f2e71]: free
        - text: ; track ngoài video/audio bị xoá trắng; file không hỏng.
