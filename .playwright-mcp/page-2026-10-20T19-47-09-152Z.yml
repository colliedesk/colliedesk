  - heading "Làm trong 6 PR, khoảng 33–41 giờ agent (chưa tính chờ CI và review)" [level=2] [ref=f2e1761]
  - table [ref=f2e1763]:
    - rowgroup [ref=f2e1764]:
      - row [ref=f2e1765]:
        - columnheader "PR" [ref=f2e1766]
        - columnheader "Nội dung" [ref=f2e1767]
        - columnheader "Giờ agent" [ref=f2e1768]
      - row [ref=f2e1769]:
        - cell "1. Media data + API đọc/sửa" [ref=f2e1770]
        - cell "Đổi tên → kb_media, cột mới, current, linkKBMedia hai path, purge + kept, lọc EXIF + Orientation, thumbnail, backfill, list/details/PATCH, Unused + summary, contract, tier, MCP, test khác workspace, export, gate latency" [ref=f2e1771]
        - cell "7–8 h" [ref=f2e1772]
      - row [ref=f2e1773]:
        - cell "2. Thùng rác, hàng loạt, replace" [ref=f2e1774]
        - cell "trash / trash-unused / restore / purge (admin), Undo theo lô, tự khôi phục, replace + undo, translation, MCP, Freshdesk" [ref=f2e1775]
        - cell "5–6 h" [ref=f2e1776]
      - row [ref=f2e1777]:
        - cell "3a. Video upload + serve" [ref=f2e1778]
        - cell "Phiên chia mảnh (khoá hàng, read deadline, giữ chỗ, đổi tên file), parser + allowlist brand/codec/handler, xoá metadata + track, ma trận xoay, fuzz + mẫu MP4 H.264 thật, ServeContent, poster theo sha, export video, 5 tool MCP video, cổng kiểm .mov/iPhone/GoPro" [ref=f2e1779]
        - cell "7–9 h" [ref=f2e1780]
      - row [ref=f2e1781]:
        - cell "3b. Help center render" [ref=f2e1782]
        - cell [ref=f2e1783]:
          - text: Renderer riêng cho khối HTML
          - code [ref=f2e1784]: <video>
          - text: /iframe → bluemonday; chèn poster/width/height từ DB; CSP media-src; CI lạnh khi đổi go.sum
        - cell "3–4 h" [ref=f2e1785]
      - row [ref=f2e1786]:
        - cell "4. Web Media library" [ref=f2e1787]
        - cell "Tab, lưới ảnh + video, upload chia mảnh XHR có tiến độ/resume, panel (Choose frame), trang Unused + chọn nhiều + Undo, thùng rác + Delete forever, e2e WebM" [ref=f2e1788]
        - cell "7–8 h" [ref=f2e1789]
      - row [ref=f2e1790]:
        - cell "5. Editor CodeMirror + preview + docs" [ref=f2e1791]
        - cell "Nút Media + picker, chèn qua upload.ts (widget %), transform preview <video>, docs user/self-host (body size proxy, dung lượng)" [ref=f2e1792]
        - cell "3–4 h" [ref=f2e1793]
  - paragraph [ref=f2e1794]:
    - text: "Chờ: CI ~2–3 phút/lần × vài lần mỗi PR, cộng review của maintainer. PR 4 và 5 làm song song sau PR 1–3b. Đã cộng ~4–6 giờ cho các điểm phản biện. Để sau: transcode tuỳ chọn, upload từ URL (chặn SSRF), S3, phụ đề"
