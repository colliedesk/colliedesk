        - text: ": số lượng + dung lượng giải phóng được, chọn nhiều, \"Move all unused to trash\", Undo theo lô."
      - listitem [ref=f2e93]: "\"Unused\" = không bài sống nào (draft/published) có bản hiện tại dùng tới. Media chỉ còn trong bài đã xoá hoặc version cũ thì có nhãn riêng, vẫn xoá được."
