version: 2
# web/ is not listed: Dependabot runs its own pnpm major instead of the packageManager pin
# and would rewrite pnpm-lock.yaml with it. Web dependencies are bumped by hand with corepack.
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # GitHub cannot serve the v7.0.0 commit archive (codeload 404), so runners fail to fetch it.
      - dependency-name: actions/setup-go
        versions: ["7.0.0"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
