name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# A newer push to a PR cancels its older run. On main a run never cancels the running one, but
# GitHub keeps only one pending run per group, so a burst of merges skips the middle commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push to main whose files a pull request run from this repository already passed in full
  # (an up-to-date branch merged with a merge commit) skips the test jobs below and keeps image and
  # roadmap: GitHub Free runs 20 jobs at once for the account, and while other pull requests hold
  # them a full main run queued past 120 seconds, so edge did not move. Any doubt runs every job.
  pr-verified:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - id: decide
        name: Did a pull request run pass on these exact files?
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr-verified.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  go:
    needs: pr-verified
    if: ${{ !cancelled() && needs.pr-verified.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start test services in the background
        run: sh .github/scripts/ci-services.sh start postgres
      # setup-go downloads its toolchain on every job (7 to 19 seconds, measured 2026-10-20) unless the
      # tool cache already holds it. Given the exact newest release, it never settles for an older
      # cached patch.
      - id: go-release
        name: Find the newest Go 1.27 release
        # Without it, setup-go resolves 1.27.x itself and downloads the toolchain as before.
        continue-on-error: true
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | python3 .github/scripts/go-release.py 1.27 >> "$GITHUB_OUTPUT"
      - name: Restore the Go toolchain
        if: steps.go-release.outputs.version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.go-release.outputs.version }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-release.outputs.version }}
      - id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ steps.go-release.outputs.version || '1.27.x' }}
          cache: false
      # setup-go's own cache is keyed on go.sum alone: saved once, never refreshed while the code
      # moves, and empty after a go.sum change. Each main run saves under its commit instead, and a
      # run restores the newest one with the same go.sum, else the newest one at all. No key may
      # match setup-go-*: actions/cache searches the pull request's ref before main's, and CodeQL's
      # setup-go saves a build-only entry there, which shadowed main's entry with the test builds.
      - name: Restore the Go build cache of the newest main run
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
            go-${{ runner.os }}-
      # Compiling, linking and listing every test binary need no database, so they run while
      # PostgreSQL starts (the wait took up to 16 seconds after the cache restore); go test reuses
      # the cached binaries below. A listing that ever needs the database fails this step.
      - name: Format, compile and list the tests
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; echo 'gofmt: format the files above' >&2; exit 1; fi
          go test -c -o "$RUNNER_TEMP/go-test-binaries/" ./...
          go test -list . ./... > "$RUNNER_TEMP/go-test-list.txt"
          # Five regular shards of three go test processes each, and three latency shards that run their
          # gates as one process (about 100 seconds of gates in run 39903507509), then regular tests if
          # their gates end early. Each test weighs its time in CI (go-test-timings.json);
          # go-test-shard.py says how a shard's time is estimated, go-test-timings.py how to refresh it.
          python3 ../.github/scripts/go-test-shard.py "$SHARD" "$SHARDS" --parts 3 --latency-shards 3 --parallel 2.7 --process-seconds 11 --timings ../.github/go-test-timings.json < "$RUNNER_TEMP/go-test-list.txt" > "$RUNNER_TEMP/go-test-patterns.txt"
      - name: Wait for test services
        run: sh .github/scripts/ci-services.sh wait postgres
      - name: Test
        working-directory: server
        # Patterns run at once; a '--' line waits for the ones before it. -v prints each test's time
        # for go-test-timings.py.
        run: |
          pids=()
          status=0
          while IFS= read -r pattern; do
            if [ "$pattern" = '--' ]; then
              for pid in "${pids[@]}"; do wait "$pid" || status=1; done
              pids=()
              continue
            fi
            go test -count=1 -run "$pattern" -v ./... &
            pids+=($!)
          done < "$RUNNER_TEMP/go-test-patterns.txt"
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          exit "$status"
      # go-cache.yml saves main's entry on every push. A pull request whose go.sum main has not cached
      # yet (a new module) saves once, on its own ref, so its next runs skip compiling that module
      # (the Anthropic SDK: about 23 seconds per job). Only shard 7 uploads, so one job pays for it.
      - if: >-
          github.event_name == 'pull_request' && matrix.shard == 7 &&
          !startsWith(steps.go-cache.outputs.cache-matched-key, format('go-{0}-{1}-{2}-', runner.os, steps.go.outputs.go-version, hashFiles('server/go.sum')))
        name: Save the Go build cache of a new go.sum
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
  web:
    needs: pr-verified
    if: ${{ !cancelled() && needs.pr-verified.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Unit tests
        working-directory: web
        # The type check runs in the e2e job, and the bundle budget after the e2e job's own Vite build
        # of the same commit: Vitest is this job's long pole.
        run: corepack pnpm test
  # The browser tests outside onboarding, in shards: one job ran them in 48 of its 117 seconds
  # (run 39902604105) and set the end of the whole run. With --fully-parallel Playwright splits by
  # test, not by file. Each shard builds the app itself while Chromium installs, so sharing a build
  # would only add a job in front of them. A third shard would pass the account's runner limit
  # (RunnerConcurrency in tests/ci-tools-test.py).
  e2e:
    needs: pr-verified
    if: ${{ !cancelled() && needs.pr-verified.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
      # The arguments of every shard's run, and of the check that the shards cover them.
      E2E_ARGS: --grep-invert @onboarding --fully-parallel --workers=3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start test services in the background
        run: sh .github/scripts/ci-services.sh start postgres
      # setup-go downloads its toolchain on every job (7 to 19 seconds, measured 2026-10-20) unless the
      # tool cache already holds it. Given the exact newest release, it never settles for an older
      # cached patch.
      - id: go-release
        name: Find the newest Go 1.27 release
        # Without it, setup-go resolves 1.27.x itself and downloads the toolchain as before.
        continue-on-error: true
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | python3 .github/scripts/go-release.py 1.27 >> "$GITHUB_OUTPUT"
      - name: Restore the Go toolchain
        if: steps.go-release.outputs.version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.go-release.outputs.version }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-release.outputs.version }}
      - id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ steps.go-release.outputs.version || '1.27.x' }}
          cache: false
      # setup-go's own cache is keyed on go.sum alone: saved once, never refreshed while the code
      # moves, and empty after a go.sum change. Each main run saves under its commit instead, and a
      # run restores the newest one with the same go.sum, else the newest one at all. No key may
      # match setup-go-*: actions/cache searches the pull request's ref before main's, and CodeQL's
      # setup-go saves a build-only entry there, which shadowed main's entry with the test builds.
      - name: Restore the Go build cache of the newest main run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
            go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      # The Vite build and the servers' compile also run while Chromium installs: the test servers'
      # `go run` then finds this commit's packages, embedded app included, in the Go cache. The
      # tests wait for it, so it starts first and the checks below yield the cores to it (nice).
      - name: Build the app and compile the test servers in the background
        run: |
          sh .github/scripts/ci-background.sh start app sh -c \
            'cd web && corepack pnpm exec vite build && cd ../server && go build -tags e2e -o /dev/null ./cmd/collie && go build -o /dev/null ./cmd/collie'
      # The API drift and TypeScript checks of the web app, go vet and migration validation run here,
      # in the background while Chromium installs and the database starts: this job finished at 56
      # seconds, while each of them made the job it ran in end later (the web job, the Go shards).
      # They run once, on the last shard, as does the check that the shards cover every test.
      - name: Start the type check, go vet and migration validation in the background
        if: matrix.shard == strategy.job-total
        run: |
          (cd web && sh ../.github/scripts/ci-background.sh start typecheck nice -n 10 corepack pnpm typecheck)
          (cd server && sh ../.github/scripts/ci-background.sh start vet nice -n 10 sh -c 'go vet ./... && go run ./cmd/migration-check --repo=..')
      # In the foreground it took 10 seconds before Chromium could install (run 39904636025).
      - name: Start the check that the shards run every end-to-end test exactly once
        if: matrix.shard == strategy.job-total
        working-directory: web
        env:
          SHARDS: ${{ strategy.job-total }}
        # E2E_ARGS is split into words on purpose, here and in the run below.
        run: |
          # shellcheck disable=SC2086
          sh ../.github/scripts/ci-background.sh start shards nice -n 10 \
            python3 ../.github/scripts/e2e-shard-check.py "$SHARDS" -- corepack pnpm exec playwright test $E2E_ARGS
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --only-shell chromium
      - name: Point the test servers at the restored Go cache
        run: for name in GOPATH GOMODCACHE GOCACHE; do echo "$name=$(go env "$name")"; done >> "$GITHUB_ENV"
      - name: Wait for test services
        run: sh .github/scripts/ci-services.sh wait postgres
      - name: Run end-to-end workflows
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          # shellcheck disable=SC2086
          sh ../.github/scripts/ci-background.sh wait app && corepack pnpm e2e $E2E_ARGS --shard="$SHARD/$SHARDS"
      - name: The production bundle stays within its size budget
        if: ${{ !cancelled() }}
        working-directory: web
        run: corepack pnpm bundle:check
      - name: The web app type-checks and matches the API contract
        if: ${{ !cancelled() && matrix.shard == strategy.job-total }}
        run: sh .github/scripts/ci-background.sh wait typecheck
      - name: go vet passes and the migrations are valid
        if: ${{ !cancelled() && matrix.shard == strategy.job-total }}
        run: sh .github/scripts/ci-background.sh wait vet
      - name: The shards run every end-to-end test exactly once
        if: ${{ !cancelled() && matrix.shard == strategy.job-total }}
        run: sh .github/scripts/ci-background.sh wait shards
  # The customer onboarding journeys listed in AGENTS.md. A separate job so they run in parallel
  # with the other end-to-end tests; every test runs in exactly one of the two jobs.
  onboarding:
    needs: pr-verified
    if: ${{ !cancelled() && needs.pr-verified.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Import journeys take about as long as all other onboarding journeys.
          # Complementary lookaheads cover every @onboarding test exactly once.
          - journey: import
            pattern: '^(?=.*@onboarding)(?=.*freshdesk import:)'
          - journey: other
            pattern: '^(?=.*@onboarding)(?!.*freshdesk import:)'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
      MAILPIT_SMTP_PORT: '1025'
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start test services in the background
        run: sh .github/scripts/ci-services.sh start postgres mailpit
      # setup-go downloads its toolchain on every job (7 to 19 seconds, measured 2026-10-20) unless the
      # tool cache already holds it. Given the exact newest release, it never settles for an older
      # cached patch.
      - id: go-release
        name: Find the newest Go 1.27 release
        # Without it, setup-go resolves 1.27.x itself and downloads the toolchain as before.
        continue-on-error: true
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | python3 .github/scripts/go-release.py 1.27 >> "$GITHUB_OUTPUT"
      - name: Restore the Go toolchain
        if: steps.go-release.outputs.version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.go-release.outputs.version }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-release.outputs.version }}
      - id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ steps.go-release.outputs.version || '1.27.x' }}
          cache: false
      # setup-go's own cache is keyed on go.sum alone: saved once, never refreshed while the code
      # moves, and empty after a go.sum change. Each main run saves under its commit instead, and a
      # run restores the newest one with the same go.sum, else the newest one at all. No key may
      # match setup-go-*: actions/cache searches the pull request's ref before main's, and CodeQL's
      # setup-go saves a build-only entry there, which shadowed main's entry with the test builds.
      - name: Restore the Go build cache of the newest main run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
            go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --only-shell chromium
      - name: Point the test servers at the restored Go cache
        run: for name in GOPATH GOMODCACHE GOCACHE; do echo "$name=$(go env "$name")"; done >> "$GITHUB_ENV"
      - name: Wait for test services
        run: sh .github/scripts/ci-services.sh wait postgres mailpit
      - name: Run onboarding journeys
        working-directory: web
        env:
          JOURNEY_PATTERN: ${{ matrix.pattern }}
        run: corepack pnpm exec vite build && corepack pnpm e2e --grep "$JOURNEY_PATTERN"
  # Builds the server image once, boots it, then runs install.sh exactly as a self-hoster does.
  # On main the image is pushed as sha-<commit>; publish-edge.yml retags that digest after CI.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Until its migrate step the upgrade test needs only the previous release, so it starts now:
      # it fills that release with the upgrade fixture and tests the backup restores while the image
      # builds, then waits for colliedesk:ci (docs/internals/upgrades.md).
      - name: Start the upgrade test from the previous release in the background
        env:
          UPGRADE_TEST_RESTORE: before
          UPGRADE_TEST_WAIT: '100'
        run: |
          previous=$(sh .github/scripts/previous-release.sh)
          sh .github/scripts/ci-background.sh start upgrade sh tests/upgrade-test.sh "$previous" colliedesk:ci
      - id: version
        run: echo "value=edge-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # The container builder reads and writes the layer cache in the Actions cache (the runner's own
      # Docker driver cannot) and carries the SBOM attestation on main's push.
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is discarded after the job; removing the builder only costs time.
          cleanup: false
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}
          load: true
          tags: colliedesk:ci
          # The Go dependency layer depends only on go.sum and the imported packages
          # (server/Dockerfile), so most commits reuse it. image-cache.yml writes it for every main
          # commit, outside this run's clock; a pull request reads its own entries, then main's.
          cache-from: type=gha,scope=image
      # The boot and install checks run in the background while main pushes and attests the image
      # (about 15 seconds). sha-<commit> may therefore exist for a commit that then fails them;
      # nothing deploys it: edge, which self-hosters and Cloud pull, moves only after CI passed.
      - name: Start the boot and install checks in the background
        env:
          VERSION: ${{ steps.version.outputs.value }}
          COLLIE_DESK_IMAGE: colliedesk:ci
        run: |
          sh .github/scripts/ci-background.sh start image-checks \
            sh -c 'sh tests/image-boot-test.sh colliedesk:ci "$VERSION" && sh tests/install-smoke.sh'
      # compose.yaml as a contributor or "From a clone" self-hoster runs it, built by the builder that
      # holds this commit's layers: only the stage with VERSION builds again.
      - name: Start the stack from compose.yaml in the background
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: sh .github/scripts/ci-background.sh start compose-smoke sh tests/compose-smoke.sh
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same builder and inputs as the loaded image, so this pushes the layers the checks run against.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push tested image as sha-<commit>
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}
          push: true
          sbom: true
          tags: ghcr.io/colliedesk/colliedesk:sha-${{ github.sha }}
      # Signed build provenance bound to the digest; edge is a retag of it, so it verifies too:
      # gh attestation verify oci://ghcr.io/colliedesk/colliedesk:edge -R colliedesk/colliedesk
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/colliedesk/colliedesk
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Image boots against Postgres and install.sh signs in with the printed link
        run: sh .github/scripts/ci-background.sh wait image-checks
      - name: The previous release upgrades to this image without losing a row or a file
        run: sh .github/scripts/ci-background.sh wait upgrade
      - name: The stack from compose.yaml reached the server
        run: sh .github/scripts/ci-background.sh wait compose-smoke

  # The one check to watch: adding or splitting jobs above never renames it.
  # Fails a PR that brings in a dependency version with a known vulnerability (OSV database).
  # Compares the PR against its base, so an advisory published later for an existing
  # dependency does not block unrelated PRs; Scorecard reports those weekly.
  # It starts when roadmap ends (about 40 seconds in) and takes about 20, well before the test jobs
  # end: starting with them it would take the runner the second e2e shard needs.
  osv-scan:
    needs: roadmap
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false

  # ROADMAP.md is read by people deciding whether to move to Colliedesk: every linked item must be
  # an open issue labelled for its section (.github/scripts/roadmap-check.py).
  roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CI shard and elapsed-time contracts
        run: python3 tests/ci-tools-test.py
      - name: Background checks pass on their output and exit status
        run: sh tests/ci-background-test.sh
      - name: Background test services wait for readiness
        run: sh tests/ci-services-test.sh
      - name: Product name spelled Colliedesk
        run: sh tests/brand-name-test.sh
      - name: No webhook secret literals (GitHub secret scanning)
        run: sh tests/webhook-secret-literal-test.sh
      - name: Release tags stay alpha (v0.0.N)
        run: sh tests/release-tag-test.sh
      - name: Release button picks the Cloud commit and the next tag
        run: sh tests/release-next-test.sh
      - name: Upgrade test starts from the release before the candidate
        run: sh tests/previous-release-test.sh
      - name: Roadmap gate rules (stubbed issue lookup)
        run: python3 -I tests/roadmap-check-test.py
      - name: Mail pipe wrapper exit codes
        run: sh tests/mail-pipe-test.sh
      - name: MTA recipient policy answers
        run: python3 -I tests/rcpt-policy-test.py
      - name: Installer argument and failure handling (stubbed Docker)
        run: sh tests/install-test.sh
      - name: ci-ok waits for every job
        run: sh tests/ci-ok-needs-test.sh && sh tests/after-ci-ok-runs-test.sh
      - name: Actions and base images are pinned
        run: sh tests/pinned-dependencies-test.sh
      - name: Pinned action archives are fetchable
        run: sh tests/pinned-actions-fetchable-test.test.sh && sh tests/pinned-actions-fetchable-test.sh
      - name: ROADMAP.md matches the issue tracker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Issues this PR closes ("Closes #N" in its description) must leave the roadmap in this PR.
          if [ -n "$PR_NUMBER" ]; then
            ROADMAP_CLOSING=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | map(tostring) | join(" ")')
            export ROADMAP_CLOSING
            echo "closes: ${ROADMAP_CLOSING:-none}"
          fi
          python3 -I .github/scripts/roadmap-check.py ROADMAP.md

  codeql:
    needs: pr-verified
    if: ${{ !cancelled() && needs.pr-verified.outputs.reuse != 'true' }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  ci-ok:
    if: ${{ !cancelled() }}
    needs: [pr-verified, go, web, e2e, onboarding, image, osv-scan, roadmap, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

      - name: Whole CI phase stays within 120 seconds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          python3 .github/scripts/ci-budget.py --started-at "$started"
