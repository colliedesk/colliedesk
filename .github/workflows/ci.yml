name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. On main a run never cancels the running one, but
# GitHub keeps only one pending run per group, so a burst of merges skips the middle commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: colliedesk_test
          POSTGRES_USER: colliedesk
          POSTGRES_PASSWORD: colliedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U colliedesk -d colliedesk_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Mail pipe wrapper exit codes
        run: sh tests/mail-pipe-test.sh
      - name: Installer argument and failure handling (stubbed Docker)
        run: sh tests/install-test.sh
      - name: Validate migrations
        working-directory: server
        run: go run ./cmd/migration-check --repo=..
      - name: Vet and test
        working-directory: server
        run: go vet ./... && go test ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck, test, and build
        working-directory: web
        run: corepack pnpm typecheck && corepack pnpm test && corepack pnpm build && corepack pnpm bundle:check
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: colliedesk_test
          POSTGRES_USER: colliedesk
          POSTGRES_PASSWORD: colliedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U colliedesk -d colliedesk_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end workflows
        run: make e2e E2E_ARGS='--grep-invert @onboarding'
  # The customer onboarding journeys listed in AGENTS.md. A separate job so they run in parallel
  # with the other end-to-end tests; every test runs in exactly one of the two jobs.
  onboarding:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: colliedesk_test
          POSTGRES_USER: colliedesk
          POSTGRES_PASSWORD: colliedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U colliedesk -d colliedesk_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
      MAILPIT_SMTP_PORT: '1025'
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run onboarding journeys
        run: make e2e E2E_ARGS='--grep @onboarding'
  # Builds the server image once, boots it, then runs install.sh exactly as a self-hoster does.
  # On main the tested image is pushed as sha-<commit>; publish-edge only retags that digest.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=edge-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}
          load: true
          tags: colliedesk:ci
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - name: Boot image against Postgres
        run: sh tests/image-boot-test.sh colliedesk:ci "${{ steps.version.outputs.value }}"
      - name: Install with install.sh and sign in with the printed link
        run: sh tests/install-smoke.sh
        env:
          COLLIE_DESK_IMAGE: colliedesk:ci
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same builder and inputs as the loaded image, so this pushes the layers that just booted.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push tested image as sha-<commit>
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ghcr.io/colliedesk/colliedesk:sha-${{ github.sha }}

  # compose.yaml as a contributor or "From a clone" self-hoster runs it.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack from compose.yaml and reach the server
        run: sh tests/compose-smoke.sh

  # The one check to watch: adding or splitting jobs above never renames it.
  ci-ok:
    if: ${{ !cancelled() }}
    needs: [go, web, e2e, onboarding, image, compose-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ci-ok waits for every job
        run: sh tests/ci-ok-needs-test.sh
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

  # Self-hosters on the edge channel pull this tag, so it moves only after ci-ok, and only for
  # the current head of main: re-running an older run must not move edge backwards.
  publish-edge:
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::main moved to $head; edge stays on the newer commit."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.head.outputs.current == 'true'
        name: Point edge at the tested digest
        run: docker buildx imagetools create -t ghcr.io/colliedesk/colliedesk:edge "ghcr.io/colliedesk/colliedesk:sha-$GITHUB_SHA"
