name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# A newer push to a PR cancels its older run. On main a run never cancels the running one, but
# GitHub keeps only one pending run per group, so a burst of merges skips the middle commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: colliedesk_test
          POSTGRES_USER: colliedesk
          POSTGRES_PASSWORD: colliedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U colliedesk -d colliedesk_test"
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-interval 1s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Validate migrations
        if: matrix.shard == 9
        working-directory: server
        run: go run ./cmd/migration-check --repo=..
      - name: Format, vet and test
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; echo 'gofmt: format the files above' >&2; exit 1; fi
          if [ "$SHARD" = 9 ]; then go vet ./...; fi
          go test -list . ./... > "$RUNNER_TEMP/go-test-list.txt"
          pattern=$(python3 ../.github/scripts/go-test-shard.py "$SHARD" 9 < "$RUNNER_TEMP/go-test-list.txt")
          go test -count=1 -run "$pattern" ./...
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck, test, and build
        working-directory: web
        run: corepack pnpm typecheck && corepack pnpm test && corepack pnpm exec vite build && corepack pnpm bundle:check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: colliedesk_test
          POSTGRES_USER: colliedesk
          POSTGRES_PASSWORD: colliedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U colliedesk -d colliedesk_test"
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-interval 1s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install chromium
      - name: Run end-to-end workflows
        working-directory: web
        run: corepack pnpm exec vite build && corepack pnpm e2e --grep-invert @onboarding --fully-parallel --workers=3
  # The customer onboarding journeys listed in AGENTS.md. A separate job so they run in parallel
  # with the other end-to-end tests; every test runs in exactly one of the two jobs.
  onboarding:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: colliedesk_test
          POSTGRES_USER: colliedesk
          POSTGRES_PASSWORD: colliedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U colliedesk -d colliedesk_test"
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-interval 1s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
      MAILPIT_SMTP_PORT: '1025'
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: corepack pnpm exec playwright install chromium
      - name: Run onboarding journeys
        working-directory: web
        run: corepack pnpm exec vite build && corepack pnpm e2e --grep @onboarding --shard=${{ matrix.shard }}/2
  # Builds the server image once, boots it, then runs install.sh exactly as a self-hoster does.
  # On main the tested image is pushed as sha-<commit>; publish-edge only retags that digest.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "value=edge-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}
          load: true
          tags: colliedesk:ci
      - name: Boot image against Postgres
        run: sh tests/image-boot-test.sh colliedesk:ci "${{ steps.version.outputs.value }}"
      - name: Install with install.sh and sign in with the printed link
        run: sh tests/install-smoke.sh
        env:
          COLLIE_DESK_IMAGE: colliedesk:ci
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same builder and inputs as the loaded image, so this pushes the layers that just booted.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push tested image as sha-<commit>
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}
          push: true
          sbom: true
          tags: ghcr.io/colliedesk/colliedesk:sha-${{ github.sha }}
      # Signed build provenance bound to the digest; edge is a retag of it, so it verifies too:
      # gh attestation verify oci://ghcr.io/colliedesk/colliedesk:edge -R colliedesk/colliedesk
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/colliedesk/colliedesk
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # compose.yaml as a contributor or "From a clone" self-hoster runs it.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack from compose.yaml and reach the server
        run: sh tests/compose-smoke.sh

  # The one check to watch: adding or splitting jobs above never renames it.
  # Fails a PR that brings in a dependency version with a known vulnerability (OSV database).
  # Compares the PR against its base, so an advisory published later for an existing
  # dependency does not block unrelated PRs; Scorecard reports those weekly.
  osv-scan:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false

  # ROADMAP.md is read by people deciding whether to move to Colliedesk: every linked item must be
  # an open issue labelled for its section (.github/scripts/roadmap-check.py).
  roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CI shard and elapsed-time contracts
        run: python3 tests/ci-tools-test.py
      - name: Product name spelled Colliedesk
        run: sh tests/brand-name-test.sh
      - name: No webhook secret literals (GitHub secret scanning)
        run: sh tests/webhook-secret-literal-test.sh
      - name: Release tags stay alpha (v0.0.N)
        run: sh tests/release-tag-test.sh
      - name: Release button picks the Cloud commit and the next tag
        run: sh tests/release-next-test.sh
      - name: Roadmap gate rules (stubbed issue lookup)
        run: python3 -I tests/roadmap-check-test.py
      - name: Mail pipe wrapper exit codes
        run: sh tests/mail-pipe-test.sh
      - name: MTA recipient policy answers
        run: python3 -I tests/rcpt-policy-test.py
      - name: Installer argument and failure handling (stubbed Docker)
        run: sh tests/install-test.sh
      - name: ci-ok waits for every job
        run: sh tests/ci-ok-needs-test.sh && sh tests/after-ci-ok-runs-test.sh
      - name: Actions and base images are pinned
        run: sh tests/pinned-dependencies-test.sh
      - name: Pinned action archives are fetchable
        run: sh tests/pinned-actions-fetchable-test.test.sh && sh tests/pinned-actions-fetchable-test.sh
      - name: ROADMAP.md matches the issue tracker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # Issues this PR closes ("Closes #N" in its description) must leave the roadmap in this PR.
          if [ -n "$PR_NUMBER" ]; then
            ROADMAP_CLOSING=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | map(tostring) | join(" ")')
            export ROADMAP_CLOSING
            echo "closes: ${ROADMAP_CLOSING:-none}"
          fi
          python3 -I .github/scripts/roadmap-check.py ROADMAP.md

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  ci-ok:
    if: ${{ !cancelled() }}
    needs: [go, web, e2e, onboarding, image, compose-smoke, osv-scan, roadmap, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

      - name: Whole CI phase stays within 120 seconds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          python3 .github/scripts/ci-budget.py --started-at "$started"

  # Self-hosters on the edge channel pull this tag, so it moves only after ci-ok, and only for
  # the current head of main: re-running an older run must not move edge backwards.
  publish-edge:
    needs: ci-ok
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::main moved to $head; edge stays on the newer commit."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.head.outputs.current == 'true'
        name: Point edge at the tested digest
        run: docker buildx imagetools create -t ghcr.io/colliedesk/colliedesk:edge "ghcr.io/colliedesk/colliedesk:sha-$GITHUB_SHA"
