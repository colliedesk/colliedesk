name: Release

# Push a v* tag on a main commit whose CI run passed. The image is rebuilt with the tag
# stamped as its version, booted, then published as X.Y.Z, X.Y and (for non-prereleases) latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a vX.Y.Z tag
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-prerelease."
            exit 1
          fi
      # latest moves only for a stable tag that is the highest stable version, so tagging a
      # patch for an older line never moves self-hosters on latest backwards.
      - id: channel
        run: |
          highest=$(git tag -l 'v*' --sort=-v:refname | grep -Fv -e '-' | head -n 1)
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then echo "latest=true"; else echo "latest=false"; fi >> "$GITHUB_OUTPUT"
      - name: Require a green CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" --jq .total_count)
          if [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run on main for $GITHUB_SHA. Tag a main commit whose CI passed."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          load: true
          tags: colliedesk:release
          cache-from: type=gha,scope=server-image
      - name: Boot image against Postgres
        run: sh tests/image-boot-test.sh colliedesk:release "$GITHUB_REF_NAME"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/colliedesk/colliedesk
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.latest == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=server-image
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
