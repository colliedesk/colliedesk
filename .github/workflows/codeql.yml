name: CodeQL

on:
  workflow_call:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        working-directory: server
        run: go build ./...
      - if: matrix.build-mode == 'manual'
        name: TEMP extraction coverage
        run: |
          echo "trap files: $(find "$RUNNER_TEMP/codeql_databases/go/trap" -type f | wc -l)"
          echo "trap source paths: $(find "$RUNNER_TEMP/codeql_databases/go/trap" -type f -path '*colliedesk*' | wc -l)"
          find "$RUNNER_TEMP/codeql_databases/go/trap" -type f | sed 's#.*/trap/go/##' | sort | sha256sum
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
