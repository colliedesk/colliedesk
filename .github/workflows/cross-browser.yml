name: Cross-browser

# Pull requests run every browser test on Chromium only (ci.yml, --project=chromium). Once a day, the core
# journeys (crossBrowserJourneys in web/playwright.config.ts) run on WebKit, Safari's engine, and Firefox,
# so a page that breaks in another browser shows within a day without making each pull request wait.
# Not on pull requests: their jobs already fill the account's runner limit (RunnerConcurrency in
# tests/ci-tools-test.py). Run it by hand: gh workflow run cross-browser.yml -R colliedesk/colliedesk
on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [ci/cross-browser-e2e]

permissions:
  contents: read

jobs:
  journeys:
    # Pinned like the e2e job: Playwright cannot install its browsers on ubuntu-latest (Ubuntu 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://colliedesk:colliedesk@127.0.0.1:5432/colliedesk_test?sslmode=disable
      MAILPIT_SMTP_PORT: '1025'
      MAILPIT_API_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start test services in the background
        run: sh .github/scripts/ci-services.sh start postgres mailpit
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        id: go
        with:
          go-version: '1.27.x'
          cache: false
      - name: Restore the Go build cache of the newest main run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
            go-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Build the app
        working-directory: web
        run: corepack pnpm exec vite build && corepack pnpm exec vite build -c vite.operator.config.ts
      - name: Install WebKit and Firefox
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps webkit firefox
      - name: Wait for test services
        run: sh .github/scripts/ci-services.sh wait postgres mailpit
      - name: Run the core journeys on WebKit and Firefox
        working-directory: web
        run: corepack pnpm e2e --project=webkit --project=firefox
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-browser-results
          # scratchDir in web/e2e/support/checkout.ts
          path: /tmp/colliedesk-e2e-*/results
          retention-days: 7
