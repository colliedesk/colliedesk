name: Issue triage default

# Every new issue gets a triage state, including issues opened by agents through the API, which
# skip the templates: no needs-triage / accepted / planned label means needs-triage.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  default-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add needs-triage when no triage label is set
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
        run: |
          set -eu
          case " $LABELS " in
            *" needs-triage "*|*" accepted "*|*" planned "*) echo "already triaged: $LABELS" ;;
            *) gh issue edit "$NUMBER" --repo "$REPO" --add-label needs-triage ;;
          esac
