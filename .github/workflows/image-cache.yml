name: Image cache

# Writes the image's layer cache (type=gha, scope image) for main; CI's image job only reads it.
# Writing it in CI cost 52 seconds whenever the Go dependencies changed (compressing and uploading
# them), which a two-minute job cannot hold. It runs after CI, never beside it: a main push that
# runs every CI job already takes 18 runners, go-cache and Scorecard two more, and a 21st would
# queue a CI job against the 120-second clock (docs/internals/performance.md, CI phase budget).
# Every finished run writes, a red or cancelled one too: a cold image job passes its 2-minute timeout,
# GitHub ends that run as cancelled, and skipping it kept main cold for good (runs 39893295025 and
# 39893508473). A waiting CI run that a newer main push replaces also ends cancelled and starts a
# write; the concurrency group below keeps one write running and only the newest one waiting.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Fills the cache by hand, as after it was evicted.
  workflow_dispatch:

permissions:
  contents: read

# A newer main commit waits for the running write instead of cancelling it: a cancelled write of
# changed dependencies would leave every run cold until one finishes.
concurrency:
  group: image-cache
  cancel-in-progress: false

jobs:
  image-cache:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # A cold write builds the Go dependencies and uploads them: about two and a half minutes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Build the image into the layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=edge-${{ github.event.workflow_run.head_sha || github.sha }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
