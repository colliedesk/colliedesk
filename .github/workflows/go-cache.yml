name: Go cache

# Saves the Go modules and test builds of every main commit for the next pull request runs. CI's Go
# shards cannot: a merge pr-verified passes skips them, so main's newest entry stopped at an older
# commit and never held a module added since (the Anthropic SDK took the shards about 23 seconds each
# to compile). A workflow of its own so it adds nothing to the CI run's 120-second clock or to edge.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest main commit's entry matters.
concurrency:
  group: go-cache
  cancel-in-progress: true

jobs:
  go-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go-release
        name: Find the newest Go 1.27 release
        continue-on-error: true
        run: curl -fsSL --retry 3 https://raw.githubusercontent.com/actions/go-versions/main/versions-manifest.json | python3 .github/scripts/go-release.py 1.27 >> "$GITHUB_OUTPUT"
      - name: Restore the Go toolchain
        if: steps.go-release.outputs.version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.go-release.outputs.version }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-release.outputs.version }}
      - id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ steps.go-release.outputs.version || '1.27.x' }}
          cache: false
      # The same keys as ci.yml's Go jobs: start from the newest entry, compile only what changed.
      - name: Restore the Go build cache of the newest main run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
            go-${{ runner.os }}-
      # What a Go shard compiles before its tests: every test binary and the packages they import.
      - name: Compile every test binary
        working-directory: server
        run: go test -c -o "$RUNNER_TEMP/go-test-binaries/" ./...
      - name: Save the Go build cache for later runs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}-${{ github.sha }}
