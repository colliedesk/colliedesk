name: Docs site

# docs/user/*.md and ROADMAP.md are published at colliedesk.com by colliedesk/colliedesk.com.
# Build that site against this change so a broken link, missing "# Title" or bad fragment
# fails here, before merge, instead of breaking the site's next deploy.
on:
  pull_request:
    paths: [docs/user/**, ROADMAP.md, .github/workflows/docs-site.yml]
  push:
    branches: [main]
    paths: [docs/user/**, ROADMAP.md, .github/workflows/docs-site.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: product
          sparse-checkout: |
            docs/user
            ROADMAP.md
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v7
        with:
          repository: colliedesk/colliedesk.com
          path: site
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Build and check the site with these docs
        working-directory: site
        env:
          PRODUCT_DIR: ${{ github.workspace }}/product
        run: pnpm install --frozen-lockfile && pnpm run build && pnpm run check
