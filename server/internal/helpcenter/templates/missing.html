{{define "content"}}
<section class="notice">
<p class="notice-code">404</p>
<h1>{{.T.NotFound}}</h1>
{{- if .Home}}
<p>{{.T.NotFoundMoved}} <a href="{{.Home}}">{{.T.GoToStart}}</a>.</p>
{{template "heroSearch" .}}
{{- else}}
<p>Check the address for typing mistakes, or ask whoever sent you the link for a new one.</p>
{{- end}}
</section>
{{end}}
