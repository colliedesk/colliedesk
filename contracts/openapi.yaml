openapi: 3.1.0
info:
  title: Colliedesk API
  version: 0.2.0
  description: >
    Passwordless, workspace-scoped helpdesk API.

    On the hosted cloud (billing enabled) a workspace has a free trial. When the trial ends with no
    paid subscription the workspace is locked: every authenticated route answers 402 with error code
    `workspace_locked`, reads included, except the routes that sign in and out, show and pay the
    plan, export the data (`GET /api/v1/export`), and show or disconnect the email channel. Paying unlocks the
    workspace on the next request. Self-hosted instances have no trial and no lock.

    An operator can switch a feature of the server off (Gmail, Microsoft 365, Autofix, the server's AI
    provider, hosted addresses, cloud sign-in, billing, cloud sign-up). `features` of `GET /api/v1/config`
    says which run. A route that uses a feature switched off answers 409 `feature_off`; reading what the
    feature holds, disconnecting it, and the webhooks that keep its data whole stay open. With billing
    switched off no workspace is billed or locked.

    When a workspace moves to a plan with fewer agents than it has (a change in the billing portal),
    the agents beyond the cap are paused: agents before admins, the most recently added first, never
    the owner (the first admin added). Their requests answer 402 `seat_paused` except
    `GET /api/v1/auth/me`, signing out, the session list and problem reports; a paused admin also keeps
    `GET /api/v1/billing`, the billing portal and checkout. `plan.agents_over` and `plan.seat_paused` of
    `GET /api/v1/auth/me` show it. Access returns once an admin deactivates agents or upgrades.

    An agent token (`POST /api/v1/auth/tokens`) is a bearer credential for an AI agent. It starts with
    `cdk_agent_` and acts as the agent who created it, limited to a tier: `read` (conversations,
    messages, contacts, tags, the team list, and the session, invite and channel settings without
    links or secrets), `draft` (also changes that never reach a customer: status, priority, assignee,
    tags, new tags, private notes, the owner's own timezone), `send` (also outgoing replies, creating,
    renaming and merging contacts, creating conversations, saved replies) or `admin` (also workspace settings, the team, revoking
    invites, channels and sessions, with the creator's admin role while they keep it). A call above the tier,
    and every call to a route that needs approval for every tier (new tokens, invites, granting,
    keeping or taking the admin role, signing out another person, export, billing checkout and portal, disconnecting email, a new inbound secret, the
    workspace address), answers 202 with an agent request a person approves. An invite link, a token
    or the inbound secret is never in an answer to a token. A token is refused as a cookie. A token
    expires 30 days after its last use and never lives longer than one year from its creation. A
    message it writes carries `agent_token`, so a person can tell it from their own.

    Every response carries an `X-Request-Id` header. A proxy's own `X-Request-Id` (8 to 64 characters of
    letters, digits, `.`, `_` and `-`) is kept; otherwise the server makes a 12-character one. The same
    id is on every server log line of the request and in `error.request_id` of an error body, so a
    person reporting a failure can quote it.
servers:
  - url: /
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /chat/session:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    get:
      operationId: getHelpChatSession
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: The end user's current chat by its cookie, with its turns; 204 without one.
      responses:
        '200':
          description: The chat
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpChatSession'}}}
        '204': {description: No chat on this browser.}
        '404': {description: 'The chat is off: the help center''s own 404 page, as when it is off.'}
  /chat:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
      - {name: embed, in: query, required: false, schema: {type: string, enum: ['1']}, description: 'The chat in a site''s frame (the widget): only the channel''s sites may frame it (frame-ancestors).'}
      - {name: t, in: query, required: false, schema: {type: string}, description: 'A one-time code from Open full chat: moves the frame''s chat to this page, then 303 to the page without it.'}
    get:
      operationId: getHelpChatPage
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: >
        The chat page, in the help center's look (its style sheets, logo, colors), loading chat.js and chat.css of the
        help center itself. Its Content-Security-Policy allows that one script, calls to the help center's own origin
        and Trusted Types; it is never framed except by the channel's sites with embed=1.
      responses:
        '200':
          description: The page
          content: {text/html: {schema: {type: string}}}
        '303': {description: 'A code moved the chat; the page without it.'}
        '404': {description: The chat is off (the help center's own 404 page).}
  /chat/chat.js:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    get:
      operationId: getHelpChatScript
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: 'The chat''s script. With `?v=<version>` (the address the pages use) it is kept a year.'
      responses:
        '200':
          description: The script
          content: {text/javascript: {schema: {type: string}}}
        '304': {description: Not modified}
        '404': {description: The chat is off.}
  /chat/chat.css:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    get:
      operationId: getHelpChatStyle
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: 'The chat''s style sheet: only the help center''s own custom properties, so its theme and custom CSS apply.'
      responses:
        '200':
          description: The style sheet
          content: {text/css: {schema: {type: string}}}
        '304': {description: Not modified}
        '404': {description: The chat is off.}
  /chat/widget.js:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    get:
      operationId: getHelpChatWidget
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: >
        The script a company's site loads to show the chat button: it asks widget-config first and draws nothing unless
        the site is one of the channel's; it reads nothing of the page and sets no cookie on the site. Checked again after an hour.
      responses:
        '200':
          description: The script
          content: {text/javascript: {schema: {type: string}}}
        '304': {description: Not modified}
        '404': {description: The chat is off.}
  /chat/widget-config:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    get:
      operationId: getHelpChatWidgetConfig
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: >
        What widget.js draws, for a site the channel lists (its Origin), with CORS for that origin alone. Any other site
        gets the help center's 404 and no CORS header.
      responses:
        '200':
          description: The chat's name, greeting, suggestions and the help center's brand colors
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpChatWidgetConfig'}}}
        '404': {description: 'Not a site of the channel, or the chat is off.'}
  /chat/transfer:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    post:
      operationId: transferHelpChat
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: >
        Open full chat, from a site's frame: a one-time code (2 minutes) that moves the browser's chat to the help
        center's own page, whose cookie the frame's partitioned cookie never reaches. Without a chat, the page's address.
      responses:
        '200':
          description: Where to open the chat
          content:
            application/json:
              schema: {type: object, required: [url], properties: {url: {type: string}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: The chat is off.}
  /chat/handoff:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    post:
      operationId: handOffHelpChat
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: >
        Talk to a person: the browser's chat (its questions, answers and the articles cited) goes to the team as an
        inbound message of the help chat channel, from the typed address, which nothing checks (the inbox marks it
        Unverified sender (Help chat)). A second hand-off of the same chat joins the same conversation. One address
        may hand off 5 chats in 10 minutes, and the channel opens at most 50 conversations in 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
                name: {type: string, maxLength: 120}
                note: {type: string, maxLength: 2000}
      responses:
        '201':
          description: 'Sent: a reference the end user may quote (the start of the conversation''s id) and whether the workspace is on a trial (it cannot reply by email then).'
          content:
            application/json:
              schema: {type: object, required: [reference, trial], properties: {reference: {type: string}, trial: {type: boolean}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'The chat is off.'}
        '415': {description: Not JSON., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: '`validation_failed`, with `fields.email`, `fields.name` or `fields.note`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429':
          description: '`rate_limited`: too many hand-offs from this address, or conversations on the channel.'
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /chat/session/end:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    post:
      operationId: endHelpChat
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: New chat. Ends the browser's chat and removes its cookie; the team keeps its transcript. Needs the help center's Origin.
      responses:
        '204': {description: 'Ended, or there was none.'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: The chat is off (the help center's own 404 page).}
  /chat/turns:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
      - {name: surface, in: query, required: false, schema: {type: string, enum: [help_center, article, widget]}, description: '`widget`: the chat is framed by a site, its cookie is partitioned.'}
    post:
      operationId: askHelpChat
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: >
        Asks a question. The answer streams as NDJSON (`application/x-ndjson`), one `HelpChatEvent` a line: `turn`,
        then `delta` (one checked sentence each; a sentence with contact details the articles do not hold is replaced),
        `sources`, `done`; or `error` after the stream started. A chat starts at its first question and its cookie is
        set (renewed for 30 days on each). Needs the help center's Origin and JSON. Limits: 1,000 characters, 50
        questions a chat, 10 a minute and 60 an hour per address; past the month's or day's limit `done` says
        `over_limit` with related articles and nothing is sent to the AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string, maxLength: 1000}
                viewing_article_number: {type: integer, minimum: 1, description: 'The number of the article the end user reads, when they ask about it.'}
                surface: {type: string, enum: [help_center, article, widget], description: Where a new chat starts.}
      responses:
        '200':
          description: The answer, as NDJSON events
          content: {application/x-ndjson: {schema: {$ref: '#/components/schemas/HelpChatEvent'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: The chat is off (the help center's own 404 page).}
        '409': {description: '`chat_full`: 50 questions; start a new chat.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: Not JSON., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: '`question_too_long` or `invalid_request`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429':
          description: '`rate_limited`: too many questions from this address, or answers at once.'
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /chat/turns/{turn_id}:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
      - {name: turn_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getHelpChatTurn
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: One answer of the browser's chat as stored, to recover a stream that broke.
      responses:
        '200':
          description: The turn
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpChatTurn'}}}
        '404': {description: 'Not an answer of this browser''s chat (`not_found`), or the chat is off (the help center''s own 404 page).'}
  /chat/turns/{turn_id}/feedback:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
      - {name: turn_id, in: path, required: true, schema: {type: string}}
    put:
      operationId: rateHelpChatAnswer
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: Rates an answer of the browser's chat; a second rating replaces the first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: {type: string, enum: [helpful, not_helpful]}
      responses:
        '204': {description: Rated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Not an answer of this browser's chat.}
        '422': {description: Not a rating., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      operationId: unrateHelpChatAnswer
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: Takes a rating back.
      responses:
        '204': {description: Taken back}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Not an answer of this browser's chat.}
  /chat/prewarm:
    servers: [{url: '{helpCenter}', description: 'A help center''s own address (helpcenter.SiteURL): https://<slug>.<HELP_CENTER_DOMAIN>, its custom domain, or <APP_ORIGIN>/help/<slug>. Never /api/v1.', variables: {helpCenter: {default: 'https://acme.colliedesk.com'}}}]
    parameters:
      - {name: channel, in: query, required: false, schema: {type: string, format: uuid}, description: 'The help chat channel; its type''s default when left out.'}
    post:
      operationId: prewarmHelpChat
      tags: [HelpCenterChat]
      x-colliedesk-surface: help-center
      x-permission: public
      security: []
      description: >
        Warms the AI's cache of the articles when the end user starts typing, so the first answer comes sooner. At most
        once in 5 minutes per address and workspace, never when the cache is warm, never a new chat; it counts toward the
        chat's limits. Always 204.
      responses:
        '204': {description: Done or skipped.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: The chat is off (the help center's own 404 page).}
  /api/v1/config:
    get:
      operationId: getPublicConfig
      security: []
      x-permission: public
      responses:
        '200':
          description: Public instance configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicConfig'}
  /api/v1/auth/cloud/exchange:
    post:
      operationId: exchangeCloudSession
      security:
        - bearerAuth: []
      x-permission: public
      description: >-
        Exchanges a verified identity token for a Colliedesk session. On a workspace's own host
        `<slug>.<HELP_CENTER_DOMAIN>` the workspace is always the host's (`workspace_slug` is ignored), the
        request must come from that host's origin, and the token's authorized party may be that origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_slug: {type: string, minLength: 1}
                label:
                  type: string
                  description: Names the device in the session list, usually the browser user agent. Defaults to "Cloud sign-in".
                timezone: {$ref: '#/components/schemas/SignInTimezone'}
                next: {$ref: '#/components/schemas/SignInNext'}
      responses:
        '200': {$ref: '#/components/responses/Redeemed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The verified email belongs to multiple workspaces
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CloudWorkspaceChoices'}
  /api/v1/auth/cloud/signup:
    post:
      operationId: signUpCloud
      summary: Start a cloud trial
      description: >
        Creates a workspace on a 14 day trial with the verified email of the identity provider's bearer
        token as its first admin, and signs that person in (session cookie, as for the cloud exchange).
        The route exists only on the hosted cloud, where cloud sign-in and billing are both configured;
        everywhere else it answers 404. One trial per mailbox: the email is lowercased, a `+tag` is dropped
        and Gmail dots are ignored, so `Ana.B+x@gmail.com` and `anab@googlemail.com` are the same person.
        At most 3 sign-ups per client address in a rolling 24 hours. The web form also asks what the
        team wants first (`goal`), the person's `role` and where they heard of Colliedesk (`source`);
        each is optional, is stored with the workspace and is counted with the trial. A value outside
        its list answers 400 `invalid_request` and creates nothing.
      security:
        - bearerAuth: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_name]
              additionalProperties: false
              properties:
                workspace_name: {type: string, minLength: 2, maxLength: 60, description: 'Trimmed; 2 to 60 characters.'}
                goal: {$ref: '#/components/schemas/OnboardingGoal'}
                role: {$ref: '#/components/schemas/OnboardingRole'}
                source: {$ref: '#/components/schemas/OnboardingSource'}
                timezone: {$ref: '#/components/schemas/SignInTimezone'}
                next: {$ref: '#/components/schemas/SignInNext'}
      responses:
        '201': {$ref: '#/components/responses/Redeemed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >
            Error code `trial_already_used` (this mailbox already started a trial: sign in instead) or
            `slug_unavailable` (no address was free for the name: try another).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
        '429':
          description: Error code `rate_limited`. This client address already started 3 trials in the last 24 hours.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: Error code `signup_unavailable`. Sign-up is off because the server lacks its sign-up hash key or its trusted proxies (operator console → Security; logged at start).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/auth/redeem:
    post:
      operationId: redeemLink
      security: []
      x-permission: public
      description: >-
        Redeems a one-time link (pairing, invite or hand-off) for a session. On a workspace's own host
        `<slug>.<HELP_CENTER_DOMAIN>` only that workspace's links are accepted; another workspace's link is
        refused like an invalid one and stays unused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1}
                requested_role: {$ref: '#/components/schemas/Role'}
                label: {type: string}
                session_type: {type: string, enum: [cookie, bearer], default: bearer}
                timezone: {$ref: '#/components/schemas/SignInTimezone'}
                next: {$ref: '#/components/schemas/SignInNext'}
      responses:
        '200': {$ref: '#/components/responses/Redeemed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      x-permission: authenticated
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/me:
    get:
      operationId: getMe
      x-permission: authenticated
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      x-permission: access:read
      responses:
        '200':
          description: Visible sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Session'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: revokeSession
      x-permission: access:read
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/auth/tokens:
    post:
      operationId: createAgentToken
      x-permission: authenticated
      description: >
        Creates a bearer token for an AI agent that acts as the signed-in agent, with a tier (`scope`) or
        its own list of `permissions` (resource:action), never both. A tier is a preset: its permissions
        are worked out on every call. A token that holds nothing admin-only has the agent role whatever
        the creator's role is. An `admin` token, and a custom token with an admin-only permission
        (`TokenPermission`, preset admin), act with the creator's role, checked on every call; only an
        admin may create one (403 `admin_token_needs_admin` otherwise). A token's call here is an agent request a person approves. It appears in `GET /api/v1/auth/sessions` (for a person) with its label and
        scope, and `DELETE /api/v1/auth/sessions/{id}` revokes it. It expires 30 days after its last
        use, and one year after its creation at the latest.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string, minLength: 1, maxLength: 80, description: 'Name shown in the session list, for example the agent host'}
                scope: {$ref: '#/components/schemas/TokenPreset'}
                permissions:
                  type: array
                  minItems: 1
                  items: {$ref: '#/components/schemas/TokenPermission'}
                  description: A custom token's permissions, instead of a scope.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The token and its session. The raw token is in this response only.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToken'}
        '200':
          description: The session of the token an earlier request with the same Idempotency-Key created; the raw token is not shown again and nothing new was created
          content: {application/json: {schema: {type: object, required: [session], properties: {session: {$ref: '#/components/schemas/Session'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/auth/invites:
    get:
      operationId: listInvites
      x-permission: access:read
      responses:
        '200':
          description: Invite metadata without secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Invite'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createInvite
      x-permission: access:write
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role_ceiling]
              properties:
                email: {type: string, format: email}
                role_ceiling: {$ref: '#/components/schemas/Role'}
      description: >
        Creates an invite and returns its one-time URL once. An agent token's call, whatever its tier
        and role ceiling, is filed as an agent request (202): the link is a credential, so only the
        person who approves sees it, once, and the stored request does not keep it.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The invite, and for a person its one-time URL
          content:
            application/json:
              schema:
                type: object
                required: [invite, url]
                properties:
                  invite: {$ref: '#/components/schemas/Invite'}
                  url: {type: string, format: uri}
        '200':
          description: The invite an earlier request with the same Idempotency-Key created, without its one-time URL (shown once); nothing new was created
          content: {application/json: {schema: {type: object, required: [invite], properties: {invite: {$ref: '#/components/schemas/Invite'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: >
            The address belongs to a deactivated agent (error code `agent_deactivated`). Reactivate the agent
            in the team list instead of inviting them again.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/auth/invites/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: revokeInvite
      x-permission: access:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Invite revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/operator/auth/redeem:
    post:
      operationId: redeemOperatorLink
      security: []
      x-permission: public
      description: >-
        Uses a one-time operator link (`collie operator pair`, 15 minutes). The console calls it when the
        operator presses Continue, never on page load, so a link scanner cannot spend it. Without an
        authenticator required or set up it signs the operator in (`step: done`, a `colliedesk_operator`
        cookie, `__Host-colliedesk_operator` on https); otherwise it returns a ticket for the code (`code`),
        and the first time the key to add (`enroll`, with a QR code drawn by the server). 404
        `operator_link_invalid`, 410 `operator_link_expired`, 409 `operator_link_used`, 423
        `operator_locked` with `locked_until`, 429 after 5 tries a minute. A repeat with the same
        Idempotency-Key is refused like any second use of the link (409).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Where the sign-in stands
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorSignInStep'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
        '429': {$ref: '#/components/responses/OperatorTooManyTries'}
  /api/v1/operator/auth/totp:
    post:
      operationId: confirmOperatorCode
      security: []
      x-permission: public
      description: >-
        Checks the authenticator code of a sign-in ticket and signs the operator in (a cookie). A wrong code
        answers 400 `operator_code_wrong` with `tries_left` and keeps the ticket; ten wrong codes lock sign-in
        for 15 minutes (423 `operator_locked`). A repeat after success is refused like any second use of the
        ticket (409).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, code]
              properties:
                ticket: {type: string, minLength: 1, maxLength: 200}
                code: {type: string, minLength: 1, maxLength: 12}
      responses:
        '200':
          description: Signed in
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorSignInStep'}}}
        '400': {$ref: '#/components/responses/OperatorCodeWrong'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
        '429': {$ref: '#/components/responses/OperatorTooManyTries'}
  /api/v1/operator/auth/cloud:
    post:
      operationId: signInOperatorWithCloud
      security:
        - bearerAuth: []
      x-permission: public
      description: >-
        Starts an operator's sign-in with a session token of the hosted cloud's identity provider (the
        `cloud_auth.*` settings) as the bearer. The token must be issued to the console's own origin
        (`azp` = OPERATOR_ORIGIN; `cloud_auth.authorized_parties` stays the app's, so a token of the app never
        opens the console and one of the console never the app), and its verified email must be an operator
        that is not revoked. It always goes on to the authenticator, whatever `operator.require_totp` says:
        a ticket for the code (`code`), or the first time the key to add (`enroll`); then
        `POST /api/v1/operator/auth/totp`. Every other token answers the same 401 `operator_sign_in_refused`,
        so the answer never tells who is an operator. 403 `csrf_rejected` when Origin is not the console's,
        404 when cloud sign-in is not configured, 423 `operator_locked`, 429 after 5 tries a minute.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      responses:
        '200':
          description: Where the sign-in stands (`code` or `enroll`, never `done`)
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorSignInStep'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
        '429': {$ref: '#/components/responses/OperatorTooManyTries'}
  /api/v1/operator/auth/me:
    get:
      operationId: getOperatorMe
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: The operator of this session or operator token. A workspace session or agent token is refused (401).
      responses:
        '200':
          description: Current operator
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorMe'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/operator/auth/logout:
    post:
      operationId: operatorLogout
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: Ends this operator session (and its cookie) or this operator token. A repeat finds it ended (401).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/operator/tokens:
    post:
      operationId: createOperatorToken
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Creates an operator token (`cdop_…`) for an AI agent: it always reads, and holds the permissions
        given; it expires after 30 days. It works on `/mcp/operator` and the operator routes only, never in a
        workspace. Needs the operator's authenticator code (`reauth_code`; 400 `reauth_required` or
        `reauth_code_invalid`, nothing saved); an operator without an authenticator passes within 15 minutes
        of signing in, else 403 `reauth_needs_new_link`. An operator token's call is a request a person
        approves (202).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string, minLength: 1, maxLength: 100}
                permissions: {type: array, items: {$ref: '#/components/schemas/OperatorPermission'}}
                reauth_code: {type: string, maxLength: 12}
                note: {type: string, maxLength: 500, description: 'Why an operator token asks for this, shown to the approver'}
      responses:
        '201':
          description: The token, shown once
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorToken'}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/operator/status:
    get:
      operationId: getOperatorStatus
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        The server at a glance: its release and newest migration, the configuration version each running
        process runs and the one they should, what needs attention (settings left in the environment, a
        refused version, an import a change waits for, the console sharing the app's address), and how many
        operator requests wait.
      responses:
        '200':
          description: Status
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorStatus'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/operator/config:
    get:
      operationId: getOperatorConfig
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Every setting: its value (a secret only says whether it is set, when and by whom), its default, where
        its value came from, how a change applies and what saving it asks for; and the bootstrap variables
        of the environment, passwords masked. Names of environment variables appear only as data (`env_name`).
      responses:
        '200':
          description: The configuration
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfig'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      operationId: changeOperatorConfig
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Saves a change as a new version, checked the way the server reads it at start; a running server
        applies it within seconds. `base_version` is the version the change was made on (409 `config_changed`
        when another was saved since). Secrets go in `secrets`, never in `set` (400 `secret_in_set`). The
        server enforces what the console asks for: `reauth_code` for a secret or a key that needs it
        (400 `reauth_required` / `reauth_code_invalid`), the secret an endpoint is bound to entered again
        (400 `reenter_secret`, `error.fields` names it), and the phrase typed to confirm (400
        `confirm_mismatch`, `error.guards` lists what the change does and asks). What a change asks depends on
        what it does (turning billing on, not rotating its token); `POST /config/check` returns the same
        `guards` first. A change of trusted proxies, cloud sign-in or the help center domain is saved as a
        trial (`applies: trial`): unless confirmed before `trial_expires_at`, it reverts by itself; while it
        runs every other save answers 409 `trial_pending`. Turning the authenticator off answers 400
        `setting_not_changeable` (the CLI only); a change that does not build answers 422 `config_invalid`
        with `error.fields` per key. Nothing is saved on a refusal. An operator token's call is a request a person approves (202); it may only name the
        secrets it needs (`"secrets": {"smtp.password": null}`), never send one (400 `secret_in_request`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperatorConfigChange'}
      responses:
        '200':
          description: Saved
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigSaved'}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/OperatorConfigRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/OperatorConfigRefused'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/config/check:
    post:
      operationId: checkOperatorConfig
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Checks a change without saving it: whether it builds (`errors` per key), what saving it would ask
        (`guards`), and with `test` a live check: `smtp` sends a test email to the operator's own address
        through the relay of the change; `polar` asks Polar about the Team and Founding products with the
        change's token; `jwks` fetches the cloud sign-in keys; `ai` sends one short request to the server AI
        provider of the change (its first model, a few output tokens). A help center domain without a
        wildcard DNS record is refused in `errors`. Nothing is saved. A live test sends the server's stored
        secrets, so an operator token gets 403 `test_needs_a_person` for one, and a change that moves an
        endpoint answers `test.ok: false` until the secret bound to it is typed again in `secrets`. A repeat with the same Idempotency-Key checks again (nothing is stored).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                set: {type: object, additionalProperties: {type: string}}
                unset: {type: array, items: {type: string}}
                secrets: {type: object, additionalProperties: {type: [string, 'null']}}
                test: {type: string, enum: [smtp, polar, jwks, ai]}
      responses:
        '200':
          description: The result of the checks
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigCheck'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/operator/config/versions:
    get:
      operationId: listOperatorConfigVersions
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: The versions, newest first, each with what it changed from the one before (a secret only says it was replaced).
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [items, running_version]
                properties:
                  running_version: {type: integer}
                  items: {type: array, items: {$ref: '#/components/schemas/OperatorConfigVersion'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/operator/config/versions/{id}/restore:
    parameters: [{name: id, in: path, required: true, schema: {type: integer, minimum: 1}}]
    post:
      operationId: restoreOperatorConfigVersion
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Saves an older version again as the newest one (secrets copied sealed). Needs `reauth_code`.
        `base_version` as for a change (409 `config_changed`). A version that does not build answers 422.
        It passes the guards of what it changes from the version that runs: a phrase in `confirm` (400
        `confirm_mismatch` with `error.guards`), and a trial when it changes trusted proxies, cloud sign-in or
        the help center domain (`applies: trial`).
        An operator token's call is a request a person approves (202).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version]
              properties:
                base_version: {type: integer}
                reauth_code: {type: string, maxLength: 12}
                note: {type: string, maxLength: 500}
                confirm: {type: object, additionalProperties: {type: string}, description: 'Per key, the phrase typed to confirm'}
      responses:
        '201':
          description: Restored as a new version
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigSaved'}}}
        '200':
          description: The version an earlier request with the same Idempotency-Key saved
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigSaved'}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/OperatorConfigRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/OperatorConfigRefused'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/config/trial/confirm:
    post:
      operationId: confirmOperatorConfigTrial
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Keeps the trial change `version` (D12): it becomes an ordinary version. Needs `reauth_code`. A version
        that is not the trial that runs answers 400 `no_trial`. An operator token's call is a request a person
        approves (202).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                reauth_code: {type: string, maxLength: 12}
                note: {type: string, maxLength: 500}
      responses:
        '201':
          description: Confirmed
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigSaved'}}}
        '200':
          description: The answer of an earlier request with the same Idempotency-Key
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigSaved'}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/OperatorConfigRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/config/trial/revert:
    post:
      operationId: revertOperatorConfigTrial
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Ends the trial change `version` now: the version before it is saved again as the newest one. Needs
        `reauth_code`. A version that is not the trial that runs answers 400 `no_trial`. An operator token's
        call is a request a person approves (202).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1}
                reauth_code: {type: string, maxLength: 12}
                note: {type: string, maxLength: 500}
      responses:
        '201':
          description: Reverted as a new version
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigSaved'}}}
        '200':
          description: The answer of an earlier request with the same Idempotency-Key
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorConfigSaved'}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/OperatorConfigRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/billing/products:
    get:
      operationId: listOperatorProducts
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: The Polar products this server sells or once sold, oldest first. A product is never removed nor changed, only taken off sale, so an old subscription always maps to its plan.
      responses:
        '200':
          description: The products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/OperatorProduct'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: addOperatorProduct
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Adds a Polar product. On sale, it takes the product of the same plan and period off sale. A product id
        already listed answers 409. Needs `reauth_code`. An operator token's call is a request a person approves (202).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, plan, period]
              properties:
                product_id: {type: string, minLength: 1, maxLength: 200}
                plan: {type: string, enum: [team, founding, solo, small, team25]}
                period: {type: string, enum: [monthly, yearly, single]}
                on_sale: {type: boolean, default: true}
                reauth_code: {type: string, maxLength: 12}
                note: {type: string, maxLength: 500}
      responses:
        '201':
          description: Added
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorProduct'}}}
        '200':
          description: The product an earlier request with the same Idempotency-Key added
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorProduct'}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/OperatorConfigRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/billing/products/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}]
    patch:
      operationId: setOperatorProductOnSale
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Puts a product on sale (taking the other of its plan and period off) or off sale; nothing else of a
        product changes. Needs `reauth_code`. An operator token's call is a request a person approves (202).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on_sale]
              properties:
                on_sale: {type: boolean}
                reauth_code: {type: string, maxLength: 12}
                note: {type: string, maxLength: 500}
      responses:
        '200':
          description: The product
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorProduct'}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/OperatorConfigRefused'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/audit:
    get:
      operationId: listOperatorAudit
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: What changed the server's configuration and its operators, newest first; never a secret's value. `format=csv` answers the same as CSV.
      parameters:
        - {name: key, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: actor, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {name: format, in: query, required: false, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        '200':
          description: Audit log
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/OperatorAuditEntry'}}
            text/csv: {schema: {type: string}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/operator/requests:
    get:
      operationId: listOperatorRequests
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: Operator requests, newest first. An operator token sees only its own; an operator's session sees all.
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/OperatorRequest'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/operator/requests/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getOperatorRequest
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: One operator request (another token's answers 404).
      responses:
        '200':
          description: The request
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorRequest'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/operator/requests/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: cancelOperatorRequest
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: Withdraws a pending request. The token that made it, or an operator's session, may (another token gets 404); a decided request answers 409. A repeat finds it cancelled (409).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      responses:
        '200':
          description: The cancelled request
          content: {application/json: {schema: {$ref: '#/components/schemas/OperatorRequest'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/operator/operators:
    get:
      operationId: listOperators
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: The operators and their sessions and tokens; never a token or a link.
      responses:
        '200':
          description: Operators
          content:
            application/json:
              schema:
                type: object
                required: [operators, sessions]
                properties:
                  operators: {type: array, items: {$ref: '#/components/schemas/Operator'}}
                  sessions: {type: array, items: {$ref: '#/components/schemas/OperatorSession'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: inviteOperator
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Invites an operator (or lets a revoked one in again): a one-time sign-in link, shown once, 15 minutes.
        Needs `reauth_code`. An operator token's call is a request a person approves (202); the link is shown
        only to the approver.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, minLength: 3, maxLength: 320}
                reauth_code: {type: string, maxLength: 12}
                note: {type: string, maxLength: 500}
      responses:
        '201':
          description: The link, shown once
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [email, link, expires_at]
                properties:
                  email: {type: string}
                  link: {type: string}
                  expires_at: {type: string, format: date-time}
        '200':
          description: The invite an earlier request with the same Idempotency-Key made, without its link
          content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string}, expires_at: {type: string, format: date-time}}}}}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/operators/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: revokeOperator
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Ends an operator's access: every session and token stops at once. Inviting them again lets them back
        in. Needs `reauth_code` (query or `X-Colliedesk-Reauth` header). An operator token's call is a request (202).
      parameters:
        - {name: X-Colliedesk-Reauth, in: header, required: false, schema: {type: string, maxLength: 12}}
      responses:
        '204': {description: Revoked}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/operator/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: revokeOperatorSession
      security: [{operatorCookie: []}, {bearerAuth: []}]
      x-permission: operator
      description: >-
        Ends one operator session or token. Ending your own browser session needs no code; any other needs
        `X-Colliedesk-Reauth`. An operator token's call is a request (202).
      parameters:
        - {name: X-Colliedesk-Reauth, in: header, required: false, schema: {type: string, maxLength: 12}}
      responses:
        '204': {description: Ended}
        '202': {$ref: '#/components/responses/OperatorRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '423': {$ref: '#/components/responses/OperatorLocked'}
  /api/v1/conversations:
    get:
      operationId: listConversations
      x-permission: conversations:read
      description: >
        Every filter narrows the list. A filter that takes several values (comma-separated) matches any
        of them, except `tag` with `tag_match=all`. A value the server does not know answers 400 instead
        of an empty page. Times are RFC 3339 and compared as instants: `*_after` includes the instant,
        `*_before` excludes it. Rows with the same sort key are ordered by id, so pages never repeat or
        skip a row while nothing changes.
      parameters:
        - name: status
          in: query
          description: 'One status or several, comma-separated: open,pending.'
          schema: {type: string, example: 'open,pending'}
        - name: priority
          in: query
          description: 'One priority or several, comma-separated: high,urgent.'
          schema: {type: string, example: 'high,urgent'}
        - name: assignee
          in: query
          description: >-
            Comma-separated. me (the caller), unassigned, anyone (assigned to somebody) or the id of a
            team member of this workspace.
          schema: {type: string, example: 'me,unassigned'}
        - name: tag
          in: query
          description: One tag id or several, comma-separated.
          schema: {type: string}
        - name: tag_match
          in: query
          description: 'any (default): a conversation with one of the tags. all: with every tag.'
          schema: {type: string, enum: [any, all], default: any}
        - name: contact
          in: query
          description: >-
            Only the conversations of this contact (any status unless `status` is given), for the contact's
            history. An id of another workspace's contact returns no rows; a value that is not a UUID answers 400.
          schema: {type: string, format: uuid}
        - name: organization
          in: query
          description: Only conversations of contacts whose organization has this name, ignoring case.
          schema: {type: string, maxLength: 200}
        - name: awaiting
          in: query
          description: >-
            team: the newest message that is not a note came from the customer, so the team owes an
            answer. customer: the newest such message is a reply of the team. A conversation without
            such a message matches neither.
          schema: {type: string, enum: [team, customer]}
        - name: has_pending_draft
          in: query
          description: 'true: an AI agent left a reply draft that waits for a person. false: none waits.'
          schema: {type: boolean}
        - name: delivery_failed
          in: query
          description: 'true: a reply of the conversation could not be delivered by email and was not retried since. false: none.'
          schema: {type: boolean}
        - name: source
          in: query
          description: imported (from another helpdesk) or native (created in Colliedesk).
          schema: {type: string, enum: [imported, native]}
        - name: channel
          in: query
          description: One channel type or several, comma-separated (see `ConversationChannel`).
          schema: {type: string, example: 'email,web_form'}
        - name: channel_id
          in: query
          description: >-
            One channel or several by id, comma-separated (`GET /api/v1/channels`, `include_removed=true` for
            removed ones): a conversation that came through one of them or whose replies leave from one of
            them. An id of another workspace matches nothing.
          schema: {type: string}
        - {name: created_after, in: query, schema: {type: string, format: date-time}}
        - {name: created_before, in: query, schema: {type: string, format: date-time}}
        - {name: updated_after, in: query, schema: {type: string, format: date-time}}
        - {name: updated_before, in: query, schema: {type: string, format: date-time}}
        - name: sort
          in: query
          description: >-
            updated_desc (default), updated_asc, created_desc, created_asc, priority (urgent first,
            then the most recently updated), waiting_longest (conversations awaiting the team, the
            oldest customer message first, then every other conversation by last update).
          schema: {$ref: '#/components/schemas/ConversationSort'}
        - name: search
          in: query
          description: Words to find in the subject, in any message text, or in the name or email of the contact.
          schema: {type: string, maxLength: 200}
        - name: result
          in: query
          description: >-
            Only the conversations one number of the results page counts: `<snapshot id>:<window>.<metric>`, as
            `GET /results` names them (for example `…:30d.first_response`). Send it without a status filter: a
            number counts conversations in any status. A snapshot that is no longer kept (numbers are worked out
            again every hour or so; a replaced one stays 24 hours) answers 410 `results_refreshed`.
          schema: {type: string, maxLength: 120, pattern: '^[0-9a-f-]{36}:(30d|7d)\.[a-z_]+$'}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Filtered inbox page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '410':
          description: The results snapshot the `result` filter names is no longer kept (`results_refreshed`)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    post:
      operationId: createConversation
      x-permission: conversations:write
      description: >
        Open a conversation with a contact. With only `contact_id` and `subject` it is empty and nothing is
        sent. With `body` it starts with an outgoing reply that is emailed to the contact (and `cc`), in the
        same transaction: when the reply is refused (trial rules, Cc rules, attachment limits, no email
        channel) nothing is stored, not even the conversation. The email carries the subject as written
        (no "Re:") and a Message-ID and reply address that thread the customer's answer back into this
        conversation.


        `channel_id` is the channel it starts from, which its replies keep leaving from; without it, the
        default email channel. 404 `channel_not_found` for no live channel of the workspace, 400
        `channel_cannot_send` for a channel a conversation cannot start on (a web form), 409 `channel_off`
        when the channel (or the default, when none is given) is off. An empty conversation keeps the
        channel too; without one its first reply takes the default.


        Send `multipart/form-data` to attach files: fields `contact_id`, `subject`, `body`, `channel_id`, one `cc` field
        per address, then repeated `files` parts, with the limits of `POST /conversations/{id}/messages`.
        `cc` follows the rules of a reply. On the trial a new conversation reaches a customer who never
        wrote in, so it is refused with 403 `trial_outbound_restricted` until the sending domain is
        verified or a plan is chosen. A workspace without an email channel answers 409
        `email_channel_missing`. A contact merged into another answers 409 `contact_merged`. A customer
        added with the conversation (`contact`) is written in the same transaction; an address that is
        already a customer answers 409 `contact_exists` with the `contact` to use.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              description: Exactly one of `contact_id` and `contact`.
              properties:
                contact_id: {type: string, format: uuid}
                contact:
                  type: object
                  description: >-
                    A customer added with the conversation, in the same transaction (only with `body`). An address
                    that is already a customer answers 409 `contact_exists` with that `contact`, and nothing is stored.
                  required: [name, email]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 200}
                    email: {type: string, format: email}
                subject: {type: string, minLength: 1}
                body: {type: string, minLength: 1, description: 'Markdown source of the first reply; without it the conversation starts empty'}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
                channel_id: {type: string, format: uuid, description: 'The channel it starts from; the default email channel when left out.'}
          multipart/form-data:
            schema:
              type: object
              required: [subject, body]
              description: Exactly one of `contact_id` and the pair `contact_name`, `contact_email` (a customer added with it).
              properties:
                contact_id: {type: string, format: uuid}
                contact_name: {type: string, minLength: 1, maxLength: 200}
                contact_email: {type: string, format: email}
                subject: {type: string, minLength: 1}
                body: {type: string, minLength: 1, description: Markdown source}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
                channel_id: {type: string, format: uuid}
                seen_reply_number: {type: integer, minimum: 0}
                files:
                  type: array
                  maxItems: 10
                  items: {type: string, format: binary}
            encoding:
              files: {contentType: application/octet-stream}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201': {$ref: '#/components/responses/Conversation'}
        '200': {$ref: '#/components/responses/Conversation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/AttachmentsTooLarge'}
        '429': {$ref: '#/components/responses/TrialOutboundLimit'}
        '507':
          description: The attachments volume is low on disk space; nothing was sent or stored
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
    patch:
      operationId: bulkUpdateConversations
      x-permission: conversations:write
      summary: Change up to 50 conversations at once
      description: >
        All or nothing: one transaction. A conversation id that is missing or belongs to another
        workspace answers 404 and changes nothing; the response does not say which id. Status,
        assignee and tags follow the same rules as `PATCH /conversations/{id}`. Tags in
        `remove_tag_ids` are removed, then tags in `add_tag_ids` are added.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkConversationUpdate'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Number of conversations changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkConversationUpdateResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/conversations/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getConversation
      x-permission: conversations:read
      responses:
        '200': {$ref: '#/components/responses/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateConversation
      x-permission: conversations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {$ref: '#/components/schemas/ConversationStatus'}
                priority: {$ref: '#/components/schemas/Priority'}
                assignee_id: {type: [string, 'null'], format: uuid}
                tag_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/Conversation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/tags/{tagId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: tagId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: addConversationTag
      x-permission: conversations:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: removeConversationTag
      x-permission: conversations:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/messages:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listMessages
      x-permission: conversations:read
      description: >
        The conversation's timeline. With `idempotency_key`, only the message a send with that
        Idempotency-Key stored in this conversation, or no item when none did: a page reloaded while a
        send was in flight asks whether it arrived before offering the text again. A send under that key
        still running is waited for, so the answer is final.
      parameters:
        - name: idempotency_key
          in: query
          required: false
          description: The Idempotency-Key of a send, 1 to 200 printable ASCII characters
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Ordered conversation timeline
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Message'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createMessage
      x-permission: conversations:write
      description: >
        Send JSON for a text-only message, or `multipart/form-data` to attach files: fields `kind` and
        `body` plus repeated `files` parts, each with a filename. A message carries at most
        `limits.outgoing_attachments_files` files and `limits.outgoing_attachments_bytes` bytes in total
        (both from `GET /api/v1/config`); more answers 413 and nothing is stored. A reply emails its
        files as attachments; a note never leaves the workspace.


        A reply may copy other people with `cc`: at most 10 plain addresses (`name@example.com`, no
        display name), stored lowercase without duplicates. The conversation contact stays the only
        `To` recipient and is dropped from `cc`; our own support, forwarding and sending addresses are
        refused with 400, and so is `cc` on a note. In `multipart/form-data` send one `cc` field per
        address, before the files. On the trial, `cc` may name only addresses the customer wrote from or
        copied (customer mail through the platform forwarder that did not fail authentication, or
        imported history) unless the sending domain is verified;
        another address answers 403 `trial_outbound_restricted` with `refused_cc` listing every
        refused address, and nothing is stored. Each reply counts its contact and every `cc` address
        against the trial's 200 people a day. A retry of a
        failed delivery sends to the same stored list. There is no Bcc.


        Every reply gets the next `reply_number` of its conversation (`latest_reply_number` of the
        conversation is the newest). Send `seen_reply_number`, the newest reply the sender had seen when
        they started writing, and a reply is refused with 409 `reply_conflict` when someone replied
        since: nothing is stored or sent, and the error lists `newer_replies` (oldest first by
        `created_at`; an imported one keeps its own time and `origin`) and `latest_reply_number`. To send
        anyway, send again with that number. Without `seen_reply_number` nothing is checked; a note is
        never checked. In `multipart/form-data`, send it before the files: a refused reply stores none.


        Send an `Idempotency-Key` header, new for each message and the same on every retry of it, and a
        repeated request returns the message the first one created (200) instead of storing and sending it
        again. Keys belong to the workspace; the same key with another conversation, kind, body, author,
        `cc` or set of files (by name, size and bytes) answers 422 `idempotency_key_reused`. The key applies to a message written directly; a reply draft
        or a call filed as an agent request (202) does not use it.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: The client's name for this submit, 1 to 200 printable ASCII characters; the same on every retry of it.
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: {type: string, enum: [outgoing, note]}
                body: {type: string, minLength: 1, description: Markdown source}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
                seen_reply_number: {type: integer, minimum: 0, description: 'The newest reply number the sender had seen; 0 when there was none.'}
                ai_draft_id: {type: string, format: uuid, description: 'The AI draft this reply was written from (outgoing replies sent directly only): the draft records how close the reply stayed to it. 409 ai_draft_not_ready when it is not this conversation''s ready, undecided draft.'}
                draft:
                  type: boolean
                  description: >-
                    Agent tokens only, with `kind: outgoing`: file the reply as a reply draft (202) that a
                    person edits, sends or discards, whatever the token's tier. A token below `send` gets a
                    draft without it, and may copy only the contact and addresses already on the
                    conversation (400 otherwise). A person's session answers 400.
          multipart/form-data:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: {type: string, enum: [outgoing, note]}
                body: {type: string, minLength: 1, description: Markdown source}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
                ai_draft_id: {type: string, format: uuid}
                files:
                  type: array
                  maxItems: 10
                  items: {type: string, format: binary}
            encoding:
              files: {contentType: application/octet-stream}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created reply or private note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '200':
          description: The message an earlier request with the same Idempotency-Key created; nothing new was stored or sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: A reply with `seen_reply_number` older than the conversation's latest reply (`reply_conflict`); nothing was stored or sent
          content: {application/json: {schema: {$ref: '#/components/schemas/ReplyConflict'}}}
        '413': {$ref: '#/components/responses/AttachmentsTooLarge'}
        '422':
          description: The Idempotency-Key already names another message (`idempotency_key_reused`); nothing was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429': {$ref: '#/components/responses/TrialOutboundLimit'}
        '507':
          description: The attachments volume is low on disk space; nothing was sent or stored
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/conversations/{id}/messages/{messageId}/retry:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: messageId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: retryMessageDelivery
      x-permission: conversations:write
      description: >
        Requeue a reply whose email delivery failed. Only `failed` deliveries can be retried, and only
        while outgoing email can work (SMTP configured, domain verified or a platform sender set); 409 says why not.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Reply with its delivery requeued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TrialOutboundLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels:
    get:
      operationId: listChannels
      x-permission: access:read
      description: >
        Lists the workspace's channels, oldest first, with their state, and the channel types this server
        runs: whether a type can be added (`available`), how many of it the workspace has and which is its
        default (`default_channel_id`). A workspace may have several channels of every type (two support
        mailboxes, two web forms); one of each is its default (`is_default`), which the routes without a
        channel id act on, a conversation started without choosing a channel leaves from, and the next
        oldest becomes when it is removed. Removed channels are left out unless `include_removed=true`
        (they come last, with `deleted_at` and state `removed`, for naming the channel of older
        conversations). Every member of the team may read it; changing a channel needs an admin.
      parameters:
        - {name: include_removed, in: query, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: The channels and the types
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelList'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createChannel
      x-permission: access:write
      description: >
        Adds a channel of a type with its configuration (`config`, the type's schema in ChannelConfigInput).
        The type validates it and the channel is stored only when it passes (400 with `fields`). A workspace
        may add several channels of a type; give each a `name` that tells them apart. An outside account
        another channel already is answers 409 `channel_account_taken`. A name another live channel of the
        type has (whatever its case) answers 409 `channel_name_taken`, a support address whose mailbox
        another email channel of the workspace has (support+vip@ is support@) 409 `support_address_taken`;
        both with `fields` and `conflict` naming that channel. Without a name the first channel of a type is
        called as its type, a later one by its address (email) or with a number. The first channel of a
        type is its default; `is_default: true` makes a later one the default. The first email channel is
        what `PUT /api/v1/channels/email` connects.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChannelCreate'}}}
      responses:
        '201':
          description: The channel
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelDetail'}}}
        '200':
          description: The channel an earlier request with the same Idempotency-Key created; nothing new was created
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelDetail'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/channels/events:
    get:
      operationId: listChannelEvents
      x-permission: access:read
      description: >
        The history of the workspace's channels, newest first: who added, renamed, turned on or off,
        changed, removed a channel, changed a secret (only its last four characters are recorded), and
        opened or discarded messages a channel held. `channel_id` keeps one channel's; `cursor` is the
        `next_cursor` of the page before.
      parameters:
        - {name: channel_id, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: A page of the history
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelEventPage'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/channels/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getChannel
      x-permission: access:read
      description: A channel with its configuration as its type shows it (never a secret). A removed channel answers 404.
      responses:
        '200':
          description: The channel
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelDetail'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateChannel
      x-permission: access:write
      description: >
        Renames a channel, turns it on or off, or changes its configuration (`config`, validated by its
        type) or its rules (`settings`: join policy, default tags, priority and assignee, rate limits,
        commands; the type's defaults apply to what is left out). A channel that is off receives nothing:
        what arrives meanwhile is kept for an admin to open or discard (`held_count`), or, for a type that
        refuses mail while off (the web form), answered as if the channel did not exist. A reply while it
        is off is saved and its delivery fails with `channel_off`; retry it once the channel is on.
        Secrets go through `PUT /api/v1/channels/{id}/credentials`, never here.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChannelChange'}}}
      responses:
        '200':
          description: The channel
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelDetail'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: removeChannel
      x-permission: access:write
      description: >
        Removes a channel: its configuration and secrets are deleted, its conversations and their
        messages stay and keep its name (`channel_ref.deleted`). Adding the type again makes a new channel.
        Removing email is disconnecting it, as `DELETE /api/v1/channels/email` does. A channel that holds
        messages that arrived while it was off is not removed (409 `channel_has_held` with `held_count`):
        open or discard them first. An agent token's call is an agent request a person approves.
      responses:
        '204': {description: Removed}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/channels/{id}/credentials:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: setChannelCredential
      x-permission: access:write
      description: >
        Stores a secret the channel's type declares (sealed with MAILBOX_TOKEN_KEYS; 409
        `secret_keys_missing` without them). Only its last four characters are shown again. An agent
        token below the admin tier is refused with 403 `credentials_need_admin_token`: a secret never
        waits in an agent request.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChannelCredentialInput'}}}
      responses:
        '200':
          description: The secret's hint
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelCredential'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/channels/{id}/check:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: checkChannel
      x-permission: access:write
      description: Reads the channel's state again and returns it; it changes nothing.
      responses:
        '200':
          description: The channel
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelDetail'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/held/replay:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: replayHeldChannelMessages
      x-permission: access:write
      description: >
        Opens messages the channel held (all, or those of `event_ids`) as conversations, as they would
        have been had the channel been on, or adds them to `conversation_id` (a conversation of this
        workspace; 404 otherwise). It works while the channel is still off, and the ceiling on new
        conversations does not apply. Messages open one by one: one that cannot be opened stops the
        replay there, the ones opened before it are recorded in the channel's history, the rest stay held.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HeldReplayInput'}}}
      responses:
        '200':
          description: What became of each message
          content: {application/json: {schema: {$ref: '#/components/schemas/HeldReplayResult'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/channels/{id}/held/discard:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: discardHeldChannelMessages
      x-permission: access:write
      description: >
        Throws away messages the channel held (all, or those of `event_ids`). It cannot be undone; the
        history keeps how many. An agent token's call is an agent request a person approves.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HeldDiscardInput'}}}
      responses:
        '200':
          description: How many were discarded
          content: {application/json: {schema: {$ref: '#/components/schemas/HeldDiscardResult'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/intake/gatherings:
    get:
      operationId: listIntakeGatherings
      x-permission: conversations:read
      description: >
        The intake queue of chat channels: what customers said in one go on a scope that collects messages
        (a gathering), by list. review: what waits for a person, oldest first (review_reason says why;
        lane_blocked waits behind an earlier card of the same sender). deciding: what waits for AI, until
        decide_by. ignored: what was set aside, newest first. decided: what was opened, joined, applied or
        set aside, newest first. Email and web forms have no gatherings.
      parameters:
        - {name: state, in: query, required: false, schema: {type: string, enum: [review, deciding, ignored, decided], default: review}}
        - {name: channel_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: scope, in: query, required: false, schema: {type: string, pattern: '^[a-z_]{1,40}$'}}
        - {name: decided_by, in: query, required: false, description: 'Only cards decided by the rules, AI or a person (agent); with ignored, decided by ai is what AI set aside.', schema: {type: string, enum: [rules, ai, agent]}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200':
          description: A page of cards
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeGatheringPage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/intake/gatherings/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getIntakeGathering
      x-permission: conversations:read
      description: A card of the intake queue with everything its customer said (oldest first) and every decision made on it (newest first).
      responses:
        '200':
          description: The card
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeGatheringDetail'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/intake/gatherings/{id}/decide:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: decideIntakeGathering
      x-permission: conversations:write
      description: >
        Decides a card that waits for a person or for AI: create opens a conversation with what it said, as
        one message (never joining a conversation its thread found since; command and subject are optional,
        a command of the channel that opens a request), attach adds it to conversation_id, ignore sets it
        aside (requeue takes it back). conversation_id is one where the reply reaches the same people: in a
        group, a conversation of the same place; in a one-to-one chat, one of the same customer on the same
        channel; or the conversation the rules named. A conversation merged into another is joined through the
        one it was merged into, which must be one of these. Any other is 400 and nothing is decided; a
        closed one of the same place opens again. The same decision again changes
        nothing; another one once the card is decided is 409 gathering_decided, with how it stands. An agent
        token needs messages:send to create (the channel may tell the customer it was received) and
        conversations:update otherwise; without it the call is filed for a person (202).
        A repeat with the same Idempotency-Key answers what the first one got and decides nothing; the key
        with another decision or card is refused with 422, code `idempotency_key_reused`.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IntakeDecideInput'}}}
      responses:
        '200':
          description: The card as decided
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeGatheringDetail'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IntakeGatheringDecided'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/intake/gatherings/{id}/requeue:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: requeueIntakeGathering
      x-permission: conversations:write
      description: Takes a card that was set aside (by a person, AI or the rules) back to the queue, review_reason requeued. Its decisions stay in its history. A card in the queue already is left as it is; one opened or joined is 409. A repeat with the same Idempotency-Key answers what the first one got; the key with another card is refused with 422, code `idempotency_key_reused`.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      responses:
        '200':
          description: The card back in the queue
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeGatheringDetail'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IntakeGatheringDecided'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/intake/summary:
    get:
      operationId: getIntakeSummary
      x-permission: conversations:read
      description: >
        What the queue holds at a glance, for a badge: whether the workspace has a chat channel with intake
        (available), how many cards wait for a person (waiting) and for AI (deciding), and every channel and
        scope a card can come from. Names and counts only, never what a customer wrote.
      responses:
        '200':
          description: The summary
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeSummary'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/intake/stats:
    get:
      operationId: getIntakeStats
      x-permission: conversations:read
      description: Counts the gatherings that closed in the last days (one channel, or all), by state and by who decided, how many fell back on the rules, and how many of AI's decisions a person changed.
      parameters:
        - {name: channel_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: days, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
      responses:
        '200':
          description: The counts
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeStats'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/conversations/{id}/intake:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getConversationIntake
      x-permission: conversations:read
      description: >
        Why each message from a channel is in this conversation: what decided it (the rules by match or by
        default, a person, or AI) and the chat gathering it came in, with that gathering's decisions (the
        newest 50 gatherings).
      responses:
        '200':
          description: Why the messages are here
          content: {application/json: {schema: {$ref: '#/components/schemas/ConversationIntake'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/messages/move:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: moveConversationMessages
      x-permission: conversations:write
      description: >
        Moves customer messages (and their files) of this conversation: to another conversation of the
        workspace (to.conversation_id), into a new conversation (to.new, a split), or, for a chat channel's
        messages, back to the intake queue (to.queue; email and web forms have none: 422 no_intake_queue).
        Replies and notes of the team stay. A resolved or closed conversation that gets them reopens.
        close_source with to.conversation_id takes every customer message of this conversation and closes
        it, pointing to where they went ("not a new request"); refused with 409 source_has_activity once
        someone replied, wrote a note or assigned it. Nothing is sent to the customer. warnings says the
        messages now sit in a conversation of another contact (replies go to that conversation's contact)
        or of another channel. Every move is undone with POST /api/v1/message-moves/{id}/undo. A repeat with
        the same Idempotency-Key answers the first move and moves nothing; the key with other messages or
        another target is refused with 422, code `idempotency_key_reused`.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MessageMoveInput'}}}
      responses:
        '200':
          description: The move
          content: {application/json: {schema: {$ref: '#/components/schemas/MessageMoveResult'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: >-
            no_intake_queue: these messages came through no chat scope with an intake queue; or
            idempotency_key_reused: the Idempotency-Key already names another move, and nothing was moved
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/conversations/{id}/message-moves:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listMessageMoves
      x-permission: conversations:read
      description: The newest 100 moves of messages out of or into this conversation, newest first, each with whether it can still be undone.
      responses:
        '200':
          description: The moves
          content: {application/json: {schema: {$ref: '#/components/schemas/MessageMovePage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/message-moves/{id}/undo:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: undoMessageMove
      x-permission: conversations:write
      description: >
        Puts the messages of a move back where they were, with the statuses it changed while nobody changed
        them since: a conversation it closed reopens, one it opened (a split) closes and points back. Undoing
        it again changes nothing. Only the newest move of a message is undone (409 move_superseded); a move
        to the intake queue whose card was decided since is not (409 move_decided). A repeat with the same
        Idempotency-Key answers what the first one got; the key with another move is refused with 422, code
        `idempotency_key_reused`.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      responses:
        '200':
          description: The move, undone
          content: {application/json: {schema: {$ref: '#/components/schemas/MessageMove'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/channel-thread-items:
    get:
      operationId: listUnresolvedChatItems
      x-permission: conversations:read
      description: >
        What customers said on chat channels, in places that open conversations, that nobody concluded on
        yet (it arrived while the channel was off), oldest first. older_than keeps those older than so
        many seconds.
      parameters:
        - {name: older_than, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 2592000}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: A page of items
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatPage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/conversations/{id}/chat:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getConversationChat
      x-permission: conversations:read
      description: >
        What was said in the chat places a conversation's messages came from, newest first: the customers'
        messages (another customer of a group is marked is_other_customer), the team's replies and the
        channel's notices, with which items are part of this conversation (linked) and how they came to it.
        linked=only keeps the conversation's own. Empty for a conversation that came from no chat.
      parameters:
        - {name: linked, in: query, required: false, schema: {type: string, enum: [only]}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: A page of items
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatPage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/ai:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getChannelAI
      x-permission: access:read
      description: >
        What each AI feature does by itself on the channel and on each scope of its type (a chat's
        one-to-one messages and groups; `""` is the whole channel): the scope's own level (null when it
        follows the channel, then the workspace's default), the level that runs, and why it is off
        (`workspace_off`: the workspace has not turned the feature on). Triage and drafts are on every
        channel; intake only on the scopes a chat type declares, never on email or a web form.
      responses:
        '200':
          description: The channel's AI levels
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAI'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/ai/{slot}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: slot, in: path, required: true, schema: {$ref: '#/components/schemas/AISlotName'}}
    put:
      operationId: setChannelAI
      x-permission: access:read
      description: >
        Sets what one AI feature does by itself on a scope of the channel (`level`: off, suggest, auto, or
        null to follow the channel and the workspace). Drafts go up to suggest (AI never sends); intake
        exists only on a chat type's intake scopes (422 `intake_not_supported` with `available_slots`
        otherwise) and takes `options`. A level decides only the AI's own work; people can ask by hand
        while the workspace has the feature on. An agent token lowers a level with `ai_settings:update`;
        a change that lets AI do more by itself (a higher level of any scope it reaches, a lower
        threshold, a source turned on, other instructions) is an agent request a person approves,
        whatever the token holds. Only admins change a level (403 for another role). Every change is in
        the AI history and in the channel's.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAIInput'}}}
      responses:
        '200':
          description: The channel's AI levels after the change
          content: {application/json: {schema: {$ref: '#/components/schemas/ChannelAI'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/AILevelNotAllowed'}
  /api/v1/channels/{id}/ai/intake/readiness:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getIntakeReadiness
      x-permission: access:read
      description: >
        Whether intake's AI may act on its own on a chat channel's scope, per action (create, attach,
        ignore), for the model intake runs and the prompt version of this server: people's explicit
        labels of the last 30 days (a person following or correcting AI on a card or by moving its
        messages) plus the newest recorded evaluation of each dataset of that model and prompt. An action
        opens with 30 labels at its accuracy (create 90 %, attach and ignore 95 %), no severe error for
        attach and ignore, and at most one conversation opened for chatter a week for create; an admin may
        open one by hand (gate_override). A closed action stays a suggestion at auto. Also what AI did on
        its own and how much people corrected, and what the last 30 days say a month costs. Nothing here
        calls a model.
      parameters:
        - {name: scope, in: query, required: true, schema: {type: string, pattern: '^[a-z_]{1,40}$'}, description: 'One of the scopes the channel''s type collects for intake.'}
      responses:
        '200':
          description: The scope's readiness
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeReadiness'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/ai/intake/evaluations:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listIntakeEvaluations
      x-permission: access:read
      description: The offline evaluations recorded for a chat channel's intake, newest first (at most 100); scope narrows them.
      parameters:
        - {name: scope, in: query, required: false, schema: {type: string, pattern: '^[a-z_]{1,40}$'}}
      responses:
        '200':
          description: Recorded evaluations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/IntakeEvaluation'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: recordIntakeEvaluation
      x-permission: access:write
      description: >
        Records the counts of an offline evaluation (`collie intake-eval`) of a scope: the model and
        prompt version it ran, the dataset's SHA-256, and per action the labelled cases, how many it got
        right, and its severe and light errors. It counts towards readiness only for that model and prompt
        version, and a newer run of the same dataset replaces it. Only admins; an agent token's record is
        an agent request a person approves, since it can open a gate.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IntakeEvaluationInput'}}}
      responses:
        '201':
          description: The recorded evaluation
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeEvaluation'}}}
        '200':
          description: The evaluation an earlier request with the same Idempotency-Key recorded; nothing new was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/IntakeEvaluation'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/channels/{id}/threads:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listChannelThreads
      x-permission: conversations:read
      description: >
        The places of a chat channel (one-to-one chats and groups), most recently active first, each with
        its newest item. Empty for a channel type without places (email, a web form). No public route
        reads a thread: a customer never sees another customer's message.
      parameters:
        - {name: kind, in: query, required: false, schema: {type: string, enum: [direct, group]}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: A page of places
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatThreadPage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/threads/{threadId}/items:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: threadId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listChannelThreadItems
      x-permission: conversations:read
      description: >
        Everything said in one place of a chat channel, newest first: what became a conversation's, what
        waits for review, what was kept as chatter or set aside as not a request, and what the team and the
        channel sent.
      parameters:
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: A page of items
          content: {application/json: {schema: {$ref: '#/components/schemas/ChatPage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/email:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getEmailChannelByID
      x-permission: access:read
      description: >-
        The settings of one email channel of the workspace, as `GET /api/v1/channels/email` shows the
        default one: its address, sender name, forwarding address (`hosted_address`), inbound secret state,
        domain verification and Gmail connection. 404 `channel_not_found` when the id names no email
        channel of this workspace.
      responses:
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/email/forwarding-confirmation:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getEmailForwardingConfirmation
      x-permission: access:read
      description: >-
        The confirmation Gmail (or Google Workspace) sent when a mailbox was set to forward to this email
        channel, read from the newest email of `forwarding-noreply@google.com` with a "Forwarding Confirmation"
        subject that reached the channel in the last 24 hours. The email itself stays a normal conversation
        (`conversation_id`). `confirm_url` is Google's confirmation link only when it is https on
        `mail.google.com` or `mail-settings.google.com` and the message passed the sender check of the
        trusted receiving server (`EMAIL_TRUSTED_AUTHSERV_ID`); otherwise it is null and only the code is
        given, because anyone can send mail with that From line. 404 `not_found` when no such email arrived
        in the last 24 hours, or `channel_not_found` when the id names no email channel of this workspace.
      responses:
        '200':
          description: The newest forwarding confirmation of the channel
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForwardingConfirmation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/{id}/email/domain-verification:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: verifyEmailDomainByID
      x-permission: access:write
      description: >-
        `POST /api/v1/channels/email/domain-verification` for one email channel. The verification belongs to
        the domain: once one channel of the workspace verified it, every channel on it is verified.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/channels/{id}/email/secret:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: rotateEmailInboundSecretByID
      x-permission: access:write
      description: >-
        Create or replace the inbound secret of one email channel. Mail a forwarder sends with it arrives on
        that channel. The raw secret is returned once; the previous one stops working.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: New inbound secret, shown once
          content:
            application/json:
              schema:
                type: object
                required: [inbound_secret, inbound_url]
                properties:
                  inbound_secret: {type: string, minLength: 1}
                  inbound_url: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/{id}/email/test-message:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: sendEmailTestMessageByID
      x-permission: conversations:write
      description: >-
        Send yourself a test message: an incoming email from the signed-in agent's own address arrives on
        this email channel and opens a conversation, stored the way real inbound mail is. It lets a team see the
        whole loop without a terminal or a forwarder: answer it, and the reply is delivered to that agent's
        mailbox by the channel's normal outbound path. On a trial the reply is allowed because its only
        recipient is an agent of this workspace whose address is proven (the agent signed in through a
        pairing link or a verified Cloud identity, not only an invite); a Cc to anyone else is still refused.
        Five test messages per workspace an hour (429 `rate_limited` with Retry-After after that); 404 when
        the workspace has no such email channel; 409 `own_address` when the agent signs in with the support
        address itself, whose mail never opens a conversation.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The test message arrived and opened a conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestMessageResult'}
        '200':
          description: The test message an earlier request with the same Idempotency-Key sent; nothing new was sent and the hourly allowance is not used
          content: {application/json: {schema: {$ref: '#/components/schemas/TestMessageResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: Five test messages were sent in the last hour; Retry-After says when the next one may go.
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/channels/{id}/email/gmail:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: connectGmailByID
      x-permission: access:write
      description: >-
        `POST /api/v1/channels/email/gmail` for one email channel: its replies, and only its, are then sent
        through that Gmail account. The consent finishes at the same callback, which returns to this
        channel's settings.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/ConsentLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: disconnectGmailByID
      x-permission: access:write
      description: >-
        `DELETE /api/v1/channels/email/gmail` for one email channel. The grant is revoked at Google only when
        no other channel holds the same account. A locked workspace may disconnect.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Gmail disconnected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/{id}/email/microsoft:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: connectMicrosoftByID
      x-permission: access:write
      description: >-
        `POST /api/v1/channels/email/microsoft` for one email channel: its replies, and only its, are then
        sent through that Microsoft 365 or Outlook.com mailbox. The consent finishes at the same callback,
        which returns to this channel's settings.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/ConsentLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: disconnectMicrosoftByID
      x-permission: access:write
      description: >-
        `DELETE /api/v1/channels/email/microsoft` for one email channel. A locked workspace may disconnect.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Microsoft 365 disconnected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email:
    get:
      operationId: getEmailChannel
      x-permission: access:read
      description: >-
        The settings of the workspace's default email channel (`is_default`); `channel` is null while email is
        not connected. Other email channels are read with `GET /api/v1/channels/{id}/email`.
      responses:
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: putEmailChannel
      x-permission: access:write
      description: >
        Connect email (the first email channel), or change the default channel's support address, its sender
        name, or both. Send only `sender_name` to rename the sender of a connected channel: the address, its
        domain verification and its sending domain stay as they are. Add another mailbox with
        `POST /api/v1/channels` and change it with `PATCH /api/v1/channels/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                support_address:
                  type: string
                  format: email
                  description: >
                    Required to connect the channel. Leave it out to keep the current address; a changed
                    address loses its domain verification.
                sender_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: >
                    The name customers see in the From line of every reply. Spaces at the ends are removed;
                    1 to 100 characters without line breaks or other control characters (400 otherwise).
                    On Colliedesk Cloud a name with a well-known brand in it is refused (422).
                    Leave it out to keep the current name; a new channel starts with the workspace name.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteEmailChannel
      x-permission: access:write
      description: Disconnect the default email channel (`DELETE /api/v1/channels/{id}` removes any channel). Conversations and messages stay; the inbound secret stops working; the next oldest email channel becomes the default. Mail held while the channel was off must be opened or discarded first (409 `channel_has_held`).
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Email channel disconnected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/channels/email/domain-verification:
    post:
      operationId: verifyEmailDomain
      x-permission: access:write
      description: >
        Look up the TXT record `dns_record_name` and mark the support address domain verified when it
        holds `dns_record_value`. When the server has an email provider account (`domain_verification` is
        `provider`), that TXT record is the proof of control and is checked first (409 `dns_record_not_found`
        without it, and the provider is not called). Then the domain is created at the provider on the first
        check and each check asks the provider to re-check: the domain is verified only when the provider
        reports it `verified`, and a 409 `dns_record_not_verified` means the records in
        `channel.dns_records` are not all verified yet. Checks that reach the provider are limited to one per
        workspace every 30 seconds (429 with `Retry-After`). 409 `email_domain_unavailable` is the provider's
        validation refusal of the domain name; any other provider failure is 502.
        Changing the support address resets verification. Agent tokens may
        check 10 times an hour per workspace (429 with `Retry-After`); a person is not limited.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/channels/email/secret:
    post:
      operationId: rotateEmailInboundSecret
      x-permission: access:write
      description: Create or replace the inbound secret of the default email channel. The raw secret is returned once; the previous one stops working.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: New inbound secret, shown once
          content:
            application/json:
              schema:
                type: object
                required: [inbound_secret, inbound_url]
                properties:
                  inbound_secret: {type: string, minLength: 1}
                  inbound_url: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email/test-message:
    post:
      operationId: sendEmailTestMessage
      x-permission: conversations:write
      description: >-
        Send yourself a test message: an incoming email from the signed-in agent's own address arrives on
        the default email channel and opens a conversation, stored the way real inbound mail is. It lets a team see the
        whole loop without a terminal or a forwarder: answer it, and the reply is delivered to that agent's
        mailbox by the channel's normal outbound path. On a trial the reply is allowed because its only
        recipient is an agent of this workspace whose address is proven (the agent signed in through a
        pairing link or a verified Cloud identity, not only an invite); a Cc to anyone else is still refused.
        Five test messages per workspace an hour (429 `rate_limited` with Retry-After after that); 404 when
        the workspace has no such email channel; 409 `own_address` when the agent signs in with the support
        address itself, whose mail never opens a conversation.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The test message arrived and opened a conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestMessageResult'}
        '200':
          description: The test message an earlier request with the same Idempotency-Key sent; nothing new was sent and the hourly allowance is not used
          content: {application/json: {schema: {$ref: '#/components/schemas/TestMessageResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: Five test messages were sent in the last hour; Retry-After says when the next one may go.
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/channels/email/gmail:
    post:
      operationId: connectGmail
      x-permission: access:write
      description: >-
        Start connecting a Gmail account to the default email channel, so its replies are sent through the Gmail API from that
        address and kept in its Sent folder. Incoming mail still arrives by forwarding. Answers Google's consent
        address (`url`), valid for 10 minutes, for the person who asked to open in their browser; Google then
        sends that browser to `GET /api/v1/channels/email/gmail/callback`, which finishes only for the same
        signed-in person. Google is asked for `gmail.send` and `openid email` (the address that connected) and
        nothing that reads mail. The account must be the channel's support address mailbox, and one account
        sends for one email channel of a workspace (the callback says otherwise). Connecting again replaces
        the earlier account and revokes its grant. 409
        `email_channel_missing` without an email channel; 409 `gmail_not_configured` when the server lacks its
        Google settings (`gmail.off_reason` is `not_set_up`; the server log and the operator console name them); 409 `feature_off` when
        the operator switched Gmail off (connections stay, and their replies wait until it is on again). An agent token gets an
        agent request; the person who approves receives the consent address.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/ConsentLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: disconnectGmail
      x-permission: access:write
      description: >-
        Disconnect Gmail: the grant is removed here and revoked at Google. Replies are then sent the way the
        workspace sent before connecting (SMTP); a reply still queued for Gmail fails with the reason and can be
        retried. A locked workspace may disconnect.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Gmail disconnected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email/gmail/callback:
    get:
      operationId: finishGmailConnect
      security: []
      x-permission: public
      summary: Google's redirect after the consent screen
      description: >-
        Opened by the browser Google redirects, never by an API client. It needs the session cookie of the admin
        who started the connection (a bearer token is not accepted) and the unused `state` of that start; the
        state is looked up in that person's workspace only. Every outcome is a 303 to the Replies tab of the
        email channel the consent was for (`/settings/channels/<channel id>`, or `/settings/channels/type/email`
        while the state is not known): `?tab=replies&gmail=connected`, or `?tab=replies&gmail_error=<reason>` with `signed_out` (no session cookie), `forbidden` (not an
        admin, or the workspace is locked), `expired` (state unknown, used, from another workspace or older than
        10 minutes), `wrong_person` (someone else started it), `denied` (consent cancelled at Google),
        `send_not_granted` (the "send email" permission was unticked), `no_refresh_token`, `no_address` (Google
        named no verified address), `address_mismatch` (the account is not the channel's support address
        mailbox), `account_in_use` (another email channel of the workspace sends through it, named by
        `&gmail_channel=<id>`), `email_channel_missing` and `google_unavailable`. A refused grant is revoked
        unless a channel holds the account. Google's own error text is
        never echoed.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '303':
          description: Back to the settings page, which explains the outcome.
          headers:
            Location: {schema: {type: string}, description: 'The channel settings path with ?tab=replies&gmail=connected or &gmail_error=<reason>.'}
  /api/v1/channels/email/microsoft:
    post:
      operationId: connectMicrosoft
      x-permission: access:write
      description: >-
        Start connecting a Microsoft 365 (work or school) or Outlook.com (personal) mailbox to the default
        email channel, so its replies are sent through Microsoft Graph from that address and kept in its Sent
        Items. Incoming mail still arrives by forwarding. Answers Microsoft's sign-in address (`url`), valid
        for 10 minutes, for the person who asked to open in their browser; Microsoft then sends that browser
        to `GET /api/v1/channels/email/microsoft/callback`, which finishes only for the same signed-in person.
        Microsoft is asked for `Mail.Send`, `User.Read`, `offline_access` and `openid`, and nothing that reads
        mail. The mailbox must be the channel's support address, and one account sends for one email channel
        of a workspace (the callback says otherwise). Connecting replaces the channel's earlier connection,
        Gmail or Microsoft 365; an earlier Gmail grant is revoked at Google. A work account may first need
        its organization's admin to approve Colliedesk (`microsoft.admin_consent_url` in the channel
        settings). 409 `email_channel_missing` without an email channel; 409 `microsoft_not_configured` when
        the server lacks its Microsoft settings (`microsoft.off_reason` is `not_set_up`). An agent token
        gets an agent request; the person who approves receives the sign-in address.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/ConsentLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: disconnectMicrosoft
      x-permission: access:write
      description: >-
        Disconnect Microsoft 365: the grant is deleted here. Microsoft has no API that revokes one app's grant,
        so Colliedesk stays listed in the account's apps until the person removes it there (My Apps for a
        work or school account, account.live.com/consent/Manage for a personal one); the deleted token is
        useless without this server's client secret. Replies are then sent the way the workspace sent before
        connecting (SMTP); a reply still queued for Microsoft 365 fails with the reason and can be retried. A
        locked workspace may disconnect. 404 when the channel has no Microsoft 365 connection.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Microsoft 365 disconnected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email/microsoft/callback:
    get:
      operationId: finishMicrosoftConnect
      security: []
      x-permission: public
      summary: Microsoft's redirect after the sign-in and consent pages
      description: >-
        Opened by the browser Microsoft redirects, never by an API client. It needs the session cookie of the
        admin who started the connection (a bearer token is not accepted) and the unused `state` of that
        start, started for Microsoft 365; the state is looked up in that person's workspace only. Every
        outcome is a 303 to the Replies tab of the email channel the consent was for
        (`/settings/channels/<channel id>`, or `/settings/channels/type/email` while the state is not known):
        `?tab=replies&microsoft=connected`, or `?tab=replies&microsoft_error=<reason>` with `signed_out`,
        `forbidden` (not an admin, or the workspace is locked), `expired` (state unknown, used, from another
        workspace or provider, or older than 10 minutes), `wrong_person`, `denied` (cancelled at Microsoft,
        or the organization needs an admin's approval), `send_not_granted`, `no_refresh_token`,
        `mailbox_unavailable` (the account has no Exchange Online mailbox), `address_mismatch` (the mailbox is
        not the channel's support address; aliases and shared mailboxes are not supported yet),
        `account_in_use` (named by `&microsoft_channel=<id>`), `email_channel_missing`,
        `server_misconfigured` (Microsoft refused this server's client secret) and `microsoft_unavailable`.
        Microsoft's own error text is never echoed.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '303':
          description: Back to the settings page, which explains the outcome.
          headers:
            Location: {schema: {type: string}, description: 'The channel settings path with ?tab=replies&microsoft=connected or &microsoft_error=<reason>.'}
  /api/v1/channels/email/microsoft/admin-consent:
    get:
      operationId: finishMicrosoftAdminConsent
      security: []
      x-permission: public
      summary: Microsoft's redirect after an organization's admin approved Colliedesk
      description: >-
        Opened by the browser of the organization's admin, who often has no Colliedesk session. Microsoft
        answers `admin_consent=True` (or `error`) and a `tenant` that is not trusted for anything; there is no
        code and nothing is stored. With a Colliedesk session it is a 303 to the Replies tab of the email
        channel named by `state` (when it is one of the session's workspace) with `?microsoft=admin_consent_done`
        or `?microsoft_error=admin_consent_failed`; without one it is a short page telling the admin to ask
        their Colliedesk admin to select Connect Microsoft 365 again.
      parameters:
        - {name: admin_consent, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '303':
          description: Back to the settings page of the signed-in person.
          headers:
            Location: {schema: {type: string}, description: 'The channel settings path with ?tab=replies&microsoft=admin_consent_done or &microsoft_error=admin_consent_failed.'}
        '200':
          description: A page for an admin without a Colliedesk session.
          content:
            text/html:
              schema: {type: string}
  /api/v1/channels/email/inbound:
    post:
      operationId: receiveInboundEmail
      security: [{inboundSecret: []}]
      x-permission: channels:inbound
      description: >
        Accepts one raw RFC 5322 message from a forwarder (Cloudflare Email Worker, Postmark or SES
        forwarding, an MTA pipe). Authenticated by an email channel's inbound secret, not by a session: the
        message arrives on that channel. Every accepted outcome is 200 so the forwarder does not retry; the
        `status` says what happened. The server-wide MAIL_FROM_INBOUND_SECRET is also accepted: it is used by
        the forwarder of MAIL_FROM_DOMAIN, and the workspace is taken from the reply+<token>@MAIL_FROM_DOMAIN
        recipient, the channel from the one that conversation's replies leave through. On the hosted cloud
        (HOSTED_MAIL_DOMAIN set) the same secret also carries mail for
        `<local>@<workspace slug>.<HOSTED_MAIL_DOMAIN>`: the workspace is taken from the topmost
        `X-Original-To` header, which the forwarder writes from the envelope recipient, and the channel from
        the local part (each channel's `hosted_address`; another local part reaches the default channel); To
        and Cc are never used. A recipient under the hosted domain that matches no workspace with a connected
        email channel is answered 404 so the forwarder rejects the message.
        Attachments, inline images and the gzip-compressed raw message are stored with the message;
        a storage failure returns 500 and stores nothing.
      requestBody:
        required: true
        content:
          message/rfc822:
            schema: {type: string}
      responses:
        '200':
          description: Message accepted, threaded, recognised as a duplicate, or dropped by loop protection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboundEmailResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/MailboxClosed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email/inbound/recipient:
    post:
      operationId: checkInboundRecipient
      security: [{inboundSecret: []}]
      x-permission: channels:inbound
      description: >
        Asked by the hosted-cloud MTA before it accepts RCPT TO, with the server-wide
        MAIL_FROM_INBOUND_SECRET (a workspace secret is refused). 204 when `POST
        /api/v1/channels/email/inbound` would route mail for this address to a workspace with a connected
        email channel, 404 otherwise. Refusing in the SMTP session means an address nobody owns is never
        bounced afterwards to a sender that may be forged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient]
              properties:
                recipient: {type: string, description: Envelope recipient (RCPT TO) address}
      responses:
        '204': {description: Mail for this address would be accepted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/conversations/{id}/time-entries:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listTimeEntries
      x-permission: conversations:read
      description: Time logged on a conversation, oldest first (for example imported from Freshdesk).
      responses:
        '200':
          description: Time entries of the conversation
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TimeEntry'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/presence:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: putConversationPresence
      x-permission: conversations:read
      description: >-
        Says that the caller has this conversation open, and whether its reply box holds a reply not
        sent yet (`writing`; the text itself is never sent). The answer lists the other people and AI
        agents who have it open, so one call both announces and reads. A browser tab calls it every
        `heartbeat_seconds` while the conversation is open; a row not renewed in time disappears on its
        own (15 seconds for viewing, 150 seconds with a reply not sent yet, 2 minutes for an agent
        token, which does not call on a schedule). `client_id` names one tab: a person with two tabs
        open has two rows and is listed once. One tab announces one conversation at most every 2
        seconds, and a call that starts or ends a reply (`writing` changes) at most every half
        second: a quicker call is answered 429 `too_many_requests` with `Retry-After` and changes
        nothing. Changes nothing a customer or a teammate wrote, so the read tier is enough for an
        agent token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceUpdate'}
      responses:
        '200':
          description: The others who have the conversation open
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPresence'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          description: This tab announced this conversation too recently (2 seconds, half a second to start or end a reply); nothing changed
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/conversations/{id}/presence/{clientId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: clientId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/PresenceClientID'}
    delete:
      operationId: deleteConversationPresence
      x-permission: conversations:read
      description: >-
        Says that the caller closed the conversation in the tab `clientId` (or, for an agent token,
        stopped working on it). Only the caller's own row is removed; another person's row, an unknown
        `clientId` or one already gone answer 204 the same, so calling it twice is harmless. A browser
        sends it with `fetch` `keepalive` when the tab closes.
      responses:
        '204': {description: The caller's row for this tab is gone}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/inbox/activity:
    get:
      operationId: getInboxActivity
      x-permission: conversations:read
      description: >-
        What changed in the inbox after `since`: conversations created, conversations another agent
        assigned to the caller, and conversations that changed in any way (a new customer message, a
        status, assignee, priority or tag change, a reply or note). `updated` includes the caller's own
        changes; only `incoming_at` marks something to announce. Each list holds at most 50 items,
        newest first; in `updated`, conversations with a customer message in the window come first, so
        a bulk change cannot push a customer reply out of the list. Send the returned `now`
        as the next `since`. A `since` older than 10 minutes is treated as 10 minutes old; an agent who
        was away longer reloads the inbox. A list can repeat an item from the previous call (a short lookback covers conversations that committed late), so the client removes duplicates by id (`updated` items by `id` and `updated_at`). Without `since` the lists are empty and `now` is the first cursor. `viewing` is not a change list: every call, with or without `since`, says who has which conversation open now.
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Inbox activity after the cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxActivity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/attachments/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: downloadAttachment
      x-permission: conversations:read
      description: >-
        Streams the stored bytes of an attachment in the caller's workspace. Always served as a
        download (`Content-Disposition: attachment`) with `application/octet-stream`; the original
        media type is in the attachment metadata on the message.
      responses:
        '200':
          description: Attachment bytes
          headers:
            Content-Disposition: {schema: {type: string}}
            X-Content-SHA256: {schema: {type: string}, description: 'Hex SHA-256 recorded when the file was stored'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/mail-image:
    get:
      operationId: getMailImage
      x-permission: conversations:read
      description: >-
        Serves one remote image of an incoming email on the viewer's behalf, so the sender sees the
        server's address and not the reader's. The address is made by the server: the message list
        rewrites every remote `<img src>` of `body_html` to this route for a signed-in person, with `u`
        (the original URL) and `s` (an HMAC over the workspace and the URL). Only signed addresses are
        served. The server refuses private, loopback, link-local, CGNAT, multicast and metadata
        addresses (also after DNS and on every redirect, at most 3), serves only PNG, JPEG, GIF and
        WebP, or an SVG document (checked from the bytes; an SVG is served with a sandboxing Content-Security-Policy and only ever shown through img), caps an image at 5 MiB, and keeps a fetched
        image per workspace so a second view does not call the source again. An agent token cannot
        use it; it reads the original HTML.
      parameters:
        - {name: u, in: query, required: true, schema: {type: string}, description: Original image URL (http or https).}
        - {name: s, in: query, required: true, schema: {type: string}, description: Hex HMAC signature made by the server.}
      responses:
        '200':
          description: The image
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=2592000, immutable'}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/svg+xml: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The signature is wrong, or the address is private or internal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: The image is over the size limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '415':
          description: The response is not a PNG, JPEG, GIF, WebP or SVG image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: The source could not be reached or answered with an error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Too many images are being fetched; retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/contacts:
    get:
      operationId: listContacts
      x-permission: contacts:read
      parameters:
        - name: search
          in: query
          description: >-
            Keep contacts whose name or email contains this text. A contact merged into another is left
            out; when it matches, the contact it was merged into is returned instead (its conversations
            are there).
          schema: {type: string}
        - name: ids
          in: query
          description: >-
            Comma-separated contact ids (UUIDs), at most 100. Only these contacts of the workspace are
            returned, in name order; an unknown id, or an id of another workspace, is skipped. More than
            100 ids, an empty entry or a value that is not a UUID answers 400 and names the problem.
            Combines with search. Merged contacts are returned when named by id.
          schema: {type: string}
        - name: limit
          in: query
          description: >-
            Return at most this many contacts (1 to 200), the first in name order. Without it every
            matching contact is returned. With it, `has_more` says whether more matched. Any other
            value answers 400.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: Workspace contacts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Contact'}}
                  has_more:
                    type: boolean
                    description: Present only when `limit` was given. True when more contacts matched than were returned.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createContact
      x-permission: contacts:write
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: {type: string, minLength: 1}
                email: {type: string, format: email}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '200':
          description: The contact an earlier request with the same Idempotency-Key created; nothing new was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/Contact'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: The address is already a customer (`contact_exists`); `contact` in the error is the contact to use, the one it was merged into when it was merged
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/contacts/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getContact
      x-permission: contacts:read
      description: >-
        The contact, how many conversations it has, the contacts merged into it, and the contact it was
        merged into. Read its conversations a page at a time with `GET /conversations?contact={id}`.
      responses:
        '200':
          description: Contact with conversation history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      operationId: updateContact
      x-permission: contacts:write
      description: >-
        Rename the contact. The name is what the team sees and the display name of the `To` line of
        later emails; the email address does not change. Rename it again to undo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Renamed contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/contacts/{id}/merges:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: mergeContact
      x-permission: contacts:write
      summary: Merge a duplicate contact into this one
      description: >-
        Moves every conversation of the duplicate (`contact_id`) to this contact and marks the duplicate
        as merged into it. Nothing is deleted: the duplicate keeps its name and email, mail from its
        address joins this contact from now on, and replies on the moved conversations go to this
        contact's email. Undo it with `DELETE /contacts/{id}/merges/{mergeId}`. The duplicate must not be
        this contact, merged already, or have contacts merged into it; this contact must not be merged.
        409 `contact_merged` says which.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id]
              properties:
                contact_id: {type: string, format: uuid, description: The duplicate to merge into this contact}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The merge, with the conversations it moved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactMerge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contacts/{id}/merges/{mergeId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: mergeId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: unmergeContact
      x-permission: contacts:write
      summary: Undo a merge
      description: >-
        Moves back to the duplicate every conversation the merge moved that is still on this contact, and
        makes the duplicate a contact of its own again. Conversations that arrived after the merge stay
        here. A merge already undone answers 409.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The undone merge
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactMerge'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/agents:
    get:
      operationId: listAgents
      x-permission: access:read
      description: >
        Every agent of the workspace, deactivated ones included (old conversations and messages still name
        them). Clients hide deactivated agents from assignee pickers.
      responses:
        '200':
          description: Workspace team
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TeamMember'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/agents/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateAgent
      x-permission: access:write
      description: >
        Change an agent's display name, role or active state; send at least one of `display_name`, `role`
        and `active`. Renaming is not a change to the admin role, so an `admin` agent token renames anyone
        directly; a rename sent with a role or active change follows the rules of that change. Deactivating an
        agent, in one transaction: sets `deactivated_at`, revokes the agent's sessions and unused sign-in
        links and invites, and moves the agent's open and pending conversations to `reassign_to` (to
        Unassigned when it is absent). Resolved and closed conversations keep their assignee. A
        deactivated agent cannot sign in and holds no seat. Reactivating clears `deactivated_at`, takes a
        seat again and does not restore assignments; the agent signs in through a new link. Sending the
        state an agent already has changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {$ref: '#/components/schemas/DisplayNameInput'}
                role: {$ref: '#/components/schemas/Role'}
                active: {type: boolean}
                reassign_to:
                  type: [string, 'null']
                  format: uuid
                  description: 'Only with `active: false`. An active agent of this workspace other than the one being deactivated; an invalid target is `invalid_reassign_target` and nothing changes.'
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The agent after the change
          content: {application/json: {schema: {$ref: '#/components/schemas/TeamMember'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >
            The change would leave the workspace without an active admin (error code `last_admin`). Make
            another agent an admin first.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/workspace/timezone:
    patch:
      operationId: updateWorkspaceTimezone
      x-permission: access:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: {type: string, minLength: 1}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated workspace timezone
          content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/workspace/name:
    patch:
      operationId: updateWorkspaceName
      x-permission: access:write
      description: >
        Rename the workspace. The team sees the name in the workspace switcher and Settings. Customers see it
        as the help center title while the help center has no title of its own; replies never carry it,
        because every email channel keeps its own `sender_name`. Spaces at the ends are removed; a name is
        2 to 60 characters without line breaks or other control characters (400 otherwise). On Colliedesk
        Cloud a name with a well-known brand in it is refused (422), as at sign-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 2, maxLength: 60}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Renamed workspace
          content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
  /api/v1/workspace/slug:
    patch:
      operationId: updateWorkspaceSlug
      x-permission: access:write
      description: >
        Rename the workspace slug. On the hosted cloud the slug is the subdomain of the forwarding address
        (`hosted_address`), so mail sent to the old address is rejected from this moment. A slug is 1 to 63
        lowercase letters, digits or inner hyphens and not a reserved name such as `app`, `www` or `mail`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: {type: string, minLength: 1, maxLength: 63}
                next: {$ref: '#/components/schemas/SignInNext'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated workspace
          content: {application/json: {schema: {$ref: '#/components/schemas/RenamedWorkspace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
  /api/v1/agents/me/timezone:
    patch:
      operationId: updateAgentTimezone
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: {type: [string, 'null']}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated agent timezone override
          content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/agents/me/display-name:
    patch:
      operationId: updateAgentDisplayName
      x-permission: authenticated
      description: >
        Set the display name of the agent signed in (or the person an agent token acts as). It is shown
        instead of the email address in the team list, on assignments and on notes. An empty string
        clears it, and the email address is shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: {$ref: '#/components/schemas/DisplayNameInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The agent with the new display name
          content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tags:
    get:
      operationId: listTags
      x-permission: conversations:read
      responses:
        '200':
          description: Workspace tags
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createTag
      x-permission: conversations:write
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
                color: {type: string, default: '#64748b'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created tag
          content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}
        '200':
          description: The tag an earlier request with the same Idempotency-Key created; nothing new was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/tags/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateTag
      x-permission: conversations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Renamed tag
          content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteTag
      x-permission: conversations:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Tag deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/saved-views:
    get:
      operationId: listSavedViews
      x-permission: conversations:read
      description: >
        The inbox views the caller can use: the views shared with the whole workspace, then the
        caller's own personal views, each group ordered by name ignoring case. A deleted view is not
        listed here (see `GET /api/v1/saved-views/trash`).
      responses:
        '200':
          description: Saved views
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createSavedView
      x-permission: conversations:write
      description: >
        Saves a set of inbox filters under a name. A personal view is seen only by the person who saved
        it; a shared view by everyone in the workspace, and anyone may change or delete it. Names are
        unique ignoring case among the caller's personal views and among the shared views (409). Each
        person keeps at most 50 personal views and a workspace at most 50 shared ones (409).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Saved view
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '200':
          description: The saved view an earlier request with the same Idempotency-Key created; nothing new was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/saved-views/trash:
    get:
      operationId: listDeletedSavedViews
      x-permission: conversations:read
      description: >
        Views deleted in the last 30 days that the caller could see, newest deletion first. Each can be
        restored with `POST /api/v1/saved-views/{id}/restore` until `purges_at`; after that it is gone.
      responses:
        '200':
          description: Deleted saved views
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/saved-views/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateSavedView
      x-permission: conversations:write
      description: >
        Renames a view, replaces its filters or changes who sees it. Send the `updated_at` you last read:
        if someone saved the view since, nothing changes and the answer is 409 `changed_elsewhere`.
        Only the owner of a personal view may change it or share it; making a shared view personal
        gives it to the caller. Another person's personal view answers 404, like a view that does not
        exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewChange'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Changed view
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteSavedView
      x-permission: conversations:write
      description: >
        Moves the view to the trash for 30 days; `POST /api/v1/saved-views/{id}/restore` brings it back.
        No conversation changes. Deleting a view already in the trash answers it unchanged.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The deleted view, with deleted_at and purges_at set
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/saved-views/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreSavedView
      x-permission: conversations:write
      description: >
        Brings a deleted view back; a view that is not in the trash is answered unchanged. Answers 409
        when a live view of the same group now has its name, or the group is full; rename or delete
        that one first.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored view
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-replies:
    get:
      operationId: listSavedReplies
      x-permission: conversations:read
      description: >
        The saved replies every agent in the workspace shares, ordered by title ignoring case. The
        body may hold the variables `{{customer.name}}` and `{{agent.name}}`; the web app fills them
        in when an agent inserts the reply. The API returns the text as stored. A reply in the trash
        is not listed here (see `GET /api/v1/saved-replies/trash`). `last_change` says who made the
        latest version, and through which agent token or approved agent request.
      responses:
        '200':
          description: Workspace saved replies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedReply'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createSavedReply
      x-permission: conversations:write
      description: >
        Any agent may create one, and a `send` agent token. A lower tier files an agent request a
        person approves. The title is unique among the replies not in the trash, ignoring case (409
        `duplicate_title`). A workspace holds at most 500, counting the ones in the trash (409
        `saved_reply_limit`).
        The new reply has version 1 in its history.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedReplyInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created saved reply
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '200':
          description: The saved reply an earlier request with the same Idempotency-Key created; nothing new was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/saved-replies/trash:
    get:
      operationId: listTrashedSavedReplies
      x-permission: conversations:read
      description: >
        Saved replies deleted in the last 30 days, most recently deleted first, in pages. Each can be
        restored with `POST /api/v1/saved-replies/{id}/restore` until `purges_at`; after that it is
        deleted for good with its history. Replies in the trash count toward the 500 of a workspace.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Saved replies in the trash
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TrashedSavedReply'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/saved-replies/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateSavedReply
      x-permission: conversations:write
      description: >
        Change the title, the body or both. Any agent may edit a shared reply, and a `send` agent
        token; a lower tier files an agent request whose detail shows the reply before and after. Send
        back the `updated_at` you read; when the reply was saved since, nothing changes and the answer
        is 409 `changed_elsewhere`. A taken title is 409 `duplicate_title`. Every edit adds a version
        to the history. A reply in the trash is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                title: {type: string, minLength: 1, maxLength: 200}
                body: {type: string, minLength: 1, maxLength: 20000}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated saved reply
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteSavedReply
      x-permission: conversations:write
      description: >
        Move the reply to the trash. It disappears from the list and the reply box, and can be
        restored for 30 days with `POST /api/v1/saved-replies/{id}/restore`. Send the `updated_at`
        you read: when the reply was saved since, nothing is deleted and the answer is 409
        `changed_elsewhere` (an agent request approved after someone edited the reply fails the same
        way). A `send` agent token may delete; a lower tier files an agent request.
      parameters:
        - {name: updated_at, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Saved reply moved to the trash}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-replies/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreSavedReply
      x-permission: conversations:write
      description: >
        Take a reply out of the trash, as it was when deleted. Send the `updated_at` of the trashed
        reply as you read it (409 `changed_elsewhere` when it changed since). 404 when it is not in the
        trash. 409 `duplicate_title` when another reply took its title meanwhile (rename that one
        first). A `send` agent token may restore; a lower tier files an agent request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored saved reply
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-replies/{id}/versions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listSavedReplyVersions
      x-permission: conversations:read
      description: >
        The versions of a saved reply, newest first, in pages: who made each, through which agent
        token or approved agent request, and the title and text it had. A reply in the trash keeps its
        history. Versions are never changed or removed while the reply exists; restoring one adds a new
        version.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before_version, in: query, description: Only versions older than this one (the next_before_version of the previous page)., schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Versions of the saved reply
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before_version]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedReplyVersion'}}
                  next_before_version: {type: [integer, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/saved-replies/{id}/versions/{version}/restore:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: restoreSavedReplyVersion
      x-permission: conversations:write
      description: >
        Make an earlier version the current one. The title and text of that version become a new
        version; nothing in the history is rewritten. Send back the `updated_at` you read (409
        `changed_elsewhere` when the reply was saved since). 409 `duplicate_title` when another reply
        has that title now. A reply in the trash is 404: restore it from the trash first. A `send`
        agent token may restore; a lower tier files an agent request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Saved reply with the restored text
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/billing:
    get:
      operationId: getBilling
      x-permission: billing:manage
      description: >
        The workspace plan, subscription state, the limits of that plan and current usage. Only
        present when billing is configured (the hosted cloud); self-hosted instances answer 404.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Plan, subscription state, limits and usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Billing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/billing/checkout:
    post:
      operationId: createBillingCheckout
      x-permission: billing:manage
      description: >
        Start a hosted checkout for the signed-in workspace. The workspace is taken from the session,
        never from the body. A workspace that already has a paid plan gets 409; it changes or cancels
        its plan in the portal. The `founding` plan gets 409 `founding_closed` once its slots are used up.
        A plan the workspace does not fit gets 409 `plan_does_not_fit` with what to remove: more seats
        (agents and pending invites) than the plan allows, or more stored attachment bytes, imported
        files included, than its storage cap. `checkout_refusals` of `GET /api/v1/billing` lists them.
        422 `billing_email_refused` when the payment provider does not accept the admin's address (a
        domain that receives no mail, for example); the message gives the provider's reason and what to do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              additionalProperties: false
              properties:
                plan: {$ref: '#/components/schemas/CheckoutPlan'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/BillingLink'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: The payment provider did not accept the admin's address; the message says why and what to do.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/billing/portal:
    post:
      operationId: createBillingPortal
      x-permission: billing:manage
      description: >
        Open the billing portal, where the customer changes the card, downloads invoices or cancels.
        404 until the workspace has had a subscription. The portal stays available after one ends.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/BillingLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/webhooks/polar:
    post:
      operationId: receivePolarWebhook
      security: [{polarWebhook: []}]
      x-permission: public
      description: >
        Receives Polar events. Authenticated by the Standard Webhooks signature (`webhook-id`,
        `webhook-timestamp`, `webhook-signature`), not by a session; a missing, wrong or stale
        signature is 401 and nothing is stored. A `subscription.*` event updates the workspace named by
        `customer.external_id`. Every understood event is 200 so Polar stops retrying; `status` says
        whether it was applied, was a redelivery, was older than the stored state, or was ignored
        (unknown workspace or product, other event types). Only present when billing is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Event understood
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/webhooks/resend:
    post:
      operationId: receiveResendWebhook
      security: [{resendWebhook: []}]
      x-permission: public
      description: >
        Receives Resend email events. Resend owns the envelope sender and rewrites the Message-ID, so its
        bounces never reach `MAIL_FROM_DOMAIN`; this webhook is how a reply sent through it shows
        **Delivery failed**. Authenticated by the Svix signature (`svix-id`, `svix-timestamp`,
        `svix-signature`), not by a session; a missing, wrong or stale signature is 401 and nothing is
        read. `email.bounced` (permanent) and `email.complained` fail the one reply named by the sender
        `reply+<token>-<reply id>@MAIL_FROM_DOMAIN` (for the older `reply+<token>@` form, only the reply
        whose Message-ID the relay kept) when the event names only the conversation's contact; when it
        names only Cc addresses of the reply, the reply stays sent and the missed copies are added to
        its note. Every understood event is 200 so Resend stops retrying; `status` is `applied`,
        `duplicate` (this `svix-id` was already applied) or `ignored` (other event types, a reply sent as
        a verified support address, no matching reply, the contact next to others or an address the
        reply was not sent to). Only present when
        `RESEND_WEBHOOK_SECRET` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Event understood
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/founding:
    get:
      operationId: getFoundingSlots
      security: []
      x-permission: public
      description: >
        How many of the Founding slots are taken, for the marketing site. Answered from server memory,
        never from the billing provider on the request: `taken` is null until the server has counted
        once after it started. `open` is false once Founding is closed, which is one-way: the slots
        are used up or the product was archived. Only present when billing is configured.
      responses:
        '200':
          description: Founding slot state
          headers:
            Cache-Control:
              schema: {type: string}
              description: '`public, max-age=60`'
            Access-Control-Allow-Origin:
              schema: {type: string}
              description: The marketing site origin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FoundingSlots'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/public/help-center/tls-ask:
    get:
      operationId: askHelpCenterCertificate
      security: []
      x-permission: public
      description: >-
        For the reverse proxy, not for people: Caddy's `on_demand_tls` asks it before getting a
        certificate for a host name it has never seen. It answers 200 when `domain` is exactly one label
        below `HELP_CENTER_DOMAIN` whose label is an existing workspace's slug (that host leads to the
        workspace's desk at its root and serves its help center under `/help`, so it answers whatever the
        help center's state). It also answers 200 when the workspace's help center is on and the
        workspace is not locked, and `domain` is the CNAME target `hc-<claim>` below
        `HELP_CENTER_DOMAIN` of its custom domain's claim (which redirects to the help center), or the
        workspace's custom domain.
        A custom domain answers 200 once it is active, or when it is pending and its DNS check passes
        now (within 2 seconds; the domain then becomes active). Live checks are bounded: a few at a
        time on the server and at most one per host name every 30 seconds. Every other case is the
        same 404; custom domains work without `HELP_CENTER_DOMAIN` too.
      parameters:
        - name: domain
          in: query
          required: true
          schema: {type: string, maxLength: 253}
      responses:
        '200': {description: The proxy may get a certificate for this host name}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/imports:
    get:
      operationId: listImports
      x-permission: workspace:import
      description: >
        The workspace's in-app imports and undos, newest first (at most 100). Admins only. A job never
        shows its Freshdesk API key; `has_key` says whether the server still holds it.
      responses:
        '200':
          description: Import jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ImportJob'}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: previewImport
      x-permission: workspace:import
      description: >
        Starts an import from Freshdesk by reading the account in the background, before anything is
        written (`state` previewing, then previewed with `preview`, or failed with `error_code`). Poll
        `GET /api/v1/imports/{id}`. The key must be a Freshdesk admin's; it is sealed on the server,
        never returned, and erased when the job ends or when the preview is not started within an
        hour. A new preview discards the workspace's earlier preview. An agent token below the admin
        tier is refused with 403 `credentials_need_admin_token` and nothing is stored: an agent request
        would keep the key.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportInput'}
      responses:
        '202':
          description: The preview job, still previewing
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '200':
          description: >-
            The preview job an earlier request with the same Idempotency-Key started, as it was then; nothing new
            was started. The Freshdesk key is not part of what makes two requests the same one. Read its state
            now with `GET /api/v1/imports/{id}`.
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/imports/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getImport
      x-permission: workspace:import
      description: State, progress and preview of one import or undo; the report is at `/report`.
      responses:
        '200':
          description: Import job
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/imports/{id}/start:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: startImport
      x-permission: workspace:import
      description: >
        Imports a previewed account: first the tickets updated in the last `recent_days` (newest first,
        so the team can work on them), then the whole account with its reconcile report. 409
        `import_running` when the workspace already has an import or undo queued, running or waiting;
        409 `import_state` when the job is not previewed, or was previewed more than an hour ago.
      responses:
        '200':
          description: The queued import
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: cancelImport
      x-permission: workspace:import
      description: >
        Stops a job. A preview is discarded; a running import stops within a minute (`cancel_requested`
        until then). What was imported stays: `POST /api/v1/imports/{id}/undo` removes it. The key is
        erased.
      responses:
        '200':
          description: The job
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/key:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: setImportKey
      x-permission: workspace:import
      description: >
        Gives a job in `waiting_key` (the server restarted without a key ring, or its keys changed) the
        Freshdesk API key again; it goes on where it stopped. Refused to agent tokens below the admin
        tier like `POST /api/v1/imports`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api_key]
              properties:
                api_key: {type: string, minLength: 1, maxLength: 200, writeOnly: true}
      responses:
        '200':
          description: The queued job
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/report:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: format
        in: query
        schema: {type: string, enum: [json, markdown], default: json}
    get:
      operationId: getImportReport
      x-permission: workspace:import
      description: >
        The reconcile report of the import (`status` OK, FAILED or UNVERIFIED), or while only the
        recent tickets are in, the interim report (`status` INTERIM, never OK; no Markdown yet). For an
        undo, what it removed. `format=markdown` answers the report as a Markdown file to download.
        404 `report_not_ready` before there is one.
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
            text/markdown:
              schema: {type: string}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/imports/{id}/undo:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: undoImport
      x-permission: workspace:import
      description: >
        Queues an undo of an import that ended (finished, failed or cancelled): it removes what that
        Freshdesk account brought into the workspace, as `collie import undo` does, and keeps what the
        team changed since. Every agent token's call waits for a person's approval.
      responses:
        '202':
          description: The undo job, queued
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ImportJob'}
                  - {$ref: '#/components/schemas/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/people:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listImportPeople
      x-permission: workspace:import
      description: >
        The agents of the import's Freshdesk account and the Colliedesk agent each is linked to. A link
        makes that agent the author of their imported replies and the assignee of the imported tickets
        they held; the preview links the agents whose email matches, and accepting an invite links the
        ones with the invited email. 409 `import_state` before the preview read the account.
      responses:
        '200':
          description: Freshdesk agents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ImportPerson'}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/people/{externalId}/link:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: externalId
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9]{1,20}$'}
        description: The Freshdesk agent id
    put:
      operationId: linkImportPerson
      x-permission: workspace:import
      description: >
        Links a Freshdesk agent to an active agent of this workspace, replacing an earlier link. Their
        imported replies get that author and the imported tickets assigned to them, unless someone
        reassigned them since, that assignee, within seconds (`pending` until then). Timestamps do not
        change. `DELETE` takes the link back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent_id]
              properties:
                agent_id: {type: string, format: uuid}
      responses:
        '200':
          description: The Freshdesk agent
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportPerson'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: unlinkImportPerson
      x-permission: workspace:import
      description: >
        Takes a link back: the imported replies show the Freshdesk name again and the imported tickets the
        link assigned lose that assignee, unless someone reassigned them since.
      responses:
        '200':
          description: The Freshdesk agent
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportPerson'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/ai:
    get:
      operationId: getAISettings
      x-permission: access:read
      description: >
        The workspace's AI settings: the server's provider (set by the operator; null when the server has
        none), the providers the workspace added (never a key, only its last four characters), each
        feature ("slot": `triage`, `draft`, `intake`) with its provider, model, whether it is on and can
        run and what it does by itself by default (`default_level`), the levels channels set apart from it
        (`channels`), the kinds of extra context intake may send (`source_consents`), and the newest 50
        changes. Every feature starts off; turning one on is an admin's consent to send that feature's
        ticket data to its provider. Agents can read this; only admins change it.
      responses:
        '200':
          description: AI settings
          content: {application/json: {schema: {$ref: '#/components/schemas/AISettings'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/ai/providers:
    post:
      operationId: addAIProvider
      x-permission: access:write
      description: >
        Adds a provider with the workspace's own key. The server sends one small request to the first
        model and saves the provider only when it answers (`422 ai_check_failed` with `check_error_code`
        otherwise: auth, permission, model_not_found, blocked_address, quota_exhausted…; nothing is saved).
        An Idempotency-Key used before with other input is also refused with 422, code `idempotency_key_reused`.
        The key is sealed and never returned. At most 5 providers (409 `ai_provider_limit`); a name is
        unique in the workspace (409 `ai_provider_name_taken`). Without `MAILBOX_TOKEN_KEYS` the server
        cannot store a key (409 `secret_keys_missing`). An OpenAI-compatible base URL must be public https
        unless the operator set `AI_ALLOW_PRIVATE_BASE_URLS=1`. At most 10 checks a minute per workspace
        (429 `ai_checks_rate_limited`). An agent token below the admin tier is refused with 403
        `credentials_need_admin_token`: an agent request would keep the key.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AIProviderInput'}}}
      responses:
        '201':
          description: The provider, checked
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '200':
          description: The provider an earlier request with the same Idempotency-Key added; nothing new was stored or checked
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AICheckFailed'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/ai/models:
    post:
      operationId: listAIModels
      x-permission: access:write
      description: >
        Lists the models a provider's key may use, before the provider is added, so a person picks them
        instead of typing ids. Anthropic lists the Claude models (newest first); an OpenAI-compatible
        server lists `GET {base_url}/models` (sorted, at most 1000). Nothing is saved or metered. A provider
        that cannot list answers `422 ai_check_failed` with `check_error_code` (auth, permission,
        model_not_found when the server keeps no list, blocked_address…); type the model names then. Same
        input rules as adding a provider, and it counts against the 10 checks a minute per workspace (429
        `ai_checks_rate_limited`). An agent token below the admin tier is refused with 403
        `credentials_need_admin_token`: an agent request would keep the key.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AIModelsInput'}}}
      responses:
        '200':
          description: The models the key may use
          content: {application/json: {schema: {$ref: '#/components/schemas/AIModelList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/AICheckFailed'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/ai/providers/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateAIProvider
      x-permission: access:write
      description: >
        Renames a provider, changes its models, or (OpenRouter only) its routing by data policy. A new
        first model is checked before it is saved (422 `ai_check_failed`, nothing changes). A model a
        feature uses, or intake's fallback model, cannot be removed (409 `ai_model_in_use`). A change of
        routing that lets requests reach providers it kept them off (data_collection deny to allow, zdr
        true to false) is a person's: an agent token's is filed for approval (202). The base URL never changes: the stored key and the features' data would go to
        a new address without anyone entering the key or turning the features on again. Add the new
        address as another provider instead.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AIProviderChange'}}}
      responses:
        '200':
          description: The provider
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AICheckFailed'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
    delete:
      operationId: removeAIProvider
      x-permission: access:write
      description: >
        Deletes a provider and erases its key now. The features that used it turn off and stay off
        (`turned_off`): switching them to another provider would change who receives the data. To undo,
        add the provider again. Its usage history stays.
      responses:
        '200':
          description: The features that turned off
          content:
            application/json:
              schema:
                type: object
                required: [turned_off]
                properties:
                  turned_off: {type: array, items: {$ref: '#/components/schemas/AISlotName'}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/providers/{id}/key:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: setAIProviderKey
      x-permission: access:write
      description: >
        Replaces a provider's key. The new key is checked first; when the check fails nothing changes and
        the old key keeps working (422 `ai_check_failed`). An agent token below the admin tier is refused
        with 403 `credentials_need_admin_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api_key]
              properties:
                api_key: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: The provider with its new key's last four characters
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AICheckFailed'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/ai/providers/{id}/check:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: checkAIProvider
      x-permission: access:write
      description: >
        Sends one small request to the provider's first model and records the result on the provider
        (`check_status` ok or failing with `check_error_code`). The call is billed by the provider and
        counted in usage as a check. At most 10 checks a minute per workspace.
      responses:
        '200':
          description: The provider with the check's result
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/ai/slots/{slot}:
    parameters:
      - {name: slot, in: path, required: true, schema: {$ref: '#/components/schemas/AISlotName'}}
    put:
      operationId: setAISlot
      x-permission: access:write
      description: >
        Sets one feature: where it runs (`server`, `provider` with `provider_id`, or `none`), the model
        (the provider's first when left out), effort, on or off, and what it does by itself where no
        channel sets a level (`default_level`). Turning a feature on, or moving it to another provider
        while it is on, records the person's consent: that feature's ticket data goes to that provider
        from now on, and what channels let it do by itself goes down a level (auto to suggest; a draft
        written by itself to one asked for). Every agent token's call becomes an agent request a person
        approves.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AISlotInput'}}}
      responses:
        '200':
          description: The feature
          content: {application/json: {schema: {$ref: '#/components/schemas/AISlot'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AILevelNotAllowed'}
  /api/v1/ai/source-consents/{class}:
    parameters:
      - {name: class, in: path, required: true, schema: {$ref: '#/components/schemas/AISourceClass'}}
    put:
      operationId: setAISourceConsent
      x-permission: access:write
      description: >
        Records an admin's consent that AI intake may send this kind of context to its provider besides
        the conversation's text (which the feature's own consent covers): `images` customers sent, the
        `contact_profile`, or an integration's data (`external:<name>`). Giving it again changes nothing.
        Every agent token's call becomes an agent request a person approves.
      responses:
        '200':
          description: The consent
          content: {application/json: {schema: {$ref: '#/components/schemas/AISourceConsent'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: removeAISourceConsent
      x-permission: access:write
      description: >
        Takes the consent back: intake leaves that kind of context out from its next decision. `removed`
        is false when there was none.
      responses:
        '200':
          description: Whether there was a consent
          content: {application/json: {schema: {type: object, required: [removed], properties: {removed: {type: boolean}}}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/results:
    get:
      operationId: getResults
      x-permission: conversations:read
      description: >-
        The results page (docs/user/results.md): the team's numbers in Colliedesk next to the baseline of the
        history it imported, for the last 30 and 7 days. Nothing is computed on the request: the numbers are
        the newest a background worker stored (`computed_at`). Every count names, through its snapshot id,
        the conversations behind it (the `result` filter of `GET /conversations`). Every role reads it; the
        compute error is shown to admins only.
      responses:
        '200':
          description: The newest numbers
          content: {application/json: {schema: {$ref: '#/components/schemas/Results'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/results/share-link:
    get:
      operationId: getResultsShareLink
      x-permission: access:write
      description: >-
        The workspace's active share link of the results page: who made it, when, and when it was last
        opened. Never the link itself: only its hash is stored, so it is shown once, when it is created.
        Admins only.
      responses:
        '200':
          description: The active link, or null
          content: {application/json: {schema: {$ref: '#/components/schemas/ResultsShareLinkState'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createResultsShareLink
      x-permission: access:write
      description: >-
        Creates a link that shows the results page's totals to anyone who has it, without signing in: no
        conversation ids, customer or team names, subjects or message text. The old link, if any, stops
        working. The address is returned once (`/r#<token>`; the token is in the fragment, so it never
        reaches a server log). An agent token's call becomes a request a person approves: the numbers leave
        sign-in. Admins only.
      responses:
        '201':
          description: The new link, shown once
          content: {application/json: {schema: {$ref: '#/components/schemas/ResultsShareLinkCreated'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: revokeResultsShareLink
      x-permission: access:write
      description: Turns the share link off; anyone who opens it then reads "This link was turned off". Repeating it changes nothing. Admins only.
      responses:
        '200':
          description: No active link
          content: {application/json: {schema: {$ref: '#/components/schemas/ResultsShareLinkState'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/results/shared:
    post:
      operationId: getSharedResults
      x-permission: public
      description: >-
        The totals a share link shows, for the public page `/r#<token>`. The token is sent in the body, never
        in the address. Only totals, medians and sample sizes: no ids, names, subjects or text. A link that
        was turned off or replaced, an unknown one, and a locked workspace's all answer the same 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: The shared totals
          content: {application/json: {schema: {$ref: '#/components/schemas/SharedResults'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404':
          description: The link was turned off, replaced or never existed
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/agents/me/results-email:
    patch:
      operationId: setResultsEmail
      x-permission: authenticated
      description: >-
        Turns the weekly results email on or off for the caller. It goes to admins only, every Monday at
        8:00 in the workspace's timezone, when the server can send email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [weekly]
              properties:
                weekly: {type: boolean}
      responses:
        '200':
          description: The caller's choice
          content:
            application/json:
              schema:
                type: object
                required: [weekly]
                properties:
                  weekly: {type: boolean}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/workspace/setup:
    get:
      operationId: getSetupProgress
      x-permission: authenticated
      description: >-
        Where the workspace stands on getting started: receive customer email, import from Freshdesk,
        invite the team, answer the first email. The steps come in the order the sign-up goal suggests;
        first_reply is always last. States only, computed on every call.
      responses:
        '200':
          description: The setup steps and whether all are done
          content: {application/json: {schema: {$ref: '#/components/schemas/SetupProgress'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/agents/me/setup-guide:
    put:
      operationId: setSetupGuideHidden
      x-permission: authenticated
      description: >-
        Hides the setup guide from the inbox of the caller, or shows it again. It is a choice of the
        person; other agents keep their own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hidden]
              properties:
                hidden: {type: boolean}
      responses:
        '200':
          description: The caller's choice
          content:
            application/json:
              schema:
                type: object
                required: [hidden]
                properties:
                  hidden: {type: boolean}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/ai/usage:
    get:
      operationId: getAIUsage
      x-permission: billing:manage
      description: >
        One UTC calendar month of the workspace's AI calls, summed per feature and provider: calls,
        failed calls, automatic calls, tokens in and out, and for the server's provider its cost in
        micro-dollars (a workspace key's calls are billed by that provider). The current month also
        carries the allowance of the server's provider when the server sets one. Admins only.
      parameters:
        - {name: month, in: query, required: false, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}, description: 'YYYY-MM; the current UTC month when left out.'}
      responses:
        '200':
          description: The month's usage
          content: {application/json: {schema: {$ref: '#/components/schemas/AIUsage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/ai/chat/usage:
    get:
      operationId: getAIChatUsage
      x-permission: billing:manage
      description: >
        One UTC calendar month of the help center's AI chat (docs/user/ai-chat.md): answers given (today and this month)
        against the limits, what it spent, chats, hand-offs to the team and feedback. On the cloud's own provider the
        limits are the plan's and spend shows only as a share (`spent_percent`); on the workspace's own provider, or a
        server without plan limits, spend is in micro-dollars against the AI chat feature's own monthly limit, if any.
        Admins only.
      parameters:
        - {name: month, in: query, required: false, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}, description: 'YYYY-MM; the current UTC month when left out.'}
      responses:
        '200':
          description: The month's use
          content: {application/json: {schema: {$ref: '#/components/schemas/AIChatUsage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/ai/chat/sessions:
    get:
      operationId: listAIChatSessions
      x-permission: conversations:read
      description: >
        The workspace's chats with the help center's AI, newest activity first, 50 a page. Texts are kept 90 days after a
        chat's last turn (`kept_until`); after that `first_question` is null. Every member of the team reads them.
      parameters:
        - {name: channel_id, in: query, required: false, schema: {type: string, format: uuid}, description: Only chats of this help chat channel.}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/AIChatStatus'}}
        - {name: feedback, in: query, required: false, schema: {type: string, enum: [not_helpful]}, description: Only chats with an answer rated not helpful.}
        - {name: conversation_id, in: query, required: false, schema: {type: string, format: uuid}, description: 'Only the chat that handed off to this conversation (the inbox''s Open chat transcript).'}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: A page of chats
          content: {application/json: {schema: {$ref: '#/components/schemas/AIChatSessionPage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/ai/chat/sessions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAIChatSession
      x-permission: conversations:read
      description: One chat with its transcript, each answer with the articles it cited (as they were) and its feedback.
      responses:
        '200':
          description: The chat
          content: {application/json: {schema: {$ref: '#/components/schemas/AIChatSession'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteAIChatSession
      x-permission: access:write
      description: >
        Deletes a chat and its transcript for good; a conversation it handed off keeps its own copy. The history of the AI
        settings records it, without its texts. Every agent token's call becomes an agent request a person approves.
      responses:
        '204': {description: Deleted}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/chat/preview:
    post:
      operationId: previewAIChat
      x-permission: conversations:write
      description: >
        Answers a question as the help center's AI chat would, with the default help chat channel's instructions (or
        `channel_id`'s), for an admin trying it. Nothing reaches a customer and nothing is stored but the call's usage,
        which counts toward the chat's limits. Not streamed: the whole answer comes back. A repeat with the same
        Idempotency-Key answers the first answer again and asks the AI nothing; the key with another question is
        refused with 422, code `idempotency_key_reused`.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question: {type: string, maxLength: 1000}
                channel_id: {type: string, format: uuid}
      responses:
        '200':
          description: The answer as an end user would see it (or, for a repeated Idempotency-Key, the first one's)
          content: {application/json: {schema: {$ref: '#/components/schemas/AIChatPreview'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {description: Too many chat answers at once., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: '`ai_failed`: the AI did not answer.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/ai/automatic-limits:
    put:
      operationId: setAIAutomaticLimits
      x-permission: access:write
      description: >
        Sets how many automatic AI tasks (started by the server, such as a triage suggestion for a new
        ticket) the workspace runs a UTC day and a minute; the defaults are 300 and 30. Past the daily
        limit automatic tasks wait for the next day; tasks a person asks for are never limited this way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [per_day, per_minute]
              properties:
                per_day: {type: integer, minimum: 0, maximum: 10000}
                per_minute: {type: integer, minimum: 0, maximum: 1000}
                draft_per_day: {type: integer, minimum: 0, maximum: 10000, description: Kept when left out.}
                intake_per_day: {type: integer, minimum: 0, maximum: 10000, description: 'Intake decisions a UTC day, inside per_day; 300 by default. Kept when left out.'}
      responses:
        '200':
          description: The limits and today's use
          content: {application/json: {schema: {$ref: '#/components/schemas/AIAutomaticLimits'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/conversations/{id}/ai-drafts:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: createAIDraft
      x-permission: conversations:write
      description: >
        Asks for an AI draft of a reply, with an optional prompt (what the reply should say). The draft is
        written in the background (202, `status` queued); read it with `GET …/ai-drafts/{draftId}?wait=`.
        It uses the conversation (never its private notes), matching knowledge base articles and similar
        solved tickets, and is plain text a person edits and sends: the AI never sends. The person's
        earlier draft on the conversation is replaced. 409 `ai_feature_off` when reply drafts are off, 402
        `ai_allowance_reached` when the server's provider spent this month's allowance, 429
        `ai_drafts_rate_limited` past 30 drafts a minute in the workspace.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prompt: {type: string, maxLength: 2000}
      responses:
        '202':
          description: The draft, queued; or an agent request when the token is below the draft tier
          content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AIDraft'}, {$ref: '#/components/schemas/AgentRequestAccepted'}]}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
    get:
      operationId: listAIDrafts
      x-permission: conversations:read
      description: The conversation's newest AI drafts (at most 20), newest first, with how each ended.
      responses:
        '200':
          description: AI drafts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AIDraft'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/ai-drafts/{draftId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAIDraft
      x-permission: conversations:read
      description: >
        One AI draft. With `wait` (1 to 20 seconds) the answer waits while the draft is queued or running,
        and comes back as soon as it is ready, failed or cancelled.
      parameters:
        - {name: wait, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 20}}
      responses:
        '200':
          description: The draft
          content: {application/json: {schema: {$ref: '#/components/schemas/AIDraft'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/ai-drafts/{draftId}/discard:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: discardAIDraft
      x-permission: conversations:write
      description: >
        Stops a draft still being written (`status` cancelled, which does not count as discarded: nobody
        saw it) or discards a ready one (`outcome` discarded); again on a draft already stopped or discarded
        it changes nothing. 409 `ai_draft_decided` once it was sent or replaced.
      responses:
        '200':
          description: The draft
          content: {application/json: {schema: {$ref: '#/components/schemas/AIDraft'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/conversations/{id}/ai-triage:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getAITriage
      x-permission: conversations:read
      description: >
        The conversation's newest AI triage suggestion (tags, priority, assignee), or null. A new ticket's
        first customer message queues one by itself when triage is on (never an imported message).
      responses:
        '200':
          description: The newest suggestion
          content:
            application/json:
              schema:
                type: object
                required: [suggestion, auto_applied]
                properties:
                  suggestion:
                    oneOf:
                      - {type: 'null'}
                      - {$ref: '#/components/schemas/AITriage'}
                  auto_applied:
                    description: The newest suggestion AI applied by itself; a later one asked for by hand does not hide it.
                    oneOf:
                      - {type: 'null'}
                      - {$ref: '#/components/schemas/AITriage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createAITriage
      x-permission: conversations:write
      description: >
        Asks for a triage suggestion by hand (202, `status` queued), replacing the open one. Refused at
        once like an AI draft: 409 `ai_feature_off`, 402 `ai_allowance_reached`, 429
        `ai_drafts_rate_limited` (30 drafts and suggestions a minute in the workspace).
      responses:
        '202':
          description: The suggestion, queued; or an agent request when the token is below the draft tier
          content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AITriage'}, {$ref: '#/components/schemas/AgentRequestAccepted'}]}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/conversations/{id}/ai-triage/{suggestionId}/accept:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: suggestionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: acceptAITriage
      x-permission: conversations:write
      description: >
        Applies an open suggestion to the conversation, as a person's change would: without a body (or
        one naming nothing) the rest of it; with one, only what it names (each from the suggestion; 400
        otherwise). After AI applied part of it, or after an undo ("Apply again", which fills only what
        is still empty), the rest can be accepted too. A part applied
        leaves the rest open; when all of it is applied the outcome is accepted. Tags are added, never
        removed; a part already applied is not applied again. Undo is an ordinary conversation change.
        Accepting an accepted one again changes nothing; 409 `ai_triage_decided` when it is not ready or
        was dismissed, replaced or expired, `ai_triage_nothing` when it names nothing to apply (a tag
        deleted or a teammate deactivated since is not named).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tag_ids: {type: array, items: {type: string, format: uuid}}
                priority: {type: [string, 'null'], enum: [low, normal, high, urgent, null]}
                assignee_agent_id: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: The suggestion, with what was applied
          content: {application/json: {schema: {$ref: '#/components/schemas/AITriage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/conversations/{id}/ai-triage/{suggestionId}/dismiss:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: suggestionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: dismissAITriage
      x-permission: conversations:write
      description: Stops a suggestion still being written, or dismisses the rest of an open one (outcome dismissed, or partly_accepted when a part was applied); nothing changes on the conversation. Again on one already stopped or dismissed it changes nothing.
      responses:
        '200':
          description: The suggestion
          content: {application/json: {schema: {$ref: '#/components/schemas/AITriage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/conversations/{id}/ai-triage/{suggestionId}/undo:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: suggestionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: undoAITriage
      x-permission: conversations:write
      description: >
        Takes back what AI applied of a suggestion by itself: the parts named, or all of it without a
        body. A part goes back only while it is still what AI set (a tag AI added is removed if it is
        still there, the priority returns to what it was before AI, the assignee is unassigned); a part
        a person changed since is kept and listed under kept. Undoing again changes nothing; accept
        applies it again, filling only what is still empty. 409 `ai_triage_not_auto_applied` when AI
        applied none of it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parts: {type: array, items: {type: string, enum: [tags, priority, assignee]}}
      responses:
        '200':
          description: The suggestion, with what was undone and kept
          content: {application/json: {schema: {$ref: '#/components/schemas/AITriage'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/export:
    get:
      operationId: exportWorkspace
      x-permission: workspace:export
      description: >-
        Streams every record of the caller's workspace as one ZIP archive (format `colliedesk-export`
        version 1, documented in `docs/user/export.md`): `manifest.json`, one NDJSON file each for
        agents, contacts, tags and conversations (with their messages, notes, tag ids, time
        entries and status changes), and the attachment files. Admins only. Works on self-hosted installs and in every
        plan state, including a read-only workspace. Sessions, pairing links, channel secrets and
        billing data are never exported. The archive is built while it is sent; if the server
        cannot finish it (for example a stored file is lost) the connection is aborted, so a
        truncated ZIP without `manifest.json` means the export failed. A client that stops reading
        is cut off after a write timeout (60 s by default), and no export runs longer than 2 hours. Only one export of a workspace runs at
        a time (409 until it has sent its last byte), and a server runs at most two exports at once
        (429 with `Retry-After`).
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The workspace archive
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="colliedesk-<slug>-<UTC yyyymmddThhmmssZ>.zip"'}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: The server is already running as many exports as it allows; retry later
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/web-form:
    get:
      operationId: getWebForm
      x-permission: access:read
      description: >-
        State of the workspace's default web form (`is_default`). A workspace that never set one up has it
        off. Other forms are read with `GET /api/v1/channels/{id}`.
      responses:
        '200': {$ref: '#/components/responses/WebFormSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putWebForm
      x-permission: access:write
      description: >-
        Turn the default web form on or off and replace its allowed origins; the first save adds a form.
        Other forms are changed with `PATCH /api/v1/channels/{id}`. Turning it off keeps the
        origins, so turning it on again needs nothing else. Origins are exact (`scheme://host[:port]`,
        http or https), at most 20, with no path, wildcard or credentials; they are lowercased and
        de-duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, allowed_origins]
              properties:
                enabled: {type: boolean}
                allowed_origins:
                  type: array
                  maxItems: 20
                  items: {type: string}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/WebFormSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/public/forms/{workspace_slug}:
    parameters:
      - name: workspace_slug
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: submitWebForm
      security: []
      x-permission: public
      description: >-
        Public, unauthenticated. The workspace's older form address: it posts to the form that has it
        (`legacy_slug`, the form the workspace had first; making another form the default does not move it);
        every form also has its own, `POST /api/v1/public/web-forms/{channel_id}`. A website posts a visitor's
        email (and optionally a message) and the workspace gets a conversation: the visitor becomes a contact (found by email), the text is an
        incoming message, the subject is `Web form: <source>` (or `Web form`) and the tag is
        `web-form`. Nothing is sent to the visitor. The body must be `application/json`. A filled
        `website` field is a bot trap: the answer is the same 202 and nothing is stored. An unknown
        workspace, a form that is off and a locked workspace all answer the same 404. Browsers may
        read the answer only from an origin on the form's allowed list (CORS). At most 5
        submissions per client address and form per minute, and 30 requests per client address
        per minute across all forms; a workspace also accepts at most 50 form conversations per 10
        minutes, counted apart from email. Fields the form does not know are ignored. The message
        is marked `email.via = web_form` with authentication `none` (unverified address).
      parameters:
        - {$ref: '#/components/parameters/WebFormPressKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
                message: {type: string, maxLength: 5000}
                source: {type: string, maxLength: 100, description: 'Where the form sits, for example site:updates'}
                website: {type: string, description: Honeypot; leave empty}
      responses:
        '202':
          description: Accepted (also for a honeypot hit)
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}, description: Set only for an allowed origin}
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415':
          description: The body is not application/json
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Invalid input; `error.fields` names each bad field and `error.message` joins their sentences, for example "Message is too long: at most 5,000 characters."'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: Too many submissions; retry after the `Retry-After` seconds
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
    options:
      operationId: preflightWebForm
      security: []
      x-permission: public
      description: CORS preflight. 204 with the allow headers for an allowed origin; every other case is the same 404 as a missing form.
      responses:
        '204':
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Access-Control-Max-Age: {schema: {type: integer}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/public/web-forms/{channel_id}:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: submitWebFormByChannel
      security: []
      x-permission: public
      description: >-
        One form's own address (its `submit_path`), with every rule of `POST /api/v1/public/forms/{workspace_slug}`:
        the conversation opens on this form, which checks its own allowed origins and counts its own
        submissions. The address names the form by its random channel id, so it tells nothing of the
        workspace's other forms. An unknown, removed or off form answers the same 404.
      parameters:
        - {$ref: '#/components/parameters/WebFormPressKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
                message: {type: string, maxLength: 5000}
                source: {type: string, maxLength: 100, description: 'Where the form sits, for example site:updates'}
                website: {type: string, description: Honeypot; leave empty}
      responses:
        '202':
          description: Accepted (also for a honeypot hit)
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}, description: Set only for an allowed origin}
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415':
          description: The body is not application/json
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Invalid input; `error.fields` names each bad field and `error.message` joins their sentences, for example "Message is too long: at most 5,000 characters."'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: Too many submissions; retry after the `Retry-After` seconds
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
    options:
      operationId: preflightWebFormByChannel
      security: []
      x-permission: public
      description: CORS preflight of one form's own address. 204 with the allow headers for an origin on that form's list; every other case is the same 404 as a missing form.
      responses:
        '204':
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Access-Control-Max-Age: {schema: {type: integer}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/export/link:
    post:
      operationId: createExportLink
      x-permission: workspace:export
      summary: Get a one-time download URL for the workspace export
      description: >-
        Admins only; works in every plan state, including a locked workspace. Runs the checks of
        `GET /api/v1/export` that can be answered before streaming (another export of this workspace is
        running: 409; the server is at its export limit: 429 with `Retry-After`) and returns a URL that
        starts the same ZIP download without a session or token. The URL works once, for the workspace
        that asked, and expires after `expires_in_seconds`; a new link replaces the previous one. A browser
        that navigates to it streams the file to disk, so a large archive is never held in memory. Links
        live in the memory of one server process: a restart invalidates them.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The one-time link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: The server is already running as many exports as it allows; retry later
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/export/download/{token}:
    get:
      operationId: downloadExport
      security: []
      x-permission: public
      summary: Download the export a one-time link was made for
      description: >-
        The token is the credential: it was made by `POST /api/v1/export/link`, works once and expires
        quickly. Streams the same archive as `GET /api/v1/export`. This route is meant to be opened by a
        browser navigation, so a refusal is never a JSON error page: it is a 303 to
        `/settings?export_error=<reason>` where the app explains it. Reasons: `link_invalid` (unknown, used,
        expired or lost in a restart), `busy` (another export of this workspace is running), `server_busy`
        (the server is at its export limit) and `failed` (the export could not start). The export slot is taken
        before the token is spent, so `busy` and `server_busy` leave the link usable until it expires.
        HEAD and other methods answer 405 without spending the token.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: The workspace archive
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="colliedesk-<slug>-<UTC yyyymmddThhmmssZ>.zip"'}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '303':
          description: The download was refused; the app explains why.
          headers:
            Location: {schema: {type: string}, description: 'The path /settings?export_error=link_invalid|busy|server_busy|failed.'}
        '405':
          description: Not GET. The token is not spent.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/agent-requests:
    get:
      operationId: listAgentRequests
      x-permission: authenticated
      description: >-
        Calls of agent tokens that wait for a person, and what became of them: pending first, then newest
        first, at most 200. An agent token sees only the requests it made; a person sees the whole
        workspace's. A pending request past its `expires_at` (seven days) is answered as `expired`.
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/AgentRequestStatus'}}
        - {name: detail, in: query, required: false, description: 'full adds each request''s body, edited_body and result; without it they are null so a poll stays small.', schema: {type: string, enum: [full]}}
      responses:
        '200':
          description: Agent requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AgentRequest'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
  /api/v1/agent-requests/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getAgentRequest
      x-permission: authenticated
      description: One agent request. An agent token finds only the requests it made (404 otherwise).
      responses:
        '200':
          description: The agent request
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agent-requests/{id}/approve:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: approveAgentRequest
      x-permission: authenticated
      parameters:
        - {$ref: '#/components/parameters/OperatorRealm'}
      description: >-
        People only (an agent token gets 403 `person_only`). Runs the stored call once, as the approving
        person: their role, the workspace lock and every check of the route apply. The answer is 200 with
        the request (`approved` when the call succeeded, `failed` with `result_status` otherwise, for
        example 403 when the approver may not do it) and `result`, the call's own answer. When the answer
        holds a credential, a link or a payment page (new token, inbound secret, export, billing), `result`
        is shown here once and the request keeps only `result_status` and `result_note`. Approving an
        export (`GET /api/v1/export` or `POST /api/v1/export/link`) answers the export's one-time download
        link. `body` replaces the text of a reply draft; it is refused for any other request. A request
        that is decided or expired, or whose token was revoked, answers 409 and runs nothing; two
        approvals at once run the call once. A person whose role may not run the call gets 403 and the
        request keeps waiting (`approvable_by`). `cc` keeps only some of a reply draft's copies; it
        cannot add one. The approval finishes even if the approver's connection closes.
        `seen_reply_number` is the newest reply the approving person had on screen: when someone replied
        since, a reply draft answers 409 `reply_conflict` like `POST .../messages` and keeps waiting, so
        it can be read again and approved with the new number.

        With `X-Colliedesk-Realm: operator` the route decides an operator request instead, for an operator's
        browser session only (no workspace credential, no operator token: 401 / 403 `person_only`): it needs
        `reauth_code`, and `secrets` carries the secrets the request names; they are used for this one call
        and never stored, and `confirm` carries the phrases a configuration change asks to type (400
        `confirm_mismatch` names them in `error.guards`, and the request keeps waiting). An agent request's id
        answers 404 there, and an operator request's id answers 404 without the header.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                body: {type: string, minLength: 1, description: 'The edited text of a reply draft (Markdown)'}
                cc:
                  type: array
                  maxItems: 10
                  items: {type: string}
                  description: The copies to keep on a reply draft; only addresses the draft already copied (400 otherwise).
                seen_reply_number: {type: integer, minimum: 0, description: 'Reply drafts only: the newest reply number on the approver''s screen.'}
                reauth_code: {type: string, maxLength: 12, description: 'Operator realm: the approver''s authenticator code'}
                secrets: {type: object, additionalProperties: {type: string}, description: 'Operator realm: the secrets the request names, used once'}
                confirm: {type: object, additionalProperties: {type: string}, description: 'Operator realm: the phrases a configuration change asks the approver to type; a token never fills them'}
      responses:
        '200':
          description: The decided request and the answer of its call
          content:
            application/json:
              schema:
                type: object
                required: [request, result]
                properties:
                  request: {oneOf: [{$ref: '#/components/schemas/AgentRequest'}, {$ref: '#/components/schemas/OperatorRequest'}]}
                  result: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: The JSON answer of the approved call; null when it had none or was too large.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/agent-requests/{id}/reject:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: rejectAgentRequest
      x-permission: authenticated
      description: >-
        People only. Refuses the request (a discarded reply draft); nothing runs, and it can never run later.
        With `X-Colliedesk-Realm: operator` it refuses an operator request (an operator's session, with `reauth_code`).
      parameters:
        - {$ref: '#/components/parameters/OperatorRealm'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 1000, description: Shown to the agent that asked}
                reauth_code: {type: string, maxLength: 12, description: 'Operator realm: the approver''s authenticator code'}
      responses:
        '200':
          description: The rejected request
          content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AgentRequest'}, {$ref: '#/components/schemas/OperatorRequest'}]}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/agent-requests/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: cancelAgentRequest
      x-permission: authenticated
      description: >-
        Withdraws a pending request. The token that made it, or the person who owns that token, may
        cancel it (another token gets 404, another person 403: they reject instead).
      responses:
        '200':
          description: The cancelled request
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/problem-reports:
    post:
      operationId: createProblemReport
      x-permission: authenticated
      description: >
        Send a problem report ("Report a problem" in the web app) to the support desk of this server.
        Where the server sets `PROBLEM_REPORT_WORKSPACE` (Colliedesk Cloud) the report becomes a
        conversation in that workspace, tagged `problem-report`, from the reporter's verified email,
        with the description, the diagnostics, facts the server knows (agent, role, workspace, plan,
        version, realm, the request id of this call) and the screenshots as attachments. No text from the
        reporter's workspace is read or sent. Every other server answers 404 `not_configured`, so the
        web app offers a GitHub issue instead. Any agent token tier may report. One agent may send 5
        reports an hour. Send JSON, or `multipart/form-data` with `description`, `diagnostics` (a JSON
        string) and up to 3 `screenshots` files (PNG, JPEG or WebP, 5 MiB in total).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProblemReportInput'}
          multipart/form-data:
            schema:
              type: object
              required: [description]
              properties:
                description: {type: string, minLength: 1, maxLength: 5000}
                diagnostics: {type: string, description: 'JSON text of a ProblemReportDiagnostics object'}
                screenshots:
                  type: array
                  maxItems: 3
                  items: {type: string, format: binary}
            encoding:
              screenshots: {contentType: 'image/png, image/jpeg, image/webp'}
      responses:
        '201':
          description: The report reached the support desk
          content:
            application/json:
              schema:
                type: object
                required: [reference]
                properties:
                  reference: {type: string, description: 'The request id of this call; quote it when you write to support'}
        '200':
          description: The report an earlier request with the same Idempotency-Key sent; nothing new was sent and the hourly allowance is not used
          content: {application/json: {schema: {type: object, required: [reference], properties: {reference: {type: string}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: This server has no support desk for problem reports (error code `not_configured`)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Invalid input; `error.fields` names each bad field (`description`, `diagnostics`, `screenshots`). Also `idempotency_key_reused` when the Idempotency-Key was used before with other input.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: This agent sent 5 reports in the last hour; retry after the `Retry-After` seconds
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/collections:
    get:
      operationId: listKBCollections
      x-permission: conversations:read
      description: >
        The knowledge base collections of the workspace that are not in the trash, as a flat list
        ordered by parent, position and name. A collection sits at most three levels deep (category,
        folder, subfolder). `article_count` counts its articles outside the trash, drafts included.
      responses:
        '200':
          description: Knowledge base collections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBCollection'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createKBCollection
      x-permission: conversations:write
      description: >
        Any agent may create one, and a `send` agent token; a lower tier files an agent request a
        person approves. Without `slug` one is made from the name. The slug is unique among the
        collections of the same parent outside the trash (409 `duplicate_slug`). A parent in the trash,
        or one already three levels deep, is 400. A workspace holds at most 1,000 collections,
        counting the ones in the trash (409 `kb_limit`). Without `position`, or with 0, it goes after
        its siblings once they were ordered by hand (`PUT /api/v1/kb/order`); until then it stays 0 and
        falls in by name.
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KBCollectionInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created collection
          content: {application/json: {schema: {$ref: '#/components/schemas/KBCollection'}}}
        '200':
          description: The collection an earlier request with the same Idempotency-Key created; nothing new was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/KBCollection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/kb/collections/trash:
    get:
      operationId: listTrashedKBCollections
      x-permission: conversations:read
      description: >
        Collections deleted in the last 30 days, most recently deleted first. Each can be restored
        with `POST /api/v1/kb/collections/{id}/restore` until `purges_at`; after that it is deleted
        for good.
      responses:
        '200':
          description: Collections in the trash
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TrashedKBCollection'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/kb/collections/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateKBCollection
      x-permission: conversations:write
      description: >
        Rename a collection, change its slug, description or position, or move it under another
        parent (`parent_id`; null moves it to the top). Send back the `updated_at` you read (409
        `changed_elsewhere` when it was saved since). A move that would put a collection under itself
        or more than three levels deep is 400. Changing the slug changes the addresses of the help
        center pages under it; old addresses are not redirected. A collection in the trash is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                name: {type: string, minLength: 1, maxLength: 200}
                slug: {type: string, minLength: 1, maxLength: 120}
                description: {type: string, maxLength: 2000}
                parent_id: {type: [string, 'null'], format: uuid}
                position: {type: integer, minimum: 0, maximum: 1000000}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated collection
          content: {application/json: {schema: {$ref: '#/components/schemas/KBCollection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteKBCollection
      x-permission: conversations:write
      description: >
        Move an empty collection to the trash: restorable for 30 days, then deleted for good. A
        collection that still holds articles or collections outside the trash is 409
        `collection_not_empty` (move or delete them first). Send the `updated_at` you read (409
        `changed_elsewhere`).
      parameters:
        - {name: updated_at, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Collection moved to the trash}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/collections/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreKBCollection
      x-permission: conversations:write
      description: >
        Take a collection out of the trash. Send its `updated_at` as the trash shows it (409
        `changed_elsewhere`). 409 `parent_in_trash` when its parent is in the trash (restore that
        first), 409 `duplicate_slug` when a sibling took its slug meanwhile. 404 when it is not in the
        trash. Among siblings ordered by hand it comes back last; otherwise it falls in by name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored collection
          content: {application/json: {schema: {$ref: '#/components/schemas/KBCollection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/order:
    put:
      operationId: setKBOrder
      x-permission: conversations:write
      description: >
        Set by hand the order of what sits directly under one parent: its collections and, under a
        collection, its articles (drafts included). `parent_id` null is the top, which holds
        collections only (`article_ids` is then empty). The lists must name every collection and
        article outside the trash under that parent, each once, and nothing else; otherwise nothing
        changes and the answer is 409 `order_stale` with the lists as they are now in
        `error.collection_ids` and `error.article_ids` (someone added, moved or deleted one since they
        were read). A parent that is not a collection of this workspace outside the trash is 404. The
        help center, the article list of a collection and the reply box's article picker follow the
        order on their next load. Positions become 1, 2, 3 in the order given; `updated_at` does not
        change, and an order that moves nothing leaves `content_version` as it is. After an order by
        hand, a new, moved, imported or restored item goes last. Any agent may set it, and a `send`
        agent token; a lower tier files an agent request.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KBOrder'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The order now
          content: {application/json: {schema: {$ref: '#/components/schemas/KBOrder'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/articles:
    get:
      operationId: listKBArticles
      x-permission: conversations:read
      description: >
        Knowledge base articles outside the trash, without their text, in pages. Without `q` the
        order is `sort`: `recent` puts the most recently updated first; `manual` is the help center's
        order (collections in their order, a collection's own articles before those of its collections,
        and in each collection by `position`, then title, then number). `sort` is `manual` with
        `collection_id` and `recent` without it, unless given. With `q` the articles whose title or text hold every word of
        `q` as a word or the start of a word (or whose title holds `q`) come first by relevance. Words
        are split the same way in the query and the text, with no language rules, so a word inside
        another word, and text in scripts written without spaces (Chinese, Japanese, Thai), are found
        only when they start a word or match the title.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: status, in: query, schema: {type: string, enum: [draft, published]}}
        - {name: collection_id, in: query, description: Only the articles directly in this collection., schema: {type: string, format: uuid}}
        - {name: sort, in: query, description: The order without `q`; ignored with `q`., schema: {type: string, enum: [recent, manual]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Knowledge base articles
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBArticleSummary'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createKBArticle
      x-permission: conversations:write
      description: >
        Write an article in Markdown. It starts as a draft unless `status` is `published`. It gets the
        next `number` of the workspace, which never changes and is never reused, so the address
        `/a/<number>-<slug>` keeps working when the title changes. Without `slug` one is made from the
        title. The text holds at most 100,000 characters and is never cut; a workspace holds at most
        2,000 articles, counting the ones in the trash (409 `kb_limit`). In a collection ordered by
        hand (`PUT /api/v1/kb/order`) it goes last; until then its `position` is 0 and it falls in by
        title. A `send` agent token may create one; a lower tier files an agent request (at most 64 KiB
        of JSON).
      parameters:
        - {$ref: '#/components/parameters/CreateIdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KBArticleInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '200':
          description: The article an earlier request with the same Idempotency-Key created; nothing new was stored
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/IdempotencyKeyReused'}
  /api/v1/kb/articles/trash:
    get:
      operationId: listTrashedKBArticles
      x-permission: conversations:read
      description: >
        Articles deleted in the last 30 days, most recently deleted first, in pages, without their
        text. Each can be restored with `POST /api/v1/kb/articles/{id}/restore` until `purges_at`; after
        that it is deleted for good with its history. Articles in the trash count toward the 2,000 of
        a workspace.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Articles in the trash
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TrashedKBArticle'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/kb/articles/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBArticle
      x-permission: conversations:read
      description: >
        One article with its Markdown text and its stored translations. It also finds an article in
        the trash (`deleted_at` is then set).
      responses:
        '200':
          description: The article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateKBArticle
      x-permission: conversations:write
      description: >
        Change the title, slug, text, collection, status (publish or unpublish), search title or meta
        description. Send back the
        `updated_at` you read; when the article was saved since, nothing changes and the answer is 409
        `changed_elsewhere`. Every change adds a version to the history. An article in the trash is
        404. A `send` agent token may edit; a lower tier files an agent request (at most 64 KiB of
        JSON).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                title: {type: string, minLength: 1, maxLength: 300}
                slug: {type: string, minLength: 1, maxLength: 120}
                body_md: {type: string, maxLength: 100000}
                collection_id: {type: string, format: uuid}
                status: {type: string, enum: [draft, published]}
                seo_title: {type: string, maxLength: 120, description: 'The page title search engines show; empty uses the article title.'}
                seo_description: {type: string, maxLength: 320, description: 'The meta description search engines show; empty uses the start of the text (160 characters).'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteKBArticle
      x-permission: conversations:write
      description: >
        Move the article to the trash: it leaves the list and the help center, and can be restored for
        30 days. Send the `updated_at` you read (409 `changed_elsewhere`). A `send` agent token may
        delete; a lower tier files an agent request.
      parameters:
        - {name: updated_at, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Article moved to the trash}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/articles/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreKBArticle
      x-permission: conversations:write
      description: >
        Take an article out of the trash, as it was when deleted (a published article is published
        again). Send its `updated_at` as the trash shows it (409 `changed_elsewhere`). 409
        `collection_in_trash` when its collection is in the trash (restore that first). 404 when it is
        not in the trash. In a collection ordered by hand it comes back last; otherwise it falls in by
        title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/articles/{id}/ai-exclusion:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: excludeKBArticleFromAI
      x-permission: conversations:write
      description: >
        Keep the article away from AI, in every language: reply drafts and triage suggestions no longer
        read or quote it, from this call on. People and the help center still see it. The change is a
        version of the article (kind `ai_exclude`, who and when), and `ai_exclusion` says since when and
        by whom; the text and `updated_at` do not change, so nobody's open edit is refused. Excluding an
        excluded article changes nothing. Undo with DELETE.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The article, excluded from AI
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: includeKBArticleInAI
      x-permission: conversations:write
      description: >
        Let AI read the article again (a version of kind `ai_include`). A published article is found
        again within seconds. Including an article that is not excluded changes nothing.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The article, readable by AI
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/articles/{id}/versions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listKBArticleVersions
      x-permission: conversations:read
      description: >
        The versions of an article, newest first, in pages: who made each, through which agent token
        or approved agent request, and the title, slug, text, collection and status it had. An article
        in the trash keeps its history. Versions are never changed or removed while the article exists.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before_version, in: query, description: Only versions older than this one (the next_before_version of the previous page)., schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Versions of the article
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before_version]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBArticleVersion'}}
                  next_before_version: {type: [integer, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/articles/{id}/versions/{version}/restore:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: restoreKBArticleVersion
      x-permission: conversations:write
      description: >
        Make the title, slug and text of an earlier version current again, as a new version; the
        status and collection stay as they are now, and nothing in the history is rewritten. Send back
        the `updated_at` you read (409 `changed_elsewhere`). An article in the trash is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Article with the restored text
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/images:
    post:
      operationId: uploadKBImage
      x-permission: conversations:write
      description: >
        Store an image in the knowledge base's media library. The body is the raw image, at most 5 MiB;
        only PNG, JPEG, GIF and WebP are accepted, judged from the bytes, not from the declared type, at
        most 8,192 pixels on a side and 40 megapixels (400 otherwise). Location, camera data, XMP and
        comments are removed without touching the pixels (a JPEG keeps its orientation), and the
        server makes a thumbnail. The same bytes uploaded twice give the same item (and take an item
        in the library's trash out of it). Images count toward the plan's storage cap (403
        `storage_limit_reached` when it is full). Put it in an article as `![text](url)`. An image no
        article ever saved is deleted 30 days after its last upload unless it is kept: `keep=true`
        is for an upload made in the library. A workspace holds at most 10,000 items, its trash
        included (409 `kb_limit`). A `send` agent token may upload; a lower tier gets 403
        `files_need_approval`.
      parameters:
        - {name: name, in: query, description: The name the library shows; the file name without its extension is a good one., schema: {type: string, maxLength: 200}}
        - {name: alt, in: query, description: Alt text the editor offers when it inserts the image., schema: {type: string, maxLength: 500}}
        - {name: keep, in: query, description: 'true keeps the image from the purge of unused items, as an upload in the library does.', schema: {type: boolean}}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/gif: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: The stored image, or the item that already held the same bytes
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413':
          description: The image is over 5 MiB; nothing was stored.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/images/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBImage
      x-permission: conversations:read
      description: >
        The bytes of one image of the workspace's knowledge base, with `nosniff` and a sandboxing
        Content-Security-Policy so nothing in it can run.
      responses:
        '200':
          description: The image
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
            X-Content-SHA256: {schema: {type: string}}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media:
    get:
      operationId: listKBMedia
      x-permission: conversations:read
      description: >
        The media library outside its trash, 60 items a page unless `limit` says otherwise, newest
        first unless `sort` says otherwise, each with its usage. `usage=unused` lists what no live
        article's current text names (articles in the trash and older versions do not count as use);
        its first page adds `summary`, the count and bytes of every unused item the filter selects,
        kept items apart. `q` matches the name or alt text.
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [image, video]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: usage, in: query, description: 'in_use: a live article shows it, or the help center as its logo or favicon; unused: neither.', schema: {type: string, enum: [in_use, unused, missing_alt]}}
        - {name: sort, in: query, schema: {type: string, enum: [newest, oldest, name, largest], default: newest}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 60}}
      responses:
        '200':
          description: A page of the library
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBMedia'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
                  summary: {$ref: '#/components/schemas/KBMediaUnusedSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/kb/media/trash:
    get:
      operationId: listTrashedKBMedia
      x-permission: conversations:read
      description: >
        The library's trash, last moved there first, 60 items a page unless `limit` says otherwise,
        each with `purge_at`, when the daily purge deletes it (30 days after it was moved), and its
        usage. An item the purge keeps (the help center's logo or favicon) has no `purge_at`. An item
        in the trash still counts toward the plan's storage until it is purged.
      parameters:
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 60}}
      responses:
        '200':
          description: A page of the trash
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBMedia'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: trashKBMedia
      x-permission: conversations:write
      description: >
        Move up to 100 library items to the trash, each only while no live article's current text names
        it, and answer each id: `trashed`, `already_in_trash`, `in_use` or `not_found`. Send the
        `batch_id` of an earlier call to add to its batch; `POST /api/v1/kb/media/restore` with that
        `batch_id` brings back the whole batch. Saving an article that names an item in the trash takes
        it out again. Calling it twice changes nothing more.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                batch_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: What happened to each item
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaBatchResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/trash-unused:
    post:
      operationId: trashUnusedKBMedia
      x-permission: conversations:write
      description: >
        Move to the trash up to 500 items no live article uses, added before `before` (when the person
        opened the page, so nothing uploaded since is swept along), leaving kept items unless
        `include_kept`. Call again with the answer's `batch_id` while `more` is true; one Undo
        (`POST /api/v1/kb/media/restore` with that `batch_id`) restores everything moved. A token below
        `send` gets an agent request naming the ids (at most 100 a request), so a person approves
        exactly what will move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              properties:
                before: {type: string, format: date-time}
                include_kept: {type: boolean, default: false}
                batch_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: How many moved
          content:
            application/json:
              schema:
                type: object
                required: [trashed, more, batch_id]
                properties:
                  trashed: {type: integer}
                  more: {type: boolean, description: True while more unused items are left; call again with batch_id.}
                  batch_id: {type: [string, 'null'], format: uuid, description: Null when nothing moved and no batch_id was sent.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/restore:
    post:
      operationId: restoreKBMediaBatch
      x-permission: conversations:write
      description: >
        Take items out of the library's trash: up to 100 `ids`, or every item of a trash `batch_id`
        (the Undo of a move to the trash). Answers each id: `restored`, `not_in_trash` or `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                batch_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: What happened to each item
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: '#/components/schemas/KBMediaResult'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/purge:
    post:
      operationId: purgeKBMedia
      x-permission: access:write
      description: >
        Delete for good up to 100 items that are in the library's trash, with their files, freeing their
        storage now instead of after 30 days. Answers each id: `purged`, `not_in_trash` (only items in
        the trash can be purged), `in_use` (the help center's logo or favicon stays until its theme no
        longer names it) or `not_found`. Articles in the trash and older versions that named one
        then show "Media no longer exists". This cannot be undone. Admins only; a lower agent token gets
        an agent request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: What happened to each item
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: '#/components/schemas/KBMediaResult'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/kb/media/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaFile
      x-permission: conversations:read
      description: >
        The bytes of a library item, with ranges (206) so a video seeks, `nosniff` and a sandboxing
        Content-Security-Policy. An id always names the same bytes: the answer may be cached for a
        year. `download=1` asks the browser to save it under its name.
      parameters:
        - {name: download, in: query, schema: {type: string, enum: ['1']}}
      responses:
        '200':
          description: The bytes
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
            ETag: {schema: {type: string}}
            Accept-Ranges: {schema: {type: string}}
          content:
            video/mp4: {schema: {type: string, format: binary}}
            video/webm: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '206':
          description: The range asked for
          content:
            video/mp4: {schema: {type: string, format: binary}}
            video/webm: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '304': {description: Not modified (If-None-Match)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416': {description: The range is outside the bytes}
    patch:
      operationId: updateKBMedia
      x-permission: conversations:write
      description: >
        Change the name, alt text (a video's title) or kept mark of a library item outside the trash.
        A new name or alt text keeps the item unless `kept` is sent too. The alt text is what the
        editor offers next time; articles keep the text they have. Send back the `updated_at` you
        read (409 `changed_elsewhere`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                name: {type: string, maxLength: 200}
                alt: {type: string, maxLength: 500}
                kept: {type: boolean}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The changed item
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: trashOneKBMedia
      x-permission: conversations:write
      description: >
        Move one library item to the trash. 409 `media_in_use`, with the articles, while a live
        article's current text names it: change those articles first. The answer's `batch_id` undoes
        it (`POST /api/v1/kb/media/restore`), as does `POST /api/v1/kb/media/{id}/restore`.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Moved to the trash, or already there
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaBatchResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/media/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreKBMedia
      x-permission: conversations:write
      description: Take one item out of the library's trash. 404 when it is not in the trash or does not exist.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The item
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/{id}/replace:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: replaceKBMedia
      x-permission: conversations:write
      description: >
        Put another library item (`with_media_id`, an image for an image, a video for a video) in the
        place of this one in every live article whose current text or a translation shows it. Each such
        article gets a new version of kind `media_replace`, and published ones change on the help
        center at once. Ids never change their bytes, so the new item keeps its own id and caches stay
        right. The answer is the replacement; `POST /api/v1/kb/media-replacements/{id}/undo` reverses
        it. 400 when the kinds differ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [with_media_id]
              properties:
                with_media_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The replacement
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaReplacement'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media-replacements/{id}/undo:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: undoKBMediaReplacement
      x-permission: conversations:write
      description: >
        Put back the text each article and translation had before the replacement, where nothing changed
        since (an article whose newest version is still the replacement's, a translation that still
        holds the replaced text), as new versions. Anything changed since keeps its text and is listed in
        `skipped_article_ids`. Undoing twice changes nothing more. 409 `media_gone` when the replaced
        item was deleted for good.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The replacement, with undone_at
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaReplacement'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/media-uploads:
    get:
      operationId: listKBMediaUploads
      x-permission: conversations:read
      description: >
        The workspace's video uploads in progress, the oldest first: who started each, the bytes received
        and when its parts expire. At most 3 are in progress at once (429 `too_many_uploads` on a fourth);
        the person who started one, or an admin, cancels it to make room.
      responses:
        '200':
          description: The uploads in progress
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBMediaUpload'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createKBMediaUpload
      x-permission: conversations:write
      description: >
        Start an upload of a video in parts: MP4 (H.264 or AV1 with AAC sound, QuickTime .mov included)
        or WebM (VP8, VP9 or AV1 with Opus or Vorbis), at most 200 MiB unless the server says
        otherwise. Nothing is converted, so the video must be one every browser plays: an H.265
        (HEVC) video, the default of iPhones, is refused when the upload completes. Send the parts with
        `PUT /api/v1/kb/media-uploads/{id}`, then complete it. The plan's storage (counting the uploads
        in progress) and the server's disk (counting every upload in progress on the server) must have
        room before any byte is sent: 403 `storage_limit_reached`, 507 `insufficient_disk`; past 200
        uploads in progress on the server a new one is 503 `server_busy`. At most 3 uploads are in progress in a
        workspace and 10 are started by one person in an hour (429 `too_many_uploads`). The parts are
        thrown away after 24 hours. A token below `send` gets 403 `files_need_approval`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                size: {type: integer, minimum: 1}
                name: {type: string, maxLength: 200}
                alt: {type: string, maxLength: 500, description: The video's title for screen readers.}
                keep: {type: boolean, description: 'true keeps the video from the purge of unused items, as an upload in the library does.'}
      responses:
        '201':
          description: The upload, at offset 0
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaUpload'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413':
          description: The video is larger than the server takes; nothing was stored.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: Too many uploads in progress or started this hour.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: The server has too many uploads in progress; try again later.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '507':
          description: The server's disk has no room for the video.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/media-uploads/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaUpload
      x-permission: conversations:read
      description: 'Where an upload stands; after a lost connection, send the part that starts at `offset`.'
      responses:
        '200':
          description: The upload
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaUpload'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putKBMediaUploadPart
      x-permission: conversations:write
      description: >
        Send the next part, at most `part_size` bytes, with `Content-Range: bytes <first>-<last>/<size>`.
        A part that does not start at the upload's offset is refused with 409 `upload_offset_mismatch`,
        the offset in `Upload-Offset` and in the answer; send that part again. One part of an upload at
        a time; a part must arrive within 120 seconds.
      parameters:
        - {name: Content-Range, in: header, required: true, schema: {type: string, pattern: '^bytes \d+-\d+/\d+$'}}
      requestBody:
        required: true
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        '200':
          description: The upload, at its new offset
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaUpload'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The part does not start where the upload stands, or the upload is complete.
          headers:
            Upload-Offset: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: Another part of this upload, or too many of the workspace, are being sent.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    delete:
      operationId: cancelKBMediaUpload
      x-permission: conversations:write
      description: >
        Cancel an upload in progress and throw its parts away, at once, even while a part is being sent
        (that part then answers 404). Only the person who started it, or an admin, can (403
        `not_your_upload`). A token below `send` gets 403 `files_need_approval`.
      responses:
        '204': {description: Cancelled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media-uploads/{id}/complete:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: completeKBMediaUpload
      x-permission: conversations:write
      description: >
        Check and store the video once every part arrived. The server reads its length, size and codecs
        from the file, and removes in place what a camera or phone leaves in it (location, titles,
        XMP, tracks of data such as GPS or subtitles) without changing a frame. A video it refuses
        (400 `unsupported_codec`, `invalid_request`; more than 8,192 pixels on a side) is thrown away with
        the upload. A full library or plan (409) keeps the parts, so the same upload completes once
        there is room; parts gone from the server are 409 `upload_lost` and the upload is cancelled.
        Location, titles and recording dates are removed. The same bytes give the item that holds them,
        and a repeated complete answers the same item. Put it in an article
        as `<video controls src="/api/v1/kb/media/<id>"></video>`.
      responses:
        '201':
          description: The video in the library
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: A part of this upload is being sent.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/media/{id}/poster:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: putKBVideoPoster
      x-permission: conversations:write
      description: >
        Give a video its poster, the still picture shown before it plays: the raw bytes of a PNG, JPEG,
        GIF or WebP image, at most 5 MiB, metadata removed. It counts toward the plan's storage with the
        video and becomes the video's thumbnail in the library. A new poster is a new `poster_url`;
        the old one is deleted. Images have no poster (400).
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/gif: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200':
          description: The video with its poster
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: The poster is over 5 MiB; nothing was stored.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/media/{id}/poster/{version}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: version, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{8}$'}}
    get:
      operationId: getKBVideoPoster
      x-permission: conversations:read
      description: 'A video''s poster, the version `poster_url` names; an older version is 404, so a cache never shows another picture under an address.'
      responses:
        '200':
          description: The poster
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '304': {description: Not modified (If-None-Match)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/{id}/details:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaDetails
      x-permission: conversations:read
      description: >
        One library item, in the trash or not, with its usage and every article that names it: live
        articles first, then those in the trash; `current` is false where only an older version does.
      responses:
        '200':
          description: The item and its articles
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaDetails'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/{id}/thumbnail:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaThumbnail
      x-permission: conversations:read
      description: >
        The thumbnail of a library item, at most 320 pixels on its longest side: a JPEG, or a PNG when
        the image has transparency. 404 while it has none (`thumbnail_url` is null): an image too
        large to decode within the server's memory budget, or one stored before thumbnails that the
        daily backfill has not reached yet.
      parameters:
        - {name: v, in: query, description: 'The version thumbnail_url names; it only makes a new thumbnail a new URL.', schema: {type: string, maxLength: 64}}
      responses:
        '200':
          description: The thumbnail
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/help-center:
    get:
      operationId: getHelpCenter
      x-permission: conversations:read
      description: >
        Whether the public help center is on, its title and language. `content_version` grows with
        every change to the knowledge base, so a cached page can tell it is stale. Until an admin turns
        it on, it is off and nothing of the knowledge base is public.
      responses:
        '200':
          description: Help center settings
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenter'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: putHelpCenter
      x-permission: access:write
      description: >
        Turn the public help center on or off, and set its title and language (a BCP 47 tag such as
        `en` or `pt-BR`). Admins only, and an `admin` agent token. Turning it off takes every page off
        line at once; turning it on again publishes the articles marked published.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelpCenterInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Help center settings
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenter'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/autofix/status:
    get:
      operationId: getAutofixStatus
      x-permission: conversations:read
      description: >
        What the navigation rail needs: how many repositories are connected (the Fixes link shows only
        when one is), and how many fixes wait for a person or are running (the groups of
        `GET /api/v1/autofix/fixes`).
      responses:
        '200':
          description: The counts
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixStatus'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/autofix/fixes:
    get:
      operationId: listFixes
      x-permission: conversations:read
      description: >
        The workspace's fixes, newest first, in pages, optionally one group of the Fixes screen:
        `needs_person` (the conversation's latest fix failed, was merged and waits for its release, or was
        sent and stayed silent for 30 minutes), `running` (in progress) or `done` (released, cancelled, or
        followed by a newer attempt), and optionally one repository and one coding agent. Without what was
        sent and the timeline: read one fix for those.
      parameters:
        - {name: group, in: query, schema: {$ref: '#/components/schemas/FixGroup'}}
        - {name: repo_id, in: query, description: Only fixes sent to this connected repository., schema: {type: string, format: uuid}}
        - {name: connector, in: query, description: Only fixes sent to this coding agent., schema: {$ref: '#/components/schemas/FixConnector'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Fixes
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Fix'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/autofix/fixes/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getFix
      x-permission: conversations:read
      description: One fix, with exactly what left Colliedesk (`sent_title`, `sent_body`) and its timeline.
      responses:
        '200':
          description: The fix
          content: {application/json: {schema: {$ref: '#/components/schemas/FixDetail'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/autofix/fixes/{id}/retry:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: retryFix
      x-permission: conversations:write
      description: >
        Sends a failed or cancelled fix again as a new attempt (`previous_attempt_id` names this one), with
        the content the person reviewed (the preview, filled in from the attempt before). The same as
        `POST /api/v1/conversations/{id}/fixes` otherwise; 409 `fix_not_ended` while this fix is in
        progress. Every agent token's call becomes an agent request; the person who approves it sends.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FixSendInput'}}}
      responses:
        '200':
          description: The attempt this client_key already made
          content: {application/json: {schema: {$ref: '#/components/schemas/FixSent'}}}
        '201':
          description: The new attempt
          content: {application/json: {schema: {$ref: '#/components/schemas/FixSent'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/autofix/fixes/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: cancelFix
      x-permission: conversations:write
      description: >
        Cancels a fix in progress (`cancelled`, reason `cancelled_by_person`). Cursor's run is cancelled.
        An issue is closed with a comment, but an agent already running may finish on GitHub: stop it there
        (`issue_url`). A pull request already open is not closed (the App cannot write pull requests).
        409 `state_conflict` once the fix ended; with `row_version`, 409 `fix_changed` when it moved since.
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/FixChangeInput'}}}
      responses:
        '200':
          description: The fix
          content: {application/json: {schema: {$ref: '#/components/schemas/Fix'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/autofix/fixes/{id}/deployed:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: markFixDeployed
      x-permission: conversations:write
      description: Says a merged fix is released (`deployed`); one released already is answered as it is. 409 `state_conflict` otherwise.
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/FixChangeInput'}}}
      responses:
        '200':
          description: The fix
          content: {application/json: {schema: {$ref: '#/components/schemas/Fix'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: unmarkFixDeployed
      x-permission: conversations:write
      description: Takes the release back (`merged` again), for a release that was rolled back or marked by mistake; a merged fix is answered as it is. 409 `state_conflict` otherwise.
      responses:
        '200':
          description: The fix
          content: {application/json: {schema: {$ref: '#/components/schemas/Fix'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/autofix/fixes/{id}/pull-request:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: linkFixPullRequest
      x-permission: conversations:write
      description: >
        Links a pull request by hand when Colliedesk did not find it (`pr_open`, `pr_linked_by` person),
        from `sent`, `working` or `failed` with reason `pr_closed`. The address must be a pull request of
        the fix's repository (400 `pull_request_not_in_repo`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: {type: string, maxLength: 500, description: 'https://github.com/<owner>/<repo>/pull/<number>'}
                row_version: {type: integer, minimum: 1}
      responses:
        '200':
          description: The fix
          content: {application/json: {schema: {$ref: '#/components/schemas/Fix'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: unlinkFixPullRequest
      x-permission: conversations:write
      description: Unlinks a pull request a person linked (back to the stop it was at when the pull request was linked, `working` or `sent`); one Colliedesk found itself stays.
      responses:
        '200':
          description: The fix
          content: {application/json: {schema: {$ref: '#/components/schemas/Fix'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/conversations/{id}/fixes:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listConversationFixes
      x-permission: conversations:read
      description: Every fix of the conversation, the latest attempt first.
      responses:
        '200':
          description: Fixes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Fix'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: sendFix
      x-permission: conversations:write
      description: >
        Sends the conversation to a coding agent: stores the fix in `sending` with exactly the title and
        body given (build them with the preview), then, for an issue connector, answers `authorize_url`:
        the person's browser goes to GitHub to confirm, and the issue is created as that person on the way
        back. Cursor is sent by the server with the workspace's key (`authorize_url` null). The same
        `client_key` answers 200 with the fix it made. 409 `fix_in_progress` while the conversation has
        one, `connector_off`, `repo_paused`, `notes_not_allowed` (note_ids on a repository that keeps notes in),
        `cursor_key_missing` (Cursor without its key). Every agent token's call becomes an agent request; the person
        who approves it gets `authorize_url` (never the token) and sends as themselves.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FixSendInput'}}}
      responses:
        '200':
          description: The fix this client_key already made
          content: {application/json: {schema: {$ref: '#/components/schemas/FixSent'}}}
        '201':
          description: The fix
          content: {application/json: {schema: {$ref: '#/components/schemas/FixSent'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/conversations/{id}/fixes/preview:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: previewFix
      x-permission: conversations:read
      description: >
        Builds what a fix would send, without sending: a title and a body masked on the server (email
        addresses, phone and card numbers, strings that look like keys or tokens, secrets in query strings;
        `@mentions` and `#123` references made inert), the customer's words wrapped as untrusted data, the
        internal notes that may go (off by default, never one an agent token wrote) and how many files stay
        behind. The person edits it and sends it with `POST …/fixes`. 409 `repo_paused`, `notes_not_allowed`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FixPreviewInput'}}}
      responses:
        '200':
          description: The preview
          content: {application/json: {schema: {$ref: '#/components/schemas/FixPreview'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/autofix/settings:
    get:
      operationId: getAutofixSettings
      x-permission: access:read
      description: >
        The GitHub installations, connected repositories and coding agents of the workspace. Never a key:
        Cursor's shows only who set it and when.
      responses:
        '200':
          description: The settings
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixSettings'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/autofix/github/installations:
    post:
      operationId: connectGitHub
      x-permission: access:write
      description: >
        Starts installing the Colliedesk GitHub App: answers the address the admin's browser opens (choose
        "Only select repositories"). GitHub sends the browser back to `/api/v1/autofix/github/callback`,
        which checks with the admin's own authorization that the installation is theirs before it joins
        the workspace. An installation that reaches every repository is stored but blocked until narrowed.
        503 `autofix_unavailable` while the server's GitHub App is not set up. Every agent token's call
        becomes an agent request; the person who approves it gets the address.
      responses:
        '201':
          description: Where the browser goes
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: {type: string, format: uri}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/AutofixUnavailable'}
  /api/v1/autofix/github/installations/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: disconnectGitHub
      x-permission: access:write
      description: >
        Uninstalls the App from that account on GitHub and removes the installation. Its repositories stay,
        paused (`removed_from_app`), so their fixes still show where they went; fixes in progress on them are
        cancelled (`repo_disconnected`). Connect again to resume. 503 `github_unavailable` when GitHub did
        not uninstall it: nothing changed. It uninstalls the App on the customer's GitHub, so every agent
        token's call becomes an agent request.
      responses:
        '200':
          description: The settings
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixSettings'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/AutofixUnavailable'}
  /api/v1/autofix/github/installations/{id}/repositories:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listGitHubRepositories
      x-permission: access:read
      description: >
        The repositories the installation can reach, read from GitHub now, each with its visibility and the
        connected repository if there is one. Only private ones can be connected.
      responses:
        '200':
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/GitHubRepository'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/AutofixUnavailable'}
  /api/v1/autofix/github/callback:
    get:
      operationId: finishGitHubAuthorization
      security: []
      x-permission: public
      summary: GitHub's redirect after installing the App or authorizing a fix
      description: >-
        Opened by the browser GitHub redirects, never by an API client. It needs the session cookie of the
        person who started (installing the App, or sending a fix) and the unused `state` of that start,
        looked up in that person's workspace only. Installing: the `installation_id` must be among the
        person's own installations, checked with their authorization, and they must administer every
        repository the installation reaches (an organization owner does; a member does not), else
        `installation_not_yours`. Sending a fix: the issue is created as
        the person in the background and the authorization is revoked. Every outcome is a 303: to
        `/settings/autofix?github=connected`, `?github=requested` (an organization member asked its owners
        to install the App; connect again once they did) or `?github_error=<reason>` (also `forbidden`:
        only an admin connects GitHub), or to the conversation with
        `?fix=<id>` or `?fix_error=<reason>` (also `forbidden`: the person may no longer send a fix, by
        their role or a locked workspace; `expired` there also when the fix no longer waits for GitHub).
        The reasons: `signed_out`, `expired`, `wrong_person`, `denied`,
        `installation_not_yours`, `installation_in_use`, `github_unavailable`. GitHub's own error text is
        never echoed.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: installation_id, in: query, required: false, schema: {type: string}}
        - {name: setup_action, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '303':
          description: Back to Colliedesk
          headers:
            Location: {schema: {type: string}}
  /api/v1/autofix/repos:
    post:
      operationId: connectRepo
      x-permission: access:write
      description: >
        Connects a repository of an active installation for fixes, after reading its visibility from GitHub
        now: 409 `repo_not_private` for a public or internal one, `installation_blocked` while the
        installation reaches every repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id, github_repo_id]
              properties:
                installation_id: {type: string, format: uuid, description: The installation's id in Colliedesk.}
                github_repo_id: {type: integer, format: int64, minimum: 1}
                default_connector: {$ref: '#/components/schemas/FixConnector'}
      responses:
        '201':
          description: The repository
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixRepo'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/AutofixUnavailable'}
  /api/v1/autofix/repos/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateRepo
      x-permission: access:write
      description: Changes the coding agent a new fix on this repository suggests (null for none).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [default_connector]
              properties:
                default_connector:
                  oneOf:
                    - {type: 'null'}
                    - {$ref: '#/components/schemas/FixConnector'}
      responses:
        '200':
          description: The repository
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixRepo'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: disconnectRepo
      x-permission: access:write
      description: >
        Disconnects the repository: fixes in progress on it are cancelled (`repo_disconnected`); its fixes
        stay with the repository's name. Connect it again to send new ones.
      responses:
        '204': {description: Disconnected}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/autofix/repos/{id}/include-notes:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: includeNotesInFixes
      x-permission: access:write
      description: >
        Lets a fix on this repository carry internal notes the sender picks (never one an agent token
        wrote). Notes then leave the workspace for the coding agent, so every agent token's call becomes an
        agent request.
      responses:
        '200':
          description: The repository
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixRepo'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: excludeNotesFromFixes
      x-permission: access:write
      description: Stops internal notes from going with fixes on this repository (the default).
      responses:
        '200':
          description: The repository
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixRepo'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/autofix/connectors/{kind}:
    parameters:
      - {name: kind, in: path, required: true, schema: {$ref: '#/components/schemas/FixConnector'}}
    put:
      operationId: enableFixConnector
      x-permission: access:write
      description: >
        Turns a coding agent on and records the admin's consent to the data it receives (which version of
        the text, who, when). Every agent token's call becomes an agent request. Cursor also needs its key.
        409 `consent_outdated` when consent_version is not the current text, 422 `consent_required` when it
        is missing. An approved request records the consent in the approver's name: the approver agrees
        to the text the request names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consent_version]
              properties:
                consent_version: {type: string, minLength: 1, maxLength: 40, description: The version of the consent text the admin read (AutofixSettings.consent_version).}
      responses:
        '200':
          description: The connector
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixConnector'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Error code `consent_required`. consent_version is missing or empty, also in an approved agent request; nothing changed.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    delete:
      operationId: disableFixConnector
      x-permission: access:write
      description: >
        Turns a coding agent off: fixes not sent yet (`sending`) are cancelled `connector_disabled`, fixes
        already sent go on. The consent on record and Cursor's key stay until removed.
      responses:
        '200':
          description: The connector
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixConnector'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/autofix/connectors/{kind}/check:
    parameters:
      - {name: kind, in: path, required: true, schema: {$ref: '#/components/schemas/FixConnector'}}
    post:
      operationId: checkFixConnector
      x-permission: access:read
      description: >
        Checks what Colliedesk can check: the installation is active, the repositories are private and the
        App has its permissions; for Cursor also that the key works and reaches the repositories. The setup
        on the vendor's side (the Claude workflow and its secret, Copilot turned on for the repository) is a
        checklist the admin ticks. The result is kept in `last_check`. 409 `cursor_key_missing` for Cursor
        without a key. Cursor lists repositories once a minute, so a check within a minute of the last one
        only tries the key.
      responses:
        '200':
          description: The connector
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixConnector'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: Error code `rate_limited`. The workspace called Cursor from the settings 5 times this minute (Retry-After says when to try again).
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503': {$ref: '#/components/responses/AutofixUnavailable'}
  /api/v1/autofix/connectors/cursor_api/key:
    put:
      operationId: setCursorKey
      x-permission: access:write
      description: >
        Stores the workspace's Cursor API key, sealed; it is never shown again, not one character. A service
        account key is advised (a user key acts with all of its owner's rights). A token without
        `autofix_settings:manage_credentials` is refused (403 `credentials_need_admin_token`), never filed
        as an agent request, because a request keeps its body. Cursor tries the key first (`GET /v1/me`):
        400 `cursor_key_invalid` when it refuses it and 503 `cursor_unavailable` when it does not answer,
        with nothing changed; 409 `secret_keys_missing` on a server without MAILBOX_TOKEN_KEYS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: {type: string, minLength: 8, maxLength: 500, writeOnly: true}
      responses:
        '200':
          description: The connector
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixConnector'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: Error code `rate_limited`. The workspace called Cursor from the settings 5 times this minute (Retry-After says when to try again).
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503': {$ref: '#/components/responses/AutofixUnavailable'}
    delete:
      operationId: removeCursorKey
      x-permission: access:write
      description: Removes the Cursor key; Cursor cannot take new fixes until a key is set again.
      responses:
        '200':
          description: The connector
          content: {application/json: {schema: {$ref: '#/components/schemas/AutofixConnector'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      security: [{githubWebhook: []}]
      x-permission: public
      description: >
        Receives the Colliedesk GitHub App's events (installation, installation_repositories, repository,
        issues, issue_comment, pull_request). Authenticated by `X-Hub-Signature-256` (HMAC-SHA256 of the raw
        body with the App's webhook secret), not by a session; a missing or wrong signature is 401 and
        nothing is stored. A delivery (`X-GitHub-Delivery`) already applied answers `duplicate`. An event acts
        only in the workspace that owns the installation, and only on a repository connected there. Bodies
        over 5 MB are refused (413).
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Event understood
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/WebhookTooLarge'}
  /api/v1/help-center/theme:
    get:
      operationId: getHelpCenterTheme
      x-permission: conversations:read
      description: >
        The brand of the public help center: logo, favicon, website and contact links, colors and
        fonts, with the contrast `checks` of the colors it shows. A null color or font is the default.
      responses:
        '200':
          description: The help center theme
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterTheme'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: putHelpCenterTheme
      x-permission: access:write
      description: >
        Replace the brand of the public help center. A field left out or null goes back to its default,
        so send the whole theme (read it first). `custom_css` is the exception: it is required, and null
        or an empty string clears it; a body without it is refused (422 `validation_failed`, with
        `fields.custom_css`) and changes nothing, so a client that does not know the field, or an agent
        request filed before it existed, cannot remove the custom CSS. Admins only; an agent token needs
        `help_center:update` and `kb_articles:publish` (both held by the `admin` preset). Without either
        permission, it files an agent request (202) and changes no public page. Every color
        pair must meet WCAG AA (4.5:1 for text, 3:1 for the primary color against the background):
        422 `contrast_too_low` names each failing color in `fields` with a color that passes, and
        nothing is saved. A logo or favicon must be an image of the workspace's media library outside
        the trash (422 `media_not_found` otherwise); it is marked kept, so the library never deletes it
        while the help center names it. `custom_css` is checked as its schema says (422
        `custom_css_refused`). A save changes `content_version`, so every page is new.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelpCenterThemeSave'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The saved theme
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterTheme'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ThemeInvalid'}
  /api/v1/help-center/search-console:
    get:
      operationId: getHelpCenterSearchConsole
      x-permission: conversations:read
      description: >
        The verification tokens of the help center: the content of the `google-site-verification`
        (Google Search Console) and `msvalidate.01` (Bing Webmaster Tools) `<meta>` tags. A token is
        null until set. Each is served as a `<meta>` tag in the head of every page of this workspace's
        help center, on its own host or custom domain, and never on the app or another workspace.
      responses:
        '200':
          description: The verification tokens
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterSearchConsole'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: putHelpCenterSearchConsole
      x-permission: access:write
      description: >
        Set or remove the verification tokens. A field left out stays as it is; null or an empty string
        removes that token. Paste only the `content` value of the meta tag Google or Bing shows (16 to
        100 letters, digits, `-` or `_`); anything else, such as the whole tag, is refused (422
        `validation_failed`, with `fields`) and nothing is saved. The tags change every public page, so
        a save changes `content_version`. Admins only; an agent token needs `help_center:update` and
        `kb_articles:publish` (both held by the `admin` preset). Without either permission, it files an
        agent request (202) and changes no public page.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelpCenterSearchConsoleInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The saved tokens
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterSearchConsole'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ThemeInvalid'}
  /api/v1/help-center/freshdesk-redirect:
    get:
      operationId: getFreshdeskRedirect
      x-permission: conversations:read
      description: >
        What a team that moved from `<name>.freshdesk.com` should do about its old help center
        addresses, read from the workspace's latest finished Freshdesk import. A team on its own
        domain redirects at DNS (`own_domain`). Otherwise Freshdesk cannot answer 301 from
        `*.freshdesk.com`, and the team pastes a script into its Freshdesk portal's head that sends a
        visitor of an old help page to the new one. Freshdesk allows that only on its Pro and
        Enterprise plans, so `plan` (the account's Freshdesk plan) decides: without it the state is
        `ask_plan`; `growth` is `growth` and carries no snippet; `pro` and `enterprise` are `ready`
        with the `snippet`. The snippet is built from the help center's address and the pages the
        import made public, never from the request; it is a JavaScript redirect, not a 301, and works
        only while the Freshdesk account does, so keep the account and the snippet for `keep_weeks`
        after the switch. Only help pages (home, solutions, search) move; sign-in and tickets stay.
      parameters:
        - name: plan
          in: query
          required: false
          description: The account's Freshdesk plan.
          schema: {type: string, enum: [growth, pro, enterprise]}
      responses:
        '200':
          description: The state and, when ready, the snippet
          content: {application/json: {schema: {$ref: '#/components/schemas/FreshdeskRedirect'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/help-center/theme/check:
    post:
      operationId: checkHelpCenterTheme
      x-permission: conversations:read
      description: >
        Check a candidate theme without saving it: the same checks as PUT. Contrast is answered with
        200 and `ok` false, so an editor can show every pair while a person picks colors; a theme of
        the wrong shape or a logo that is not in the library is 422 as on PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelpCenterThemeInput'}
      responses:
        '200':
          description: The checks of the candidate
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterThemeChecks'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ThemeInvalid'}
  /api/v1/help-center/theme/preview:
    post:
      operationId: previewHelpCenterTheme
      x-permission: conversations:read
      description: >
        Render a page of the help center with a candidate theme, saving nothing: the real page templates,
        the workspace's live collections and published articles (never drafts), also while the help center
        is off. `page` `article` shows the published article with the lowest number, or a sample text when
        nothing is published; a video in it shows as a placeholder. The answer is one HTML document
        for an `<iframe sandbox="allow-same-origin" srcdoc>`: it links the help center's style sheet
        under `/help/_/`, carries the candidate brand inline and its own policy (`default-src 'none';
        img-src <origin>/api/v1/kb/images/ <origin>/api/v1/kb/media/; style-src <origin>/help/_/
        'unsafe-inline'; script-src 'none'; form-action 'none'; base-uri 'none'`), which runs no script;
        images load from the session's knowledge base routes and links take no pointer. Contrast is answered as in
        `/theme/check` (200 with `ok` false), so the person sees why Save would refuse; a theme of the
        wrong shape or a logo that is not an image of the library is 422 as on PUT. Each person may ask
        for 600 previews a minute (429 with `Retry-After` beyond).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelpCenterThemePreviewInput'}
      responses:
        '200':
          description: The page and the checks of the candidate
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterThemePreview'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ThemeInvalid'}
        '429':
          description: Too many previews in the last minute; try again after `Retry-After` seconds.
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/help-center/domain:
    get:
      operationId: getHelpCenterDomain
      x-permission: conversations:read
      description: >
        The help center's custom domain, such as `help.example.com`: its status (`none`, `pending` until
        its DNS check passes, `active` once the help center serves on it), the DNS records to set, and the
        last check. `records` lists one record that sends the host name to Colliedesk and one that proves
        the workspace owns it: on a server with `HELP_CENTER_DOMAIN`, a CNAME to the claim's own target
        `hc-<claim>.<HELP_CENTER_DOMAIN>` does both, and the TXT record is the alternative; without it, the
        TXT record proves ownership and the CNAME (or A/AAAA) record only routes. The CNAME target and the
        token are random, made when the host name is set, and kept until it is removed or replaced; the
        workspace's slug proves nothing, since another workspace may take it after a rename. The token is
        in the TXT record's value; it is public in DNS once set, so every tier may read it, and it is
        never exported. On a server with billing, a workspace on its trial may set and verify a domain, but
        the help center serves on it only once the workspace is paid (`awaiting_payment`).
      responses:
        '200':
          description: The custom domain
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterDomain'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: putHelpCenterDomain
      x-permission: access:write
      description: >
        Set or replace the help center's custom domain. Admins only, and an `admin` agent token. A new
        host name is `pending` with a new token until its DNS check passes (POST
        /api/v1/help-center/domain/check, the reverse proxy's first certificate question, or the daily
        re-check) with a new token and CNAME target; sending the current host name again changes nothing.
        Unicode host names are stored in
        their ASCII (punycode) form. Refused with 422 `validation_failed` (`fields.hostname`) for an IP
        address, a single label, more than 253 characters, `APP_ORIGIN`'s host, or `HELP_CENTER_DOMAIN`
        and the names below it. A host name another workspace's help center serves on can be claimed too:
        the claim stays `pending`, and its check answers 409 `domain_taken` until DNS proves this claim
        and no longer proves the other workspace's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelpCenterDomainInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The custom domain
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterDomain'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: The host name cannot be a custom domain; `error.fields.hostname` says why
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    delete:
      operationId: deleteHelpCenterDomain
      x-permission: access:write
      description: >
        Remove the custom domain. The help center stops serving on it with the next request to this
        server (other server processes within 30 seconds) and its other addresses stop redirecting there.
        Setting the same host name again needs a new check, with a new CNAME target and TXT token. Admins
        only, and an
        `admin` agent token; removing when there is none changes nothing.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: No custom domain
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterDomain'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/help-center/domain/check:
    post:
      operationId: checkHelpCenterDomain
      x-permission: access:write
      description: >
        Look up the custom domain's DNS now (at most 3 seconds) and record the result: the host name's
        CNAME chain ends at the claim's own target `hc-<claim>.<HELP_CENTER_DOMAIN>`, or
        `_help-center-verify.<host name>` holds the token. A pending domain that passes becomes `active`;
        one that fails keeps its status, with `check_error` saying which record to set (never what the
        server's DNS answered). A check counts only for the claim it looked up: when the domain is removed
        or set again meanwhile, it answers 409 `domain_changed`. An active domain whose check fails keeps
        serving, with `check_error` and `failing_since`; the first failed check 7 days after
        `failing_since` puts it back to `pending` (`pending_reason` `proof_lost`). When another workspace's
        help center serves on the host name, a passing check takes it over if the same DNS answer does not
        prove the other workspace's claim (that workspace goes back to `pending` with `taken_over`), and
        answers 409 `domain_taken` if it does. 404 when no domain is set. Admins only, and an `admin` agent
        token. One workspace's checks, by people and agent tokens together, are limited to 10 an hour (429
        with `Retry-After`): each makes the server ask DNS.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The custom domain after the check
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenterDomain'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: The workspace checked its domain 10 times in the last hour; retry after `Retry-After` seconds.
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: colliedesk_session}
    operatorCookie: {type: apiKey, in: cookie, name: colliedesk_operator, description: '__Host-colliedesk_operator when the console is served over https'}
    inboundSecret: {type: apiKey, in: header, name: X-Colliedesk-Inbound-Secret}
    polarWebhook: {type: apiKey, in: header, name: webhook-signature}
    resendWebhook: {type: apiKey, in: header, name: svix-signature}
    githubWebhook: {type: apiKey, in: header, name: X-Hub-Signature-256}
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    WebFormPressKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional name of one press of the page's submit button, 1 to 200 printable ASCII characters; send the
        same key when the page retries that press. A repeat of the same key, form, email, message and source
        is accepted (202) and stores nothing new; the same key with other words is a new submission. Without
        a key every request is a submission. A malformed key is 400. Repeats still count against the limits.
      schema: {type: string, minLength: 1, maxLength: 200}
    OperatorRealm:
      name: X-Colliedesk-Realm
      in: header
      required: false
      description: '`operator`: the request is an operator request, decided with an operator''s session (the operator console sends it).'
      schema: {type: string, enum: [operator]}
    CreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        The client's name for this submit, 1 to 200 printable ASCII characters; the same on every retry
        of it. A repeat within a day returns what the first request created (200) and creates nothing; a
        repeat that arrives while the first still runs waits up to 10 seconds for its answer, then answers 409
        `request_in_progress`. The same key with other input answers 422 `idempotency_key_reused`. Keys belong
        to the workspace. An agent token below the route's tier files an agent request (202) without the key.
      schema: {type: string, minLength: 1, maxLength: 200}
  responses:
    IdempotencyKeyReused:
      description: The Idempotency-Key already names another request with other input (`idempotency_key_reused`); nothing was created
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AgentRequestAccepted:
      description: >-
        An agent token called this above its tier, or the action needs a person's approval for every
        tier: nothing happened yet. The call is stored as an agent request a person approves or rejects
        (`GET /api/v1/agent-requests/{request_id}` shows the outcome); it expires after seven days. A
        token gets 429 `too_many_requests` while 50 of its requests wait or after 100 in an hour (with
        `Retry-After`), 402 `workspace_locked` in a locked workspace, and a call with files gets 403
        `files_need_approval` (send the text alone, attach files after approval).
      content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequestAccepted'}}}
    Redeemed:
      description: Session created from a one-time link
      headers:
        Set-Cookie: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Redeemed'}
    Conversation:
      description: Workspace conversation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Conversation'}
    EmailChannelSettings:
      description: Email channel settings for this workspace
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EmailChannelSettings'}
    BadRequest: {$ref: '#/components/responses/Error400'}
    Conflict:
      description: The resource is not in a state that allows this action
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    IntakeGatheringDecided:
      description: The card was decided otherwise meanwhile (gathering_decided); nothing changed
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, state, decided_by, decided_by_agent_id, conversation_id]
                properties:
                  code: {type: string, enum: [gathering_decided]}
                  message: {type: string}
                  request_id: {type: string}
                  state: {type: string}
                  decided_by: {type: [string, 'null'], enum: [rules, ai, agent, null]}
                  decided_by_agent_id: {type: [string, 'null'], format: uuid, description: The person who decided it.}
                  conversation_id: {type: [string, 'null'], format: uuid}
    InternalError:
      description: Temporary server failure; the message was not stored and the forwarder should retry
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BillingLink:
      description: A single-use URL on the billing provider
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: {type: string, format: uri}
    ConsentLink:
      description: The provider's consent address for the person who started the connection, valid 10 minutes
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: {type: string, format: uri}
    BadGateway:
      description: The billing provider failed or could not be reached; nothing changed, try again
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AttachmentsTooLarge:
      description: More files than allowed or more bytes than allowed in total for one message; nothing was stored
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PayloadTooLarge:
      description: Message larger than 25 MiB or with more than 100 attachments; nothing was stored
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AutofixUnavailable:
      description: >-
        Error code `autofix_unavailable` (this server's GitHub App is not set up: GET /api/v1/config names
        the missing settings) or `github_unavailable` / `cursor_unavailable` (the vendor did not answer;
        nothing changed, try again)
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    WebhookTooLarge:
      description: A webhook body over 5 MB; nothing was stored
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    WebFormSettings:
      description: Web form channel state
      content: {application/json: {schema: {$ref: '#/components/schemas/WebFormSettings'}}}
    TooManyRequests:
      description: Per-contact inbound rate limit reached; the forwarder should retry later
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AICheckFailed:
      description: The provider check failed; nothing was saved or changed. `check_error_code` says why.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AILevelNotAllowed:
      description: 'The feature cannot run at that level there: ai_level_not_allowed (drafts never reach auto; intake reaches auto only on a channel''s scope), or intake_not_supported (the scope has no intake; available_slots lists what it has).'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AIChecksRateLimited:
      description: The workspace ran 10 provider checks in the last minute; try again shortly.
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Gone:
      description: The link or ticket expired
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    OperatorLocked:
      description: Operator sign-in is locked after ten wrong codes; `error.locked_until` says until when
      content: {application/json: {schema: {$ref: '#/components/schemas/OperatorLockedError'}}}
    OperatorTooManyTries:
      description: More than 5 tries a minute
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    OperatorCodeWrong:
      description: The code did not match (`operator_code_wrong`, `error.tries_left`) or the body is invalid
      content: {application/json: {schema: {$ref: '#/components/schemas/OperatorCodeError'}}}
    OperatorRequestAccepted:
      description: >-
        An operator token asked for a change: nothing happened yet. It waits as an operator request a
        person approves in the console (with their authenticator code); it expires after seven days.
      content: {application/json: {schema: {$ref: '#/components/schemas/OperatorRequestAccepted'}}}
    OperatorConfigRefused:
      description: >-
        Nothing was saved. `error.code` says why (`secret_in_set`, `reauth_required`, `reauth_code_invalid`,
        `reenter_secret`, `confirm_mismatch`, `setting_not_changeable`, `unknown_setting`, `config_invalid`,
        `secret_in_request`, `no_trial`); `error.fields` names the settings, never a value.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized: {$ref: '#/components/responses/Error401'}
    Forbidden: {$ref: '#/components/responses/Error403'}
    NotFound: {$ref: '#/components/responses/Error404'}
    ThemeInvalid:
      description: >-
        The theme was not saved. `error.code` is `validation_failed` (a field of the wrong shape),
        `media_not_found` (a logo or favicon that is not an image of the library outside the trash) or
        `contrast_too_low` (a color pair below WCAG AA; `error.checks` lists every pair) or
        `custom_css_refused` (`error.fields.custom_css` says where and why, such as `line 3, column 14:
        url() is not allowed`). `error.fields` holds one message per field, such as `colors.text`.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error400:
      description: Invalid request
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PlanLimitReached:
      description: >
        The action would exceed a limit of the workspace's plan (error code `plan_limit_reached`):
        more agents, pending invites included, than the plan allows. Nothing was changed; the
        action works again after an upgrade or after freeing a seat. A locked workspace answers
        `workspace_locked` instead.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TrialOutboundLimit:
      description: >
        Sending this reply would take a trial workspace past 200 people emailed in the last 24 hours,
        where each reply counts its contact and every Cc address (error code `trial_outbound_limit`,
        with `retry_after_seconds` and a `Retry-After` header: the time until enough counted replies
        leave the window). Nothing was stored. Paid plans have no such limit.
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    WorkspaceLocked:
      description: >
        The workspace's trial or subscription ended (error code `workspace_locked`). Nothing was read
        or changed. Choose a plan in billing, or export the data; the same request works after payment.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NameNotAllowed:
      description: >
        The name contains a well-known brand (error code `name_not_allowed`), for example a payment or
        mail provider. On the hosted cloud only; a self-hosted server accepts any name. Nothing was
        created or changed. The match is on whole words, so "Pineapple" is fine and "PayPal Support" is not.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    MailboxClosed:
      description: >
        The workspace no longer accepts this mail. Error code `mailbox_closed`: the workspace is locked.
        Error code `storage_limit_reached`: a trial or locked workspace would pass its 2 GiB attachment
        storage limit (imported files do not count). Both are permanent for the sender: the forwarder
        bounces the message instead of retrying, and nothing was stored. A Founding workspace never gets
        the storage answer for mail: its 20 GiB limit (imported files count) applies to uploads and imports
        only, and mail over it is stored in full. Nothing is deleted, and reading, replying without new
        attachments and export keep working.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error401:
      description: Authentication failed
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error403:
      description: >
        Permission or CSRF check failed. An agent token on a route closed to every token gets error
        code `scope_insufficient`, and `person_only` on a decision only a person makes (approving or
        rejecting an agent request); a token below a route's tier gets 202 instead (an agent request).
        A call with files that would need approval gets `files_need_approval`. On
        `POST /conversations/{id}/messages` a trial workspace gets error code
        `trial_outbound_restricted` for a reply to a conversation the customer did not start
        (unless it verified its sending domain), or for a `cc` address the customer never wrote
        from or copied (then `refused_cc` lists them), or when the customer wrote from another address
        than the contact's after a merge (then `reason` is `contact_address_differs` and `reply_to` names
        the contact's address). When the customer wrote but the mail does not count, `reason` says why:
        `mail_not_via_hosted_address` (posted to the workspace's own inbound URL) or
        `sender_authentication_failed` (sender verification failed). Nothing was stored.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error404:
      description: Resource not found in this workspace
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    SignInTimezone:
      type: string
      maxLength: 64
      description: >-
        The browser's IANA timezone. At the agent's first sign-in, while they never chose a timezone and the
        workspace is still on its `UTC` default, it becomes the agent's own (`timezone_override`). A later
        sign-in never changes it, and an unknown zone is ignored; it never fails the sign-in.
    ImportPerson:
      type: object
      required: [external_id, name, email, active, linked_agent_id, linked_by_email, pending, updated_at]
      properties:
        external_id: {type: string, description: The Freshdesk agent id}
        name: {type: string}
        email: {type: string}
        active: {type: boolean, description: An active agent in Freshdesk}
        linked_agent_id: {type: [string, 'null'], format: uuid}
        linked_by_email: {type: boolean, description: 'Linked because the emails match, not by a person'}
        pending: {type: boolean, description: The link changed and the imported replies and tickets are still being moved}
        updated_at: {type: string, format: date-time}
    ImportOptions:
      type: object
      additionalProperties: false
      properties:
        recent_days:
          type: integer
          minimum: 0
          maximum: 365
          description: The tickets updated in these last days are imported first, newest first; 0 skips that pass. Default 90.
        include_personal_canned_responses:
          type: boolean
          description: Also import canned responses from personal folders; they become shared with the whole workspace.
        help_center_portal:
          type: integer
          minimum: 0
          description: On an account with several portals, the portal whose published articles stay published.
        old_help_center_domain:
          type: string
          maxLength: 255
          description: >-
            The old Freshdesk help center's own custom domain, for example support.acme.com (an http:// or https://
            prefix and a trailing slash are dropped; stored as the host). Its /support/ links in imported articles
            and saved replies are pointed at the new help center like the account domain's. Answers 400 when it
            is not a host name.
    ImportInput:
      type: object
      additionalProperties: false
      required: [source, domain, api_key]
      properties:
        source: {type: string, enum: [freshdesk]}
        domain: {type: string, minLength: 1, maxLength: 255, description: 'Your <account>.freshdesk.com address'}
        api_key: {type: string, minLength: 1, maxLength: 200, writeOnly: true, description: 'A Freshdesk admin''s API key (Profile settings > API key)'}
        options: {$ref: '#/components/schemas/ImportOptions'}
    ImportProgress:
      type: object
      required: [step, done, total, api_calls, updated_at]
      properties:
        step: {type: string, description: 'The importer step, for example importing tickets'}
        done: {type: integer}
        total: {type: integer, description: 0 when the step does not know its total}
        rate_limit_until: {type: string, format: date-time, description: Set while the import waits for the Freshdesk rate limit}
        api_calls: {type: integer, description: Freshdesk requests of this run so far}
        eta_seconds: {type: integer, description: The rest of the step at the pace of the last five minutes; missing when unknown}
        updated_at: {type: string, format: date-time}
    ImportPreview:
      type: object
      description: >-
        What a few reads of the account tell before anything is written. Freshdesk has no ticket count:
        tickets_outside_archive is its search total, which leaves archived tickets out, and archived
        tickets can have ids above highest_listed_ticket_id; neither is an upper bound.
      required: [domain, account_id, source, agents, companies, contacts, tickets_outside_archive, highest_listed_ticket_id, archive, canned_responses, knowledge_base, rate_limit_per_minute, api_calls, checked_at]
      properties:
        domain: {type: string}
        account_id: {type: integer}
        source: {type: string}
        agents:
          type: array
          items:
            type: object
            required: [id, name, email, active]
            properties:
              id: {type: integer}
              name: {type: string}
              email: {type: string}
              active: {type: boolean}
        companies: {type: integer}
        contacts: {type: [integer, 'null'], description: null when Freshdesk search is unavailable}
        tickets_outside_archive: {type: [integer, 'null']}
        highest_listed_ticket_id: {type: integer}
        archive: {$ref: '#/components/schemas/ImportAccess'}
        canned_responses: {$ref: '#/components/schemas/ImportAccess'}
        knowledge_base: {$ref: '#/components/schemas/ImportAccess'}
        rate_limit_per_minute: {type: integer, description: X-Ratelimit-Total; 0 when Freshdesk sent none}
        api_calls: {type: integer}
        checked_at: {type: string, format: date-time}
    ImportAccess:
      type: string
      enum: [readable, none, refused, unknown]
      description: >-
        Whether the key can read this part: none means the account has none; refused (403) for the
        archive means the report can be UNVERIFIED at best.
    ImportJob:
      type: object
      required: [id, kind, source, domain, account_source, undo_of, state, phase, options, preview, progress, status, error_code, error_message, imported_conversations, has_key, has_interim_report, has_report, cancel_requested, next_run_at, created_by, created_at, started_at, finished_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [import, undo]}
        source: {type: string, enum: [freshdesk]}
        domain: {type: string}
        account_source: {type: [string, 'null'], description: 'The Freshdesk account, freshdesk:account:<id>, known after the preview'}
        undo_of: {type: [string, 'null'], format: uuid, description: The import an undo removes}
        state:
          type: string
          enum: [previewing, previewed, queued, running, retry_wait, waiting_key, finished, failed, cancelled, discarded]
        phase: {type: string, enum: [preview, recent, full, undo]}
        options: {$ref: '#/components/schemas/ImportOptions'}
        preview:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ImportPreview'}
        progress:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ImportProgress'}
        status: {type: [string, 'null'], enum: [OK, FAILED, UNVERIFIED, null], description: The reconcile status of a finished import}
        error_code:
          type: [string, 'null']
          description: >-
            Why a job failed or waits: freshdesk_key_rejected, freshdesk_needs_admin_key,
            freshdesk_plan_no_api (the Freshdesk Free plan, or an ended trial of a higher plan, has no
            API calls), freshdesk_unavailable, import_running_elsewhere, retrying_failed_items,
            storage_cap, knowledge_base_limit, key_unavailable, no_progress or import_error.
        error_message: {type: [string, 'null']}
        imported_conversations:
          type: [integer, 'null']
          description: >-
            How many conversations of the Freshdesk account were in the workspace when the import ended
            (what an undo removes, less what the team changed since); null while it runs and for an undo.
        has_key: {type: boolean, description: The server still holds the Freshdesk API key of this job}
        has_interim_report: {type: boolean}
        has_report: {type: boolean}
        cancel_requested: {type: boolean}
        next_run_at: {type: [string, 'null'], format: date-time, description: When a job in retry_wait runs again}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    AgentRequestStatus:
      type: string
      enum: [pending, approved, failed, rejected, cancelled, expired]
    AgentRequestAccepted:
      type: object
      required: [request_id, kind, status, summary, expires_at, message]
      properties:
        request_id: {type: string, format: uuid}
        kind: {type: string, enum: [reply_draft, action]}
        status: {$ref: '#/components/schemas/AgentRequestStatus'}
        summary: {type: string, description: 'What the call does, for the person deciding'}
        expires_at: {type: string, format: date-time}
        message: {type: string}
    AgentRequest:
      type: object
      required: [id, kind, status, method, route, path, body, edited_body, approvable_by, summary, conversation_id, saved_reply, requested_by, decided_by, decided_at, reason, result_status, result, result_note, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [reply_draft, action], description: 'reply_draft: an outgoing reply a token may not send; action: any other call'}
        status: {$ref: '#/components/schemas/AgentRequestStatus'}
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
        route: {type: string, description: 'The route pattern, for example /api/v1/conversations/{id}'}
        path: {type: string, description: The concrete path that runs on approval}
        body: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: 'The JSON body of the call as the token sent it; null when it had none, in a list without detail=full, and 90 days after the decision.'}
        edited_body: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: 'A reply draft as the approver edited it (text changed, copies removed); this is what ran. Null when not edited.'}
        approvable_by: {type: string, enum: [agent, admin, owner], description: 'The lowest role whose person can approve it; a person below it gets 403 and the request keeps waiting. owner: the call changes the settings of the person who owns the token (a /me route), so only that person can approve it (403 owner_only for anyone else).'}
        summary: {type: string}
        conversation_id: {type: [string, 'null'], format: uuid}
        saved_reply:
          description: >
            For a request that edits, deletes or restores a saved reply: the reply as it was when the
            token asked (before) and as it is now (current, null once it is deleted for good), so the
            change can be shown as a difference. Only with detail=full and on a single request; null otherwise.
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, before, current, restores]
              properties:
                id: {type: string, format: uuid}
                before:
                  oneOf:
                    - {type: 'null'}
                    - {$ref: '#/components/schemas/SavedReplyText'}
                restores:
                  description: For a request that restores a version, that version's number, title and text as they were when the token asked; null otherwise.
                  oneOf:
                    - {type: 'null'}
                    - type: object
                      required: [version, title, body]
                      properties:
                        version: {type: integer}
                        title: {type: string}
                        body: {type: string}
                current:
                  oneOf:
                    - {type: 'null'}
                    - type: object
                      required: [title, body, updated_at, deleted_at]
                      properties:
                        title: {type: string}
                        body: {type: string}
                        updated_at: {type: string, format: date-time}
                        deleted_at: {type: [string, 'null'], format: date-time}
        requested_by:
          type: object
          required: [token_id, token_label, token_scope, token_permissions, token_revoked, agent_id, agent_name]
          properties:
            token_id: {type: [string, 'null'], format: uuid}
            token_label: {type: string}
            token_scope: {$ref: '#/components/schemas/TokenScope'}
            token_permissions:
              type: array
              items: {type: string}
              description: What the token held when it asked (resource:action); empty for a request older than permissions.
            token_revoked: {type: boolean, description: A request of a revoked token can only be rejected.}
            agent_id: {type: [string, 'null'], format: uuid}
            agent_name: {type: [string, 'null'], description: The person who owns the token}
        decided_by:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [agent_id, name]
              properties:
                agent_id: {type: [string, 'null'], format: uuid}
                name: {type: string}
        decided_at: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null']}
        result_status: {type: [integer, 'null'], description: HTTP status the approved call answered}
        result: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: 'The JSON answer of the approved call, at most 64 KiB; null when withheld (see result_note) or none.'}
        result_note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    PublicConfig:
      type: object
      required: [app_origin, workspace_hosts, cloud_sign_in, billing, signup, limits, product_analytics, ai, autofix, features]
      properties:
        features:
          type: object
          description: >-
            Which features of the server run here: their settings are complete and the operator has not
            switched them off (operator console → Features, `features.<name>`). The web app shows only
            those. A route of a feature switched off answers 409 `feature_off`; what the feature holds
            (connections, fixes, subscriptions, queued replies) stays and is used again once it is on.
          required: [gmail, microsoft, autofix, ai_server, hosted_mail, cloud_sign_in, billing, signup]
          properties:
            gmail: {$ref: '#/components/schemas/PublicFeature'}
            microsoft: {$ref: '#/components/schemas/PublicFeature'}
            autofix: {$ref: '#/components/schemas/PublicFeature'}
            ai_server: {$ref: '#/components/schemas/PublicFeature'}
            hosted_mail: {$ref: '#/components/schemas/PublicFeature'}
            cloud_sign_in: {$ref: '#/components/schemas/PublicFeature'}
            billing: {$ref: '#/components/schemas/PublicFeature'}
            signup: {$ref: '#/components/schemas/PublicFeature'}
        workspace_hosts:
          type: boolean
          description: >-
            True when each workspace's desk runs on its own host `<slug>.<HELP_CENTER_DOMAIN>`: a browser
            signed in on `app_origin` continues there (`continue_url` of a sign-in).
        app_origin:
          type: string
          format: uri
          description: >-
            `APP_ORIGIN`: where a person finds their workspace and a new team signs up. With
            `HELP_CENTER_DOMAIN`, each workspace's desk runs on its own host `<slug>.<HELP_CENTER_DOMAIN>`,
            and this is the address a page there links to for everything else.
        autofix:
          type: object
          required: [available, missing_settings, off_reason]
          properties:
            available: {type: boolean, description: 'The operator set up the server''s GitHub App (operator console → Mailboxes & GitHub, github.*) and has not switched Autofix off, so Autofix can be used; the web app hides it otherwise.'}
            missing_settings: {type: array, maxItems: 0, items: {type: string}, deprecated: true, description: 'Always empty: a public answer never names the server''s settings (the operator console and `collie config features` do). Read off_reason.'}
            off_reason: {$ref: '#/components/schemas/FeatureOffReason'}
        ai:
          type: object
          required: [server_provider]
          properties:
            server_provider: {type: boolean, description: 'True when the operator configured an AI provider for every workspace (operator console → AI: ai.server.*).'}
        product_analytics:
          type: object
          description: >
            Where the web app reports which screens and buttons agents use. On by default on the
            cloud and self-hosted; `DISABLE_TELEMETRY` or `DO_NOT_TRACK` (and a development build)
            answer `enabled: false`, and then the web app never loads the analytics library.
          required: [enabled, key, host, realm]
          properties:
            enabled: {type: boolean}
            realm: {type: [string, 'null'], enum: [cloud, self-hosted, null], description: Carried on every event so cloud and self-hosted use are told apart.}
            key: {type: [string, 'null'], description: Public PostHog project key; it can add events but not read them.}
            host: {type: [string, 'null'], description: PostHog ingestion host.}
        version: {type: string, description: 'The running build: a release tag such as `v0.0.1`, `edge-<commit>` for a main build, or `dev`.'}
        limits:
          type: object
          required: [outgoing_attachments_bytes, outgoing_attachments_files]
          properties:
            outgoing_attachments_bytes: {type: integer, description: Most raw bytes of files one reply or note can carry in total.}
            outgoing_attachments_files: {type: integer, description: Most files one reply or note can carry.}
        cloud_sign_in:
          type: object
          required: [enabled, publishable_key]
          properties:
            enabled: {type: boolean}
            publishable_key: {type: [string, 'null']}
        billing:
          type: object
          required: [enabled, switched_off]
          properties:
            enabled: {type: boolean, description: False on self-hosted instances; the billing routes answer 404.}
            switched_off:
              type: boolean
              description: >-
                Billing is set up but the operator switched it off: nobody is billed or locked and nothing is
                sold (checkout answers 409 `feature_off`, `checkout_plans` is empty), but `GET /api/v1/billing`
                and the billing portal stay open, so a workspace with a subscription can still see and cancel it.
        signup:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean, description: True only where `POST /api/v1/auth/cloud/signup` exists (cloud sign-in and billing both configured).}
    FeatureOffReason:
      type: [string, 'null']
      enum: [not_set_up, switched_off, null]
      description: 'Why the feature is not offered: `not_set_up` (the server misses its settings), `switched_off` (the operator switched it off; what it holds stays). Null while it is offered.'
    PublicFeature:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    AISlotName: {type: string, enum: [triage, draft, chat, intake], description: '`chat`: the AI that answers end users in the help center''s chat (docs/user/ai-chat.md); intake decides whether a chat message opens a conversation, joins one, or is not a request; it runs only on chat channels.'}
    AILevel: {type: string, enum: ['off', suggest, auto], description: 'What a feature does by itself: off (only when someone asks), suggest (it writes a suggestion or a draft for a person), auto (triage applies its auto_parts; intake on a chat channel''s scope decides). Drafts never reach auto.'}
    AISourceClass: {type: string, pattern: '^(images|contact_profile|external:[a-z0-9_]{1,40})$'}
    AISourceConsent:
      type: object
      required: [source_class, consented_by, consented_at]
      properties:
        source_class: {$ref: '#/components/schemas/AISourceClass'}
        consented_by: {type: [string, 'null'], format: uuid}
        consented_at: {type: string, format: date-time}
    IntakeOptions:
      type: object
      additionalProperties: false
      description: 'Intake''s settings on a chat channel''s scope; a field left out keeps its default. At most 16 KiB.'
      properties:
        create_threshold: {type: number, minimum: 0.5, maximum: 0.99, description: 'Confidence to open a conversation by itself. Default 0.85.'}
        attach_threshold: {type: number, minimum: 0.5, maximum: 0.99, description: 'Confidence to add a message to an open conversation by itself; a wrong one hides a new request. Default 0.90.'}
        ignore_threshold: {type: number, minimum: 0.5, maximum: 0.99, description: 'Confidence to set a message aside as not a request. Default 0.95.'}
        attach_requires_single_candidate: {type: boolean, description: 'Never attach by itself while the customer has two or more open conversations it hesitates between. Default true.'}
        auto_max_age_seconds: {type: integer, minimum: 60, maximum: 86400, description: 'A batch older than this when decided is only suggested. Default 7200.'}
        reopen_window_days: {type: integer, minimum: 0, maximum: 90, description: 'How long after its last change a resolved conversation is a candidate. Default 7.'}
        sources:
          type: object
          description: 'Context sources on or off: incoming (always on), thread_window, open_conversations, corrections (off by default), contact, kb, images. A source left out keeps its default; one that needs a consent (images, contact) is left out without it.'
          additionalProperties: {type: boolean}
        instructions: {type: string, maxLength: 4000, description: 'The channel''s own words added to the prompt.'}
        redact_keywords: {type: array, maxItems: 100, items: {type: string, minLength: 1, maxLength: 80}, description: 'Words that mark a secret in the channel''s language (a password, a code).'}
        contact_labels:
          type: object
          additionalProperties: false
          description: 'Words of the channel''s language that name a bank account (account) or an identity document (id) before its number; the number is masked before AI reads it. Removing one needs the approval raising AI needs.'
          properties:
            account: {type: array, maxItems: 50, items: {type: string, minLength: 1, maxLength: 80}}
            id: {type: array, maxItems: 50, items: {type: string, minLength: 1, maxLength: 80}}
        redact_patterns:
          type: array
          maxItems: 20
          description: 'The channel''s own shapes of an identifier no word names (a national ID number, a phone number written without its prefix), in RE2 syntax, each masked as its kind before AI reads a message. A pattern that matches the empty string, is too large or does not compile is refused. Removing one needs the approval raising AI needs.'
          items:
            type: object
            additionalProperties: false
            required: [pattern, mask]
            properties:
              pattern: {type: string, minLength: 1, maxLength: 200}
              mask: {type: string, enum: [phone, id_number, account_number, hidden]}
        gate_override:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [create, attach, ignore]}
          description: 'Actions AI may take on its own before readiness shows it is ready (an admin''s call); needs gate_override_reason. Adding one needs the approval raising AI needs.'
        gate_override_reason: {type: string, maxLength: 500, description: 'Why the gates in gate_override were opened by hand.'}
    AIChannelLevel:
      type: object
      required: [channel_id, channel_name, scope, slot, level, effective_level, off_reason, options, updated_by, updated_at]
      properties:
        channel_id: {type: string, format: uuid}
        channel_name: {type: string}
        scope: {type: string, description: "'' for the whole channel, or a scope of its type."}
        slot: {$ref: '#/components/schemas/AISlotName'}
        level: {$ref: '#/components/schemas/AILevel'}
        effective_level: {$ref: '#/components/schemas/AILevel'}
        off_reason: {type: [string, 'null'], enum: [workspace_off, null], description: 'workspace_off: the workspace has not turned the feature on, so nothing runs.'}
        options: {anyOf: [{$ref: '#/components/schemas/IntakeOptions'}, {type: 'null'}], description: Intake only.}
        updated_by: {type: [string, 'null'], format: uuid}
        updated_at: {type: string, format: date-time}
    ChannelAI:
      type: object
      required: [channel_id, scopes]
      properties:
        channel_id: {type: string, format: uuid}
        scopes:
          type: array
          description: "The whole channel ('') first, then each scope of its type."
          items:
            type: object
            required: [scope, slots]
            properties:
              scope: {type: string}
              slots:
                type: array
                description: 'The features the scope has: triage and draft everywhere, intake only on a chat type''s intake scopes.'
                items:
                  type: object
                  required: [slot, level, effective_level, source, off_reason, options]
                  properties:
                    slot: {$ref: '#/components/schemas/AISlotName'}
                    level: {anyOf: [{$ref: '#/components/schemas/AILevel'}, {type: 'null'}], description: 'This scope''s own level; null follows the channel, then the workspace.'}
                    effective_level: {$ref: '#/components/schemas/AILevel'}
                    source: {type: string, enum: [scope, channel, workspace], description: Where the level that runs is set.}
                    off_reason: {type: [string, 'null'], enum: [workspace_off, null]}
                    options: {anyOf: [{$ref: '#/components/schemas/IntakeOptions'}, {type: 'null'}], description: 'Intake only, with the defaults filled in.'}
    ChatItem:
      type: object
      required: [id, thread_id, direction, role, sender, contact_id, agent_id, is_other_customer, body, external_id, quote_external_id, message_id, disposition, disposition_reason, occurred_at, files, linked, link_reason]
      properties:
        id: {type: string, format: uuid}
        thread_id: {type: string, format: uuid}
        direction: {type: string, enum: [in, out]}
        role: {type: string, enum: [customer, staff, bot], description: 'bot: the channel''s own message (a notice).'}
        sender: {$ref: '#/components/schemas/ChatSender'}
        contact_id: {type: [string, 'null'], format: uuid}
        agent_id: {type: [string, 'null'], format: uuid}
        is_other_customer: {type: boolean, description: 'On a conversation''s chat: a customer who is not the conversation''s.'}
        body: {type: string}
        external_id: {type: [string, 'null'], description: Its id on the channel.}
        quote_external_id: {type: [string, 'null'], description: The id on the channel of the message it answers.}
        message_id: {type: [string, 'null'], format: uuid, description: The conversation message it became.}
        disposition: {type: string, enum: [unresolved, gathering, conversation, pending_review, not_request, staff, bot, archived]}
        disposition_reason: {type: [string, 'null']}
        occurred_at: {type: string, format: date-time}
        files:
          type: array
          description: 'The files of an item that came in, as they were fetched; the conversation message it became has them as attachments.'
          items:
            type: object
            required: [name, content_type, status, size, error]
            properties:
              name: {type: string}
              content_type: {type: string}
              status: {type: string}
              size: {type: [integer, 'null']}
              error: {type: [string, 'null']}
        linked: {type: boolean, description: 'On a conversation''s chat: the item is part of this conversation.'}
        link_reason: {type: [string, 'null'], enum: [opened, gathered, command, ai, agent, reopen, reply, import, null]}
    ChatPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ChatItem'}}
        next_cursor: {type: [string, 'null'], description: The cursor of the next page; null on the last.}
    ChatThread:
      type: object
      required: [id, channel_id, kind, external_id, name, contact_id, opens_conversations, last_item_at, last_item]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        kind: {type: string, enum: [direct, group]}
        external_id: {type: string}
        name: {type: [string, 'null']}
        contact_id: {type: [string, 'null'], format: uuid, description: A one-to-one chat's customer.}
        opens_conversations: {type: boolean}
        last_item_at: {type: [string, 'null'], format: date-time}
        last_item: {anyOf: [{$ref: '#/components/schemas/ChatItem'}, {type: 'null'}]}
    ChatThreadPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ChatThread'}}
        next_cursor: {type: [string, 'null']}
    IntakeGathering:
      type: object
      required: [id, channel_id, scope, thread_id, lane_key, contact_id, state, review_reason, rules, conversation_id, decided_by, decided_at, decided_by_agent_id,
        ignore_reason, fallback, opened_at, closed_at, decide_by, requeued_at, requeued_by_agent_id, item_count, sender, place, preview, suggestion]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        scope: {type: string}
        thread_id: {type: [string, 'null'], format: uuid}
        lane_key: {type: string, description: 'The place and sender whose cards are decided one after the other.'}
        contact_id: {type: [string, 'null'], format: uuid}
        state: {type: string, enum: [deciding, review, created, attached, ignored, applied, cancelled], description: 'applied: the rules decided, AI only suggests.'}
        review_reason: {type: [string, 'null'], enum: [no_command, ai_unsure, ai_unavailable, too_old, credential, target_changed, lane_blocked, requeued, gate_closed, null]}
        rules:
          type: object
          required: [action, rule, basis, target_conversation_id]
          description: What the channel's rules decided when it closed; what applies when AI does not decide in time.
          properties:
            action: {type: string, enum: [create, attach, review, archive]}
            rule: {type: string}
            basis: {type: string, enum: [match, default], description: 'match: the batch carried evidence (a command, a reply to a message of a conversation); default: what the scope does without.'}
            target_conversation_id: {type: [string, 'null'], format: uuid}
        conversation_id: {type: [string, 'null'], format: uuid, description: The conversation it opened or joined.}
        decided_by: {type: [string, 'null'], enum: [rules, ai, agent, null]}
        decided_at: {type: [string, 'null'], format: date-time}
        decided_by_agent_id: {type: [string, 'null'], format: uuid}
        ignore_reason: {anyOf: [{$ref: '#/components/schemas/IntakeIgnoreReason'}, {type: 'null'}], description: 'Why a person set it aside, when they said.'}
        fallback: {type: boolean, description: The rules decided because AI did not in time or failed.}
        opened_at: {type: string, format: date-time}
        closed_at: {type: string, format: date-time}
        decide_by: {type: [string, 'null'], format: date-time, description: Until when AI may decide it.}
        requeued_at: {type: [string, 'null'], format: date-time}
        requeued_by_agent_id: {type: [string, 'null'], format: uuid}
        item_count: {type: integer}
        sender: {$ref: '#/components/schemas/ChatSender'}
        place:
          type: [object, 'null']
          required: [kind, name]
          description: 'The chat place it was said in: a one-to-one chat or a group, with its name on the channel.'
          properties:
            kind: {type: string, enum: [direct, group]}
            name: {type: [string, 'null']}
        preview: {type: string, maxLength: 280, description: 'The beginning of what the customer wrote first.'}
        suggestion:
          anyOf: [{$ref: '#/components/schemas/IntakeSuggestion'}, {type: 'null'}]
          description: 'What AI suggested and did not do, the newest, unless a person decided since. While the card waits (deciding or review), follow it with follows_decision_id; once the rules applied it (applied), it only says what AI would have done.'
    IntakeSuggestion:
      type: object
      required: [decision_id, action, target_conversation_id, target_subject, target_status, runner_up_conversation_id, runner_up_subject, runner_up_confidence,
        confidence, command, subject, reply_kind, ignore_reason, reason, not_applied_reason, created_at]
      properties:
        decision_id: {type: string, format: uuid}
        action: {type: string, enum: [create, attach, ignore]}
        target_conversation_id: {type: [string, 'null'], format: uuid, description: With attach.}
        target_subject: {type: [string, 'null']}
        target_status: {anyOf: [{$ref: '#/components/schemas/ConversationStatus'}, {type: 'null'}], description: 'resolved or closed: following it reopens the conversation, except a resolved one when reply_kind is acknowledgement.'}
        runner_up_conversation_id: {type: [string, 'null'], format: uuid, description: The second most likely conversation.}
        runner_up_subject: {type: [string, 'null']}
        runner_up_confidence: {type: [number, 'null']}
        confidence: {type: [number, 'null']}
        command: {type: [string, 'null'], description: 'With create: the command whose tags and priority it opens with.'}
        subject: {type: [string, 'null'], description: With create.}
        reply_kind: {type: [string, 'null'], enum: [substantive, acknowledgement, null], description: 'acknowledgement: the customer only thanked or acknowledged.'}
        ignore_reason: {anyOf: [{$ref: '#/components/schemas/IntakeIgnoreReason'}, {type: 'null'}]}
        reason: {type: [string, 'null']}
        not_applied_reason: {type: string, enum: [level_suggest, below_threshold, too_old, credential, person_first, target_changed, lane_blocked, gate_closed, limit, error,
            several_candidates, no_content],
          description: 'Why AI did not do it: level_suggest (the scope only suggests), gate_closed (AI may not act on its own yet), below_threshold, too_old, credential (the messages hold a credential), target_changed, person_first, limit, error, several_candidates (the customer has two or more conversations it could join), no_content (nothing it could read).'}
        created_at: {type: string, format: date-time}
    IntakeCounts:
      type: object
      additionalProperties: false
      required: [labels, correct, severe, light]
      properties:
        labels: {type: integer, minimum: 0}
        correct: {type: integer, minimum: 0}
        severe: {type: integer, minimum: 0, description: 'attach: a new request merged into an old conversation; ignore: a request set aside; create: none.'}
        light: {type: integer, minimum: 0}
    IntakeEvaluationInput:
      type: object
      additionalProperties: false
      required: [scope, model, prompt_version, dataset_sha256, counts]
      properties:
        scope: {type: string, pattern: '^[a-z_]{1,40}$'}
        model: {type: string, minLength: 1, maxLength: 200}
        prompt_version: {type: string, minLength: 1, maxLength: 80}
        dataset_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        counts:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            create: {$ref: '#/components/schemas/IntakeCounts'}
            attach: {$ref: '#/components/schemas/IntakeCounts'}
            ignore: {$ref: '#/components/schemas/IntakeCounts'}
    IntakeEvaluation:
      type: object
      required: [id, channel_id, scope, model, prompt_version, dataset_sha256, counts, run_by_agent_id, via_token, created_at]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        scope: {type: string}
        model: {type: string}
        prompt_version: {type: string}
        dataset_sha256: {type: string}
        counts: {type: object, additionalProperties: {$ref: '#/components/schemas/IntakeCounts'}}
        run_by_agent_id: {type: [string, 'null'], format: uuid}
        via_token: {type: boolean}
        created_at: {type: string, format: date-time}
    IntakeLabelCounts:
      type: object
      required: [labels, correct, wrong, severe]
      properties:
        labels: {type: integer}
        correct: {type: integer}
        wrong: {type: integer}
        severe: {type: integer}
    IntakeReadiness:
      type: object
      required: [channel_id, scope, model, prompt_version, actions, applied, estimate]
      properties:
        channel_id: {type: string, format: uuid}
        scope: {type: string}
        model: {type: string, description: 'The model intake runs; empty while intake is off (evaluations then count for nothing).'}
        prompt_version: {type: string}
        actions:
          type: array
          items:
            type: object
            required: [action, gate, labels, correct, wrong, severe, needed, accuracy_needed, missing, live, evaluation]
            properties:
              action: {type: string, enum: [create, attach, ignore]}
              gate: {type: string, enum: [open, closed, overridden], description: 'open or overridden: AI takes the action on its own at auto; closed: it stays a suggestion.'}
              labels: {type: integer}
              correct: {type: integer}
              wrong: {type: integer}
              severe: {type: integer}
              needed: {type: integer, description: Labels the action needs.}
              accuracy_needed: {type: number}
              missing: {type: array, items: {type: string, enum: [labels, accuracy, severe, junk]}, description: 'What keeps the gate closed: too few labels, too many wrong, a severe error, or (create) more than one conversation opened for chatter in a week.'}
              live: {$ref: '#/components/schemas/IntakeLabelCounts'}
              evaluation:
                anyOf:
                  - allOf:
                      - {$ref: '#/components/schemas/IntakeLabelCounts'}
                      - {type: object, required: [run_at], properties: {run_at: {type: string, format: date-time}}}
                  - {type: 'null'}
        applied:
          type: object
          required: [decisions, corrected, correction_rate]
          description: What AI did on its own in the last 30 days, and how much people corrected.
          properties:
            decisions: {type: integer}
            corrected: {type: integer}
            correction_rate: {type: [number, 'null']}
        estimate:
          type: object
          required: [days, cards, ai_calls, cost_per_call]
          description: 'What the last days say: cards closed, how many AI would read at auto (the rules decided them only by default), and the average cost of a call.'
          properties:
            days: {type: integer}
            cards: {type: integer}
            ai_calls: {type: integer}
            cost_per_call:
              type: object
              required: [micro_usd, provider_cost]
              properties:
                micro_usd: {type: [integer, 'null'], description: 'On the server''s provider: its price in millionths of a dollar.'}
                provider_cost: {type: [number, 'null'], description: 'What the provider reported, in its own unit (OpenRouter credits).'}
    IntakeIgnoreReason: {type: string, enum: [chat, handled_in_chat, duplicate, other], description: 'chat: not a request; handled_in_chat: the team answered it in the chat; duplicate: said in another card or conversation already.'}
    IntakeCandidate:
      type: object
      required: [conversation_id, subject, status, contact_id, contact_name, channel_id, updated_at, resolved]
      description: 'A conversation a card may join without the reply going to someone else: in a group, an open or pending conversation of the same place active in the last 72 hours; in a one-to-one chat, the same customer''s on the same channel; then the ones resolved within the reopen window (7 days unless the channel says otherwise).'
      properties:
        conversation_id: {type: string, format: uuid}
        subject: {type: string}
        status: {$ref: '#/components/schemas/ConversationStatus'}
        contact_id: {type: string, format: uuid}
        contact_name: {type: string}
        channel_id: {type: [string, 'null'], format: uuid}
        updated_at: {type: string, format: date-time}
        resolved: {type: boolean, description: Joining it reopens it.}
    IntakeSummary:
      type: object
      required: [available, waiting, deciding, scopes]
      properties:
        available: {type: boolean, description: The workspace has a chat channel whose type collects messages for intake.}
        waiting: {type: integer, description: Cards that wait for a person.}
        deciding: {type: integer, description: Cards that wait for AI until their time to be decided.}
        scopes:
          type: array
          items:
            type: object
            required: [channel_id, channel_name, scope]
            properties:
              channel_id: {type: string, format: uuid}
              channel_name: {type: string}
              scope: {type: string}
    ChatSender:
      type: object
      required: [kind, value, name]
      properties:
        kind: {type: [string, 'null']}
        value: {type: [string, 'null']}
        name: {type: [string, 'null']}
    IntakeDecision:
      type: object
      required: [id, decider, basis, action, target_conversation_id, runner_up_conversation_id, runner_up_confidence, command, subject, reply_kind, confidence, reason,
        applied, ignore_reason, not_applied_reason, fallback, corrects_decision_id, follows_decision_id, error_code, model, agent_id, via_token, created_at]
      properties:
        id: {type: string, format: uuid}
        decider: {type: string, enum: [ai, agent]}
        basis: {type: string, enum: [model, person]}
        action: {type: string, enum: [create, attach, ignore, review]}
        target_conversation_id: {type: [string, 'null'], format: uuid}
        runner_up_conversation_id: {type: [string, 'null'], format: uuid}
        runner_up_confidence: {type: [number, 'null']}
        command: {type: [string, 'null']}
        subject: {type: [string, 'null']}
        reply_kind: {type: [string, 'null'], enum: [substantive, acknowledgement, null]}
        confidence: {type: [number, 'null']}
        reason: {type: [string, 'null'], description: "AI's reason; erased 90 days after."}
        applied: {type: boolean}
        ignore_reason: {anyOf: [{$ref: '#/components/schemas/IntakeIgnoreReason'}, {type: 'null'}], description: 'With ignore: why it was set aside, when the decider said.'}
        not_applied_reason: {type: [string, 'null']}
        fallback: {type: boolean}
        corrects_decision_id: {type: [string, 'null'], format: uuid, description: 'The AI decision a person undid or decided otherwise than.'}
        follows_decision_id: {type: [string, 'null'], format: uuid, description: 'The AI suggestion a person decided as.'}
        error_code: {type: [string, 'null'], description: 'What failed when AI''s answer was not a decision: target_invalid (it named a conversation it was not offered), invalid_answer, no_subject.'}
        model: {type: [string, 'null']}
        agent_id: {type: [string, 'null'], format: uuid}
        via_token: {type: boolean}
        created_at: {type: string, format: date-time}
    IntakeGatheringDetail:
      allOf:
        - {$ref: '#/components/schemas/IntakeGathering'}
        - type: object
          required: [items, decisions, candidates, commands]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ChatItem'}}
            decisions: {type: array, items: {$ref: '#/components/schemas/IntakeDecision'}}
            candidates: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/IntakeCandidate'}, description: 'Where it may be added, the rules'' target first, then the newest; empty once it is decided.'}
            commands: {type: array, items: {type: string}, description: 'The channel''s commands that open a request, for create.'}
    IntakeGatheringPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/IntakeGathering'}}
        next_cursor: {type: [string, 'null']}
    IntakeDecideInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [create, attach, ignore]}
        conversation_id: {type: string, format: uuid, description: With attach.}
        command: {type: string, minLength: 1, maxLength: 40, description: 'With create: a command of the channel that opens a request, for its tags and priority.'}
        subject: {type: string, minLength: 1, maxLength: 200, description: With create.}
        ignore_reason: {$ref: '#/components/schemas/IntakeIgnoreReason'}
        follows_decision_id: {type: string, format: uuid, description: 'The AI suggestion of this card the decision follows (Follow suggestion); its reply_kind comes with it. Another card''s, or no AI decision, is refused.'}
    IntakeStats:
      type: object
      required: [days, gatherings, by_state, decided_by, fallback, ai_decisions, ai_corrected]
      properties:
        days: {type: integer}
        gatherings: {type: integer}
        by_state: {type: object, additionalProperties: {type: integer}}
        decided_by: {type: object, additionalProperties: {type: integer}}
        fallback: {type: integer}
        ai_decisions: {type: integer}
        ai_corrected: {type: integer, description: "AI's decisions a person changed afterwards."}
    MessageMoveInput:
      type: object
      additionalProperties: false
      required: [message_ids, to]
      properties:
        message_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}, description: Customer messages of this conversation.}
        to:
          type: object
          additionalProperties: false
          description: 'Exactly one of conversation_id, new or queue.'
          properties:
            conversation_id: {type: string, format: uuid}
            new:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                subject: {type: string, minLength: 1, maxLength: 200}
            queue: {type: boolean, enum: [true]}
        close_source: {type: boolean, description: 'With to.conversation_id: every customer message of this conversation goes, and it closes pointing there.'}
    MessageMove:
      type: object
      required: [id, message_ids, from_conversation_id, to_conversation_id, created_conversation, closed_source, gathering_id, decision_id, moved_by_agent_id,
        via_token, moved_at, undone_at, undone_by_agent_id, undoable]
      properties:
        id: {type: string, format: uuid}
        message_ids: {type: array, items: {type: string, format: uuid}}
        from_conversation_id: {type: string, format: uuid}
        to_conversation_id: {type: [string, 'null'], format: uuid, description: Null for a move back to the intake queue.}
        created_conversation: {type: boolean, description: The move opened to_conversation_id (a split).}
        closed_source: {type: boolean, description: The move took every customer message of the source and closed it.}
        gathering_id: {type: [string, 'null'], format: uuid, description: The intake card a move to the queue made.}
        decision_id: {type: [string, 'null'], format: uuid, description: 'The person''s intake decision it recorded, when it corrected what AI had applied.'}
        moved_by_agent_id: {type: [string, 'null'], format: uuid}
        via_token: {type: boolean, description: An AI agent moved them with a token.}
        moved_at: {type: string, format: date-time}
        undone_at: {type: [string, 'null'], format: date-time}
        undone_by_agent_id: {type: [string, 'null'], format: uuid}
        undoable: {type: boolean, description: 'Not undone, the newest move of each of its messages, and (to the queue) its card not decided since.'}
    MessageMoveResult:
      type: object
      required: [move, warnings]
      properties:
        move: {$ref: '#/components/schemas/MessageMove'}
        warnings:
          type: array
          items: {type: string, enum: [other_contact, other_channel]}
          description: 'other_contact: a message now sits in a conversation of another contact, whose replies go to that contact; other_channel: a message came through another channel than the conversation''s.'
    MessageMovePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MessageMove'}}
    ConversationIntake:
      type: object
      required: [messages, gatherings]
      properties:
        messages:
          type: array
          items:
            type: object
            required: [message_id, decision_basis, decision_rule, gathering_id]
            properties:
              message_id: {type: string, format: uuid}
              decision_basis: {type: [string, 'null'], enum: [match, default, person, model, null]}
              decision_rule: {type: [string, 'null']}
              gathering_id: {type: [string, 'null'], format: uuid}
        gatherings: {type: array, items: {$ref: '#/components/schemas/IntakeGatheringDetail'}}
    ChannelAIInput:
      type: object
      additionalProperties: false
      required: [scope, level]
      properties:
        scope: {type: string, pattern: '^[a-z_]{0,40}$', description: "'' for the whole channel, or one of its type's scopes."}
        level: {anyOf: [{$ref: '#/components/schemas/AILevel'}, {type: 'null'}], description: 'null removes the scope''s own level.'}
        options: {$ref: '#/components/schemas/IntakeOptions'}
    AIProviderKind: {type: string, enum: [anthropic, openai_compatible]}
    AIProvider:
      type: object
      required: [id, kind, label, base_url, auth_kind, key_hint, models, check_status, check_error_code, checked_at, created_by, created_at, updated_at, used_by, routing]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/AIProviderKind'}
        label: {type: string}
        base_url: {type: [string, 'null'], description: Only an OpenAI-compatible provider has one.}
        auth_kind: {type: string, enum: [api_key, none]}
        key_hint: {type: [string, 'null'], description: The key's last four characters; the key itself is never returned.}
        models: {type: array, items: {type: string}, description: The first is the one a check uses.}
        check_status: {type: string, enum: [ok, failing]}
        check_error_code: {type: [string, 'null'], description: 'Why the last check failed: auth, permission, model_not_found, bad_request, too_large, rate_limited, overloaded, quota_exhausted, timeout, unavailable, blocked_address, invalid_response.'}
        checked_at: {type: string, format: date-time}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        used_by: {type: array, items: {$ref: '#/components/schemas/AISlotName'}, description: 'The features set to this provider, on or off.'}
        routing: {anyOf: [{$ref: '#/components/schemas/AIProviderRouting'}, {type: 'null'}], description: 'OpenRouter''s routing by data policy; null on another server, which has none.'}
    AIProviderRouting:
      type: object
      additionalProperties: false
      required: [data_collection, zdr]
      description: >
        How OpenRouter picks the provider that serves each request (https://openrouter.ai/docs/features/provider-routing).
        data_collection deny keeps requests off providers that store or may train on what they are sent;
        zdr keeps them on providers with zero data retention. A model no such provider serves fails its check.
      properties:
        data_collection: {type: string, enum: [allow, deny]}
        zdr: {type: boolean}
    AISlot:
      type: object
      required: [slot, source, provider_id, model, fallback_model, effort, enabled, default_level, automatic, auto_parts, active, off_reason, consented_by, consented_at, updated_by, updated_at, monthly_cap_micro_usd]
      properties:
        slot: {$ref: '#/components/schemas/AISlotName'}
        monthly_cap_micro_usd: {type: [integer, 'null'], description: 'AI chat only: the most it may spend a UTC calendar month, in millionths of a US dollar, on the workspace''s own provider or a server without plan limits; null is no limit. The cloud''s own provider has its plan''s limits.'}
        source: {type: string, enum: [server, provider, none]}
        provider_id: {type: [string, 'null'], format: uuid}
        model: {type: [string, 'null']}
        fallback_model: {type: [string, 'null'], description: 'Intake only: the same provider''s model a request goes to when model fails (timeout, rate limit, provider busy or down, model gone) or answers what cannot be read.'}
        effort: {type: string, enum: [low, medium, high]}
        enabled: {type: boolean}
        default_level: {$ref: '#/components/schemas/AILevel'}
        automatic: {type: boolean, deprecated: true, description: 'Read from default_level for older clients: triage auto, drafts suggest.'}
        auto_parts: {type: array, items: {type: string, enum: [tags, priority, assignee]}, description: 'Triage only: what applies by itself.'}
        active: {type: boolean, description: 'On, and its provider and model are still there: the feature runs.'}
        off_reason: {type: [string, 'null'], enum: [server_provider_missing, server_provider_off, model_not_offered, null], description: 'Why a feature that is on cannot run. `server_provider_off`: the operator switched the server''s provider off; it runs again once it is on.'}
        consented_by: {type: [string, 'null'], format: uuid, description: Who agreed that this feature's data goes to its current provider.}
        consented_at: {type: [string, 'null'], format: date-time}
        updated_by: {type: [string, 'null'], format: uuid}
        updated_at: {type: [string, 'null'], format: date-time}
    AIEvent:
      type: object
      required: [id, kind, actor_agent_id, actor_name, via_token, provider_id, provider_label, slot, detail, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [provider_added, provider_changed, provider_key_changed, provider_removed, slot_changed, automatic_limits_changed, chat_deleted, channel_level_changed, source_consent_changed]}
        actor_agent_id: {type: [string, 'null'], format: uuid}
        actor_name: {type: [string, 'null']}
        via_token: {type: boolean, description: True when an agent token made the change.}
        provider_id: {type: [string, 'null'], format: uuid}
        provider_label: {type: [string, 'null'], description: The provider's name at the time; kept after it is deleted.}
        slot: {anyOf: [{$ref: '#/components/schemas/AISlotName'}, {type: 'null'}]}
        detail: {type: object, additionalProperties: true, description: 'What changed: from and to for a feature, from_hint and to_hint for a key, turned_off for a deleted provider; channel_id, channel_name, scope, slot, before, after, options_changed (and reason recipient_changed when the server lowered it) for a channel''s level; source_class and consented for a source consent. Never a key.'}
        created_at: {type: string, format: date-time}
    AIAutomaticLimits:
      type: object
      required: [per_day, per_minute, used_today, paused_until, draft_per_day, drafts_today, drafts_paused_until, drafts_reserved_until, intake_per_day, intake_today, intake_paused_until]
      properties:
        per_day: {type: integer}
        per_minute: {type: integer}
        used_today: {type: integer, description: 'Automatic tasks that started today (UTC). Tasks count, not calls, so a retry uses no more.'}
        paused_until: {type: [string, 'null'], format: date-time, description: 'When today''s limit is used up: the next UTC midnight.'}
        draft_per_day: {type: integer, description: 'Drafts written by themselves in a UTC day, counted inside per_day. Each conversation gets at most 5 in 24 hours.'}
        drafts_today: {type: integer}
        drafts_paused_until: {type: [string, 'null'], format: date-time, description: 'When today''s automatic drafts (or all automatic runs) are used up: the next UTC midnight.'}
        drafts_reserved_until: {type: [string, 'null'], format: date-time, description: 'When automatic drafts spent half of this month''s allowance of the server''s provider: the next month. The other half stays for drafts people ask for and for triage.'}
        intake_per_day: {type: integer, description: 'Intake decisions in a UTC day, counted inside per_day, so a busy group cannot spend the day''s triage and drafts.'}
        intake_today: {type: integer}
        intake_paused_until: {type: [string, 'null'], format: date-time, description: 'When today''s intake decisions (or all automatic runs) are used up: the next UTC midnight.'}
    HelpChatWidgetConfig:
      type: object
      required: [name, greeting, suggestions, brand]
      properties:
        name: {type: string}
        greeting: {type: string}
        suggestions: {type: array, items: {type: string}}
        brand:
          description: 'The help center''s brand accent (#rrggbb) and the color on it; null when its theme sets no color (the button is ink #171717).'
          oneOf:
            - type: 'null'
            - type: object
              required: [accent, accent_ink]
              properties:
                accent: {type: string, pattern: '^#[0-9a-f]{6}$'}
                accent_ink: {type: string, pattern: '^#[0-9a-f]{6}$'}
    HelpChatEvent:
      type: object
      required: [type]
      description: 'One line of an answer''s stream. `turn` first; `delta` a checked sentence; `sources` the cited articles (or, `over_limit`, related ones); `done` last; `error` instead of `done`.'
      properties:
        type: {type: string, enum: [turn, delta, sources, done, error]}
        turn_id: {type: string, format: uuid}
        session_created: {type: boolean, description: This question started a new chat.}
        text: {type: string}
        sources: {type: array, items: {$ref: '#/components/schemas/HelpChatSource'}}
        status: {type: string, enum: [answered, no_source, over_limit]}
        links_allowed: {type: array, items: {type: string}, description: Links of the answer that are the articles' own; only these are shown as links.}
        redacted: {type: boolean}
        code: {type: string, enum: [model_failed, timeout]}
    HelpChatSession:
      type: object
      required: [status, idle_hours, turns]
      properties:
        status: {$ref: '#/components/schemas/AIChatStatus'}
        idle_hours: {type: integer, description: Hours since the last turn; a chat idle more than 24 asks the end user to continue it.}
        turns: {type: array, items: {$ref: '#/components/schemas/HelpChatTurn'}}
    HelpChatTurn:
      type: object
      required: [id, question, answer, status, sources, feedback, created_at]
      properties:
        id: {type: string, format: uuid}
        question: {type: [string, 'null']}
        answer: {type: [string, 'null']}
        status: {type: string, enum: [streaming, answered, no_source, over_limit, failed]}
        error_code: {type: [string, 'null']}
        sources: {type: array, items: {$ref: '#/components/schemas/HelpChatSource'}}
        feedback: {type: [string, 'null'], enum: [helpful, not_helpful, null]}
        redacted: {type: boolean, description: A sentence of the answer was hidden because it held contact details not in the articles.}
        created_at: {type: string, format: date-time}
    HelpChatSource:
      type: object
      required: [number, title, url, folder]
      properties:
        number: {type: integer}
        title: {type: string}
        url: {type: string, description: The article's page on the help center.}
        folder: {type: string}
    AIChatPreview:
      type: object
      required: [answer, status, sources, redacted, whole, articles, took_ms]
      properties:
        answer: {type: string}
        status: {type: string, enum: [answered, no_source, over_limit]}
        sources: {type: array, items: {type: object, required: [number, title, folder], properties: {number: {type: integer}, title: {type: string}, folder: {type: string}}}}
        redacted: {type: boolean}
        whole: {type: boolean, description: 'The AI read every article (else the best excerpts of a large knowledge base).'}
        articles: {type: integer, description: How many articles it read.}
        took_ms: {type: integer}
    AIChatStatus: {type: string, enum: [open, ended, handed_off], description: '`ended`: the end user started a new chat. `handed_off`: they asked to talk to a person.'}
    AIChatUsage:
      type: object
      required: [month, answers, answers_today, answer_limit, day_answer_limit, spent_micro_usd, limit_micro_usd, spent_percent, unpriced_model, chats, handed_off, rated_helpful, rated, articles, resets_at]
      properties:
        month: {type: string, description: YYYY-MM}
        answers: {type: integer, description: 'Questions the AI answered (with or without a source) this month; a question over the limits is not counted.'}
        answers_today: {type: integer}
        answer_limit: {type: [integer, 'null'], description: 'The plan''s monthly answers on the cloud''s own provider; null where answers are not limited.'}
        day_answer_limit: {type: [integer, 'null'], description: A tenth of the month's.}
        spent_micro_usd: {type: [integer, 'null'], description: 'What the chat spent, calls still running included at most; null on the cloud''s own provider, and when the server has no price for the model (unpriced_model).'}
        limit_micro_usd: {type: [integer, 'null'], description: 'The AI chat feature''s own monthly limit; null without one, and on the cloud''s own provider.'}
        spent_percent: {type: [integer, 'null'], minimum: 0, maximum: 100, description: Spend as a share of the month's limit; null without one.}
        unpriced_model: {type: [string, 'null'], description: 'The AI chat''s model when the server has no price for it (the setting ai.server.prices): its spend is not counted (spent_micro_usd is null) and no limit in dollars can be set. Null when it is priced.'}
        chats: {type: integer, description: Chats started this month.}
        handed_off: {type: integer}
        rated_helpful: {type: integer}
        rated: {type: integer}
        articles: {type: integer, description: 'Published articles the AI may answer from (the help center''s, without those kept away from AI); 0 answers nothing.'}
        resets_at: {type: string, format: date-time}
    AIChatSessionSummary:
      type: object
      required: [id, channel_id, channel_name, surface, status, turns, first_question, not_helpful, conversation_id, created_at, last_turn_at, ended_at, kept_until]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        channel_name: {type: string}
        surface: {type: string, enum: [help_center, article, widget], description: 'Where it started: the chat page, an article''s chat box, or a site''s widget.'}
        status: {$ref: '#/components/schemas/AIChatStatus'}
        turns: {type: integer}
        first_question: {type: [string, 'null'], description: Null once the texts expired.}
        not_helpful: {type: boolean, description: An answer of it was rated not helpful.}
        conversation_id: {type: [string, 'null'], format: uuid, description: The conversation its hand-off opened.}
        created_at: {type: string, format: date-time}
        last_turn_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        kept_until: {type: string, format: date-time, description: When its texts are removed unless another turn comes first.}
    AIChatSessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AIChatSessionSummary'}}
        next_cursor: {type: [string, 'null']}
    AIChatSource:
      type: object
      required: [ordinal, article_id, number, version, title, folder]
      properties:
        ordinal: {type: integer}
        article_id: {type: [string, 'null'], format: uuid, description: Null once the article was deleted for good.}
        number: {type: integer}
        version: {type: integer}
        title: {type: [string, 'null']}
        folder: {type: [string, 'null']}
    AIChatTurn:
      type: object
      required: [id, seq, question, answer, status, error_code, viewing_article_id, sources, feedback, created_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        question: {type: [string, 'null']}
        answer: {type: [string, 'null'], description: 'As the end user saw it: contact details not in the articles are hidden.'}
        status: {type: string, enum: [streaming, answered, no_source, over_limit, failed]}
        error_code: {type: [string, 'null']}
        viewing_article_id: {type: [string, 'null'], format: uuid, description: The article they were reading when they asked.}
        sources: {type: array, items: {$ref: '#/components/schemas/AIChatSource'}}
        feedback: {type: [string, 'null'], enum: [helpful, not_helpful, null]}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    AIChatSession:
      allOf:
        - {$ref: '#/components/schemas/AIChatSessionSummary'}
        - type: object
          required: [history_cut_at, transcript]
          properties:
            history_cut_at: {type: [string, 'null'], format: date-time, description: 'Turns before it no longer fit what the AI reads of the chat.'}
            transcript: {type: array, items: {$ref: '#/components/schemas/AIChatTurn'}}
    AIAllowance:
      type: object
      required: [limit_micro_usd, used_micro_usd, resets_at, drafts_left]
      properties:
        drafts_left: {type: [integer, 'null'], minimum: 0, description: 'About how many reply drafts what is left pays for, at the workspace''s average cost of a draft over 30 days (before its first, a typical one); null when no price is known.'}
        limit_micro_usd: {type: integer, description: 'This month''s allowance of the server''s provider, in millionths of a US dollar.'}
        used_micro_usd: {type: integer, description: Spent so far; calls still running are not counted yet.}
        resets_at: {type: string, format: date-time, description: The first instant of the next UTC month.}
    Results:
      type: object
      required: [current, baseline, baseline_state, hours_saved, error, weekly_email]
      properties:
        weekly_email:
          description: The caller's weekly email (admins only; null for agents).
          oneOf:
            - type: 'null'
            - type: object
              required: [subscribed, can_send, next_at, timezone]
              properties:
                subscribed: {type: boolean}
                can_send: {type: boolean, description: False when the server has no outgoing mail settings.}
                next_at: {type: string, format: date-time, description: The next Monday 8:00 in the workspace's timezone.}
                timezone: {type: string, description: The workspace's timezone (IANA).}
        current:
          description: Colliedesk's numbers; null until the worker has computed them once.
          oneOf: [{$ref: '#/components/schemas/ResultsSnapshot'}, {type: 'null'}]
        baseline:
          description: The imported history's numbers, measured when its import finished; null without one.
          oneOf: [{$ref: '#/components/schemas/ResultsSnapshot'}, {type: 'null'}]
        baseline_state:
          type: string
          enum: [none, computing, ready]
          description: >-
            `none`: no import to compare with. `computing`: an import finished (or was run again or undone) and
            its numbers are being worked out. `ready`: `baseline` holds them.
        hours_saved:
          type: object
          description: >-
            Per window, the upper bound of time AI drafts saved: conversations with a draft sent nearly unchanged
            times the baseline's median handle time. Null without a baseline handle time from at least 5
            conversations in that window.
          additionalProperties: false
          properties:
            30d: {$ref: '#/components/schemas/ResultsHoursSaved'}
            7d: {$ref: '#/components/schemas/ResultsHoursSaved'}
        error:
          description: Why the last compute failed (admins only; null for agents and when it worked).
          oneOf:
            - type: 'null'
            - type: object
              required: [message, at]
              properties:
                message: {type: string}
                at: {type: string, format: date-time}
    ResultsShareLink:
      type: object
      required: [created_at, created_by_name, last_viewed_at]
      properties:
        created_at: {type: string, format: date-time}
        created_by_name: {type: [string, 'null'], description: Null when that person was removed.}
        last_viewed_at: {type: [string, 'null'], format: date-time, description: 'Updated at most once an hour.'}
    ResultsShareLinkState:
      type: object
      required: [link]
      properties:
        link:
          oneOf: [{$ref: '#/components/schemas/ResultsShareLink'}, {type: 'null'}]
    ResultsShareLinkCreated:
      type: object
      required: [link, url]
      properties:
        link: {$ref: '#/components/schemas/ResultsShareLink'}
        url: {type: string, description: 'The address to share, shown only now.'}
    SharedResults:
      type: object
      additionalProperties: false
      required: [workspace_name, computed_at, baseline_from, baseline_import_status, current, baseline, hours_saved]
      properties:
        workspace_name: {type: string}
        baseline_import_status:
          type: [string, 'null']
          enum: [OK, UNVERIFIED, null]
          description: UNVERIFIED when the baseline's import could not check that every ticket arrived (the page labels it); null for an import made before results existed.
        computed_at: {type: [string, 'null'], format: date-time}
        baseline_from:
          type: [string, 'null']
          enum: [freshdesk, helpscout, null]
          description: Where the baseline was imported from; null without one (or while it is not shown).
        current:
          oneOf: [{$ref: '#/components/schemas/SharedResultsSide'}, {type: 'null'}]
        baseline:
          oneOf: [{$ref: '#/components/schemas/SharedResultsSide'}, {type: 'null'}]
        hours_saved:
          type: object
          additionalProperties: false
          properties:
            30d: {$ref: '#/components/schemas/ResultsHoursSaved'}
            7d: {$ref: '#/components/schemas/ResultsHoursSaved'}
    SharedResultsSide:
      type: object
      additionalProperties: false
      required: [measured_at, windows]
      properties:
        measured_at: {type: string, format: date-time}
        windows:
          type: object
          required: [30d, 7d]
          additionalProperties: false
          properties:
            30d: {$ref: '#/components/schemas/ResultsWindow'}
            7d: {$ref: '#/components/schemas/ResultsWindow'}
    ResultsHoursSaved:
      oneOf:
        - type: 'null'
        - type: object
          required: [hours, conversations, median_handle_minutes]
          properties:
            hours: {type: number}
            conversations: {type: integer}
            median_handle_minutes: {type: integer}
    ResultsSnapshot:
      type: object
      required: [id, computed_at, measured_at, windows]
      properties:
        id: {type: string, format: uuid, description: 'Names the snapshot in the `result` filter.'}
        computed_at: {type: string, format: date-time}
        measured_at: {type: string, format: date-time, description: 'The moment the numbers describe: the anchor of a baseline.'}
        history_since: {type: string, format: date-time, description: 'Current only: since when status history is complete.'}
        source: {type: string, description: 'Baseline only: the import ledger source, for example freshdesk:account:123.'}
        import_status:
          type: string
          enum: [OK, FAILED, UNVERIFIED, '']
          description: 'Baseline only: the reconcile status of the import''s latest run; empty for an import made before results existed.'
        import_cause:
          type: string
          enum: [archive_refused]
          description: 'Baseline only: present when the import is UNVERIFIED only because the Freshdesk plan refuses the archive API and every other total was confirmed.'
        end: {type: string, format: date-time, description: 'Baseline only: where its windows end (the newest ticket created by the anchor).'}
        stats_read: {type: integer, description: 'Baseline only: tickets whose resolve times were read; 0 means run the import again for them.'}
        windows:
          type: object
          required: [30d, 7d]
          additionalProperties: false
          properties:
            30d: {$ref: '#/components/schemas/ResultsWindow'}
            7d: {$ref: '#/components/schemas/ResultsWindow'}
    ResultsRange:
      type: object
      required: [from, to]
      description: Created after `from`, up to and including `to`.
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    ResultsWindow:
      type: object
      required: [created, resolved_created, available_on, first_response, resolution, reopened, volume, handle, ai]
      properties:
        created: {$ref: '#/components/schemas/ResultsRange'}
        resolved_created: {$ref: '#/components/schemas/ResultsRange'}
        available_on:
          type: [string, 'null']
          format: date-time
          description: When resolution and reopens can be shown; set while status history does not reach back far enough.
        first_response:
          type: object
          required: [median_seconds, p90_seconds, answered, waiting]
          properties:
            median_seconds: {type: [integer, 'null'], description: Null below 5 answered conversations.}
            p90_seconds: {type: [integer, 'null']}
            answered: {type: integer}
            waiting: {type: integer, description: Customer-started conversations of the window with no reply yet.}
        resolution:
          oneOf:
            - type: 'null'
            - type: object
              required: [median_seconds, resolved, unresolved, without_resolve_time]
              properties:
                median_seconds: {type: [integer, 'null']}
                resolved: {type: integer}
                unresolved: {type: integer, description: 'Not resolved, or resolved less than 7 days ago, or reopened.'}
                without_resolve_time: {type: integer, description: Imported tickets without a resolve time from the source.}
        reopened:
          oneOf:
            - type: 'null'
            - type: object
              required: [rate, reopened, resolutions]
              properties:
                rate: {type: [number, 'null'], description: 'Share (0 to 1); null below 5 resolutions.'}
                reopened: {type: integer}
                resolutions: {type: integer}
        volume:
          type: object
          required: [count, from, days, per_week]
          properties:
            count: {type: integer}
            from: {type: string, format: date-time, description: 'Where the weeks are counted from: the window start or the first conversation, if later.'}
            days: {type: number}
            per_week: {type: [number, 'null']}
        handle:
          oneOf:
            - type: 'null'
            - type: object
              required: [median_minutes, conversations]
              properties:
                median_minutes: {type: [integer, 'null']}
                conversations: {type: integer}
        ai:
          oneOf:
            - type: 'null'
            - type: object
              required: [sent_unchanged, sent_edited, discarded, conversations_sent_unchanged]
              properties:
                sent_unchanged: {type: integer}
                sent_edited: {type: integer}
                discarded: {type: integer}
                conversations_sent_unchanged: {type: integer}
    AIUsage:
      type: object
      required: [month, allowance, rows]
      properties:
        month: {type: string}
        allowance: {anyOf: [{$ref: '#/components/schemas/AIAllowance'}, {type: 'null'}]}
        rows:
          type: array
          items:
            type: object
            required: [feature, billed_to, provider_label, calls, failed, automatic, input_tokens, output_tokens, cost_micro_usd, provider_cost]
            properties:
              feature: {type: string, enum: [check, triage, draft, chat, intake]}
              billed_to: {type: string, enum: [server, workspace_key]}
              provider_label: {type: string}
              calls: {type: integer}
              failed: {type: integer}
              automatic: {type: integer}
              input_tokens: {type: integer}
              output_tokens: {type: integer}
              cost_micro_usd: {type: [integer, 'null'], description: 'Only for the server''s provider.'}
              provider_cost: {type: [number, 'null'], description: 'What the provider itself said the calls cost, in its own unit (OpenRouter: credits), never converted to dollars; null when it said nothing.'}
    AIDraft:
      type: object
      required: [id, conversation_id, status, error_code, prompt, text, missing_info, sources, warnings, model, outcome, similarity, sent_message_id, requested_by_agent_id, automatic, answers_message_id, reply_needed, created_at, ready_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, ready, failed, cancelled]}
        error_code: {type: [string, 'null'], description: 'Why a draft failed or stopped: feature_off, ai_allowance_reached, refused, too_long, empty_answer, a provider error code, restored, cancelled…'}
        prompt: {type: string, description: What the person asked for; erased 90 days after the draft ended.}
        text: {type: [string, 'null'], description: 'The draft, plain text; null until ready, and 90 days after it ended.'}
        missing_info: {type: [string, 'null'], description: What the draft needs that the sources did not say.}
        sources:
          type: array
          description: The articles and solved conversations the draft used, named from the database.
          items: {$ref: '#/components/schemas/AISource'}
        warnings:
          type: array
          description: An email address, a number, another customer's name, a word in an alphabet the conversation does not use, or a masked detail ([email], [number], [company]) copied from a past conversation, in the draft but not in this conversation. Check before sending.
          items:
            type: object
            required: [kind, value]
            properties:
              kind: {type: string, enum: [email, number, name, script, placeholder]}
              value: {type: string}
        model: {type: [string, 'null']}
        outcome: {type: [string, 'null'], enum: [sent_unchanged, sent_edited, discarded, superseded, expired, null]}
        similarity: {type: [number, 'null'], description: 'How close the sent reply stayed to the draft, 0 to 1 by words; 0.9 and above is sent_unchanged.'}
        sent_message_id: {type: [string, 'null'], format: uuid}
        requested_by_agent_id: {type: [string, 'null'], format: uuid}
        automatic: {type: boolean, description: 'Written by itself when a customer wrote (the draft feature''s automatic mode), not asked for by a person; the whole team sees it. Never sent by itself.'}
        answers_message_id: {type: [string, 'null'], format: uuid, description: The customer message an automatic draft answers.}
        reply_needed: {type: [boolean, 'null'], description: 'For an automatic draft: false when the model thinks the message needs no reply (a thank-you). Null for a person''s draft.'}
        created_at: {type: string, format: date-time}
        ready_at: {type: [string, 'null'], format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    AISource:
      type: object
      description: An article or a solved conversation an AI draft or suggestion read, named from the database, never by the model.
      required: [kind, id, title]
      properties:
        kind: {type: string, enum: [kb_article, conversation]}
        id: {type: string, format: uuid}
        locale: {type: string}
        number: {type: integer}
        title: {type: string}
    AITriage:
      type: object
      required: [id, conversation_id, status, error_code, automatic, tag_ids, priority, assignee_agent_id, reason, sources, stale, model, outcome, applied, created_at, ready_at, decided_at, decided_by_agent_id,
        auto_applied_at, auto_applied, skipped, undone_parts, kept, undone_at, undone_by_agent_id]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, ready, failed, cancelled]}
        error_code: {type: [string, 'null'], description: 'Why it failed or stopped: automatic_limit (the workspace''s daily limit of automatic suggestions), ai_allowance_reached, feature_off, refused, invalid_answer, a provider error code, restored, cancelled…'}
        automatic: {type: boolean, description: Queued by a new ticket rather than asked for by a person.}
        tag_ids: {type: array, items: {type: string, format: uuid}, description: Tags of the workspace the suggestion names that the conversation did not have when it came.}
        priority: {type: [string, 'null'], enum: [low, normal, high, urgent, null], description: Null when it matches the conversation's or a person set it first.}
        assignee_agent_id: {type: [string, 'null'], format: uuid, description: Null when it matches the conversation's or a person set it first.}
        reason: {type: [string, 'null'], description: 'One sentence a teammate can check; generated text, erased 90 days after it was decided.'}
        sources: {type: array, items: {$ref: '#/components/schemas/AISource'}, description: The articles and solved conversations the reason rests on.}
        stale:
          type: object
          required: [priority, assignee_agent_id]
          description: What a person set on the conversation after the suggestion was asked for and before it came; that field is not suggested.
          properties:
            priority: {type: [string, 'null'], enum: [low, normal, high, urgent, null]}
            assignee_agent_id: {type: [string, 'null'], format: uuid}
        model: {type: [string, 'null']}
        outcome: {type: [string, 'null'], enum: [accepted, partly_accepted, dismissed, superseded, expired, auto_applied, undone, null], description: 'Null while open, also after a part was applied. accepted: all of it applied; partly_accepted: a part applied, the rest dismissed, replaced or expired after 7 days; auto_applied: AI applied all of it by itself; undone: what AI applied was taken back.'}
        applied:
          description: What was applied of it so far, by people or by AI.
          allOf: [{$ref: '#/components/schemas/AITriageSet'}]
        created_at: {type: string, format: date-time}
        ready_at: {type: [string, 'null'], format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
        decided_by_agent_id: {type: [string, 'null'], format: uuid}
        auto_applied_at: {type: [string, 'null'], format: date-time, description: When AI applied a part by itself (automatic apply).}
        auto_applied: {$ref: '#/components/schemas/AITriageSet'}
        skipped:
          type: object
          description: 'The parts AI did not apply by itself because the conversation had them set: priority (set_by_person, agent_conversation) or assignee (already_assigned), with the value it had.'
          additionalProperties:
            type: object
            required: [reason, value]
            properties:
              reason: {type: string, enum: [set_by_person, agent_conversation, already_assigned]}
              value: {type: [string, 'null']}
        undone_parts: {$ref: '#/components/schemas/AITriageSet'}
        kept:
          type: object
          required: [priority, assignee_agent_id]
          description: What an undo left because a person changed it after AI, with its value then.
          properties:
            priority: {type: [string, 'null'], enum: [low, normal, high, urgent, null]}
            assignee_agent_id: {type: [string, 'null'], format: uuid}
        undone_at: {type: [string, 'null'], format: date-time}
        undone_by_agent_id: {type: [string, 'null'], format: uuid}
    AITriageSet:
      type: object
      required: [tag_ids, priority, assignee_agent_id]
      properties:
        tag_ids: {type: array, items: {type: string, format: uuid}}
        priority: {type: [string, 'null']}
        assignee_agent_id: {type: [string, 'null'], format: uuid}
    AISettings:
      type: object
      required: [server, providers, slots, events, provider_limit, can_store_keys, allow_private_base_urls, automatic, allowance, auto_triage, auto_draft_estimate, channels, source_consents]
      properties:
        server:
          description: The server's provider, set by the operator in the operator console → AI (ai.server.*); null when the server has none.
          anyOf:
            - type: 'null'
            - type: object
              required: [kind, label, models]
              properties:
                kind: {$ref: '#/components/schemas/AIProviderKind'}
                label: {type: string}
                models:
                  type: object
                  description: Per feature, the models a workspace may pick; the first is the default.
                  additionalProperties: {type: array, items: {type: string}}
        providers: {type: array, items: {$ref: '#/components/schemas/AIProvider'}}
        slots: {type: array, items: {$ref: '#/components/schemas/AISlot'}}
        channels: {type: array, items: {$ref: '#/components/schemas/AIChannelLevel'}, description: 'The levels live channels set apart from the workspace''s default, by channel name.'}
        source_consents: {type: array, items: {$ref: '#/components/schemas/AISourceConsent'}}
        events: {type: array, items: {$ref: '#/components/schemas/AIEvent'}, description: 'The newest 50 changes, newest first.'}
        provider_limit: {type: integer}
        can_store_keys: {type: boolean, description: False while the server has no MAILBOX_TOKEN_KEYS; no key can be added.}
        allow_private_base_urls: {type: boolean, description: True when the operator lets workspace providers use private addresses and plain http.}
        automatic: {$ref: '#/components/schemas/AIAutomaticLimits'}
        allowance: {anyOf: [{$ref: '#/components/schemas/AIAllowance'}, {type: 'null'}], description: 'This month''s allowance of the server''s provider; null when the server sets none.'}
        auto_draft_estimate:
          type: object
          required: [customer_messages, draft_cost_micro_usd]
          description: 'What a draft for every customer message would have meant in the last 30 days: the customer messages (imports left out), and a draft''s cost on the server''s provider (the workspace''s average, or a typical one at the server''s prices); null without a price.'
          properties:
            customer_messages: {type: integer}
            draft_cost_micro_usd: {type: [integer, 'null']}
        auto_triage:
          type: object
          required: [applied, undone]
          description: Triage suggestions AI applied by itself in the last 30 days, and how many of those a person undid.
          properties:
            applied: {type: integer}
            undone: {type: integer}
    AIProviderInput:
      type: object
      additionalProperties: false
      required: [kind, label, models]
      properties:
        kind: {$ref: '#/components/schemas/AIProviderKind'}
        label: {type: string, minLength: 1, maxLength: 80}
        base_url: {type: string, maxLength: 500, description: 'OpenAI-compatible only, with the version path: https://openrouter.ai/api/v1.'}
        api_key: {type: string, maxLength: 500, description: Required except for an OpenAI-compatible server on a private address the operator allowed.}
        models: {type: array, minItems: 1, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
        routing: {$ref: '#/components/schemas/AIProviderRouting'}
    AIModelsInput:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/AIProviderKind'}
        base_url: {type: string, maxLength: 500, description: 'OpenAI-compatible only, with the version path: https://openrouter.ai/api/v1.'}
        api_key: {type: string, maxLength: 500, description: Required except for an OpenAI-compatible server on a private address the operator allowed. Never stored.}
    AIModelList:
      type: object
      required: [models]
      properties:
        models: {type: array, maxItems: 1000, items: {type: string}}
    AIProviderChange:
      type: object
      additionalProperties: false
      properties:
        label: {type: string, minLength: 1, maxLength: 80}
        models: {type: array, minItems: 1, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
        routing: {$ref: '#/components/schemas/AIProviderRouting'}
    AISlotInput:
      type: object
      additionalProperties: false
      required: [source, enabled]
      properties:
        source: {type: string, enum: [server, provider, none]}
        provider_id: {type: string, format: uuid, description: With source provider.}
        model: {type: string, maxLength: 200}
        fallback_model: {type: string, maxLength: 200, description: 'Intake only: another of the same provider''s models; an empty string removes it. Left out: kept while the provider stays and still offers it.'}
        effort: {type: string, enum: [low, medium, high], description: Low when left out.}
        enabled: {type: boolean}
        default_level: {$ref: '#/components/schemas/AILevel'}
        automatic: {type: boolean, deprecated: true, description: 'The older switch: true is default_level auto for triage and suggest for drafts; false takes it back to suggest (triage) or off (drafts). Left out with default_level: kept as it is (off when the feature turns off; suggest for triage and off for drafts when it turns on or moves to another provider).'}
        auto_parts: {type: array, items: {type: string, enum: [tags, priority, assignee]}, description: 'Triage only. Left out: kept; tags and priority when it applies by itself with none.'}
        monthly_cap_micro_usd: {type: [integer, 'null'], minimum: 1, description: 'AI chat only. Left out: kept; null removes the limit.'}
    ExportLink:
      type: object
      required: [url, expires_in_seconds]
      properties:
        url: {type: string, description: 'Path on this server, for example /api/v1/export/download/<token>.'}
        expires_in_seconds: {type: integer}
    CheckoutPlan: {type: string, enum: [solo_monthly, solo_yearly, small_monthly, small_yearly, team_monthly, team_yearly, team25_monthly, team25_yearly, founding], description: '`solo_*`, `small_*` and `team25_*` are refused with 400 on a server that has no Polar product for them.'}
    FoundingSlots:
      type: object
      required: [slots, taken, open]
      properties:
        slots: {type: integer, description: Founding slots in total}
        taken: {type: [integer, 'null'], description: 'Slots held by active, trialing or past due subscriptions; null until counted'}
        open: {type: boolean, description: Whether Founding can still be bought; false while the operator switched billing off}
    WebhookResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [applied, duplicate, stale, ignored]}
    Billing:
      type: object
      required: [plan, trial_ends_at, locked, status, current_period_end, cancel_at_period_end, active_subscriptions, complimentary, complimentary_until, limits, usage, checkout_plans, checkout_refusals, storage_upgrade_plan]
      properties:
        plan:
          type: string
          enum: [trial, solo, small, team, team25, founding, none]
          description: The plan in effect now. `trial` is the free trial; `none` means the trial is over and nothing is paid.
        trial_ends_at: {type: string, format: date-time, description: 'When the free trial ends or ended, whatever the plan.'}
        locked: {type: boolean, description: 'True when `plan` is `none`; the workspace refuses every route outside the locked allowlist.'}
        status:
          type: string
          enum: [none, incomplete, incomplete_expired, trialing, active, past_due, canceled, unpaid, paused, unknown]
          description: >
            The latest subscription status from the provider, `none` when there never was one.
            `past_due` keeps the paid plan while the provider retries the card; `canceled` keeps it
            until `current_period_end`; `unknown` is a status this version does not recognise and
            grants nothing. With several subscriptions the one that decides the plan is shown.
        current_period_end: {type: [string, 'null'], format: date-time}
        cancel_at_period_end: {type: boolean}
        active_subscriptions:
          type: integer
          description: >
            Subscriptions that grant a paid plan now. More than one means the workspace pays twice;
            cancel the extra one in the billing portal.
        complimentary:
          type: boolean
          description: >
            True when the plan in effect was granted by HC Labs instead of bought. Such a workspace
            has no billing account: checkout answers 409 and the portal is not available.
        complimentary_until:
          type: [string, 'null']
          format: date-time
          description: 'When a complimentary plan ends; null when it has no end or the plan is not complimentary.'
        checkout_refusals:
          type: array
          description: The checkout plans this workspace does not fit now, each with the reason checkout would give. The web app disables their buttons.
          items:
            type: object
            required: [plan, reason]
            additionalProperties: false
            properties:
              plan: {$ref: '#/components/schemas/CheckoutPlan'}
              reason: {type: string}
        storage_upgrade_plan:
          type: [string, 'null']
          enum: [solo, small, team, team25, founding, null]
          description: The plan this server sells with more storage and as many agents as the plan in effect, for the storage notice; null on the trial and when none is on sale.
        checkout_plans:
          type: array
          items: {$ref: '#/components/schemas/CheckoutPlan'}
          description: 'The plans this server can sell, in the order to offer them. `solo_*`, `small_*` and `team25_*` appear only for the Polar products this server has configured; the web app shows a purchase button for each plan listed and for no other. `founding` is dropped once Founding is closed.'
        limits:
          type: object
          required: [agents, storage_bytes, storage_warn_bytes, replies_per_24h]
          properties:
            agents: {type: integer, description: 'Seats of the plan; 0 when locked.'}
            replies_per_24h: {type: [integer, 'null'], description: 'People that emailed replies may reach in any 24 hours on the trial, each reply counting its contact and every Cc address; null on every other plan and self-hosted.'}
            storage_bytes:
              type: [integer, 'null']
              format: int64
              description: 'Attachment storage cap in bytes: 2 GiB on the trial and when locked (imported files do not count); 10 GiB on Solo, 30 GiB on Small, 20 GiB on Founding, 100 GiB on Team and 250 GiB on Team 25 (imported files count); null on self-hosted, which has none.'
            storage_warn_bytes:
              type: [integer, 'null']
              format: int64
              description: Usage at which the web app warns, 80% of `storage_bytes`; null when there is no cap.
        usage:
          type: object
          required: [agents, pending_invites, replies_last_24h, storage_bytes]
          properties:
            agents: {type: integer}
            storage_bytes:
              type: integer
              format: int64
              description: Attachment and knowledge base image bytes counted against `limits.storage_bytes`. On the trial files of imported messages are not counted; on a paid plan every file is, imported ones included.
            replies_last_24h:
              type: integer
              description: People reached by the emailed replies of the last 24 hours (the contact plus every Cc address of each reply), which count against the trial cap of 200; 0 on other plans.
            pending_invites:
              type: integer
              description: Unused, unrevoked, unexpired invites. Each holds an agent seat, so agents plus pending invites is compared with `limits.agents`.
    WorkspaceChoice:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
    CloudWorkspaceChoices:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/WorkspaceChoice'}
    Role: {type: string, enum: [admin, agent]}
    ConversationStatus: {type: string, enum: [open, pending, resolved, closed]}
    Priority: {type: string, enum: [low, normal, high, urgent]}
    ConversationChannel:
      type: string
      pattern: '^[a-z_]{1,40}$'
      description: >-
        How the conversation started: a channel type this server runs, or an origin that comes through no
        channel. Values: email, web_form, help_chat, imported, agent, problem_report. A test build may run another type
        (the loopback chat stand-in), so a client names a value it does not know by itself.
        email: a customer's mail. web_form: the public web form.
        help_chat: an end user handed a chat with the help center's AI to the team (the address was typed, never verified).
        imported: brought over from another helpdesk (its original channel is in origin.source).
        agent: a team member started it in Colliedesk; an older image that does not know this field
        also writes agent. problem_report: an agent's Report a problem.
    ConversationSort: {type: string, enum: [updated_desc, updated_asc, created_desc, created_asc, priority, waiting_longest], default: updated_desc}
    ConversationFilters:
      type: object
      additionalProperties: false
      description: >-
        The filters of `GET /api/v1/conversations` as one object; a list holds the values the query
        string separates with commas. An empty object is every conversation, most recently updated first.
      properties:
        status: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/ConversationStatus'}}
        priority: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/Priority'}}
        assignee:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, description: 'me, unassigned, anyone or a team member id'}
        tag: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, format: uuid}}
        tag_match: {type: string, enum: [any, all]}
        contact: {type: string, format: uuid}
        organization: {type: string, minLength: 1, maxLength: 200}
        awaiting: {type: string, enum: [team, customer]}
        has_pending_draft: {type: boolean}
        delivery_failed: {type: boolean}
        source: {type: string, enum: [imported, native]}
        channel: {type: array, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/ConversationChannel'}}
        channel_id:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
          description: 'Channels: a conversation that came through one of them or whose replies leave from one of them. A removed channel still filters.'
        created_after: {type: string, format: date-time}
        created_before: {type: string, format: date-time}
        updated_after: {type: string, format: date-time}
        updated_before: {type: string, format: date-time}
        sort: {$ref: '#/components/schemas/ConversationSort'}
        search: {type: string, minLength: 1, maxLength: 200}
    SavedViewScope: {type: string, enum: [personal, shared]}
    SavedViewInput:
      type: object
      required: [name, scope, filters]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        scope: {$ref: '#/components/schemas/SavedViewScope'}
        filters: {$ref: '#/components/schemas/ConversationFilters'}
    SavedViewChange:
      type: object
      required: [updated_at]
      minProperties: 2
      additionalProperties: false
      properties:
        updated_at: {type: string, format: date-time, description: 'The updated_at of the view as the caller last read it. If someone saved it since, nothing changes (409 changed_elsewhere).'}
        name: {type: string, minLength: 1, maxLength: 80}
        scope: {$ref: '#/components/schemas/SavedViewScope'}
        filters: {$ref: '#/components/schemas/ConversationFilters'}
    SavedView:
      type: object
      required: [id, name, scope, filters, owner_agent_id, created_at, updated_at, deleted_at, purges_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scope: {$ref: '#/components/schemas/SavedViewScope'}
        filters: {$ref: '#/components/schemas/ConversationFilters'}
        owner_agent_id: {type: [string, 'null'], format: uuid, description: The person a personal view belongs to; null for a shared view.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
        purges_at: {type: [string, 'null'], format: date-time, description: When a deleted view is removed for good.}
    Workspace:
      type: object
      required: [id, slug, name, timezone]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        timezone: {type: string, default: UTC}
    SetupProgress:
      type: object
      required: [steps, complete, recommended]
      properties:
        steps:
          type: array
          items: {$ref: '#/components/schemas/SetupStep'}
        complete: {type: boolean, description: True when every step is done.}
        recommended:
          description: The step the sign-up goal puts first while it is not done; null for a goal without one.
          type: [string, 'null']
          enum: [email, import, invite, null]
    SetupStep:
      type: object
      required: [key, state, detail]
      properties:
        key: {type: string, enum: [email, import, invite, first_reply]}
        state:
          type: string
          description: >-
            email none, waiting, working or needs_attention; import none, running or done; invite alone,
            invited or joined; first_reply none or sent.
          enum: [none, waiting, working, needs_attention, running, done, alone, invited, joined, sent]
        detail:
          description: A reason code for needs_attention; null otherwise.
          type: [string, 'null']
    Agent:
      type: object
      required: [id, email, display_name, role, timezone_override]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        timezone_override: {type: [string, 'null']}
    DisplayNameInput:
      type: string
      maxLength: 80
      description: >
        Leading and trailing spaces are removed; the rest may be at most 80 characters and may not hold
        control characters or text-direction overrides. An empty string clears the name.
    TeamMember:
      type: object
      required: [id, email, display_name, role, timezone_override, deactivated_at, last_active_at, open_conversations]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        timezone_override: {type: [string, 'null']}
        deactivated_at:
          type: [string, 'null']
          format: date-time
          description: Null for an active agent.
        last_active_at:
          type: [string, 'null']
          format: date-time
          description: The last time a session of the agent was used; null when none ever was.
        open_conversations:
          type: integer
          description: Open and pending conversations assigned to the agent; a deactivation moves them.
    Redeemed:
      type: object
      required: [agent, workspace]
      properties:
        token: {type: string}
        agent: {$ref: '#/components/schemas/Agent'}
        workspace: {$ref: '#/components/schemas/Workspace'}
        continue_url:
          type: string
          format: uri
          description: >-
            Present only for a browser that signed in on `APP_ORIGIN` of a server with `HELP_CENTER_DOMAIN`:
            the workspace host's `/sign-in` address, with `next` and a one-time token in the fragment
            (`#handoff=<token>`, never sent to a server). The web app there redeems the token with
            `POST /api/v1/auth/redeem` for a cookie session of the same agent and role. The token works once,
            for one minute, only on that workspace's host and only with `session_type: cookie`. With
            `continue_url` the answer sets no session cookie on `APP_ORIGIN`.
    RenamedWorkspace:
      allOf:
        - $ref: '#/components/schemas/Workspace'
        - type: object
          properties:
            continue_url:
              type: string
              format: uri
              description: >-
                Present when the rename was made with a browser session on the workspace's own host
                `<slug>.<HELP_CENTER_DOMAIN>`: the desk moves to the new host, and the browser continues at
                this address, signed in there by a one-time token in the fragment (as for a sign-in's
                `continue_url`). The old host's cookie no longer signs in.
    SignInNext:
      type: string
      maxLength: 2048
      description: >-
        The page a browser signing in on `APP_ORIGIN` opens on its workspace's host (`continue_url`), a path
        of this site such as `/settings/billing?buy=team_monthly`; anything else opens the inbox.
    OnboardingGoal:
      type: string
      enum: [leave_helpdesk, shared_inbox, lower_cost, ai_agents, other]
      description: What the team wants Colliedesk to do first, asked at cloud sign-up.
    OnboardingRole:
      type: string
      enum: [founder, support_lead, support_agent, developer, other]
      description: The role of the person who signed up.
    OnboardingSource:
      type: string
      enum: [x, email, search, ai_chatgpt, ai_claude, ai_gemini, ai_perplexity, ai_other, tiktok, youtube, reddit, github, referral, other]
      description: Where the person heard of Colliedesk.
    Me:
      type: object
      required: [agent, workspace, timezone, scope, permissions, plan, onboarding_goal, ai_features, setup_guide_hidden]
      properties:
        setup_guide_hidden: {type: boolean, description: True when this agent hid the setup guide in the inbox.}
        ai_features:
          type: object
          description: Which AI features can run now in the workspace (on, with a working provider); the web app offers only those.
          required: [triage, draft]
          properties:
            triage: {type: boolean}
            draft: {type: boolean}
            chat: {type: boolean, description: 'The help center''s AI chat answers end users (a server before it sends none).'}
        agent: {$ref: '#/components/schemas/Agent'}
        workspace: {$ref: '#/components/schemas/Workspace'}
        timezone: {type: string}
        onboarding_goal:
          description: The goal given at cloud sign-up; the empty inbox starts with the matching step. Null when none was given and on self-hosted instances.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/OnboardingGoal'}
        scope:
          description: The tier of the agent token making the call, custom for one with its own permissions; null for a person's own session.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/TokenScope'}
        permissions:
          type: array
          items: {type: string}
          description: What the agent token making the call holds (resource:action); empty for a person's own session.
        plan:
          description: The trial and lock state, so every agent sees it. Null on self-hosted instances.
          oneOf:
            - type: 'null'
            - type: object
              required: [plan, trial_ends_at, locked, trial_extended, agents_over, seat_paused]
              properties:
                plan: {type: string, enum: [trial, solo, small, team, team25, founding, none]}
                agents_over: {type: integer, description: How many active agents the workspace has beyond its plan's agent cap; 0 when it fits.}
                seat_paused: {type: boolean, description: 'True when this agent is beyond the cap and paused (requests answer 402 `seat_paused`).'}
                trial_ends_at: {type: string, format: date-time}
                locked: {type: boolean}
                trial_extended: {type: boolean, description: True when a Freshdesk import already extended the trial.}
    TokenPreset:
      type: string
      enum: [read, draft, send, admin]
      description: A tier to create a token with; each holds every permission of its own preset and below (TokenPermission).
    TokenPermission:
      type: string
      description: >
        A permission an agent token can hold, resource:action. Each has a preset, the lowest tier that holds it;
        the admin ones act with the creator's role. Actions beyond CRUD name a different risk: send (reaches a
        customer), publish (reaches the public help center), export and share (data leaves), purge (no way back),
        manage_credentials (another service's key), manage_roles, revoke and invite (people's access).
      enum:
        - conversations:read
        - conversations:update
        - messages:read
        - messages:note
        - messages:send
        - ai_assist:read
        - ai_assist:create
        - contacts:read
        - contacts:create
        - contacts:update
        - tags:read
        - tags:create
        - tags:update
        - tags:delete
        - saved_replies:read
        - saved_replies:create
        - saved_replies:update
        - saved_replies:delete
        - saved_views:read
        - saved_views:create
        - saved_views:update
        - saved_views:delete
        - kb_articles:read
        - kb_articles:create
        - kb_articles:update
        - kb_articles:delete
        - kb_articles:publish
        - kb_media:read
        - kb_media:create
        - kb_media:update
        - kb_media:delete
        - kb_media:purge
        - help_center:read
        - help_center:update
        - results:read
        - results:share
        - agent_requests:read
        - agent_requests:cancel
        - profile:update
        - team:read
        - team:invite
        - team:revoke
        - team:manage_roles
        - team:create_tokens
        - channels:read
        - channels:update
        - channels:manage_credentials
        - workspace:update
        - workspace:export
        - billing:read
        - billing:manage
        - imports:read
        - imports:run
        - imports:manage_credentials
        - imports:undo
        - ai_settings:read
        - ai_settings:update
        - ai_settings:manage_credentials
        - autofix:read
        - autofix:update
        - autofix:send
        - autofix_settings:read
        - autofix_settings:update
        - autofix_settings:manage_credentials
    TokenScope:
      type: string
      enum: [read, draft, send, admin, custom]
      description: >
        Tier of an agent token, or `custom` for a token that holds its own list of permissions. `read`: read what an agent may read, including the session and invite
        lists and the channel settings without links or secrets. `draft`: also change status, priority,
        assignee and tags of a conversation, create tags, add private notes and set the owner's own
        timezone. `send`: also send and retry replies, rename and delete tags, create, rename and merge
        contacts, create conversations, and write saved replies. `admin`: also workspace settings, the team, revoking
        invites, the web form and email channel, and sessions; it acts with the creator's role, so only
        an admin can create it and it loses admin rights when its creator is demoted.
    AgentToken:
      type: object
      required: [token, session]
      properties:
        token: {type: string, description: 'Raw bearer value, starting with cdk_agent_; Colliedesk stores only a hash of it and never shows it again'}
        session: {$ref: '#/components/schemas/Session'}
    Session:
      type: object
      required: [id, agent_id, agent_email, label, scope, permissions, current, created_at, last_seen_at, expires_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        agent_email: {type: string, format: email}
        label: {type: string}
        scope:
          description: The tier of an agent token, custom for one with its own permissions; null for a person's session, which has no tier.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TokenScope'
        permissions:
          type: array
          items: {type: string}
          description: What an agent token holds (resource:action), its tier's permissions or its own list; empty for a person's session.
        current:
          type: boolean
          description: True for the session that made this request, so a client can mark "this device".
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    Invite:
      type: object
      required: [id, email, role_ceiling, created_by_email, created_at, expires_at, used_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role_ceiling: {$ref: '#/components/schemas/Role'}
        created_by_email: {type: string, format: email}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        used_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    Contact:
      type: object
      required: [id, name, email, organization, merged_into_id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: [string, 'null'], format: email, description: 'Null for a customer known only on a channel (identities).'}
        identities:
          type: array
          description: Who the customer is on channels that know them by something other than email.
          items: {$ref: '#/components/schemas/ContactIdentity'}
        organization: {type: [string, 'null'], description: 'Company or organization name, for example imported from a Freshdesk company'}
        merged_into_id: {type: [string, 'null'], format: uuid, description: 'The contact this one was merged into; null for a contact of its own'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ContactDetail:
      allOf:
        - {$ref: '#/components/schemas/Contact'}
        - type: object
          required: [conversation_count, merged_into, merges]
          properties:
            conversation_count: {type: integer, minimum: 0, description: 'Conversations of the contact, any status, imported ones included'}
            merged_into:
              description: The contact this one was merged into, or null. Its conversations and new mail are there.
              oneOf:
                - {type: 'null'}
                - {$ref: '#/components/schemas/Contact'}
            merges:
              type: array
              description: Contacts merged into this one and not undone, newest first
              items: {$ref: '#/components/schemas/ContactMerge'}
    ContactMerge:
      type: object
      required: [id, contact_id, merged_contact, conversation_ids, merged_by_agent_id, merged_at, undone_at]
      properties:
        id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid, description: The contact that was kept}
        merged_contact: {$ref: '#/components/schemas/Contact'}
        conversation_ids:
          type: array
          description: The conversations the merge moved; undoing it moves back those still on the kept contact
          items: {type: string, format: uuid}
        merged_by_agent_id: {type: [string, 'null'], format: uuid}
        merged_at: {type: string, format: date-time}
        undone_at: {type: [string, 'null'], format: date-time}
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        color: {type: string}
    SavedReplyInput:
      type: object
      required: [title, body]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 20000}
    SavedReply:
      type: object
      required: [id, title, body, created_by_agent_id, created_at, updated_at, last_change]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        created_by_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          description: The latest version of the reply; null only for a reply no history reaches.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyChange'}
    TrashedSavedReply:
      type: object
      required: [id, title, body, created_by_agent_id, created_at, updated_at, last_change, deleted_at, deleted_by, purges_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        created_by_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyChange'}
        deleted_at: {type: string, format: date-time}
        deleted_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        purges_at: {type: string, format: date-time, description: When the reply and its history are deleted for good (30 days after deleted_at).}
    SavedReplyPerson:
      type: object
      required: [agent_id, name]
      properties:
        agent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
    SavedReplyChange:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at]
      properties:
        version: {type: integer, minimum: 1}
        kind:
          type: string
          enum: [baseline, create, edit, delete, restore, undelete]
          description: 'baseline: the reply as it was when history started (edited before, so its author is unknown); restore: an earlier version made current again; undelete: taken out of the trash.'
        restored_from_version: {type: [integer, 'null'], description: The version a restore copied.}
        changed_by:
          description: The person who made the change (or approved the agent request that made it); null for an import or a removed person.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          description: The agent token that made or asked for the change; null when a person made it in the web app.
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid, description: The approved agent request that made the change.}
        created_at: {type: string, format: date-time}
    SavedReplyVersion:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at, title, body]
      properties:
        version: {type: integer, minimum: 1}
        kind: {type: string, enum: [baseline, create, edit, delete, restore, undelete]}
        restored_from_version: {type: [integer, 'null']}
        changed_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        title: {type: string, description: The title after this change.}
        body: {type: string, description: The text after this change.}
    KBCollectionInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string, minLength: 1, maxLength: 120, description: 'Lowercase letters, digits and hyphens in any script; made from the name when left out.'}
        description: {type: string, maxLength: 2000}
        parent_id: {type: [string, 'null'], format: uuid}
        position: {type: integer, minimum: 0, maximum: 1000000, description: 'Its place among its siblings. Left out or 0: after the last sibling once they were ordered by hand, else 0 (by name).'}
    KBCollection:
      type: object
      required: [id, parent_id, name, slug, description, position, article_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        position: {type: integer}
        article_count: {type: integer, description: 'Articles directly in this collection and outside the trash, drafts included.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TrashedKBCollection:
      type: object
      required: [id, parent_id, name, slug, description, position, article_count, created_at, updated_at, deleted_at, deleted_by, purges_at]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        position: {type: integer}
        article_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        deleted_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        purges_at: {type: string, format: date-time, description: When it is deleted for good (30 days after deleted_at).}
    KBArticleInput:
      type: object
      required: [collection_id, title, body_md]
      properties:
        collection_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 300}
        slug: {type: string, minLength: 1, maxLength: 120, description: 'Lowercase letters, digits and hyphens in any script; made from the title when left out.'}
        body_md: {type: string, maxLength: 100000, description: 'The text in Markdown. Of raw HTML the help center shows only a YouTube or Vimeo player, an <iframe> whose src is https://www.youtube.com/embed/<id>, https://www.youtube-nocookie.com/embed/<id> or https://player.vimeo.com/video/<id>; anything else is left out when shown and kept as written.'}
        status: {type: string, enum: [draft, published], default: draft}
        seo_title: {type: string, maxLength: 120, description: 'The page title search engines show; empty uses the article title.'}
        seo_description: {type: string, maxLength: 320, description: 'The meta description search engines show; empty uses the start of the text (160 characters).'}
    KBArticleStatus:
      type: string
      enum: [draft, published]
      description: 'published: on the public help center while it is on. draft: only agents see it.'
    KBArticleChange:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at]
      properties:
        version: {type: integer, minimum: 1}
        kind:
          type: string
          enum: [create, edit, delete, restore, undelete, import, media_replace, ai_exclude, ai_include]
          description: 'restore: an earlier version made current again; undelete: taken out of the trash; import: written by an import from another help desk; media_replace: a library item was replaced in the text, or the replacement undone; ai_exclude, ai_include: AI was kept away from the article, or let read it again (the text did not change).'
        restored_from_version: {type: [integer, 'null'], description: The version a restore copied.}
        changed_by:
          description: The person who made the change (or approved the agent request that made it); null for an import or a removed person.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          description: The agent token that made or asked for the change; null when a person made it in the web app.
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid, description: The approved agent request that made the change.}
        created_at: {type: string, format: date-time}
    KBOrder:
      type: object
      required: [parent_id, collection_ids, article_ids]
      properties:
        parent_id: {type: [string, 'null'], format: uuid, description: 'The collection whose children these are; null for the top.'}
        collection_ids:
          type: array
          maxItems: 1000
          description: Its collections outside the trash, first to last.
          items: {type: string, format: uuid}
        article_ids:
          type: array
          maxItems: 2000
          description: Its articles outside the trash, drafts included, first to last; empty at the top.
          items: {type: string, format: uuid}
    KBArticleSummary:
      type: object
      required: [id, number, collection_id, position, title, slug, status, published_at, author_agent_id, created_at, updated_at, last_change, url]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1, description: 'Never changes and is never reused in the workspace; the help center address is /a/<number>-<slug>.'}
        collection_id: {type: string, format: uuid}
        position: {type: integer, minimum: 0, description: 'Its place in its collection, set with PUT /api/v1/kb/order; 0 until the collection is ordered by hand. Ties go by title, then number.'}
        title: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        published_at: {type: [string, 'null'], format: date-time, description: When it was last published; null for a draft.}
        author_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/KBArticleChange'}
        url:
          type: string
          format: uri
          description: >-
            The public address of the article, `<help center url>/a/<number>-<slug>` (see HelpCenter.url).
            It is the one to put in a reply. The help center shows the article there only while the
            article is published and the help center is on; a new slug is a new address, and the old
            one still leads to the article.
    KBArticleAIExclusion:
      type: object
      required: [at, by]
      properties:
        at: {type: string, format: date-time}
        by:
          description: Who excluded it; null when that person was removed.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
    KBArticleTranslation:
      type: object
      required: [locale, title, body_md, updated_at]
      properties:
        locale: {type: string}
        title: {type: string}
        body_md: {type: string}
        updated_at: {type: string, format: date-time}
    KBArticle:
      type: object
      required: [id, number, collection_id, position, title, slug, status, published_at, author_agent_id, created_at, updated_at, last_change, url, body_md, has_source_html, translations, deleted_at, ai_exclusion, seo_title, seo_description]
      properties:
        ai_drafts_this_month: {type: integer, minimum: 0, description: 'Only when one article is read (GET): the AI reply drafts this UTC month that used it as a source.'}
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        collection_id: {type: string, format: uuid}
        position: {type: integer, minimum: 0}
        title: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        published_at: {type: [string, 'null'], format: date-time}
        author_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/KBArticleChange'}
        url: {type: string, format: uri, description: 'The public address of the article, as in KBArticleSummary.'}
        body_md: {type: string}
        seo_title: {type: string, maxLength: 120, description: 'The page title search engines show; empty uses the article title.'}
        seo_description: {type: string, maxLength: 320, description: 'The meta description search engines show; empty uses the start of the text (160 characters).'}
        has_source_html: {type: boolean, description: An import kept the original HTML; it is in the workspace export and is never shown on the help center.}
        translations:
          type: array
          description: Translations an import brought in. They are kept and exported; the help center does not show them yet.
          items: {$ref: '#/components/schemas/KBArticleTranslation'}
        deleted_at: {type: [string, 'null'], format: date-time, description: Set while the article is in the trash.}
        ai_exclusion:
          description: Null while AI may read the article (when it is published); set while it is excluded from AI.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/KBArticleAIExclusion'}
        missing_media:
          type: array
          description: 'Only in the answer to a save: ids the text names that no item of the media library has (it was purged, or never existed), shown as "Media no longer exists". The save went through.'
          items: {type: string, format: uuid}
    TrashedKBArticle:
      type: object
      required: [id, number, collection_id, position, title, slug, status, published_at, author_agent_id, created_at, updated_at, last_change, url, deleted_at, deleted_by, purges_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        collection_id: {type: string, format: uuid}
        position: {type: integer, minimum: 0}
        title: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        published_at: {type: [string, 'null'], format: date-time}
        author_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/KBArticleChange'}
        url: {type: string, format: uri, description: 'The public address of the article, as in KBArticleSummary.'}
        deleted_at: {type: string, format: date-time}
        deleted_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        purges_at: {type: string, format: date-time, description: When the article and its history are deleted for good (30 days after deleted_at).}
    KBArticleVersion:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at, title, slug, body_md, status, collection_id, seo_title, seo_description]
      properties:
        version: {type: integer, minimum: 1}
        kind: {type: string, enum: [create, edit, delete, restore, undelete, import, media_replace, ai_exclude, ai_include]}
        restored_from_version: {type: [integer, 'null']}
        changed_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        title: {type: string}
        slug: {type: string}
        body_md: {type: string}
        seo_title: {type: string}
        seo_description: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        collection_id: {type: [string, 'null'], format: uuid, description: Null once that collection was deleted for good.}
    KBMedia:
      type: object
      required: [id, kind, content_type, size, sha256, url, name, alt, width, height, duration_ms, codecs, thumbnail_url, poster_url, kept, deleted_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [image, video]}
        content_type: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp, video/mp4, video/webm]}
        size: {type: integer, description: Bytes of the original.}
        sha256: {type: string}
        url: {type: string, description: 'The path to put in an article: /api/v1/kb/images/<id> for an image, /api/v1/kb/media/<id> for a video.'}
        name: {type: string, maxLength: 200, description: What the library shows; empty when nobody named it.}
        alt: {type: string, maxLength: 500, description: An image's alt text or a video's title; the editor offers it when it inserts the item.}
        width: {type: [integer, 'null'], description: Pixels as shown (a photo turned a quarter has width and height swapped); null until the server read them.}
        height: {type: [integer, 'null']}
        duration_ms: {type: [integer, 'null'], description: A video's length; null for an image or when the file does not say.}
        codecs: {type: array, items: {type: string}, description: A video's codecs; empty for an image.}
        thumbnail_url: {type: [string, 'null'], description: 'The thumbnail, /api/v1/kb/media/<id>/thumbnail?v=<version>; a new thumbnail gets a new version. Null while there is none.'}
        poster_url: {type: [string, 'null'], description: 'A video''s still picture, /api/v1/kb/media/<id>/poster/<version>; a new poster is a new URL. Null for an image or a video without one.'}
        kept: {type: boolean, description: The purge never deletes a kept item.}
        deleted_at: {type: [string, 'null'], format: date-time, description: Set while the item is in the library's trash.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/KBMediaUsage'}
        purge_at: {type: string, format: date-time, description: 'When the purge deletes it: set only for an item nobody kept, no article ever saved and the help center does not show; in the trash, for an item no live article and not the help center names.'}
    KBMediaUsage:
      type: object
      required: [articles, trashed_articles, older_versions, help_center]
      properties:
        articles: {type: integer, description: Live articles whose current text or a translation names it; above 0 means in use.}
        trashed_articles: {type: integer, description: Articles in the trash whose current text names it.}
        older_versions: {type: integer, description: Articles where only an older version names it.}
        help_center:
          type: array
          items: {type: string, enum: [logo, favicon]}
          description: >-
            What the help center shows it as; empty when it does not. An item the help center shows is
            in use: it is not listed as unused, Remove unused skips it, and neither the daily purge nor
            Delete forever deletes it (purge answers in_use), even in the trash.
    KBMediaDetails:
      allOf:
        - {$ref: '#/components/schemas/KBMedia'}
        - type: object
          required: [articles]
          properties:
            articles:
              type: array
              items:
                type: object
                required: [id, number, title, status, in_trash, current]
                properties:
                  id: {type: string, format: uuid}
                  number: {type: integer}
                  title: {type: string}
                  status: {type: string, enum: [draft, published]}
                  in_trash: {type: boolean}
                  current: {type: boolean, description: False when only an older version names the item.}
    KBMediaResult:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [trashed, already_in_trash, in_use, not_found, restored, not_in_trash, purged]}
    KBMediaBatchResult:
      type: object
      required: [results, batch_id]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/KBMediaResult'}}
        batch_id: {type: [string, 'null'], format: uuid, description: 'The trash batch the moved items joined, for Undo; null when nothing moved.'}
    KBMediaReplacement:
      type: object
      required: [id, from_media_id, to_media_id, article_ids, translations, skipped_article_ids, created_at, undone_at]
      properties:
        id: {type: string, format: uuid}
        from_media_id: {type: string, format: uuid}
        to_media_id: {type: string, format: uuid}
        article_ids: {type: array, items: {type: string, format: uuid}, description: The articles that got a new version.}
        translations:
          type: array
          items:
            type: object
            required: [article_id, locale]
            properties:
              article_id: {type: string, format: uuid}
              locale: {type: string}
        skipped_article_ids: {type: array, items: {type: string, format: uuid}, description: 'After an undo: the articles (or their translations) that changed since the replacement and kept their text.'}
        created_at: {type: string, format: date-time}
        undone_at: {type: [string, 'null'], format: date-time}
    KBMediaUpload:
      type: object
      required: [id, kind, name, size, offset, part_size, expires_at, media_id, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [video]}
        name: {type: string}
        size: {type: integer, description: The bytes announced.}
        offset: {type: integer, description: The bytes received; the next part starts here.}
        part_size: {type: integer, description: The most bytes one part may carry (8 MiB).}
        expires_at: {type: string, format: date-time, description: The parts are thrown away after this (24 hours after the start).}
        media_id: {type: [string, 'null'], format: uuid, description: The library item once the upload is complete.}
        created_by:
          description: Who started it; null once they left the workspace. Only they, or an admin, cancel it.
          oneOf: [{$ref: '#/components/schemas/SavedReplyPerson'}, {type: 'null'}]
        created_at: {type: string, format: date-time}
    KBMediaUnusedSummary:
      type: object
      required: [count, bytes, kept_count, kept_bytes]
      description: Every unused item the filter selects, not only the page; kept items apart. Bytes count the original and a video's poster.
      properties:
        count: {type: integer}
        bytes: {type: integer}
        kept_count: {type: integer}
        kept_bytes: {type: integer}
    HelpCenterInput:
      type: object
      required: [enabled, title, locale]
      properties:
        enabled: {type: boolean}
        title: {type: string, maxLength: 200, description: Shown at the top of every page; empty uses the workspace name.}
        locale: {type: string, minLength: 2, maxLength: 35, description: 'BCP 47 language tag of the pages, such as en or pt-BR.'}
    HelpCenter:
      type: object
      required: [enabled, title, locale, content_version, updated_at, url]
      properties:
        enabled: {type: boolean}
        title: {type: string}
        locale: {type: string}
        content_version: {type: integer, minimum: 0}
        updated_at: {type: [string, 'null'], format: date-time, description: Null until the knowledge base or its settings were first changed.}
        url:
          type: string
          format: uri
          description: >-
            The public address of the help center, also while it is off: `https://<custom domain>` once
            the workspace's custom domain is active (GET /api/v1/help-center/domain), else
            `<APP_ORIGIN>/help/<slug>` on a self-hosted server, or `https://<slug>.<HELP_CENTER_DOMAIN>/help`
            when the server sets that variable and the slug can be a host name (the root of that host
            leads to the workspace's desk). The older addresses
            redirect to the custom domain while it is active. Changing the workspace slug changes the
            slug addresses, and links to the old slug stop working.
    HelpCenterDomain:
      type: object
      required: [hostname, status, records, created_at, verified_at, checked_at, check_error, certificate_requested_at, failing_since, pending_reason, awaiting_payment]
      properties:
        hostname: {type: [string, 'null'], description: 'The custom host name in ASCII (punycode) form; null when none is set.'}
        status:
          type: string
          enum: [none, pending, active]
          description: >-
            `pending` until a DNS check passes; `active` while the help center serves on it. An active domain
            goes back to `pending` when no check has proved it for 7 days, or when another workspace proves the
            host name while this domain's records do not (`pending_reason` says which).
        records:
          type: array
          description: The DNS records to set at the domain's DNS provider; empty when no domain is set.
          items: {$ref: '#/components/schemas/HelpCenterDomainRecord'}
        created_at: {type: [string, 'null'], format: date-time, description: When this host name was set.}
        verified_at: {type: [string, 'null'], format: date-time, description: When a DNS check first passed.}
        checked_at: {type: [string, 'null'], format: date-time, description: "The last DNS check: the button, the proxy's certificate question or the daily re-check."}
        check_error: {type: [string, 'null'], description: 'Which record the last check did not find when it did not pass; null after a check that passed.'}
        certificate_requested_at: {type: [string, 'null'], format: date-time, description: 'When the reverse proxy was last told it may get a certificate for the host name; recorded at most once an hour.'}
        failing_since:
          type: [string, 'null']
          format: date-time
          description: >-
            While the domain is active: the first failed DNS check since the last one that passed, null while
            checks pass. The first check that fails 7 days after it puts the domain back to `pending`.
        pending_reason:
          type: [string, 'null']
          enum: [proof_lost, taken_over, null]
          description: >-
            Why an active domain went back to `pending`: `proof_lost` (no DNS check proved it for 7 days) or
            `taken_over` (another workspace proved the host name while this domain's records did not). Null
            otherwise; cleared when a check passes or the host name is set again.
        awaiting_payment:
          type: boolean
          description: >-
            True while the workspace is on its trial or locked after it: the domain can be set and verified,
            but the help center serves on it, and the reverse proxy gets its certificate, only once the
            workspace is paid. Until then the help center stays on its own address. Always false on a server
            without billing.
    HelpCenterDomainRecord:
      type: object
      required: [type, name, value, purpose]
      properties:
        type: {type: string, enum: [CNAME, A, AAAA, TXT]}
        name: {type: string, description: The record's full name.}
        value: {type: string}
        purpose:
          type: string
          enum: [route_and_verify, route, verify]
          description: '`route_and_verify`: sends visitors to the help center and proves ownership; `route`: only sends visitors; `verify`: only proves ownership.'
    HelpCenterDomainInput:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: {type: string, minLength: 1, maxLength: 253, description: 'A host name such as help.example.com; Unicode names are accepted and stored in punycode.'}
    HelpCenterThemeColors:
      type: object
      additionalProperties: false
      description: 'Each color is #rrggbb, or null for the default. Any color set makes the pages light only.'
      properties:
        primary: {$ref: '#/components/schemas/ThemeColor'}
        header: {$ref: '#/components/schemas/ThemeColor'}
        header_text: {$ref: '#/components/schemas/ThemeColor'}
        background: {$ref: '#/components/schemas/ThemeColor'}
        text: {$ref: '#/components/schemas/ThemeColor'}
        link: {$ref: '#/components/schemas/ThemeColor'}
        footer: {$ref: '#/components/schemas/ThemeColor'}
    ThemeColor:
      type: [string, 'null']
      pattern: '^#[0-9a-fA-F]{6}$'
      description: 'A color as #rrggbb; answers are lowercase.'
    ThemeFont:
      type: [string, 'null']
      enum: [system-sans, humanist-sans, geometric-sans, classic-serif, transitional-serif, rounded-sans, mono, null]
      description: >-
        A font stack of the reader's own system: nothing is downloaded. Null is the default (system-sans
        for text, classic-serif for headings).
    FreshdeskRedirect:
      type: object
      required: [state, freshdesk_domain, address, keep_weeks, snippet, mapped]
      properties:
        state:
          type: string
          enum: [no_import, own_domain, help_center_off, ask_plan, growth, ready]
          description: >-
            `no_import`: no finished Freshdesk import. `own_domain`: the old help center had its own
            domain; redirect it at DNS. `help_center_off`: turn the help center on first. `ask_plan`:
            send `plan`. `growth`: Freshdesk's Growth plan cannot paste code into the portal, so old
            `*.freshdesk.com` links cannot be redirected; point your own links at the new address.
            `ready`: `snippet` holds the code.
        freshdesk_domain: {type: [string, 'null'], description: 'The imported account, such as acme.freshdesk.com.'}
        address: {type: string, format: uri, description: 'The help center address the snippet redirects to.'}
        keep_weeks: {type: integer, description: 'Keep the Freshdesk account and the snippet at least this many weeks after the switch.'}
        snippet: {type: [string, 'null'], description: 'HTML for the Freshdesk portal head; null unless state is ready.'}
        mapped:
          type: [object, 'null']
          required: [articles, folders, categories, embedded]
          properties:
            articles: {type: integer}
            folders: {type: integer}
            categories: {type: integer}
            embedded: {type: boolean, description: 'False when the knowledge base was too large to embed: the snippet then redirects every old address by its id to the help center, which maps it.'}
    HelpCenterSearchConsoleInput:
      type: object
      additionalProperties: false
      properties:
        google_site_verification: {type: [string, 'null'], maxLength: 100, description: 'The content of Google Search Console''s `google-site-verification` meta tag. Left out: unchanged. Null or empty: removed.'}
        bing_site_verification: {type: [string, 'null'], maxLength: 100, description: 'The content of Bing Webmaster Tools'' `msvalidate.01` meta tag. Left out: unchanged. Null or empty: removed.'}
    HelpCenterSearchConsole:
      type: object
      required: [google_site_verification, bing_site_verification, content_version, updated_at]
      properties:
        google_site_verification: {type: [string, 'null']}
        bing_site_verification: {type: [string, 'null']}
        content_version: {type: integer, minimum: 0}
        updated_at: {type: [string, 'null'], format: date-time, description: Null until the help center settings were first changed.}
    HelpCenterThemeInput:
      type: object
      additionalProperties: false
      properties:
        logo_media_id: {type: [string, 'null'], format: uuid, description: 'An image of the media library shown at the top of every page. Outside its trash, except the image this field already names: a theme read and sent back whole saves even after its logo was moved to the trash.'}
        favicon_media_id: {type: [string, 'null'], format: uuid, description: 'An image of the media library shown as the browser tab icon; the same trash rule as logo_media_id.'}
        logo_alt: {type: [string, 'null'], maxLength: 200, description: 'What the logo says, for screen readers; empty uses the help center title.'}
        linkback_url: {type: [string, 'null'], maxLength: 2000, description: 'Your website, an absolute http or https address, linked from the top of every page.'}
        contact_url: {type: [string, 'null'], maxLength: 2000, description: 'Where readers contact you: an https address or mailto: and one plain email address (no name, no ?subject= or ?bcc=, no %-encoding).'}
        contact_phone: {type: [string, 'null'], maxLength: 40, description: 'A phone number shown in the footer: digits, spaces and + - ( ).'}
        colors: {$ref: '#/components/schemas/HelpCenterThemeColors'}
        body_font: {$ref: '#/components/schemas/ThemeFont'}
        heading_font: {$ref: '#/components/schemas/ThemeFont'}
        custom_css:
          type: [string, 'null']
          description: >-
            CSS served after the theme's colors and fonts on every public page, for details the other
            fields do not cover; empty or null is none. At most 32,768 bytes of UTF-8, counted by the
            server (a character outside ASCII takes 2 to 4 bytes; a JSON schema can only count characters,
            so the limit is not a maxLength here). Refused (422
            `custom_css_refused`, with the line and column) when it could load anything or leave its
            style sheet: `url()` and the image functions (`image()`, `image-set()`, `cross-fade()`,
            `element()`, `src()`, `paint()`), `expression()`, the properties `behavior` and
            `-moz-binding` (a class such as `.behavior` is fine), at-rules other than `@media`,
            `@supports`, `@keyframes`, `@layer` and `@container`, a backslash outside quotes, `</`,
            `<!--`, a control character other than tab, newline, carriage return and form feed, an
            unbalanced bracket, an unclosed string or comment, and `url(`, `@import`, `image-set(`,
            `image(`, `cross-fade(`, `element(`, `src(`, `paint(`, `expression(`, `javascript:` or
            `vbscript:` anywhere once escapes are read. It is stored and served exactly as sent. The contrast checks do not cover it.
    HelpCenterThemeSave:
      description: >-
        The body of a save: the theme with `custom_css` required (null or an empty string for none), so a
        body that leaves it out cannot remove it by accident.
      allOf:
        - {$ref: '#/components/schemas/HelpCenterThemeInput'}
      required: [custom_css]
    HelpCenterTheme:
      type: object
      required: [logo_media_id, favicon_media_id, logo_alt, linkback_url, contact_url, contact_phone, colors, body_font, heading_font, custom_css, content_version, updated_at, checks]
      properties:
        logo_media_id: {type: [string, 'null'], format: uuid}
        favicon_media_id: {type: [string, 'null'], format: uuid}
        logo_alt: {type: string}
        linkback_url: {type: [string, 'null']}
        contact_url: {type: [string, 'null']}
        contact_phone: {type: [string, 'null']}
        colors:
          allOf: [{$ref: '#/components/schemas/HelpCenterThemeColors'}]
          required: [primary, header, header_text, background, text, link, footer]
        body_font: {$ref: '#/components/schemas/ThemeFont'}
        heading_font: {$ref: '#/components/schemas/ThemeFont'}
        custom_css: {type: string, description: 'The custom CSS, empty for none.'}
        content_version: {type: integer, minimum: 0}
        updated_at: {type: [string, 'null'], format: date-time, description: Null until the help center settings were first changed.}
        checks:
          type: array
          description: The contrast of every color pair the pages show, with defaults filled in.
          items: {$ref: '#/components/schemas/ThemeContrastCheck'}
    HelpCenterThemeChecks:
      type: object
      required: [ok, checks, fields]
      properties:
        ok: {type: boolean, description: True when every pair passes and the theme can be saved.}
        checks:
          type: array
          items: {$ref: '#/components/schemas/ThemeContrastCheck'}
        fields:
          type: object
          description: 'One message per failing color, keyed like colors.text; empty when ok.'
          additionalProperties: {type: string}
    HelpCenterThemePreviewInput:
      type: object
      additionalProperties: false
      required: [page, theme]
      properties:
        page: {type: string, enum: [home, article], description: The page to render.}
        theme: {$ref: '#/components/schemas/HelpCenterThemeInput'}
    HelpCenterThemePreview:
      type: object
      required: [html, ok, checks, fields]
      properties:
        html: {type: string, description: 'A whole HTML document with its own Content-Security-Policy, the help center style sheet linked and the brand inline; it holds no script.'}
        ok: {type: boolean, description: True when every pair passes and the theme can be saved.}
        checks:
          type: array
          items: {$ref: '#/components/schemas/ThemeContrastCheck'}
        fields:
          type: object
          description: 'One message per failing color, keyed like colors.text; empty when ok.'
          additionalProperties: {type: string}
    ThemeContrastCheck:
      type: object
      required: [pair, field, foreground, background, ratio, required, passes, suggestion]
      properties:
        pair:
          type: string
          enum: [text_on_background, link_on_background, header_text_on_header, ink_on_primary, footer_ink_on_footer, primary_on_background]
          description: >-
            Which colors meet. ink_on_primary is the button text (white or black, the better one) on the
            primary color; footer_ink_on_footer is the text or header text, the better one, on the footer.
        field: {type: string, description: 'The color to change when it fails, such as colors.text.'}
        foreground: {type: string, pattern: '^#[0-9a-f]{6}$'}
        background: {type: string, pattern: '^#[0-9a-f]{6}$'}
        ratio: {type: number, description: 'WCAG 2 contrast ratio, to two decimals; 4.5 means 4.5:1.'}
        required: {type: number}
        passes: {type: boolean}
        suggestion: {type: [string, 'null'], pattern: '^#[0-9a-f]{6}$', description: 'Null when it passes: else the nearest color for field that passes every pair of that field.'}
    SavedReplyText:
      type: object
      required: [title, body, updated_at]
      properties:
        title: {type: string}
        body: {type: string}
        updated_at: {type: string, format: date-time}
    Conversation:
      type: object
      required: [id, contact_id, contact_name, subject, status, priority, assignee_id, tags, channel, origin, created_at, updated_at, latest_reply_number]
      properties:
        latest_reply_number: {type: integer, minimum: 0, description: 'The reply_number of the newest reply; 0 before the first. Send it as seen_reply_number with a reply.'}
        id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid}
        contact_name: {type: string}
        subject: {type: string}
        status: {$ref: '#/components/schemas/ConversationStatus'}
        priority: {$ref: '#/components/schemas/Priority'}
        assignee_id: {type: [string, 'null'], format: uuid}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        channel: {$ref: '#/components/schemas/ConversationChannel'}
        channel_ref:
          description: The channel the conversation came through and the one its replies leave through; null for one that came through none (started by a team member, imported, a problem report) and has no channel to reply through.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ChannelRef'}
        origin:
          description: Where an imported conversation came from; null for conversations created in Colliedesk.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ConversationOrigin'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ConversationOrigin:
      type: object
      required: [system, external_id, type, source, due_at, first_response_due_at, cc, forwarded_to]
      properties:
        system: {type: string, description: 'Source system, for example freshdesk'}
        external_id: {type: string, description: Ticket id in the source system}
        responder_external_id:
          type: [string, 'null']
          description: >-
            Id of the source agent the ticket was assigned to, so it can be linked to a Colliedesk agent
            later. Missing or null on imports that predate it and when the ticket had no agent.
        type: {type: [string, 'null'], description: Ticket type in the source system}
        source: {type: [string, 'null'], description: 'Channel the ticket came from: email, portal, phone, chat, feedback_widget, outbound_email or other'}
        due_at: {type: [string, 'null'], format: date-time}
        first_response_due_at: {type: [string, 'null'], format: date-time}
        cc: {type: array, items: {type: string}}
        forwarded_to: {type: array, items: {type: string}}
        mailboxes:
          type: array
          items: {type: string}
          description: >-
            The addresses the conversation was sent to at the source, most trusted first; its replies leave
            from the email channel of the first one the workspace has, else the default.
        stats:
          type: object
          description: >-
            What the source helpdesk reported about the ticket (Freshdesk `include=stats`), read once: a
            later import keeps the first values it read and only fills a ticket that has none. Missing on
            imports that predate it, on archived Freshdesk tickets and on other sources. The results page
            reads `resolved_at` for the imported baseline (docs/user/results.md).
          required: [status, resolved_at, first_responded_at, closed_at]
          properties:
            status:
              type: string
              enum: [open, pending, resolved, closed]
              description: The ticket's status, as Colliedesk maps it, when these were read
            resolved_at: {type: [string, 'null'], format: date-time}
            first_responded_at: {type: [string, 'null'], format: date-time}
            closed_at: {type: [string, 'null'], format: date-time}
    BulkConversationUpdate:
      type: object
      required: [ids, changes]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        changes:
          type: object
          minProperties: 1
          properties:
            status: {$ref: '#/components/schemas/ConversationStatus'}
            assignee_id: {type: [string, 'null'], format: uuid}
            add_tag_ids: {type: array, items: {type: string, format: uuid}, maxItems: 50}
            remove_tag_ids: {type: array, items: {type: string, format: uuid}, maxItems: 50}
    BulkConversationUpdateResult:
      type: object
      required: [updated]
      properties:
        updated: {type: integer, minimum: 1}
    ConversationPage:
      type: object
      required: [items, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
    ReplyConflict:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, latest_reply_number, newer_replies]
          properties:
            code: {type: string, enum: [reply_conflict]}
            message: {type: string}
            request_id: {type: string}
            latest_reply_number: {type: integer, minimum: 1, description: Send this as seen_reply_number to send anyway.}
            newer_replies:
              type: array
              description: The replies after the sender's seen_reply_number, oldest first by created_at.
              items: {$ref: '#/components/schemas/Message'}
    PresenceClientID:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: A random id a browser tab makes when the page loads (not stored across reloads), or a fixed name an agent token picks.
    PresenceUpdate:
      type: object
      additionalProperties: false
      required: [client_id, writing]
      properties:
        client_id: {$ref: '#/components/schemas/PresenceClientID'}
        writing: {type: boolean, description: The reply box (not a private note) holds text that is not sent yet.}
        edited: {type: boolean, default: false, description: The reply text changed since the last call; keeps `edited_at` current.}
        hidden: {type: boolean, default: false, description: The tab is in the background; the answer then asks for fewer calls.}
    ConversationViewer:
      type: object
      required: [agent_id, name, writing, writing_since, edited_at, agent_token]
      properties:
        agent_id: {type: string, format: uuid}
        name: {type: string, description: 'Display name, or the email when there is none'}
        writing: {type: boolean, description: A reply not sent yet is open in one of their tabs.}
        writing_since:
          type: [string, 'null']
          format: date-time
          description: When that reply was started; null when not writing.
        edited_at:
          type: [string, 'null']
          format: date-time
          description: When that reply last changed; a reply untouched for minutes is a draft left open, not someone typing. Null when not writing.
        agent_token:
          description: The agent token an AI agent has the conversation open with, acting as `agent_id`; null for a person.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageAgentToken'}
    ConversationPresence:
      type: object
      required: [viewers, heartbeat_seconds]
      properties:
        viewers:
          type: array
          description: Everyone else who has the conversation open, once per person and per agent token, people first then by name. The caller's own tabs are left out.
          items: {$ref: '#/components/schemas/ConversationViewer'}
        heartbeat_seconds: {type: integer, minimum: 1, description: Call again after this many seconds to stay listed.}
    InboxActivity:
      type: object
      required: [now, new_conversations, assigned_to_me, updated, viewing]
      properties:
        now: {type: string, format: date-time}
        viewing:
          type: array
          maxItems: 200
          description: >-
            Who else has a conversation open right now, on every call (the first one included), so the
            inbox list can mark those conversations: the same viewers `PUT
            /api/v1/conversations/{id}/presence` answers, per conversation. The caller's own tabs are left
            out; conversations nobody else has open are not listed.
          items:
            type: object
            required: [conversation_id, viewers]
            properties:
              conversation_id: {type: string, format: uuid}
              viewers:
                type: array
                minItems: 1
                items: {$ref: '#/components/schemas/ConversationViewer'}
        new_conversations:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, subject, contact_name, created_at]
            properties:
              id: {type: string, format: uuid}
              subject: {type: string}
              contact_name: {type: string}
              created_at: {type: string, format: date-time}
        assigned_to_me:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, subject, contact_name, assigned_at, by_ai]
            properties:
              id: {type: string, format: uuid}
              subject: {type: string}
              contact_name: {type: string}
              assigned_at: {type: string, format: date-time}
              by_ai: {type: boolean, description: AI assigned it by itself (a triage suggestion applied automatically).}
        updated:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, subject, contact_name, assignee_id, updated_at, incoming_at]
            properties:
              id: {type: string, format: uuid}
              subject: {type: string}
              contact_name: {type: string}
              assignee_id: {type: [string, 'null'], format: uuid}
              updated_at: {type: string, format: date-time}
              incoming_at:
                type: [string, 'null']
                format: date-time
                description: Time of the newest customer message inside the polled window, or null when the change was not a customer message.
    Message:
      type: object
      required: [id, conversation_id, author_agent_id, author_name, agent_token, agent_request_id, ai_draft_id, ai_draft_outcome, kind, body, body_html, origin, attachments, cc, created_at, delivery, email, reply_number]
      properties:
        channel_id: {type: [string, 'null'], format: uuid, description: The channel that carried the message; null for a note and for messages stored before channels were recorded.}
        other_contact_id: {type: [string, 'null'], format: uuid, description: 'A customer message moved into a conversation of another contact: the contact whose conversation it came from. A reply suggests no copy to them, and replies never go to them.'}
        intake_reply_kind: {type: [string, 'null'], enum: [substantive, acknowledgement, null], description: 'What intake said a chat customer''s message added to the conversation it joined: acknowledgement (a thank-you, an "ok") kept a resolved conversation resolved and asked for no automatic draft. Null when intake did not say.'}
        external_id: {type: [string, 'null'], description: 'The message''s id on its channel, prefixed by the type ("email:<Message-ID>").'}
        channel_meta:
          type: [object, 'null']
          additionalProperties: true
          description: What the channel knows of the message beyond the email envelope (for example files that could not be fetched, files_failed).

        ai_draft_id: {type: [string, 'null'], format: uuid, description: The AI draft the reply was written from.}
        ai_draft_outcome: {type: [string, 'null'], enum: [sent_unchanged, sent_edited, null], description: 'Whether the reply kept the draft''s words (sent_unchanged, 90 % or more) or was edited; null without a draft.'}
        reply_number:
          type: [integer, 'null']
          minimum: 1
          description: The replies of a conversation numbered 1, 2, 3... in the order they were stored (an imported reply gets the next number whatever its time); null for a note or a customer message.
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        author_agent_id: {type: [string, 'null'], format: uuid}
        author_name: {type: [string, 'null'], description: 'Who wrote the message: the name stored with an imported message, else the team member''s display name (or email), else for incoming mail the conversation contact''s name when the contact sent it; null when none applies'}
        agent_token:
          description: The agent token the message was written with; null for what a person wrote and for incoming mail.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageAgentToken'}
        agent_request_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The agent request whose approval sent this message (a reply draft): `agent_token` drafted it,
            `author_agent_id` approved and sent it. Null otherwise.
        kind: {type: string, enum: [incoming, outgoing, note]}
        body: {type: string}
        body_html:
          type: [string, 'null']
          description: >-
            Original HTML of an imported or incoming email. Untrusted content: render it only in a
            sandboxed frame that runs no scripts. For a signed-in person, every remote `<img src>` is
            rewritten to `/api/v1/mail-image` (the image proxy) and `srcset` is removed, so the frame
            can load images from the Colliedesk origin and nowhere else. An agent token reads the HTML
            as stored.
        origin:
          description: Where an imported message came from; null for messages written in Colliedesk.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageOrigin'}
        attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        cc:
          description: Addresses an outgoing reply was copied to; empty for every other message.
          allOf: [{$ref: '#/components/schemas/CopiedAddresses'}]
        created_at: {type: string, format: date-time}
        delivery:
          description: Email delivery of an outgoing reply; null when the reply was not emailed.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageDelivery'}
        email:
          description: Envelope details of an incoming email; null for messages that did not arrive by email.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/IncomingEmail'}
    MessageAgentToken:
      type: object
      required: [id, label, scope, agent_name]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, description: 'Name the token was given when it was created, for example Claude Code'}
        scope: {$ref: '#/components/schemas/TokenScope'}
        agent_name: {type: string, description: 'Display name, or the email when there is none, of the agent the token acts as'}
    CopiedAddresses:
      type: array
      maxItems: 10
      description: Plain email addresses copied on a reply, lowercase, without duplicates.
      items: {type: string}
    MessageOrigin:
      type: object
      required: [system, external_id, kind, from, to, cc, bcc]
      properties:
        system: {type: string}
        external_id: {type: string}
        author_external_id:
          type: [string, 'null']
          description: >-
            Id of the source agent who wrote the item, so it can be linked to a Colliedesk agent later.
            Missing or null on imports that predate it and when a customer wrote it.
        kind:
          type: string
          enum: [description, reply, incoming, automated_response, private_note, public_note, forward, forwarded_email, other]
          description: >-
            How the source system classified the item. public_note was visible to the customer there;
            forward went to a third party, not to the customer; automated_response is an automatic reply
            from the customer side (an out-of-office or a messenger acknowledgement) that the source
            flagged, which the timeline folds into one line.
        from: {type: [string, 'null']}
        to: {type: array, items: {type: string}}
        cc: {type: array, items: {type: string}}
        bcc: {type: array, items: {type: string}}
    TimeEntry:
      type: object
      required: [id, conversation_id, agent_id, agent_name, minutes, note, billable, executed_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        agent_id: {type: [string, 'null'], format: uuid}
        agent_name: {type: string}
        minutes: {type: integer, minimum: 0}
        note: {type: string}
        billable: {type: boolean}
        executed_at: {type: string, format: date-time}
    Attachment:
      type: object
      required: [id, message_id, filename, content_type, size, sha256, inline, created_at]
      properties:
        id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        filename: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        inline:
          type: boolean
          description: >-
            True when the bytes are embedded in the message's `body_html` (an inline image shown in the
            formatted message), so the message view need not list the file again. The file stays stored and
            downloadable. Set by the server only when the image was actually embedded.
        created_at: {type: string, format: date-time}
    DeliveryStatus: {type: string, enum: [queued, sent, failed]}
    MessageDelivery:
      type: object
      required: [status, attempts, last_error, sent_at]
      properties:
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        reason_code:
          type: [string, 'null']
          description: >-
            A fixed code beside last_error: channel_off (the channel was off; retry once it is on),
            channel_not_connected (no channel of the type that carries the reply was connected, a web form
            without email; retry once it is), channel_removed, no_recipient (the customer has no address on
            the channel), bounced, gave_up, mailbox_server_config (a queued reply waits because Microsoft refused
            this server's own app credentials; the operator must update microsoft.client_secret in the operator console, and
            reconnecting does not help), mailbox_switched_off (a queued reply waits because the operator switched
            Gmail or Microsoft 365 off; it is sent once it is on again), mailbox_not_configured (a queued reply
            waits because the server lost a setting its connected provider needs; it is sent once the setting is back;
            on a server that runs no email outbox at all, no SMTP relay and no provider set up, the reply fails at once
            with this code and Retry sends it once the setting is back).
            Null for most email failures, whose words are in last_error.
        attempts: {type: integer, minimum: 0}
        last_error:
          type: [string, 'null']
          description: >
            Why a failed or retried delivery did not go out. On a sent reply, names the copied (Cc)
            addresses it did not reach: refused by the relay or bounced later. A copy that misses
            never fails the reply to the contact.
        sent_at: {type: [string, 'null'], format: date-time}
    EmailAuthentication:
      type: string
      enum: [pass, fail, none]
      description: Upstream SPF/DKIM/DMARC verdict from Authentication-Results; `none` when no verdict was present.
    IncomingEmail:
      type: object
      required: [from, authentication, attachments, original_attachment_id]
      properties:
        from: {type: string}
        authentication: {$ref: '#/components/schemas/EmailAuthentication'}
        via:
          type: string
          enum: [platform, workspace, web_form]
          description: >-
            Door the message came through; absent on mail stored before this was recorded. `web_form`
            is text typed into the public web form: the address is unverified (authentication `none`).
            Trial replies need `platform`.
        cc:
          type: array
          description: >-
            Other addresses on the Cc line of the email (not the sender, not our own addresses), as the
            reply box offers them to copy. Absent on mail stored before Cc was kept.
          items: {type: string}
        original_attachment_id:
          type: [string, 'null']
          format: uuid
          description: >-
            Attachment holding the complete raw message, gzip-compressed (original-message.eml.gz).
            Null for mail received before raw messages were kept.
        attachments:
          type: array
          description: >-
            Names of the files in the message. Their bytes are in the message's `attachments` (mail received
            before attachments were stored lists names only).
          items:
            type: object
            required: [filename, content_type]
            properties:
              filename: {type: string}
              content_type: {type: string}
    ForwardingConfirmation:
      type: object
      required: [code, confirm_url, received_at, conversation_id]
      properties:
        code: {type: string, description: "The confirmation code the provider asks for, digits only."}
        confirm_url: {type: [string, 'null'], format: uri, description: "Google's confirmation link; null unless the sender check passed and the host is Google's."}
        received_at: {type: string, format: date-time}
        conversation_id: {type: string, format: uuid, description: The conversation the confirmation email opened.}
    TestMessageResult:
      type: object
      required: [conversation_id, message_id, sent_to]
      properties:
        conversation_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        sent_to: {type: string, format: email, description: "The agent's own address the test came from, where a reply to it is delivered."}
    EmailChannel:
      type: object
      required: [support_address, sender_name, secret_set, secret_rotated_at, domain, domain_verified_at, dns_record_name, dns_record_value, dns_records, dns_records_expired_at, created_at, updated_at]
      description: >
        One email channel. Its domain's verification and provider domain belong to the domain: two channels
        of the workspace on one domain show the same, verify it once and share one provider domain.
      properties:
        channel_id: {type: string, format: uuid, description: The channel these settings belong to.}
        support_address: {type: string, format: email}
        sender_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            The name customers see in the From line of every reply this channel sends (with " via Colliedesk"
            while the domain is not verified) and in Reply-To. Renaming the workspace does not change it.
        secret_set: {type: boolean}
        dns_records:
          type: array
          description: >
            Records to publish when the server verifies domains through its email provider
            (`domain_verification` is `provider`), with the provider's last reported status for each.
            Empty when it uses the TXT record above, or before the provider has created the domain.
          items: {$ref: '#/components/schemas/EmailDNSRecord'}
        dns_records_expired_at:
          type: [string, 'null']
          format: date-time
          description: >
            Set when the provider domain stayed unverified for 7 days and was released, so `dns_records` is empty.
            Verifying again creates a new one and clears this.
        secret_rotated_at: {type: [string, 'null'], format: date-time}
        domain: {type: string}
        domain_verified_at: {type: [string, 'null'], format: date-time}
        dns_record_name: {type: string, description: TXT record name that proves control of the domain}
        dns_record_value: {type: string, description: Value the TXT record must hold}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EmailSendingPause:
      type: object
      required: [paused_at, reason]
      properties:
        paused_at: {type: string, format: date-time}
        reason: {type: string, description: The complaint count and rate that caused the pause}
    EmailDNSRecord:
      type: object
      required: [record, type, name, value, priority, status]
      properties:
        record: {type: string, description: 'Purpose of the record as the provider names it, for example SPF or DKIM'}
        type: {type: string, description: 'DNS record type, for example TXT, CNAME or MX'}
        name: {type: string, description: Host name to publish the record under}
        value: {type: string}
        priority: {type: [integer, 'null'], description: MX priority; null for other types}
        status: {type: string, description: 'Provider status, for example not_started, pending, verified, failed'}
    SMTPStatus:
      type: object
      required: [configured, host, port, starttls, authenticated]
      properties:
        configured: {type: boolean}
        host: {type: string}
        port: {type: integer}
        starttls: {type: boolean}
        authenticated: {type: boolean}
    EmailChannelSettings:
      type: object
      required: [channel, inbound_url, smtp, from_policy, sending_from, hosted_address, domain_verification, sending_pause, gmail, microsoft]
      properties:
        gmail: {$ref: '#/components/schemas/GmailSettings'}
        microsoft: {$ref: '#/components/schemas/MicrosoftSettings'}
        sending_pause:
          description: >
            Set when the workspace's email sending is paused after spam complaints (3 or more in 7 days and
            more than 0.3% of the replies sent). Replies can still be written; they stay queued with a
            note until an operator resumes sending with `collie email resume`. Admins cannot clear it.
          oneOf:
            - {type: 'null'}
            - $ref: '#/components/schemas/EmailSendingPause'
        domain_verification:
          type: string
          enum: [txt, provider]
          description: >
            How the support address domain is verified. `txt`: publish `channel.dns_record_name` and
            `channel.dns_record_value`. `provider`: publish the records in `channel.dns_records`, which
            give replies a DKIM signature for the domain.
        hosted_address:
          type: [string, 'null']
          description: >
            Forwarding address of this email channel on the hosted cloud, `<local>@<slug>.<HOSTED_MAIL_DOMAIN>`:
            `support@` for the workspace's first channel (and while none is connected), a local part of its own
            for a channel added beside it. Null when the server has no HOSTED_MAIL_DOMAIN (self-host) or the slug cannot be a mail
            subdomain; change the slug with `PATCH /api/v1/workspace/slug`.
        from_policy:
          type: string
          enum: [verified, any]
          description: '`verified`: send as the support address only after domain verification. `any`: always (operator owns the relay).'
        sending_from:
          type: [string, 'null']
          description: >-
            The From address replies use now; null when replies cannot be emailed. With a mailbox connected (Gmail
            or Microsoft 365) it is that address, and null while that connection has failed (replies never fall back
            to SMTP then).
        channel:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/EmailChannel'}
        inbound_url: {type: string, format: uri}
        smtp: {$ref: '#/components/schemas/SMTPStatus'}
    GmailSettings:
      type: object
      required: [available, missing_settings, off_reason, redirect_uri, connection]
      properties:
        available:
          type: boolean
          description: Whether this server can connect Gmail (its operator set the Google OAuth client and token keys, and has not switched Gmail off).
        missing_settings:
          type: array
          maxItems: 0
          deprecated: true
          items: {type: string, enum: [GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, MAILBOX_TOKEN_KEYS]}
          description: Always empty; a workspace never reads the server's setting names. Read off_reason.
        off_reason: {$ref: '#/components/schemas/FeatureOffReason'}
        redirect_uri:
          type: string
          format: uri
          description: The redirect URI to register on the OAuth client in Google Cloud console.
        connection:
          description: The channel's Gmail connection; null when it has none (or sends through Microsoft 365).
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MailboxConnection'}
        address_matches:
          type: boolean
          description: >-
            Only with a connection: whether its account is the channel's support address mailbox. A connection
            made before Gmail had to match keeps sending; connect it again with the support address to fix it.
    MicrosoftSettings:
      type: object
      required: [available, missing_settings, off_reason, redirect_uri, admin_consent_redirect_uri, admin_consent_url, large_attachment_bytes, server_credentials_refused, connection]
      properties:
        available:
          type: boolean
          description: Whether this server can connect Microsoft 365 (its operator registered an app in Microsoft Entra and set the token keys, and has not switched it off).
        missing_settings:
          type: array
          maxItems: 0
          deprecated: true
          items: {type: string, enum: [MICROSOFT_OAUTH_CLIENT_ID, MICROSOFT_OAUTH_CLIENT_SECRET, MAILBOX_TOKEN_KEYS]}
          description: Always empty; a workspace never reads the server's setting names. Read off_reason.
        off_reason: {$ref: '#/components/schemas/FeatureOffReason'}
        redirect_uri:
          type: string
          format: uri
          description: The Web redirect URI to register on the app in Microsoft Entra.
        admin_consent_redirect_uri:
          type: string
          format: uri
          description: The second redirect URI to register, where an organization's admin returns after approving Colliedesk.
        admin_consent_url:
          type: [string, 'null']
          format: uri
          description: >-
            The address to send an organization's Microsoft 365 admin when Microsoft says the person needs an
            admin's approval; after the admin approves, the person connects again. Null when Microsoft 365 is not
            available or the server accepts personal accounts only.
        large_attachment_bytes:
          type: integer
          description: >-
            From this total size of files the web app warns that Microsoft may refuse the reply. Microsoft
            documents no limit for sending; a refused reply fails with the reason and keeps its files.
        server_credentials_refused:
          type: boolean
          description: >-
            True while a reply of this channel waits because Microsoft refused this server's own app credentials
            (microsoft.client_secret wrong or expired). The connection is fine; the operator must update the
            secret, and reconnecting does not help. False while the server lacks its Microsoft settings (available is
            false): off_reason says why.
        connection:
          description: The channel's Microsoft 365 connection; null when it has none (or sends through Gmail).
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MailboxConnection'}
        address_matches:
          type: boolean
          description: 'Only with a connection: whether its mailbox is the channel''s support address.'
    MailboxConnection:
      type: object
      required: [provider, address, status, error_code, error, failed_at, connected_at]
      properties:
        provider: {type: string, enum: [google, microsoft]}
        address: {type: string, format: email, description: The mailbox replies are sent from.}
        status:
          type: string
          enum: [connected, failed]
          description: '`failed` when the provider stopped honouring the grant: replies fail with `error` until an admin reconnects.'
        error_code:
          type: [string, 'null']
          enum: [revoked, permission, mailbox_unavailable, null]
          description: >-
            revoked: the provider refuses the grant (access removed, expired, password reset, a sign-in policy).
            permission: the provider refuses to send for it. mailbox_unavailable: the Microsoft account has no
            Exchange Online mailbox any more.
        error: {type: [string, 'null']}
        failed_at: {type: [string, 'null'], format: date-time}
        connected_at: {type: string, format: date-time}
    ChannelType:
      type: string
      pattern: '^[a-z_]{1,40}$'
      description: >-
        A channel type this server runs, by the name its registry gives it. Shipped types: email, web_form, help_chat.
        A test build may run another (the loopback chat stand-in), so a client shows a type it does not know
        by its name. A new type adds its value to the shipped types here and its configuration to ChannelConfig.
    ChannelState:
      type: object
      required: [state, reason_code, message]
      properties:
        state:
          type: string
          enum: [working, waiting, off, needs_attention, not_connected, removed]
          description: >-
            `waiting`: set up, but nothing has arrived on the channel yet (reason `no_message_yet`); it turns
            `working` with the first message received, which proves the way in works.
        reason_code:
          type: [string, 'null']
          description: >-
            Why a channel needs attention, a fixed code the web app explains: email `sending_paused`,
            `cannot_send`, `gmail_broken`, `microsoft_broken`, `domain_unverified`, `no_inbound_secret`; web form `no_origins`; help chat `ai_chat_off`.
            A waiting channel has `no_message_yet`.
        message: {type: [string, 'null']}
    Channel:
      type: object
      required: [id, type, name, enabled, status, summary, capabilities, held_count, unsent_count, last_inbound_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/ChannelType'}
        name: {type: string, minLength: 1, maxLength: 80}
        enabled: {type: boolean}
        status: {$ref: '#/components/schemas/ChannelState'}
        summary: {type: string, description: 'One line under the name: the support address, the allowed origins.'}
        capabilities:
          type: array
          description: Fixed codes of what the channel carries (threads, attachments_in, attachments_out, cc, html, form).
          items: {type: string}
        held_count: {type: integer, minimum: 0, description: Messages that arrived while the channel was off and wait to be opened or discarded.}
        unsent_count: {type: integer, minimum: 0, description: 'Replies whose delivery failed with channel_off; retry them once the channel is on.'}
        last_inbound_at: {type: [string, 'null'], format: date-time}
        is_default: {type: boolean, description: 'Whether this is its type''s default channel: a call, link or address that names no channel uses it.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time, description: 'Only on a removed channel, which only `include_removed=true` lists.'}
    EmailChannelConfig:
      allOf: [{$ref: '#/components/schemas/EmailChannel'}]
      description: The email channel's configuration, as `GET /api/v1/channels/email` shows it.
    WebFormChannelConfig:
      allOf: [{$ref: '#/components/schemas/WebFormSettings'}]
      description: The web form's configuration, as `GET /api/v1/channels/web-form` shows it.
    HelpChatChannelConfig:
      type: object
      required: [channel_id, enabled, greeting, suggestions, instructions, widget_origins]
      description: >-
        The help chat's surface (docs/user/help-chat.md): what the chat says first, the questions it offers, what is added to
        the AI's instructions, and the sites whose pages may embed the chat. The chat answers on the help center's own
        address (`<help center>/chat`); a site embeds it with `<script src="<help center>/chat/widget.js" data-channel="<channel_id>" async></script>`.
      properties:
        channel_id: {type: string, format: uuid}
        enabled: {type: boolean}
        greeting: {type: string, maxLength: 300}
        suggestions: {type: array, maxItems: 4, items: {type: string, maxLength: 120}}
        instructions: {type: string, maxLength: 2000, description: 'Added to the AI''s instructions. The AI still answers only from published articles; instructions cannot add facts.'}
        widget_origins: {type: array, maxItems: 20, items: {type: string}, description: 'Exact origins (scheme://host[:port]) whose pages may embed the chat.'}
    ChannelConfig:
      description: A channel's configuration, by its type.
      oneOf:
        - {$ref: '#/components/schemas/EmailChannelConfig'}
        - {$ref: '#/components/schemas/WebFormChannelConfig'}
        - {$ref: '#/components/schemas/HelpChatChannelConfig'}
    ChannelDetail:
      allOf:
        - {$ref: '#/components/schemas/Channel'}
        - type: object
          required: [config]
          properties:
            config: {$ref: '#/components/schemas/ChannelConfig'}
    ChannelTypeInfo:
      type: object
      required: [type, available, count, default_channel_id]
      properties:
        type: {$ref: '#/components/schemas/ChannelType'}
        available: {type: boolean, description: Whether a channel of the type can be added now.}
        count: {type: integer, minimum: 0, description: How many live channels of the type the workspace has.}
        default_channel_id: {type: [string, 'null'], format: uuid, description: The type's default channel; null while the workspace has none of it.}
    ChannelList:
      type: object
      required: [items, types]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Channel'}}
        types: {type: array, items: {$ref: '#/components/schemas/ChannelTypeInfo'}}
    EmailChannelConfigInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        support_address: {type: string, format: email, maxLength: 254}
        sender_name: {type: string, minLength: 1, maxLength: 100}
    WebFormChannelConfigInput:
      type: object
      additionalProperties: false
      properties:
        allowed_origins: {type: array, maxItems: 20, items: {type: string, maxLength: 200}}
    HelpChatChannelConfigInput:
      type: object
      additionalProperties: false
      minProperties: 1
      description: A field left out is kept.
      properties:
        greeting: {type: string, maxLength: 300}
        suggestions: {type: array, maxItems: 4, items: {type: string, maxLength: 120}}
        instructions: {type: string, maxLength: 2000}
        widget_origins: {type: array, maxItems: 20, items: {type: string, maxLength: 200}}
    ChannelConfigInput:
      description: A channel's configuration as its type takes it.
      oneOf:
        - {$ref: '#/components/schemas/EmailChannelConfigInput'}
        - {$ref: '#/components/schemas/WebFormChannelConfigInput'}
        - {$ref: '#/components/schemas/HelpChatChannelConfigInput'}
    ChannelSettings:
      type: object
      description: >-
        The channel's rules, over its type's defaults: `join_policy` {kind: always_reopen, within_days
        (days), never}, `default_tags`, `default_priority`, `default_assignee_id`, `rate_limits`
        {window_seconds, per_sender, new_conversations, scope: workspace or channel}, `commands` (name to
        {action: open, cancel or reopen; phrases; tags; priority}), `review`, `scopes` (keys the type
        declares; each {mode: all or commands, join_policy, review, gather {quiet_seconds, max_seconds,
        pre_command_seconds}, cut_on_command, unmatched: join_open}), `notices` {received}. Never a secret.
      additionalProperties: true
    ChannelCreate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/ChannelType'}
        name: {type: string, minLength: 1, maxLength: 80}
        enabled: {type: boolean}
        is_default: {type: boolean, description: 'true makes the new channel its type''s default; false is refused (400).'}
        config: {$ref: '#/components/schemas/ChannelConfigInput'}
        settings: {$ref: '#/components/schemas/ChannelSettings'}
    ChannelChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        enabled: {type: boolean}
        is_default:
          type: boolean
          description: >-
            true makes the channel its type's default (recorded as default_changed); the one that was loses
            it. A type keeps a default while it has a channel, so false is refused (400): make another channel
            the default instead.
        config: {$ref: '#/components/schemas/ChannelConfigInput'}
        settings: {$ref: '#/components/schemas/ChannelSettings'}
    ChannelCredentialInput:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,40}$'}
        value: {type: string, minLength: 1, maxLength: 4096}
    ChannelCredential:
      type: object
      required: [name, hint]
      properties:
        name: {type: string}
        hint: {type: [string, 'null'], description: The secret's last four characters.}
    ChannelEvent:
      type: object
      required: [id, at, kind, channel_id, channel_name, channel_type, actor]
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        kind:
          type: string
          enum: [added, renamed, enabled, disabled, config_changed, credential_changed, removed, held_replayed, held_discarded, default_changed, ai_changed]
        channel_id: {type: string, format: uuid}
        channel_name: {type: string}
        channel_type: {type: string}
        actor:
          type: object
          required: [agent_id, name, token_label]
          properties:
            agent_id: {type: [string, 'null'], format: uuid}
            name: {type: [string, 'null']}
            token_label: {type: [string, 'null']}
        fields:
          type: array
          items: {type: string}
          description: 'config_changed: the names of the settings that changed (email support_address, sender_name; web_form allowed_origins; settings for its rules). credential_changed: the name of the secret replaced (email inbound_secret). ai_changed: the AI feature whose level changed (triage, draft, intake); the levels are in the AI history. Never a value. Empty for other kinds.'
        count: {type: [integer, 'null'], description: 'held_replayed and held_discarded: how many messages were opened or discarded.'}
    ChannelEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ChannelEvent'}}
        next_cursor: {type: [string, 'null']}
    HeldReplayInput:
      type: object
      additionalProperties: false
      properties:
        event_ids: {type: array, maxItems: 500, items: {type: string, format: uuid}}
        conversation_id: {type: string, format: uuid}
    HeldReplayResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [status, conversation_id, message_id]
            properties:
              status: {type: string}
              conversation_id: {type: [string, 'null'], format: uuid}
              message_id: {type: [string, 'null'], format: uuid}
    HeldDiscardInput:
      type: object
      additionalProperties: false
      properties:
        event_ids: {type: array, maxItems: 500, items: {type: string, format: uuid}}
    HeldDiscardResult:
      type: object
      required: [discarded]
      properties:
        discarded: {type: integer, minimum: 0}
    ChannelRef:
      type: object
      required: [id, type, name, enabled, deleted, replies_via]
      description: >-
        The channel a conversation came through, and the one its replies leave through (`replies_via`,
        null when none can carry them): its own when its type sends, else the one its replies are pinned to
        (the channel it was started from, or that sent its first reply; an import's source mailbox when the
        workspace has it), else its type's default. A web form's replies leave by email.
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        deleted: {type: boolean}
        replies_via:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, name, enabled]
              properties:
                id: {type: string, format: uuid}
                name: {type: string}
                enabled: {type: boolean}
                instead_of:
                  description: >-
                    The channel the replies would leave from, removed: the default stands in for it. Null
                    otherwise.
                  oneOf:
                    - {type: 'null'}
                    - type: object
                      required: [id, name]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
    ContactIdentity:
      type: object
      required: [channel_id, kind, value, display_name]
      properties:
        channel_id: {type: string, format: uuid}
        kind: {type: string}
        value: {type: string}
        display_name: {type: [string, 'null']}
    InboundEmailResult:
      type: object
      required: [status, reason, conversation_id, message_id, authentication]
      properties:
        status:
          type: string
          enum: [created, threaded, duplicate, dropped, held]
          description: >-
            `held`: the email channel is off. The message is kept in the channel (its original is stored)
            until an admin opens it as a conversation or discards it; nothing is opened meanwhile.
        reason: {type: [string, 'null'], description: 'Why a message was dropped: auto_submitted, bulk, mailer_daemon, own_message, own_address, channel_removed, unknown_recipient (no conversation for a reply+<token>@MAIL_FROM_DOMAIN recipient); why it was held: channel_off.'}
        conversation_id: {type: [string, 'null'], format: uuid}
        message_id: {type: [string, 'null'], format: uuid}
        authentication: {$ref: '#/components/schemas/EmailAuthentication'}
    WebFormSettings:
      type: object
      required: [enabled, allowed_origins, submit_path]
      properties:
        channel_id: {type: string, format: uuid, description: 'The form''s channel; absent while the workspace has no form.'}
        enabled: {type: boolean}
        allowed_origins: {type: array, items: {type: string}, description: 'The origins this form may be posted from; each form has its own, and two forms may list the same.'}
        legacy_slug: {type: boolean, description: 'Whether the workspace''s older address /api/v1/public/forms/<slug> posts to this form: the form the workspace had first keeps it.'}
        submit_path:
          type: string
          description: >
            Path a website posts to; the host is this instance: the older `/api/v1/public/forms/<workspace slug>`
            for the form that has it (`legacy_slug`), else the form's own `/api/v1/public/web-forms/<channel id>`,
            which every form also answers.
    ProblemReportInput:
      type: object
      required: [description]
      additionalProperties: false
      properties:
        description: {type: string, minLength: 1, maxLength: 5000}
        diagnostics: {$ref: '#/components/schemas/ProblemReportDiagnostics'}
    ProblemReportDiagnostics:
      type: object
      description: >
        What the web app gathered in the browser. Ids, routes, status codes and error messages only;
        a query string is dropped from every path and long text is cut. Nothing a customer wrote.
      additionalProperties: false
      properties:
        app_version: {type: string, maxLength: 40}
        user_agent: {type: string, maxLength: 300}
        viewport:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 0, maximum: 20000}
            height: {type: integer, minimum: 0, maximum: 20000}
        page_path: {type: string, maxLength: 300, description: Address path without query or fragment}
        client_errors:
          type: array
          maxItems: 20
          items:
            type: object
            required: [message, source, at]
            properties:
              message: {type: string, maxLength: 2000}
              source: {type: string, maxLength: 100}
              at: {type: string, format: date-time}
        failed_api_calls:
          type: array
          maxItems: 20
          items:
            type: object
            required: [method, route, status, at]
            properties:
              method: {type: string, maxLength: 10}
              route: {type: string, maxLength: 300, description: Route template or path without query}
              status: {type: integer, minimum: 100, maximum: 599}
              request_id: {type: string, maxLength: 64, description: The X-Request-Id of the failed response}
              at: {type: string, format: date-time}
        product_events:
          type: array
          maxItems: 30
          items: {type: string, maxLength: 60}
    OperatorPermission:
