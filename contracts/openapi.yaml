openapi: 3.1.0
info:
  title: Colliedesk API
  version: 0.2.0
  description: >
    Passwordless, workspace-scoped helpdesk API.

    On the hosted cloud (billing enabled) a workspace has a free trial. When the trial ends with no
    paid subscription the workspace is locked: every authenticated route answers 402 with error code
    `workspace_locked`, reads included, except the routes that sign in and out, show and pay the
    plan, export the data (`GET /api/v1/export`), and show or disconnect the email channel. Paying unlocks the
    workspace on the next request. Self-hosted instances have no trial and no lock.

    When a workspace moves to a plan with fewer agents than it has (a change in the billing portal),
    the agents beyond the cap are paused: agents before admins, the most recently added first, never
    the owner (the first admin added). Their requests answer 402 `seat_paused` except
    `GET /api/v1/auth/me`, signing out, the session list and problem reports; a paused admin also keeps
    `GET /api/v1/billing`, the billing portal and checkout. `plan.agents_over` and `plan.seat_paused` of
    `GET /api/v1/auth/me` show it. Access returns once an admin deactivates agents or upgrades.

    An agent token (`POST /api/v1/auth/tokens`) is a bearer credential for an AI agent. It starts with
    `cdk_agent_` and acts as the agent who created it, limited to a tier: `read` (conversations,
    messages, contacts, tags, the team list, and the session, invite and channel settings without
    links or secrets), `draft` (also changes that never reach a customer: status, priority, assignee,
    tags, new tags, private notes, the owner's own timezone), `send` (also outgoing replies, creating,
    renaming and merging contacts, creating conversations, saved replies) or `admin` (also workspace settings, the team, revoking
    invites, channels and sessions, with the creator's admin role while they keep it). A call above the tier,
    and every call to a route that needs approval for every tier (new tokens, invites, granting,
    keeping or taking the admin role, signing out another person, export, billing checkout and portal, disconnecting email, a new inbound secret, the
    workspace address), answers 202 with an agent request a person approves. An invite link, a token
    or the inbound secret is never in an answer to a token. A token is refused as a cookie. A token
    expires 30 days after its last use and never lives longer than one year from its creation. A
    message it writes carries `agent_token`, so a person can tell it from their own.

    Every response carries an `X-Request-Id` header. A proxy's own `X-Request-Id` (8 to 64 characters of
    letters, digits, `.`, `_` and `-`) is kept; otherwise the server makes a 12-character one. The same
    id is on every server log line of the request and in `error.request_id` of an error body, so a
    person reporting a failure can quote it.
servers:
  - url: /
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/config:
    get:
      operationId: getPublicConfig
      security: []
      x-permission: public
      responses:
        '200':
          description: Public instance configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicConfig'}
  /api/v1/auth/cloud/exchange:
    post:
      operationId: exchangeCloudSession
      security:
        - bearerAuth: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_slug: {type: string, minLength: 1}
                label:
                  type: string
                  description: Names the device in the session list, usually the browser user agent. Defaults to "Cloud sign-in".
      responses:
        '200': {$ref: '#/components/responses/Redeemed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The verified email belongs to multiple workspaces
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CloudWorkspaceChoices'}
  /api/v1/auth/cloud/signup:
    post:
      operationId: signUpCloud
      summary: Start a cloud trial
      description: >
        Creates a workspace on a 14 day trial with the verified email of the identity provider's bearer
        token as its first admin, and signs that person in (session cookie, as for the cloud exchange).
        The route exists only on the hosted cloud, where cloud sign-in and billing are both configured;
        everywhere else it answers 404. One trial per mailbox: the email is lowercased, a `+tag` is dropped
        and Gmail dots are ignored, so `Ana.B+x@gmail.com` and `anab@googlemail.com` are the same person.
        At most 3 sign-ups per client address in a rolling 24 hours. The web form also asks what the
        team wants first (`goal`), the person's `role` and where they heard of Colliedesk (`source`);
        each is optional, is stored with the workspace and is counted with the trial. A value outside
        its list answers 400 `invalid_request` and creates nothing.
      security:
        - bearerAuth: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_name]
              additionalProperties: false
              properties:
                workspace_name: {type: string, minLength: 2, maxLength: 60, description: 'Trimmed; 2 to 60 characters.'}
                goal: {$ref: '#/components/schemas/OnboardingGoal'}
                role: {$ref: '#/components/schemas/OnboardingRole'}
                source: {$ref: '#/components/schemas/OnboardingSource'}
      responses:
        '201': {$ref: '#/components/responses/Redeemed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >
            Error code `trial_already_used` (this mailbox already started a trial: sign in instead) or
            `slug_unavailable` (no address was free for the name: try another).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
        '429':
          description: Error code `rate_limited`. This client address already started 3 trials in the last 24 hours.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: Error code `signup_unavailable`. Sign-up is off because SIGNUP_HASH_KEY or TRUSTED_PROXIES is missing on the server (logged at start).
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/auth/redeem:
    post:
      operationId: redeemLink
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1}
                requested_role: {$ref: '#/components/schemas/Role'}
                label: {type: string}
                session_type: {type: string, enum: [cookie, bearer], default: bearer}
      responses:
        '200': {$ref: '#/components/responses/Redeemed'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      x-permission: authenticated
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/me:
    get:
      operationId: getMe
      x-permission: authenticated
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      x-permission: access:read
      responses:
        '200':
          description: Visible sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Session'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: revokeSession
      x-permission: access:read
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/auth/tokens:
    post:
      operationId: createAgentToken
      x-permission: authenticated
      description: >
        Creates a bearer token for an AI agent that acts as the signed-in agent. A `read`, `draft` or
        `send` token has the agent role whatever the creator's role is. An `admin` token acts with the
        creator's role, checked on every call; only an admin may create one (403
        `admin_token_needs_admin` otherwise). A token's call here is an agent request a person approves. It appears in `GET /api/v1/auth/sessions` (for a person) with its label and
        scope, and `DELETE /api/v1/auth/sessions/{id}` revokes it. It expires 30 days after its last
        use, and one year after its creation at the latest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, scope]
              properties:
                label: {type: string, minLength: 1, maxLength: 80, description: 'Name shown in the session list, for example the agent host'}
                scope: {$ref: '#/components/schemas/TokenScope'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The token and its session. The raw token is in this response only.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/invites:
    get:
      operationId: listInvites
      x-permission: access:read
      responses:
        '200':
          description: Invite metadata without secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Invite'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createInvite
      x-permission: access:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role_ceiling]
              properties:
                email: {type: string, format: email}
                role_ceiling: {$ref: '#/components/schemas/Role'}
      description: >
        Creates an invite and returns its one-time URL once. An agent token's call, whatever its tier
        and role ceiling, is filed as an agent request (202): the link is a credential, so only the
        person who approves sees it, once, and the stored request does not keep it.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The invite, and for a person its one-time URL
          content:
            application/json:
              schema:
                type: object
                required: [invite, url]
                properties:
                  invite: {$ref: '#/components/schemas/Invite'}
                  url: {type: string, format: uri}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: >
            The address belongs to a deactivated agent (error code `agent_deactivated`). Reactivate the agent
            in the team list instead of inviting them again.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/auth/invites/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      operationId: revokeInvite
      x-permission: access:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Invite revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations:
    get:
      operationId: listConversations
      x-permission: conversations:read
      description: >
        Every filter narrows the list. A filter that takes several values (comma-separated) matches any
        of them, except `tag` with `tag_match=all`. A value the server does not know answers 400 instead
        of an empty page. Times are RFC 3339 and compared as instants: `*_after` includes the instant,
        `*_before` excludes it. Rows with the same sort key are ordered by id, so pages never repeat or
        skip a row while nothing changes.
      parameters:
        - name: status
          in: query
          description: 'One status or several, comma-separated: open,pending.'
          schema: {type: string, example: 'open,pending'}
        - name: priority
          in: query
          description: 'One priority or several, comma-separated: high,urgent.'
          schema: {type: string, example: 'high,urgent'}
        - name: assignee
          in: query
          description: >-
            Comma-separated. me (the caller), unassigned, anyone (assigned to somebody) or the id of a
            team member of this workspace.
          schema: {type: string, example: 'me,unassigned'}
        - name: tag
          in: query
          description: One tag id or several, comma-separated.
          schema: {type: string}
        - name: tag_match
          in: query
          description: 'any (default): a conversation with one of the tags. all: with every tag.'
          schema: {type: string, enum: [any, all], default: any}
        - name: contact
          in: query
          description: >-
            Only the conversations of this contact (any status unless `status` is given), for the contact's
            history. An id of another workspace's contact returns no rows; a value that is not a UUID answers 400.
          schema: {type: string, format: uuid}
        - name: organization
          in: query
          description: Only conversations of contacts whose organization has this name, ignoring case.
          schema: {type: string, maxLength: 200}
        - name: awaiting
          in: query
          description: >-
            team: the newest message that is not a note came from the customer, so the team owes an
            answer. customer: the newest such message is a reply of the team. A conversation without
            such a message matches neither.
          schema: {type: string, enum: [team, customer]}
        - name: has_pending_draft
          in: query
          description: 'true: an AI agent left a reply draft that waits for a person. false: none waits.'
          schema: {type: boolean}
        - name: delivery_failed
          in: query
          description: 'true: a reply of the conversation could not be delivered by email and was not retried since. false: none.'
          schema: {type: boolean}
        - name: source
          in: query
          description: imported (from another helpdesk) or native (created in Colliedesk).
          schema: {type: string, enum: [imported, native]}
        - name: channel
          in: query
          description: One channel or several, comma-separated (see `ConversationChannel`).
          schema: {type: string, example: 'email,web_form'}
        - {name: created_after, in: query, schema: {type: string, format: date-time}}
        - {name: created_before, in: query, schema: {type: string, format: date-time}}
        - {name: updated_after, in: query, schema: {type: string, format: date-time}}
        - {name: updated_before, in: query, schema: {type: string, format: date-time}}
        - name: sort
          in: query
          description: >-
            updated_desc (default), updated_asc, created_desc, created_asc, priority (urgent first,
            then the most recently updated), waiting_longest (conversations awaiting the team, the
            oldest customer message first, then every other conversation by last update).
          schema: {$ref: '#/components/schemas/ConversationSort'}
        - name: search
          in: query
          description: Words to find in the subject, in any message text, or in the name or email of the contact.
          schema: {type: string, maxLength: 200}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Filtered inbox page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createConversation
      x-permission: conversations:write
      description: >
        Open a conversation with a contact. With only `contact_id` and `subject` it is empty and nothing is
        sent. With `body` it starts with an outgoing reply that is emailed to the contact (and `cc`), in the
        same transaction: when the reply is refused (trial rules, Cc rules, attachment limits, no email
        channel) nothing is stored, not even the conversation. The email carries the subject as written
        (no "Re:") and a Message-ID and reply address that thread the customer's answer back into this
        conversation.


        Send `multipart/form-data` to attach files: fields `contact_id`, `subject`, `body`, one `cc` field
        per address, then repeated `files` parts, with the limits of `POST /conversations/{id}/messages`.
        `cc` follows the rules of a reply. On the trial a new conversation reaches a customer who never
        wrote in, so it is refused with 403 `trial_outbound_restricted` until the sending domain is
        verified or a plan is chosen. A workspace without an email channel answers 409
        `email_channel_missing`. A contact merged into another answers 409 `contact_merged`. A customer
        added with the conversation (`contact`) is written in the same transaction; an address that is
        already a customer answers 409 `contact_exists` with the `contact` to use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              description: Exactly one of `contact_id` and `contact`.
              properties:
                contact_id: {type: string, format: uuid}
                contact:
                  type: object
                  description: >-
                    A customer added with the conversation, in the same transaction (only with `body`). An address
                    that is already a customer answers 409 `contact_exists` with that `contact`, and nothing is stored.
                  required: [name, email]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 200}
                    email: {type: string, format: email}
                subject: {type: string, minLength: 1}
                body: {type: string, minLength: 1, description: 'Markdown source of the first reply; without it the conversation starts empty'}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
          multipart/form-data:
            schema:
              type: object
              required: [subject, body]
              description: Exactly one of `contact_id` and the pair `contact_name`, `contact_email` (a customer added with it).
              properties:
                contact_id: {type: string, format: uuid}
                contact_name: {type: string, minLength: 1, maxLength: 200}
                contact_email: {type: string, format: email}
                subject: {type: string, minLength: 1}
                body: {type: string, minLength: 1, description: Markdown source}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
                seen_reply_number: {type: integer, minimum: 0}
                files:
                  type: array
                  maxItems: 10
                  items: {type: string, format: binary}
            encoding:
              files: {contentType: application/octet-stream}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201': {$ref: '#/components/responses/Conversation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/AttachmentsTooLarge'}
        '429': {$ref: '#/components/responses/TrialOutboundLimit'}
        '507':
          description: The attachments volume is low on disk space; nothing was sent or stored
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    patch:
      operationId: bulkUpdateConversations
      x-permission: conversations:write
      summary: Change up to 50 conversations at once
      description: >
        All or nothing: one transaction. A conversation id that is missing or belongs to another
        workspace answers 404 and changes nothing; the response does not say which id. Status,
        assignee and tags follow the same rules as `PATCH /conversations/{id}`. Tags in
        `remove_tag_ids` are removed, then tags in `add_tag_ids` are added.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkConversationUpdate'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Number of conversations changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkConversationUpdateResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/conversations/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getConversation
      x-permission: conversations:read
      responses:
        '200': {$ref: '#/components/responses/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateConversation
      x-permission: conversations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {$ref: '#/components/schemas/ConversationStatus'}
                priority: {$ref: '#/components/schemas/Priority'}
                assignee_id: {type: [string, 'null'], format: uuid}
                tag_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/Conversation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/tags/{tagId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: tagId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: addConversationTag
      x-permission: conversations:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: removeConversationTag
      x-permission: conversations:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/messages:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listMessages
      x-permission: conversations:read
      responses:
        '200':
          description: Ordered conversation timeline
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Message'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createMessage
      x-permission: conversations:write
      description: >
        Send JSON for a text-only message, or `multipart/form-data` to attach files: fields `kind` and
        `body` plus repeated `files` parts, each with a filename. A message carries at most
        `limits.outgoing_attachments_files` files and `limits.outgoing_attachments_bytes` bytes in total
        (both from `GET /api/v1/config`); more answers 413 and nothing is stored. A reply emails its
        files as attachments; a note never leaves the workspace.


        A reply may copy other people with `cc`: at most 10 plain addresses (`name@example.com`, no
        display name), stored lowercase without duplicates. The conversation contact stays the only
        `To` recipient and is dropped from `cc`; our own support, forwarding and sending addresses are
        refused with 400, and so is `cc` on a note. In `multipart/form-data` send one `cc` field per
        address, before the files. On the trial, `cc` may name only addresses the customer wrote from or
        copied (customer mail through the platform forwarder that did not fail authentication, or
        imported history) unless the sending domain is verified;
        another address answers 403 `trial_outbound_restricted` with `refused_cc` listing every
        refused address, and nothing is stored. Each reply counts its contact and every `cc` address
        against the trial's 200 people a day. A retry of a
        failed delivery sends to the same stored list. There is no Bcc.


        Every reply gets the next `reply_number` of its conversation (`latest_reply_number` of the
        conversation is the newest). Send `seen_reply_number`, the newest reply the sender had seen when
        they started writing, and a reply is refused with 409 `reply_conflict` when someone replied
        since: nothing is stored or sent, and the error lists `newer_replies` (oldest first by
        `created_at`; an imported one keeps its own time and `origin`) and `latest_reply_number`. To send
        anyway, send again with that number. Without `seen_reply_number` nothing is checked; a note is
        never checked. In `multipart/form-data`, send it before the files: a refused reply stores none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: {type: string, enum: [outgoing, note]}
                body: {type: string, minLength: 1, description: Markdown source}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
                seen_reply_number: {type: integer, minimum: 0, description: 'The newest reply number the sender had seen; 0 when there was none.'}
                draft:
                  type: boolean
                  description: >-
                    Agent tokens only, with `kind: outgoing`: file the reply as a reply draft (202) that a
                    person edits, sends or discards, whatever the token's tier. A token below `send` gets a
                    draft without it, and may copy only the contact and addresses already on the
                    conversation (400 otherwise). A person's session answers 400.
          multipart/form-data:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: {type: string, enum: [outgoing, note]}
                body: {type: string, minLength: 1, description: Markdown source}
                cc: {$ref: '#/components/schemas/CopiedAddresses'}
                files:
                  type: array
                  maxItems: 10
                  items: {type: string, format: binary}
            encoding:
              files: {contentType: application/octet-stream}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created reply or private note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: A reply with `seen_reply_number` older than the conversation's latest reply (`reply_conflict`); nothing was stored or sent
          content: {application/json: {schema: {$ref: '#/components/schemas/ReplyConflict'}}}
        '413': {$ref: '#/components/responses/AttachmentsTooLarge'}
        '429': {$ref: '#/components/responses/TrialOutboundLimit'}
        '507':
          description: The attachments volume is low on disk space; nothing was sent or stored
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/conversations/{id}/messages/{messageId}/retry:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: messageId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: retryMessageDelivery
      x-permission: conversations:write
      description: >
        Requeue a reply whose email delivery failed. Only `failed` deliveries can be retried, and only
        while outgoing email can work (SMTP configured, domain verified or a platform sender set); 409 says why not.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Reply with its delivery requeued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TrialOutboundLimit'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email:
    get:
      operationId: getEmailChannel
      x-permission: access:read
      responses:
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: putEmailChannel
      x-permission: access:write
      description: >
        Connect the email channel, change its support address, change its sender name, or both. Send only
        `sender_name` to rename the sender of a connected channel: the address, its domain verification and
        its sending domain stay as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                support_address:
                  type: string
                  format: email
                  description: >
                    Required to connect the channel. Leave it out to keep the current address; a changed
                    address loses its domain verification.
                sender_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: >
                    The name customers see in the From line of every reply. Spaces at the ends are removed;
                    1 to 100 characters without line breaks or other control characters (400 otherwise).
                    On Colliedesk Cloud a name with a well-known brand in it is refused (422).
                    Leave it out to keep the current name; a new channel starts with the workspace name.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteEmailChannel
      x-permission: access:write
      description: Disconnect the email channel. Conversations and messages stay; the inbound secret stops working.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Email channel disconnected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/channels/email/domain-verification:
    post:
      operationId: verifyEmailDomain
      x-permission: access:write
      description: >
        Look up the TXT record `dns_record_name` and mark the support address domain verified when it
        holds `dns_record_value`. When the server has an email provider account (`domain_verification` is
        `provider`), that TXT record is the proof of control and is checked first (409 `dns_record_not_found`
        without it, and the provider is not called). Then the domain is created at the provider on the first
        check and each check asks the provider to re-check: the domain is verified only when the provider
        reports it `verified`, and a 409 `dns_record_not_verified` means the records in
        `channel.dns_records` are not all verified yet. Checks that reach the provider are limited to one per
        workspace every 30 seconds (429 with `Retry-After`). 409 `email_domain_unavailable` is the provider's
        validation refusal of the domain name; any other provider failure is 502.
        Changing the support address resets verification. Agent tokens may
        check 10 times an hour per workspace (429 with `Retry-After`); a person is not limited.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/EmailChannelSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/channels/email/secret:
    post:
      operationId: rotateEmailInboundSecret
      x-permission: access:write
      description: Create or replace the inbound secret. The raw secret is returned once; the previous one stops working.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: New inbound secret, shown once
          content:
            application/json:
              schema:
                type: object
                required: [inbound_secret, inbound_url]
                properties:
                  inbound_secret: {type: string, minLength: 1}
                  inbound_url: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email/gmail:
    post:
      operationId: connectGmail
      x-permission: access:write
      description: >-
        Start connecting the workspace's Gmail account, so replies are sent through the Gmail API from that
        address and kept in its Sent folder. Incoming mail still arrives by forwarding. Answers Google's consent
        address (`url`), valid for 10 minutes, for the person who asked to open in their browser; Google then
        sends that browser to `GET /api/v1/channels/email/gmail/callback`, which finishes only for the same
        signed-in person. Google is asked for `gmail.send` and `openid email` (the address that connected) and
        nothing that reads mail. Connecting again replaces the earlier account and revokes its grant. 409
        `email_channel_missing` without an email channel; 409 `gmail_not_configured` when the server lacks its
        Google settings (`gmail.missing_settings` in the channel settings names them). An agent token gets an
        agent request; the person who approves receives the consent address.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/ConsentLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: disconnectGmail
      x-permission: access:write
      description: >-
        Disconnect Gmail: the grant is removed here and revoked at Google. Replies are then sent the way the
        workspace sent before connecting (SMTP); a reply still queued for Gmail fails with the reason and can be
        retried. A locked workspace may disconnect.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Gmail disconnected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email/gmail/callback:
    get:
      operationId: finishGmailConnect
      security: []
      x-permission: public
      summary: Google's redirect after the consent screen
      description: >-
        Opened by the browser Google redirects, never by an API client. It needs the session cookie of the admin
        who started the connection (a bearer token is not accepted) and the unused `state` of that start; the
        state is looked up in that person's workspace only. Every outcome is a 303 to `/settings`:
        `?gmail=connected`, or `?gmail_error=<reason>` with `signed_out` (no session cookie), `forbidden` (not an
        admin, or the workspace is locked), `expired` (state unknown, used, from another workspace or older than
        10 minutes), `wrong_person` (someone else started it), `denied` (consent cancelled at Google),
        `send_not_granted` (the "send email" permission was unticked), `no_refresh_token`, `no_address` (Google
        named no verified address), `email_channel_missing` and `google_unavailable`. Google's own error text is
        never echoed.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '303':
          description: Back to the settings page, which explains the outcome.
          headers:
            Location: {schema: {type: string}, description: 'The path /settings?gmail=connected or /settings?gmail_error=<reason>.'}
  /api/v1/channels/email/inbound:
    post:
      operationId: receiveInboundEmail
      security: [{inboundSecret: []}]
      x-permission: channels:inbound
      description: >
        Accepts one raw RFC 5322 message from a forwarder (Cloudflare Email Worker, Postmark or SES
        forwarding, an MTA pipe). Authenticated by the workspace inbound secret, not by a session.
        Every accepted outcome is 200 so the forwarder does not retry; the `status` says what happened.
        The server-wide MAIL_FROM_INBOUND_SECRET is also accepted: it is used by the forwarder of
        MAIL_FROM_DOMAIN, and the workspace is taken from the reply+<token>@MAIL_FROM_DOMAIN recipient.
        On the hosted cloud (HOSTED_MAIL_DOMAIN set) the same secret also carries mail for
        `<local>@<workspace slug>.<HOSTED_MAIL_DOMAIN>`: the workspace is taken from the topmost
        `X-Original-To` header, which the forwarder writes from the envelope recipient; To and Cc are never
        used. A recipient under the hosted domain that matches no workspace with a connected email channel
        is answered 404 so the forwarder rejects the message.
        Attachments, inline images and the gzip-compressed raw message are stored with the message;
        a storage failure returns 500 and stores nothing.
      requestBody:
        required: true
        content:
          message/rfc822:
            schema: {type: string}
      responses:
        '200':
          description: Message accepted, threaded, recognised as a duplicate, or dropped by loop protection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboundEmailResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/MailboxClosed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/email/inbound/recipient:
    post:
      operationId: checkInboundRecipient
      security: [{inboundSecret: []}]
      x-permission: channels:inbound
      description: >
        Asked by the hosted-cloud MTA before it accepts RCPT TO, with the server-wide
        MAIL_FROM_INBOUND_SECRET (a workspace secret is refused). 204 when `POST
        /api/v1/channels/email/inbound` would route mail for this address to a workspace with a connected
        email channel, 404 otherwise. Refusing in the SMTP session means an address nobody owns is never
        bounced afterwards to a sender that may be forged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient]
              properties:
                recipient: {type: string, description: Envelope recipient (RCPT TO) address}
      responses:
        '204': {description: Mail for this address would be accepted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/conversations/{id}/time-entries:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listTimeEntries
      x-permission: conversations:read
      description: Time logged on a conversation, oldest first (for example imported from Freshdesk).
      responses:
        '200':
          description: Time entries of the conversation
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TimeEntry'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/conversations/{id}/presence:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: putConversationPresence
      x-permission: conversations:read
      description: >-
        Says that the caller has this conversation open, and whether its reply box holds a reply not
        sent yet (`writing`; the text itself is never sent). The answer lists the other people and AI
        agents who have it open, so one call both announces and reads. A browser tab calls it every
        `heartbeat_seconds` while the conversation is open; a row not renewed in time disappears on its
        own (15 seconds for viewing, 150 seconds with a reply not sent yet, 2 minutes for an agent
        token, which does not call on a schedule). `client_id` names one tab: a person with two tabs
        open has two rows and is listed once. One tab announces one conversation at most every 2
        seconds, and a call that starts or ends a reply (`writing` changes) at most every half
        second: a quicker call is answered 429 `too_many_requests` with `Retry-After` and changes
        nothing. Changes nothing a customer or a teammate wrote, so the read tier is enough for an
        agent token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceUpdate'}
      responses:
        '200':
          description: The others who have the conversation open
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPresence'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429':
          description: This tab announced this conversation too recently (2 seconds, half a second to start or end a reply); nothing changed
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/conversations/{id}/presence/{clientId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: clientId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/PresenceClientID'}
    delete:
      operationId: deleteConversationPresence
      x-permission: conversations:read
      description: >-
        Says that the caller closed the conversation in the tab `clientId` (or, for an agent token,
        stopped working on it). Only the caller's own row is removed; another person's row, an unknown
        `clientId` or one already gone answer 204 the same, so calling it twice is harmless. A browser
        sends it with `fetch` `keepalive` when the tab closes.
      responses:
        '204': {description: The caller's row for this tab is gone}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/inbox/activity:
    get:
      operationId: getInboxActivity
      x-permission: conversations:read
      description: >-
        What changed in the inbox after `since`: conversations created, conversations another agent
        assigned to the caller, and conversations that changed in any way (a new customer message, a
        status, assignee, priority or tag change, a reply or note). `updated` includes the caller's own
        changes; only `incoming_at` marks something to announce. Each list holds at most 50 items,
        newest first; in `updated`, conversations with a customer message in the window come first, so
        a bulk change cannot push a customer reply out of the list. Send the returned `now`
        as the next `since`. A `since` older than 10 minutes is treated as 10 minutes old; an agent who
        was away longer reloads the inbox. A list can repeat an item from the previous call (a short lookback covers conversations that committed late), so the client removes duplicates by id (`updated` items by `id` and `updated_at`). Without `since` the lists are empty and `now` is the first cursor. `viewing` is not a change list: every call, with or without `since`, says who has which conversation open now.
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Inbox activity after the cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxActivity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/attachments/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: downloadAttachment
      x-permission: conversations:read
      description: >-
        Streams the stored bytes of an attachment in the caller's workspace. Always served as a
        download (`Content-Disposition: attachment`) with `application/octet-stream`; the original
        media type is in the attachment metadata on the message.
      responses:
        '200':
          description: Attachment bytes
          headers:
            Content-Disposition: {schema: {type: string}}
            X-Content-SHA256: {schema: {type: string}, description: 'Hex SHA-256 recorded when the file was stored'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/mail-image:
    get:
      operationId: getMailImage
      x-permission: conversations:read
      description: >-
        Serves one remote image of an incoming email on the viewer's behalf, so the sender sees the
        server's address and not the reader's. The address is made by the server: the message list
        rewrites every remote `<img src>` of `body_html` to this route for a signed-in person, with `u`
        (the original URL) and `s` (an HMAC over the workspace and the URL). Only signed addresses are
        served. The server refuses private, loopback, link-local, CGNAT, multicast and metadata
        addresses (also after DNS and on every redirect, at most 3), serves only PNG, JPEG, GIF and
        WebP, or an SVG document (checked from the bytes; an SVG is served with a sandboxing Content-Security-Policy and only ever shown through img), caps an image at 5 MiB, and keeps a fetched
        image per workspace so a second view does not call the source again. An agent token cannot
        use it; it reads the original HTML.
      parameters:
        - {name: u, in: query, required: true, schema: {type: string}, description: Original image URL (http or https).}
        - {name: s, in: query, required: true, schema: {type: string}, description: Hex HMAC signature made by the server.}
      responses:
        '200':
          description: The image
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=2592000, immutable'}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/svg+xml: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The signature is wrong, or the address is private or internal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: The image is over the size limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '415':
          description: The response is not a PNG, JPEG, GIF, WebP or SVG image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: The source could not be reached or answered with an error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Too many images are being fetched; retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/contacts:
    get:
      operationId: listContacts
      x-permission: contacts:read
      parameters:
        - name: search
          in: query
          description: >-
            Keep contacts whose name or email contains this text. A contact merged into another is left
            out; when it matches, the contact it was merged into is returned instead (its conversations
            are there).
          schema: {type: string}
        - name: ids
          in: query
          description: >-
            Comma-separated contact ids (UUIDs), at most 100. Only these contacts of the workspace are
            returned, in name order; an unknown id, or an id of another workspace, is skipped. More than
            100 ids, an empty entry or a value that is not a UUID answers 400 and names the problem.
            Combines with search. Merged contacts are returned when named by id.
          schema: {type: string}
        - name: limit
          in: query
          description: >-
            Return at most this many contacts (1 to 200), the first in name order. Without it every
            matching contact is returned. With it, `has_more` says whether more matched. Any other
            value answers 400.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: Workspace contacts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Contact'}}
                  has_more:
                    type: boolean
                    description: Present only when `limit` was given. True when more contacts matched than were returned.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createContact
      x-permission: contacts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: {type: string, minLength: 1}
                email: {type: string, format: email}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: The address is already a customer (`contact_exists`); `contact` in the error is the contact to use, the one it was merged into when it was merged
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/contacts/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getContact
      x-permission: contacts:read
      description: >-
        The contact, how many conversations it has, the contacts merged into it, and the contact it was
        merged into. Read its conversations a page at a time with `GET /conversations?contact={id}`.
      responses:
        '200':
          description: Contact with conversation history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      operationId: updateContact
      x-permission: contacts:write
      description: >-
        Rename the contact. The name is what the team sees and the display name of the `To` line of
        later emails; the email address does not change. Rename it again to undo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Renamed contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/contacts/{id}/merges:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: mergeContact
      x-permission: contacts:write
      summary: Merge a duplicate contact into this one
      description: >-
        Moves every conversation of the duplicate (`contact_id`) to this contact and marks the duplicate
        as merged into it. Nothing is deleted: the duplicate keeps its name and email, mail from its
        address joins this contact from now on, and replies on the moved conversations go to this
        contact's email. Undo it with `DELETE /contacts/{id}/merges/{mergeId}`. The duplicate must not be
        this contact, merged already, or have contacts merged into it; this contact must not be merged.
        409 `contact_merged` says which.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id]
              properties:
                contact_id: {type: string, format: uuid, description: The duplicate to merge into this contact}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The merge, with the conversations it moved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactMerge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/contacts/{id}/merges/{mergeId}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: mergeId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: unmergeContact
      x-permission: contacts:write
      summary: Undo a merge
      description: >-
        Moves back to the duplicate every conversation the merge moved that is still on this contact, and
        makes the duplicate a contact of its own again. Conversations that arrived after the merge stay
        here. A merge already undone answers 409.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The undone merge
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactMerge'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/agents:
    get:
      operationId: listAgents
      x-permission: access:read
      description: >
        Every agent of the workspace, deactivated ones included (old conversations and messages still name
        them). Clients hide deactivated agents from assignee pickers.
      responses:
        '200':
          description: Workspace team
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TeamMember'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/agents/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateAgent
      x-permission: access:write
      description: >
        Change an agent's display name, role or active state; send at least one of `display_name`, `role`
        and `active`. Renaming is not a change to the admin role, so an `admin` agent token renames anyone
        directly; a rename sent with a role or active change follows the rules of that change. Deactivating an
        agent, in one transaction: sets `deactivated_at`, revokes the agent's sessions and unused sign-in
        links and invites, and moves the agent's open and pending conversations to `reassign_to` (to
        Unassigned when it is absent). Resolved and closed conversations keep their assignee. A
        deactivated agent cannot sign in and holds no seat. Reactivating clears `deactivated_at`, takes a
        seat again and does not restore assignments; the agent signs in through a new link. Sending the
        state an agent already has changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {$ref: '#/components/schemas/DisplayNameInput'}
                role: {$ref: '#/components/schemas/Role'}
                active: {type: boolean}
                reassign_to:
                  type: [string, 'null']
                  format: uuid
                  description: 'Only with `active: false`. An active agent of this workspace other than the one being deactivated; an invalid target is `invalid_reassign_target` and nothing changes.'
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The agent after the change
          content: {application/json: {schema: {$ref: '#/components/schemas/TeamMember'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PlanLimitReached'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >
            The change would leave the workspace without an active admin (error code `last_admin`). Make
            another agent an admin first.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/workspace/timezone:
    patch:
      operationId: updateWorkspaceTimezone
      x-permission: access:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: {type: string, minLength: 1}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated workspace timezone
          content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/workspace/name:
    patch:
      operationId: updateWorkspaceName
      x-permission: access:write
      description: >
        Rename the workspace. The team sees the name in the workspace switcher and Settings. Customers see it
        as the help center title while the help center has no title of its own; replies never carry it,
        because every email channel keeps its own `sender_name`. Spaces at the ends are removed; a name is
        2 to 60 characters without line breaks or other control characters (400 otherwise). On Colliedesk
        Cloud a name with a well-known brand in it is refused (422), as at sign-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 2, maxLength: 60}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Renamed workspace
          content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
  /api/v1/workspace/slug:
    patch:
      operationId: updateWorkspaceSlug
      x-permission: access:write
      description: >
        Rename the workspace slug. On the hosted cloud the slug is the subdomain of the forwarding address
        (`hosted_address`), so mail sent to the old address is rejected from this moment. A slug is 1 to 63
        lowercase letters, digits or inner hyphens and not a reserved name such as `app`, `www` or `mail`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: {type: string, minLength: 1, maxLength: 63}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated workspace
          content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/NameNotAllowed'}
  /api/v1/agents/me/timezone:
    patch:
      operationId: updateAgentTimezone
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: {type: [string, 'null']}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated agent timezone override
          content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/agents/me/display-name:
    patch:
      operationId: updateAgentDisplayName
      x-permission: authenticated
      description: >
        Set the display name of the agent signed in (or the person an agent token acts as). It is shown
        instead of the email address in the team list, on assignments and on notes. An empty string
        clears it, and the email address is shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: {$ref: '#/components/schemas/DisplayNameInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The agent with the new display name
          content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tags:
    get:
      operationId: listTags
      x-permission: conversations:read
      responses:
        '200':
          description: Workspace tags
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createTag
      x-permission: conversations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
                color: {type: string, default: '#64748b'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created tag
          content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/tags/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateTag
      x-permission: conversations:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Renamed tag
          content: {application/json: {schema: {$ref: '#/components/schemas/Tag'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteTag
      x-permission: conversations:write
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Tag deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/saved-views:
    get:
      operationId: listSavedViews
      x-permission: conversations:read
      description: >
        The inbox views the caller can use: the views shared with the whole workspace, then the
        caller's own personal views, each group ordered by name ignoring case. A deleted view is not
        listed here (see `GET /api/v1/saved-views/trash`).
      responses:
        '200':
          description: Saved views
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createSavedView
      x-permission: conversations:write
      description: >
        Saves a set of inbox filters under a name. A personal view is seen only by the person who saved
        it; a shared view by everyone in the workspace, and anyone may change or delete it. Names are
        unique ignoring case among the caller's personal views and among the shared views (409). Each
        person keeps at most 50 personal views and a workspace at most 50 shared ones (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Saved view
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-views/trash:
    get:
      operationId: listDeletedSavedViews
      x-permission: conversations:read
      description: >
        Views deleted in the last 30 days that the caller could see, newest deletion first. Each can be
        restored with `POST /api/v1/saved-views/{id}/restore` until `purges_at`; after that it is gone.
      responses:
        '200':
          description: Deleted saved views
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/saved-views/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateSavedView
      x-permission: conversations:write
      description: >
        Renames a view, replaces its filters or changes who sees it. Send the `updated_at` you last read:
        if someone saved the view since, nothing changes and the answer is 409 `changed_elsewhere`.
        Only the owner of a personal view may change it or share it; making a shared view personal
        gives it to the caller. Another person's personal view answers 404, like a view that does not
        exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewChange'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Changed view
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteSavedView
      x-permission: conversations:write
      description: >
        Moves the view to the trash for 30 days; `POST /api/v1/saved-views/{id}/restore` brings it back.
        No conversation changes. Deleting a view already in the trash answers it unchanged.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The deleted view, with deleted_at and purges_at set
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/saved-views/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreSavedView
      x-permission: conversations:write
      description: >
        Brings a deleted view back; a view that is not in the trash is answered unchanged. Answers 409
        when a live view of the same group now has its name, or the group is full; rename or delete
        that one first.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored view
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedView'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-replies:
    get:
      operationId: listSavedReplies
      x-permission: conversations:read
      description: >
        The saved replies every agent in the workspace shares, ordered by title ignoring case. The
        body may hold the variables `{{customer.name}}` and `{{agent.name}}`; the web app fills them
        in when an agent inserts the reply. The API returns the text as stored. A reply in the trash
        is not listed here (see `GET /api/v1/saved-replies/trash`). `last_change` says who made the
        latest version, and through which agent token or approved agent request.
      responses:
        '200':
          description: Workspace saved replies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedReply'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createSavedReply
      x-permission: conversations:write
      description: >
        Any agent may create one, and a `send` agent token. A lower tier files an agent request a
        person approves. The title is unique among the replies not in the trash, ignoring case (409
        `duplicate_title`). A workspace holds at most 500, counting the ones in the trash (409
        `saved_reply_limit`).
        The new reply has version 1 in its history.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedReplyInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created saved reply
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-replies/trash:
    get:
      operationId: listTrashedSavedReplies
      x-permission: conversations:read
      description: >
        Saved replies deleted in the last 30 days, most recently deleted first, in pages. Each can be
        restored with `POST /api/v1/saved-replies/{id}/restore` until `purges_at`; after that it is
        deleted for good with its history. Replies in the trash count toward the 500 of a workspace.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Saved replies in the trash
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TrashedSavedReply'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/saved-replies/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateSavedReply
      x-permission: conversations:write
      description: >
        Change the title, the body or both. Any agent may edit a shared reply, and a `send` agent
        token; a lower tier files an agent request whose detail shows the reply before and after. Send
        back the `updated_at` you read; when the reply was saved since, nothing changes and the answer
        is 409 `changed_elsewhere`. A taken title is 409 `duplicate_title`. Every edit adds a version
        to the history. A reply in the trash is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                title: {type: string, minLength: 1, maxLength: 200}
                body: {type: string, minLength: 1, maxLength: 20000}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated saved reply
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteSavedReply
      x-permission: conversations:write
      description: >
        Move the reply to the trash. It disappears from the list and the reply box, and can be
        restored for 30 days with `POST /api/v1/saved-replies/{id}/restore`. Send the `updated_at`
        you read: when the reply was saved since, nothing is deleted and the answer is 409
        `changed_elsewhere` (an agent request approved after someone edited the reply fails the same
        way). A `send` agent token may delete; a lower tier files an agent request.
      parameters:
        - {name: updated_at, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Saved reply moved to the trash}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-replies/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreSavedReply
      x-permission: conversations:write
      description: >
        Take a reply out of the trash, as it was when deleted. Send the `updated_at` of the trashed
        reply as you read it (409 `changed_elsewhere` when it changed since). 404 when it is not in the
        trash. 409 `duplicate_title` when another reply took its title meanwhile (rename that one
        first). A `send` agent token may restore; a lower tier files an agent request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored saved reply
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/saved-replies/{id}/versions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listSavedReplyVersions
      x-permission: conversations:read
      description: >
        The versions of a saved reply, newest first, in pages: who made each, through which agent
        token or approved agent request, and the title and text it had. A reply in the trash keeps its
        history. Versions are never changed or removed while the reply exists; restoring one adds a new
        version.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before_version, in: query, description: Only versions older than this one (the next_before_version of the previous page)., schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Versions of the saved reply
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before_version]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedReplyVersion'}}
                  next_before_version: {type: [integer, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/saved-replies/{id}/versions/{version}/restore:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: restoreSavedReplyVersion
      x-permission: conversations:write
      description: >
        Make an earlier version the current one. The title and text of that version become a new
        version; nothing in the history is rewritten. Send back the `updated_at` you read (409
        `changed_elsewhere` when the reply was saved since). 409 `duplicate_title` when another reply
        has that title now. A reply in the trash is 404: restore it from the trash first. A `send`
        agent token may restore; a lower tier files an agent request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Saved reply with the restored text
          content: {application/json: {schema: {$ref: '#/components/schemas/SavedReply'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/billing:
    get:
      operationId: getBilling
      x-permission: billing:manage
      description: >
        The workspace plan, subscription state, the limits of that plan and current usage. Only
        present when billing is configured (the hosted cloud); self-hosted instances answer 404.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Plan, subscription state, limits and usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Billing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/billing/checkout:
    post:
      operationId: createBillingCheckout
      x-permission: billing:manage
      description: >
        Start a hosted checkout for the signed-in workspace. The workspace is taken from the session,
        never from the body. A workspace that already has a paid plan gets 409; it changes or cancels
        its plan in the portal. The `founding` plan gets 409 `founding_closed` once its slots are used up.
        A plan the workspace does not fit gets 409 `plan_does_not_fit` with what to remove: more seats
        (agents and pending invites) than the plan allows, or more stored attachment bytes, imported
        files included, than its storage cap. `checkout_refusals` of `GET /api/v1/billing` lists them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              additionalProperties: false
              properties:
                plan: {$ref: '#/components/schemas/CheckoutPlan'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/BillingLink'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/billing/portal:
    post:
      operationId: createBillingPortal
      x-permission: billing:manage
      description: >
        Open the billing portal, where the customer changes the card, downloads invoices or cancels.
        404 until the workspace has had a subscription. The portal stays available after one ends.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/BillingLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/webhooks/polar:
    post:
      operationId: receivePolarWebhook
      security: [{polarWebhook: []}]
      x-permission: public
      description: >
        Receives Polar events. Authenticated by the Standard Webhooks signature (`webhook-id`,
        `webhook-timestamp`, `webhook-signature`), not by a session; a missing, wrong or stale
        signature is 401 and nothing is stored. A `subscription.*` event updates the workspace named by
        `customer.external_id`. Every understood event is 200 so Polar stops retrying; `status` says
        whether it was applied, was a redelivery, was older than the stored state, or was ignored
        (unknown workspace or product, other event types). Only present when billing is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Event understood
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/webhooks/resend:
    post:
      operationId: receiveResendWebhook
      security: [{resendWebhook: []}]
      x-permission: public
      description: >
        Receives Resend email events. Resend owns the envelope sender and rewrites the Message-ID, so its
        bounces never reach `MAIL_FROM_DOMAIN`; this webhook is how a reply sent through it shows
        **Delivery failed**. Authenticated by the Svix signature (`svix-id`, `svix-timestamp`,
        `svix-signature`), not by a session; a missing, wrong or stale signature is 401 and nothing is
        read. `email.bounced` (permanent) and `email.complained` fail the one reply named by the sender
        `reply+<token>-<reply id>@MAIL_FROM_DOMAIN` (for the older `reply+<token>@` form, only the reply
        whose Message-ID the relay kept) when the event names only the conversation's contact; when it
        names only Cc addresses of the reply, the reply stays sent and the missed copies are added to
        its note. Every understood event is 200 so Resend stops retrying; `status` is `applied`,
        `duplicate` (this `svix-id` was already applied) or `ignored` (other event types, a reply sent as
        a verified support address, no matching reply, the contact next to others or an address the
        reply was not sent to). Only present when
        `RESEND_WEBHOOK_SECRET` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Event understood
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/founding:
    get:
      operationId: getFoundingSlots
      security: []
      x-permission: public
      description: >
        How many of the Founding slots are taken, for the marketing site. Answered from server memory,
        never from the billing provider on the request: `taken` is null until the server has counted
        once after it started. `open` is false once Founding is closed, which is one-way: the slots
        are used up or the product was archived. Only present when billing is configured.
      responses:
        '200':
          description: Founding slot state
          headers:
            Cache-Control:
              schema: {type: string}
              description: '`public, max-age=60`'
            Access-Control-Allow-Origin:
              schema: {type: string}
              description: The marketing site origin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FoundingSlots'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/public/help-center/tls-ask:
    get:
      operationId: askHelpCenterCertificate
      security: []
      x-permission: public
      description: >-
        For the reverse proxy, not for people: Caddy's `on_demand_tls` asks it before getting a
        certificate for a host name it has never seen. It answers 200 only when `domain` is exactly
        one label below `HELP_CENTER_DOMAIN`, that label is a workspace slug that can be a host name,
        the workspace's help center is on and the workspace is not locked. Every other case, and a
        server without `HELP_CENTER_DOMAIN`, is the same 404.
      parameters:
        - name: domain
          in: query
          required: true
          schema: {type: string, maxLength: 253}
      responses:
        '200': {description: The proxy may get a certificate for this host name}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/imports:
    get:
      operationId: listImports
      x-permission: workspace:import
      description: >
        The workspace's in-app imports and undos, newest first (at most 100). Admins only. A job never
        shows its Freshdesk API key; `has_key` says whether the server still holds it.
      responses:
        '200':
          description: Import jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ImportJob'}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: previewImport
      x-permission: workspace:import
      description: >
        Starts an import from Freshdesk by reading the account in the background, before anything is
        written (`state` previewing, then previewed with `preview`, or failed with `error_code`). Poll
        `GET /api/v1/imports/{id}`. The key must be a Freshdesk admin's; it is sealed on the server,
        never returned, and erased when the job ends or when the preview is not started within an
        hour. A new preview discards the workspace's earlier preview. An agent token below the admin
        tier is refused with 403 `credentials_need_admin_token` and nothing is stored: an agent request
        would keep the key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportInput'}
      responses:
        '202':
          description: The preview job, still previewing
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/imports/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getImport
      x-permission: workspace:import
      description: State, progress and preview of one import or undo; the report is at `/report`.
      responses:
        '200':
          description: Import job
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/imports/{id}/start:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: startImport
      x-permission: workspace:import
      description: >
        Imports a previewed account: first the tickets updated in the last `recent_days` (newest first,
        so the team can work on them), then the whole account with its reconcile report. 409
        `import_running` when the workspace already has an import or undo queued, running or waiting;
        409 `import_state` when the job is not previewed, or was previewed more than an hour ago.
      responses:
        '200':
          description: The queued import
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: cancelImport
      x-permission: workspace:import
      description: >
        Stops a job. A preview is discarded; a running import stops within a minute (`cancel_requested`
        until then). What was imported stays: `POST /api/v1/imports/{id}/undo` removes it. The key is
        erased.
      responses:
        '200':
          description: The job
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/key:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: setImportKey
      x-permission: workspace:import
      description: >
        Gives a job in `waiting_key` (the server restarted without a key ring, or its keys changed) the
        Freshdesk API key again; it goes on where it stopped. Refused to agent tokens below the admin
        tier like `POST /api/v1/imports`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api_key]
              properties:
                api_key: {type: string, minLength: 1, maxLength: 200, writeOnly: true}
      responses:
        '200':
          description: The queued job
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/report:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: format
        in: query
        schema: {type: string, enum: [json, markdown], default: json}
    get:
      operationId: getImportReport
      x-permission: workspace:import
      description: >
        The reconcile report of the import (`status` OK, FAILED or UNVERIFIED), or while only the
        recent tickets are in, the interim report (`status` INTERIM, never OK; no Markdown yet). For an
        undo, what it removed. `format=markdown` answers the report as a Markdown file to download.
        404 `report_not_ready` before there is one.
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
            text/markdown:
              schema: {type: string}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/imports/{id}/undo:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: undoImport
      x-permission: workspace:import
      description: >
        Queues an undo of an import that ended (finished, failed or cancelled): it removes what that
        Freshdesk account brought into the workspace, as `collie import undo` does, and keeps what the
        team changed since. Every agent token's call waits for a person's approval.
      responses:
        '202':
          description: The undo job, queued
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ImportJob'}
                  - {$ref: '#/components/schemas/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/people:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listImportPeople
      x-permission: workspace:import
      description: >
        The agents of the import's Freshdesk account and the Colliedesk agent each is linked to. A link
        makes that agent the author of their imported replies and the assignee of the imported tickets
        they held; the preview links the agents whose email matches, and accepting an invite links the
        ones with the invited email. 409 `import_state` before the preview read the account.
      responses:
        '200':
          description: Freshdesk agents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ImportPerson'}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/imports/{id}/people/{externalId}/link:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: externalId
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9]{1,20}$'}
        description: The Freshdesk agent id
    put:
      operationId: linkImportPerson
      x-permission: workspace:import
      description: >
        Links a Freshdesk agent to an active agent of this workspace, replacing an earlier link. Their
        imported replies get that author and the imported tickets assigned to them, unless someone
        reassigned them since, that assignee, within seconds (`pending` until then). Timestamps do not
        change. `DELETE` takes the link back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent_id]
              properties:
                agent_id: {type: string, format: uuid}
      responses:
        '200':
          description: The Freshdesk agent
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportPerson'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: unlinkImportPerson
      x-permission: workspace:import
      description: >
        Takes a link back: the imported replies show the Freshdesk name again and the imported tickets the
        link assigned lose that assignee, unless someone reassigned them since.
      responses:
        '200':
          description: The Freshdesk agent
          content: {application/json: {schema: {$ref: '#/components/schemas/ImportPerson'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/ai:
    get:
      operationId: getAISettings
      x-permission: access:read
      description: >
        The workspace's AI settings: the server's provider (set by the operator; null when the server has
        none), the providers the workspace added (never a key, only its last four characters), each
        feature ("slot": `triage`, `draft`) with its provider, model and whether it is on and can run,
        and the newest 50 changes. Every feature starts off; turning one on is an admin's consent to
        send that feature's ticket data to its provider. Agents can read this; only admins change it.
      responses:
        '200':
          description: AI settings
          content: {application/json: {schema: {$ref: '#/components/schemas/AISettings'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/ai/providers:
    post:
      operationId: addAIProvider
      x-permission: access:write
      description: >
        Adds a provider with the workspace's own key. The server sends one small request to the first
        model and saves the provider only when it answers (`422 ai_check_failed` with `check_error_code`
        otherwise: auth, permission, model_not_found, blocked_address, quota_exhausted…; nothing is saved).
        The key is sealed and never returned. At most 5 providers (409 `ai_provider_limit`); a name is
        unique in the workspace (409 `ai_provider_name_taken`). Without `MAILBOX_TOKEN_KEYS` the server
        cannot store a key (409 `secret_keys_missing`). An OpenAI-compatible base URL must be public https
        unless the operator set `AI_ALLOW_PRIVATE_BASE_URLS=1`. At most 10 checks a minute per workspace
        (429 `ai_checks_rate_limited`). An agent token below the admin tier is refused with 403
        `credentials_need_admin_token`: an agent request would keep the key.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AIProviderInput'}}}
      responses:
        '201':
          description: The provider, checked
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AICheckFailed'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/ai/providers/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateAIProvider
      x-permission: access:write
      description: >
        Renames a provider or changes its models. A new first model is checked before it is saved (422
        `ai_check_failed`, nothing changes). A model a feature uses cannot be removed (409
        `ai_model_in_use`). The base URL never changes: the stored key and the features' data would go to
        a new address without anyone entering the key or turning the features on again. Add the new
        address as another provider instead.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AIProviderChange'}}}
      responses:
        '200':
          description: The provider
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AICheckFailed'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
    delete:
      operationId: removeAIProvider
      x-permission: access:write
      description: >
        Deletes a provider and erases its key now. The features that used it turn off and stay off
        (`turned_off`): switching them to another provider would change who receives the data. To undo,
        add the provider again. Its usage history stays.
      responses:
        '200':
          description: The features that turned off
          content:
            application/json:
              schema:
                type: object
                required: [turned_off]
                properties:
                  turned_off: {type: array, items: {$ref: '#/components/schemas/AISlotName'}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai/providers/{id}/key:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: setAIProviderKey
      x-permission: access:write
      description: >
        Replaces a provider's key. The new key is checked first; when the check fails nothing changes and
        the old key keeps working (422 `ai_check_failed`). An agent token below the admin tier is refused
        with 403 `credentials_need_admin_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [api_key]
              properties:
                api_key: {type: string, minLength: 1, maxLength: 500}
      responses:
        '200':
          description: The provider with its new key's last four characters
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AICheckFailed'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/ai/providers/{id}/check:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: checkAIProvider
      x-permission: access:write
      description: >
        Sends one small request to the provider's first model and records the result on the provider
        (`check_status` ok or failing with `check_error_code`). The call is billed by the provider and
        counted in usage as a check. At most 10 checks a minute per workspace.
      responses:
        '200':
          description: The provider with the check's result
          content: {application/json: {schema: {$ref: '#/components/schemas/AIProvider'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/AIChecksRateLimited'}
  /api/v1/ai/slots/{slot}:
    parameters:
      - {name: slot, in: path, required: true, schema: {$ref: '#/components/schemas/AISlotName'}}
    put:
      operationId: setAISlot
      x-permission: access:write
      description: >
        Sets one feature: where it runs (`server`, `provider` with `provider_id`, or `none`), the model
        (the provider's first when left out), effort, and on or off. Turning a feature on, or moving it to
        another provider while it is on, records the person's consent: that feature's ticket data goes to
        that provider from now on. Every agent token's call becomes an agent request a person approves.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AISlotInput'}}}
      responses:
        '200':
          description: The feature
          content: {application/json: {schema: {$ref: '#/components/schemas/AISlot'}}}
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/export:
    get:
      operationId: exportWorkspace
      x-permission: workspace:export
      description: >-
        Streams every record of the caller's workspace as one ZIP archive (format `colliedesk-export`
        version 1, documented in `docs/user/export.md`): `manifest.json`, one NDJSON file each for
        agents, contacts, tags and conversations (with their messages, notes, tag ids and time
        entries), and the attachment files. Admins only. Works on self-hosted installs and in every
        plan state, including a read-only workspace. Sessions, pairing links, channel secrets and
        billing data are never exported. The archive is built while it is sent; if the server
        cannot finish it (for example a stored file is lost) the connection is aborted, so a
        truncated ZIP without `manifest.json` means the export failed. A client that stops reading
        is cut off after a write timeout (60 s by default), and no export runs longer than 2 hours. Only one export of a workspace runs at
        a time (409 until it has sent its last byte), and a server runs at most two exports at once
        (429 with `Retry-After`).
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The workspace archive
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="colliedesk-<slug>-<UTC yyyymmddThhmmssZ>.zip"'}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: The server is already running as many exports as it allows; retry later
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/channels/web-form:
    get:
      operationId: getWebForm
      x-permission: access:read
      description: State of the public web form channel. A workspace that never set it up has it off.
      responses:
        '200': {$ref: '#/components/responses/WebFormSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: putWebForm
      x-permission: access:write
      description: >-
        Turn the public web form on or off and replace its allowed origins. Turning it off keeps the
        origins, so turning it on again needs nothing else. Origins are exact (`scheme://host[:port]`,
        http or https), at most 20, with no path, wildcard or credentials; they are lowercased and
        de-duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, allowed_origins]
              properties:
                enabled: {type: boolean}
                allowed_origins:
                  type: array
                  maxItems: 20
                  items: {type: string}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200': {$ref: '#/components/responses/WebFormSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/public/forms/{workspace_slug}:
    parameters:
      - name: workspace_slug
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: submitWebForm
      security: []
      x-permission: public
      description: >-
        Public, unauthenticated. A website posts a visitor's email (and optionally a message) and the
        workspace gets a conversation: the visitor becomes a contact (found by email), the text is an
        incoming message, the subject is `Web form: <source>` (or `Web form`) and the tag is
        `web-form`. Nothing is sent to the visitor. The body must be `application/json`. A filled
        `website` field is a bot trap: the answer is the same 202 and nothing is stored. An unknown
        workspace, a form that is off and a locked workspace all answer the same 404. Browsers may
        read the answer only from an origin on the workspace's allowed list (CORS). At most 5
        submissions per client address and workspace per minute, and 30 requests per client address
        per minute across all forms; a workspace also accepts at most 50 form conversations per 10
        minutes, counted apart from email. Fields the form does not know are ignored. The message
        is marked `email.via = web_form` with authentication `none` (unverified address).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
                message: {type: string, maxLength: 5000}
                source: {type: string, maxLength: 100, description: 'Where the form sits, for example site:updates'}
                website: {type: string, description: Honeypot; leave empty}
      responses:
        '202':
          description: Accepted (also for a honeypot hit)
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}, description: Set only for an allowed origin}
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415':
          description: The body is not application/json
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Invalid input; `error.fields` names each bad field
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: Too many submissions; retry after the `Retry-After` seconds
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
    options:
      operationId: preflightWebForm
      security: []
      x-permission: public
      description: CORS preflight. 204 with the allow headers for an allowed origin; every other case is the same 404 as a missing form.
      responses:
        '204':
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin: {schema: {type: string}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}
            Access-Control-Max-Age: {schema: {type: integer}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/export/link:
    post:
      operationId: createExportLink
      x-permission: workspace:export
      summary: Get a one-time download URL for the workspace export
      description: >-
        Admins only; works in every plan state, including a locked workspace. Runs the checks of
        `GET /api/v1/export` that can be answered before streaming (another export of this workspace is
        running: 409; the server is at its export limit: 429 with `Retry-After`) and returns a URL that
        starts the same ZIP download without a session or token. The URL works once, for the workspace
        that asked, and expires after `expires_in_seconds`; a new link replaces the previous one. A browser
        that navigates to it streams the file to disk, so a large archive is never held in memory. Links
        live in the memory of one server process: a restart invalidates them.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: The one-time link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: The server is already running as many exports as it allows; retry later
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/export/download/{token}:
    get:
      operationId: downloadExport
      security: []
      x-permission: public
      summary: Download the export a one-time link was made for
      description: >-
        The token is the credential: it was made by `POST /api/v1/export/link`, works once and expires
        quickly. Streams the same archive as `GET /api/v1/export`. This route is meant to be opened by a
        browser navigation, so a refusal is never a JSON error page: it is a 303 to
        `/settings?export_error=<reason>` where the app explains it. Reasons: `link_invalid` (unknown, used,
        expired or lost in a restart), `busy` (another export of this workspace is running), `server_busy`
        (the server is at its export limit) and `failed` (the export could not start). The export slot is taken
        before the token is spent, so `busy` and `server_busy` leave the link usable until it expires.
        HEAD and other methods answer 405 without spending the token.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: The workspace archive
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment; filename="colliedesk-<slug>-<UTC yyyymmddThhmmssZ>.zip"'}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '303':
          description: The download was refused; the app explains why.
          headers:
            Location: {schema: {type: string}, description: 'The path /settings?export_error=link_invalid|busy|server_busy|failed.'}
        '405':
          description: Not GET. The token is not spent.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/agent-requests:
    get:
      operationId: listAgentRequests
      x-permission: authenticated
      description: >-
        Calls of agent tokens that wait for a person, and what became of them: pending first, then newest
        first, at most 200. An agent token sees only the requests it made; a person sees the whole
        workspace's. A pending request past its `expires_at` (seven days) is answered as `expired`.
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/AgentRequestStatus'}}
        - {name: detail, in: query, required: false, description: 'full adds each request''s body, edited_body and result; without it they are null so a poll stays small.', schema: {type: string, enum: [full]}}
      responses:
        '200':
          description: Agent requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AgentRequest'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
  /api/v1/agent-requests/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getAgentRequest
      x-permission: authenticated
      description: One agent request. An agent token finds only the requests it made (404 otherwise).
      responses:
        '200':
          description: The agent request
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/agent-requests/{id}/approve:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: approveAgentRequest
      x-permission: authenticated
      description: >-
        People only (an agent token gets 403 `person_only`). Runs the stored call once, as the approving
        person: their role, the workspace lock and every check of the route apply. The answer is 200 with
        the request (`approved` when the call succeeded, `failed` with `result_status` otherwise, for
        example 403 when the approver may not do it) and `result`, the call's own answer. When the answer
        holds a credential, a link or a payment page (new token, inbound secret, export, billing), `result`
        is shown here once and the request keeps only `result_status` and `result_note`. Approving an
        export (`GET /api/v1/export` or `POST /api/v1/export/link`) answers the export's one-time download
        link. `body` replaces the text of a reply draft; it is refused for any other request. A request
        that is decided or expired, or whose token was revoked, answers 409 and runs nothing; two
        approvals at once run the call once. A person whose role may not run the call gets 403 and the
        request keeps waiting (`approvable_by`). `cc` keeps only some of a reply draft's copies; it
        cannot add one. The approval finishes even if the approver's connection closes.
        `seen_reply_number` is the newest reply the approving person had on screen: when someone replied
        since, a reply draft answers 409 `reply_conflict` like `POST .../messages` and keeps waiting, so
        it can be read again and approved with the new number.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                body: {type: string, minLength: 1, description: 'The edited text of a reply draft (Markdown)'}
                cc:
                  type: array
                  maxItems: 10
                  items: {type: string}
                  description: The copies to keep on a reply draft; only addresses the draft already copied (400 otherwise).
                seen_reply_number: {type: integer, minimum: 0, description: 'Reply drafts only: the newest reply number on the approver''s screen.'}
      responses:
        '200':
          description: The decided request and the answer of its call
          content:
            application/json:
              schema:
                type: object
                required: [request, result]
                properties:
                  request: {$ref: '#/components/schemas/AgentRequest'}
                  result: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: The JSON answer of the approved call; null when it had none or was too large.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/agent-requests/{id}/reject:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: rejectAgentRequest
      x-permission: authenticated
      description: People only. Refuses the request (a discarded reply draft); nothing runs, and it can never run later.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 1000, description: Shown to the agent that asked}
      responses:
        '200':
          description: The rejected request
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/agent-requests/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: cancelAgentRequest
      x-permission: authenticated
      description: >-
        Withdraws a pending request. The token that made it, or the person who owns that token, may
        cancel it (another token gets 404, another person 403: they reject instead).
      responses:
        '200':
          description: The cancelled request
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequest'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/support/problem-reports:
    post:
      operationId: createProblemReport
      x-permission: authenticated
      description: >
        Send a problem report ("Report a problem" in the web app) to the support desk of this server.
        Where the server sets `PROBLEM_REPORT_WORKSPACE` (Colliedesk Cloud) the report becomes a
        conversation in that workspace, tagged `problem-report`, from the reporter's verified email,
        with the description, the diagnostics, facts the server knows (agent, role, workspace, plan,
        version, realm, the request id of this call) and the screenshots as attachments. No text from the
        reporter's workspace is read or sent. Every other server answers 404 `not_configured`, so the
        web app offers a GitHub issue instead. Any agent token tier may report. One agent may send 5
        reports an hour. Send JSON, or `multipart/form-data` with `description`, `diagnostics` (a JSON
        string) and up to 3 `screenshots` files (PNG, JPEG or WebP, 5 MiB in total).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProblemReportInput'}
          multipart/form-data:
            schema:
              type: object
              required: [description]
              properties:
                description: {type: string, minLength: 1, maxLength: 5000}
                diagnostics: {type: string, description: 'JSON text of a ProblemReportDiagnostics object'}
                screenshots:
                  type: array
                  maxItems: 3
                  items: {type: string, format: binary}
            encoding:
              screenshots: {contentType: 'image/png, image/jpeg, image/webp'}
      responses:
        '201':
          description: The report reached the support desk
          content:
            application/json:
              schema:
                type: object
                required: [reference]
                properties:
                  reference: {type: string, description: 'The request id of this call; quote it when you write to support'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/WorkspaceLocked'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: This server has no support desk for problem reports (error code `not_configured`)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: Invalid input; `error.fields` names each bad field (`description`, `diagnostics`, `screenshots`)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: This agent sent 5 reports in the last hour; retry after the `Retry-After` seconds
          headers:
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/kb/collections:
    get:
      operationId: listKBCollections
      x-permission: conversations:read
      description: >
        The knowledge base collections of the workspace that are not in the trash, as a flat list
        ordered by parent, position and name. A collection sits at most three levels deep (category,
        folder, subfolder). `article_count` counts its articles outside the trash, drafts included.
      responses:
        '200':
          description: Knowledge base collections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBCollection'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createKBCollection
      x-permission: conversations:write
      description: >
        Any agent may create one, and a `send` agent token; a lower tier files an agent request a
        person approves. Without `slug` one is made from the name. The slug is unique among the
        collections of the same parent outside the trash (409 `duplicate_slug`). A parent in the trash,
        or one already three levels deep, is 400. A workspace holds at most 1,000 collections,
        counting the ones in the trash (409 `kb_limit`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KBCollectionInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created collection
          content: {application/json: {schema: {$ref: '#/components/schemas/KBCollection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/collections/trash:
    get:
      operationId: listTrashedKBCollections
      x-permission: conversations:read
      description: >
        Collections deleted in the last 30 days, most recently deleted first. Each can be restored
        with `POST /api/v1/kb/collections/{id}/restore` until `purges_at`; after that it is deleted
        for good.
      responses:
        '200':
          description: Collections in the trash
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TrashedKBCollection'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/kb/collections/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: updateKBCollection
      x-permission: conversations:write
      description: >
        Rename a collection, change its slug, description or position, or move it under another
        parent (`parent_id`; null moves it to the top). Send back the `updated_at` you read (409
        `changed_elsewhere` when it was saved since). A move that would put a collection under itself
        or more than three levels deep is 400. Changing the slug changes the addresses of the help
        center pages under it; old addresses are not redirected. A collection in the trash is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                name: {type: string, minLength: 1, maxLength: 200}
                slug: {type: string, minLength: 1, maxLength: 120}
                description: {type: string, maxLength: 2000}
                parent_id: {type: [string, 'null'], format: uuid}
                position: {type: integer, minimum: 0, maximum: 1000000}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated collection
          content: {application/json: {schema: {$ref: '#/components/schemas/KBCollection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteKBCollection
      x-permission: conversations:write
      description: >
        Move an empty collection to the trash: restorable for 30 days, then deleted for good. A
        collection that still holds articles or collections outside the trash is 409
        `collection_not_empty` (move or delete them first). Send the `updated_at` you read (409
        `changed_elsewhere`).
      parameters:
        - {name: updated_at, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Collection moved to the trash}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/collections/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreKBCollection
      x-permission: conversations:write
      description: >
        Take a collection out of the trash. Send its `updated_at` as the trash shows it (409
        `changed_elsewhere`). 409 `parent_in_trash` when its parent is in the trash (restore that
        first), 409 `duplicate_slug` when a sibling took its slug meanwhile. 404 when it is not in the
        trash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored collection
          content: {application/json: {schema: {$ref: '#/components/schemas/KBCollection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/articles:
    get:
      operationId: listKBArticles
      x-permission: conversations:read
      description: >
        Knowledge base articles outside the trash, without their text, in pages. Without `q` the
        most recently updated come first. With `q` the articles whose title or text hold every word of
        `q` as a word or the start of a word (or whose title holds `q`) come first by relevance. Words
        are split the same way in the query and the text, with no language rules, so a word inside
        another word, and text in scripts written without spaces (Chinese, Japanese, Thai), are found
        only when they start a word or match the title.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: status, in: query, schema: {type: string, enum: [draft, published]}}
        - {name: collection_id, in: query, description: Only the articles directly in this collection., schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Knowledge base articles
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBArticleSummary'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createKBArticle
      x-permission: conversations:write
      description: >
        Write an article in Markdown. It starts as a draft unless `status` is `published`. It gets the
        next `number` of the workspace, which never changes and is never reused, so the address
        `/a/<number>-<slug>` keeps working when the title changes. Without `slug` one is made from the
        title. The text holds at most 100,000 characters and is never cut; a workspace holds at most
        2,000 articles, counting the ones in the trash (409 `kb_limit`). A `send` agent token may
        create one; a lower tier files an agent request (at most 64 KiB of JSON).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KBArticleInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '201':
          description: Created article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/articles/trash:
    get:
      operationId: listTrashedKBArticles
      x-permission: conversations:read
      description: >
        Articles deleted in the last 30 days, most recently deleted first, in pages, without their
        text. Each can be restored with `POST /api/v1/kb/articles/{id}/restore` until `purges_at`; after
        that it is deleted for good with its history. Articles in the trash count toward the 2,000 of
        a workspace.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Articles in the trash
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TrashedKBArticle'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/kb/articles/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBArticle
      x-permission: conversations:read
      description: >
        One article with its Markdown text and its stored translations. It also finds an article in
        the trash (`deleted_at` is then set).
      responses:
        '200':
          description: The article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateKBArticle
      x-permission: conversations:write
      description: >
        Change the title, slug, text, collection or status (publish or unpublish). Send back the
        `updated_at` you read; when the article was saved since, nothing changes and the answer is 409
        `changed_elsewhere`. Every change adds a version to the history. An article in the trash is
        404. A `send` agent token may edit; a lower tier files an agent request (at most 64 KiB of
        JSON).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                title: {type: string, minLength: 1, maxLength: 300}
                slug: {type: string, minLength: 1, maxLength: 120}
                body_md: {type: string, maxLength: 100000}
                collection_id: {type: string, format: uuid}
                status: {type: string, enum: [draft, published]}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Updated article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteKBArticle
      x-permission: conversations:write
      description: >
        Move the article to the trash: it leaves the list and the help center, and can be restored for
        30 days. Send the `updated_at` you read (409 `changed_elsewhere`). A `send` agent token may
        delete; a lower tier files an agent request.
      parameters:
        - {name: updated_at, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '204': {description: Article moved to the trash}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/articles/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreKBArticle
      x-permission: conversations:write
      description: >
        Take an article out of the trash, as it was when deleted (a published article is published
        again). Send its `updated_at` as the trash shows it (409 `changed_elsewhere`). 409
        `collection_in_trash` when its collection is in the trash (restore that first). 404 when it is
        not in the trash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Restored article
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/articles/{id}/versions:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: listKBArticleVersions
      x-permission: conversations:read
      description: >
        The versions of an article, newest first, in pages: who made each, through which agent token
        or approved agent request, and the title, slug, text, collection and status it had. An article
        in the trash keeps its history. Versions are never changed or removed while the article exists.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before_version, in: query, description: Only versions older than this one (the next_before_version of the previous page)., schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Versions of the article
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before_version]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBArticleVersion'}}
                  next_before_version: {type: [integer, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/articles/{id}/versions/{version}/restore:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: restoreKBArticleVersion
      x-permission: conversations:write
      description: >
        Make the title, slug and text of an earlier version current again, as a new version; the
        status and collection stay as they are now, and nothing in the history is rewritten. Send back
        the `updated_at` you read (409 `changed_elsewhere`). An article in the trash is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Article with the restored text
          content: {application/json: {schema: {$ref: '#/components/schemas/KBArticle'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/images:
    post:
      operationId: uploadKBImage
      x-permission: conversations:write
      description: >
        Store an image in the knowledge base's media library. The body is the raw image, at most 5 MiB;
        only PNG, JPEG, GIF and WebP are accepted, judged from the bytes, not from the declared type, at
        most 8,192 pixels on a side and 40 megapixels (400 otherwise). Location, camera data, XMP and
        comments are removed without touching the pixels (a JPEG keeps its orientation), and the
        server makes a thumbnail. The same bytes uploaded twice give the same item (and take an item
        in the library's trash out of it). Images count toward the plan's storage cap (403
        `storage_limit_reached` when it is full). Put it in an article as `![text](url)`. An image no
        article ever saved is deleted 30 days after its last upload unless it is kept: `keep=true`
        is for an upload made in the library. A workspace holds at most 10,000 items, its trash
        included (409 `kb_limit`). A `send` agent token may upload; a lower tier gets 403
        `files_need_approval`.
      parameters:
        - {name: name, in: query, description: The name the library shows; the file name without its extension is a good one., schema: {type: string, maxLength: 200}}
        - {name: alt, in: query, description: Alt text the editor offers when it inserts the image., schema: {type: string, maxLength: 500}}
        - {name: keep, in: query, description: 'true keeps the image from the purge of unused items, as an upload in the library does.', schema: {type: boolean}}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/gif: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: The stored image, or the item that already held the same bytes
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413':
          description: The image is over 5 MiB; nothing was stored.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/images/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBImage
      x-permission: conversations:read
      description: >
        The bytes of one image of the workspace's knowledge base, with `nosniff` and a sandboxing
        Content-Security-Policy so nothing in it can run.
      responses:
        '200':
          description: The image
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
            X-Content-SHA256: {schema: {type: string}}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media:
    get:
      operationId: listKBMedia
      x-permission: conversations:read
      description: >
        The media library outside its trash, 60 items a page unless `limit` says otherwise, newest
        first unless `sort` says otherwise, each with its usage. `usage=unused` lists what no live
        article's current text names (articles in the trash and older versions do not count as use);
        its first page adds `summary`, the count and bytes of every unused item the filter selects,
        kept items apart. `q` matches the name or alt text.
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [image, video]}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: usage, in: query, schema: {type: string, enum: [in_use, unused, missing_alt]}}
        - {name: sort, in: query, schema: {type: string, enum: [newest, oldest, name, largest], default: newest}}
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 60}}
      responses:
        '200':
          description: A page of the library
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBMedia'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
                  summary: {$ref: '#/components/schemas/KBMediaUnusedSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/kb/media/trash:
    get:
      operationId: listTrashedKBMedia
      x-permission: conversations:read
      description: >
        The library's trash, last moved there first, 60 items a page unless `limit` says otherwise,
        each with `purge_at`, when the daily purge deletes it (30 days after it was moved), and its
        usage. An item in the trash still counts toward the plan's storage until it is purged.
      parameters:
        - {name: cursor, in: query, description: The next_cursor of the previous page., schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 60}}
      responses:
        '200':
          description: A page of the trash
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBMedia'}}
                  next_cursor: {type: [string, 'null'], description: Null on the last page.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: trashKBMedia
      x-permission: conversations:write
      description: >
        Move up to 100 library items to the trash, each only while no live article's current text names
        it, and answer each id: `trashed`, `already_in_trash`, `in_use` or `not_found`. Send the
        `batch_id` of an earlier call to add to its batch; `POST /api/v1/kb/media/restore` with that
        `batch_id` brings back the whole batch. Saving an article that names an item in the trash takes
        it out again. Calling it twice changes nothing more.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                batch_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: What happened to each item
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaBatchResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/trash-unused:
    post:
      operationId: trashUnusedKBMedia
      x-permission: conversations:write
      description: >
        Move to the trash up to 500 items no live article uses, added before `before` (when the person
        opened the page, so nothing uploaded since is swept along), leaving kept items unless
        `include_kept`. Call again with the answer's `batch_id` while `more` is true; one Undo
        (`POST /api/v1/kb/media/restore` with that `batch_id`) restores everything moved. A token below
        `send` gets an agent request naming the ids (at most 100 a request), so a person approves
        exactly what will move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              properties:
                before: {type: string, format: date-time}
                include_kept: {type: boolean, default: false}
                batch_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: How many moved
          content:
            application/json:
              schema:
                type: object
                required: [trashed, more, batch_id]
                properties:
                  trashed: {type: integer}
                  more: {type: boolean, description: True while more unused items are left; call again with batch_id.}
                  batch_id: {type: [string, 'null'], format: uuid, description: Null when nothing moved and no batch_id was sent.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/restore:
    post:
      operationId: restoreKBMediaBatch
      x-permission: conversations:write
      description: >
        Take items out of the library's trash: up to 100 `ids`, or every item of a trash `batch_id`
        (the Undo of a move to the trash). Answers each id: `restored`, `not_in_trash` or `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                batch_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: What happened to each item
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: '#/components/schemas/KBMediaResult'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/purge:
    post:
      operationId: purgeKBMedia
      x-permission: access:write
      description: >
        Delete for good up to 100 items that are in the library's trash, with their files, freeing their
        storage now instead of after 30 days. Answers each id: `purged`, `not_in_trash` (only items in
        the trash can be purged) or `not_found`. Articles in the trash and older versions that named one
        then show "Media no longer exists". This cannot be undone. Admins only; a lower agent token gets
        an agent request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: What happened to each item
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: '#/components/schemas/KBMediaResult'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/kb/media/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaFile
      x-permission: conversations:read
      description: >
        The bytes of a library item, with ranges (206) so a video seeks, `nosniff` and a sandboxing
        Content-Security-Policy. An id always names the same bytes: the answer may be cached for a
        year. `download=1` asks the browser to save it under its name.
      parameters:
        - {name: download, in: query, schema: {type: string, enum: ['1']}}
      responses:
        '200':
          description: The bytes
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
            ETag: {schema: {type: string}}
            Accept-Ranges: {schema: {type: string}}
          content:
            video/mp4: {schema: {type: string, format: binary}}
            video/webm: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '206':
          description: The range asked for
          content:
            video/mp4: {schema: {type: string, format: binary}}
            video/webm: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '304': {description: Not modified (If-None-Match)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416': {description: The range is outside the bytes}
    patch:
      operationId: updateKBMedia
      x-permission: conversations:write
      description: >
        Change the name, alt text (a video's title) or kept mark of a library item outside the trash.
        A new name or alt text keeps the item unless `kept` is sent too. The alt text is what the
        editor offers next time; articles keep the text they have. Send back the `updated_at` you
        read (409 `changed_elsewhere`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updated_at]
              properties:
                updated_at: {type: string, format: date-time}
                name: {type: string, maxLength: 200}
                alt: {type: string, maxLength: 500}
                kept: {type: boolean}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The changed item
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: trashOneKBMedia
      x-permission: conversations:write
      description: >
        Move one library item to the trash. 409 `media_in_use`, with the articles, while a live
        article's current text names it: change those articles first. The answer's `batch_id` undoes
        it (`POST /api/v1/kb/media/restore`), as does `POST /api/v1/kb/media/{id}/restore`.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Moved to the trash, or already there
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaBatchResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/media/{id}/restore:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: restoreKBMedia
      x-permission: conversations:write
      description: Take one item out of the library's trash. 404 when it is not in the trash or does not exist.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The item
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/{id}/replace:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: replaceKBMedia
      x-permission: conversations:write
      description: >
        Put another library item (`with_media_id`, an image for an image, a video for a video) in the
        place of this one in every live article whose current text or a translation shows it. Each such
        article gets a new version of kind `media_replace`, and published ones change on the help
        center at once. Ids never change their bytes, so the new item keeps its own id and caches stay
        right. The answer is the replacement; `POST /api/v1/kb/media-replacements/{id}/undo` reverses
        it. 400 when the kinds differ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [with_media_id]
              properties:
                with_media_id: {type: string, format: uuid}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The replacement
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaReplacement'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media-replacements/{id}/undo:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: undoKBMediaReplacement
      x-permission: conversations:write
      description: >
        Put back the text each article and translation had before the replacement, where nothing changed
        since (an article whose newest version is still the replacement's, a translation that still
        holds the replaced text), as new versions. Anything changed since keeps its text and is listed in
        `skipped_article_ids`. Undoing twice changes nothing more. 409 `media_gone` when the replaced
        item was deleted for good.
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: The replacement, with undone_at
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaReplacement'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/kb/media-uploads:
    get:
      operationId: listKBMediaUploads
      x-permission: conversations:read
      description: >
        The workspace's video uploads in progress, the oldest first: who started each, the bytes received
        and when its parts expire. At most 3 are in progress at once (429 `too_many_uploads` on a fourth);
        the person who started one, or an admin, cancels it to make room.
      responses:
        '200':
          description: The uploads in progress
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/KBMediaUpload'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createKBMediaUpload
      x-permission: conversations:write
      description: >
        Start an upload of a video in parts: MP4 (H.264 or AV1 with AAC sound, QuickTime .mov included)
        or WebM (VP8, VP9 or AV1 with Opus or Vorbis), at most 200 MiB unless the server says
        otherwise. Nothing is converted, so the video must be one every browser plays: an H.265
        (HEVC) video, the default of iPhones, is refused when the upload completes. Send the parts with
        `PUT /api/v1/kb/media-uploads/{id}`, then complete it. The plan's storage (counting the uploads
        in progress) and the server's disk (counting every upload in progress on the server) must have
        room before any byte is sent: 403 `storage_limit_reached`, 507 `insufficient_disk`; past 200
        uploads in progress on the server a new one is 503 `server_busy`. At most 3 uploads are in progress in a
        workspace and 10 are started by one person in an hour (429 `too_many_uploads`). The parts are
        thrown away after 24 hours. A token below `send` gets 403 `files_need_approval`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                size: {type: integer, minimum: 1}
                name: {type: string, maxLength: 200}
                alt: {type: string, maxLength: 500, description: The video's title for screen readers.}
                keep: {type: boolean, description: 'true keeps the video from the purge of unused items, as an upload in the library does.'}
      responses:
        '201':
          description: The upload, at offset 0
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaUpload'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413':
          description: The video is larger than the server takes; nothing was stored.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: Too many uploads in progress or started this hour.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503':
          description: The server has too many uploads in progress; try again later.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '507':
          description: The server's disk has no room for the video.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/media-uploads/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaUpload
      x-permission: conversations:read
      description: 'Where an upload stands; after a lost connection, send the part that starts at `offset`.'
      responses:
        '200':
          description: The upload
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaUpload'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putKBMediaUploadPart
      x-permission: conversations:write
      description: >
        Send the next part, at most `part_size` bytes, with `Content-Range: bytes <first>-<last>/<size>`.
        A part that does not start at the upload's offset is refused with 409 `upload_offset_mismatch`,
        the offset in `Upload-Offset` and in the answer; send that part again. One part of an upload at
        a time; a part must arrive within 120 seconds.
      parameters:
        - {name: Content-Range, in: header, required: true, schema: {type: string, pattern: '^bytes \d+-\d+/\d+$'}}
      requestBody:
        required: true
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        '200':
          description: The upload, at its new offset
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaUpload'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The part does not start where the upload stands, or the upload is complete.
          headers:
            Upload-Offset: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '429':
          description: Another part of this upload, or too many of the workspace, are being sent.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    delete:
      operationId: cancelKBMediaUpload
      x-permission: conversations:write
      description: >
        Cancel an upload in progress and throw its parts away, at once, even while a part is being sent
        (that part then answers 404). Only the person who started it, or an admin, can (403
        `not_your_upload`). A token below `send` gets 403 `files_need_approval`.
      responses:
        '204': {description: Cancelled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media-uploads/{id}/complete:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: completeKBMediaUpload
      x-permission: conversations:write
      description: >
        Check and store the video once every part arrived. The server reads its length, size and codecs
        from the file, and removes in place what a camera or phone leaves in it (location, titles,
        XMP, tracks of data such as GPS or subtitles) without changing a frame. A video it refuses
        (400 `unsupported_codec`, `invalid_request`; more than 8,192 pixels on a side) is thrown away with
        the upload. A full library or plan (409) keeps the parts, so the same upload completes once
        there is room; parts gone from the server are 409 `upload_lost` and the upload is cancelled.
        Location, titles and recording dates are removed. The same bytes give the item that holds them,
        and a repeated complete answers the same item. Put it in an article
        as `<video controls src="/api/v1/kb/media/<id>"></video>`.
      responses:
        '201':
          description: The video in the library
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429':
          description: A part of this upload is being sent.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/media/{id}/poster:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: putKBVideoPoster
      x-permission: conversations:write
      description: >
        Give a video its poster, the still picture shown before it plays: the raw bytes of a PNG, JPEG,
        GIF or WebP image, at most 5 MiB, metadata removed. It counts toward the plan's storage with the
        video and becomes the video's thumbnail in the library. A new poster is a new `poster_url`;
        the old one is deleted. Images have no poster (400).
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/gif: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200':
          description: The video with its poster
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMedia'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: The poster is over 5 MiB; nothing was stored.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/kb/media/{id}/poster/{version}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: version, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{8}$'}}
    get:
      operationId: getKBVideoPoster
      x-permission: conversations:read
      description: 'A video''s poster, the version `poster_url` names; an older version is 404, so a cache never shows another picture under an address.'
      responses:
        '200':
          description: The poster
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '304': {description: Not modified (If-None-Match)}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/{id}/details:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaDetails
      x-permission: conversations:read
      description: >
        One library item, in the trash or not, with its usage and every article that names it: live
        articles first, then those in the trash; `current` is false where only an older version does.
      responses:
        '200':
          description: The item and its articles
          content: {application/json: {schema: {$ref: '#/components/schemas/KBMediaDetails'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/kb/media/{id}/thumbnail:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      operationId: getKBMediaThumbnail
      x-permission: conversations:read
      description: >
        The thumbnail of a library item, at most 320 pixels on its longest side: a JPEG, or a PNG when
        the image has transparency. 404 while it has none (`thumbnail_url` is null): an image too
        large to decode within the server's memory budget, or one stored before thumbnails that the
        daily backfill has not reached yet.
      parameters:
        - {name: v, in: query, description: 'The version thumbnail_url names; it only makes a new thumbnail a new URL.', schema: {type: string, maxLength: 64}}
      responses:
        '200':
          description: The thumbnail
          headers:
            Cache-Control: {schema: {type: string}, description: 'private, max-age=31536000, immutable'}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/help-center:
    get:
      operationId: getHelpCenter
      x-permission: conversations:read
      description: >
        Whether the public help center is on, its title and language. `content_version` grows with
        every change to the knowledge base, so a cached page can tell it is stale. Until an admin turns
        it on, it is off and nothing of the knowledge base is public.
      responses:
        '200':
          description: Help center settings
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenter'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: putHelpCenter
      x-permission: access:write
      description: >
        Turn the public help center on or off, and set its title and language (a BCP 47 tag such as
        `en` or `pt-BR`). Admins only, and an `admin` agent token. Turning it off takes every page off
        line at once; turning it on again publishes the articles marked published.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HelpCenterInput'}
      responses:
        '202': {$ref: '#/components/responses/AgentRequestAccepted'}
        '200':
          description: Help center settings
          content: {application/json: {schema: {$ref: '#/components/schemas/HelpCenter'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: colliedesk_session}
    inboundSecret: {type: apiKey, in: header, name: X-Colliedesk-Inbound-Secret}
    polarWebhook: {type: apiKey, in: header, name: webhook-signature}
    resendWebhook: {type: apiKey, in: header, name: svix-signature}
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    AgentRequestAccepted:
      description: >-
        An agent token called this above its tier, or the action needs a person's approval for every
        tier: nothing happened yet. The call is stored as an agent request a person approves or rejects
        (`GET /api/v1/agent-requests/{request_id}` shows the outcome); it expires after seven days. A
        token gets 429 `too_many_requests` while 50 of its requests wait or after 100 in an hour (with
        `Retry-After`), 402 `workspace_locked` in a locked workspace, and a call with files gets 403
        `files_need_approval` (send the text alone, attach files after approval).
      content: {application/json: {schema: {$ref: '#/components/schemas/AgentRequestAccepted'}}}
    Redeemed:
      description: Session created from a one-time link
      headers:
        Set-Cookie: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Redeemed'}
    Conversation:
      description: Workspace conversation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Conversation'}
    EmailChannelSettings:
      description: Email channel settings for this workspace
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EmailChannelSettings'}
    BadRequest: {$ref: '#/components/responses/Error400'}
    Conflict:
      description: The resource is not in a state that allows this action
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    InternalError:
      description: Temporary server failure; the message was not stored and the forwarder should retry
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BillingLink:
      description: A single-use URL on the billing provider
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: {type: string, format: uri}
    ConsentLink:
      description: The provider's consent address for the person who started the connection, valid 10 minutes
      content:
        application/json:
          schema:
            type: object
            required: [url]
            properties:
              url: {type: string, format: uri}
    BadGateway:
      description: The billing provider failed or could not be reached; nothing changed, try again
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AttachmentsTooLarge:
      description: More files than allowed or more bytes than allowed in total for one message; nothing was stored
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PayloadTooLarge:
      description: Message larger than 25 MiB or with more than 100 attachments; nothing was stored
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    WebFormSettings:
      description: Web form channel state
      content: {application/json: {schema: {$ref: '#/components/schemas/WebFormSettings'}}}
    TooManyRequests:
      description: Per-contact inbound rate limit reached; the forwarder should retry later
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AICheckFailed:
      description: The provider check failed; nothing was saved or changed. `check_error_code` says why.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AIChecksRateLimited:
      description: The workspace ran 10 provider checks in the last minute; try again shortly.
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized: {$ref: '#/components/responses/Error401'}
    Forbidden: {$ref: '#/components/responses/Error403'}
    NotFound: {$ref: '#/components/responses/Error404'}
    Error400:
      description: Invalid request
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    PlanLimitReached:
      description: >
        The action would exceed a limit of the workspace's plan (error code `plan_limit_reached`):
        more agents, pending invites included, than the plan allows. Nothing was changed; the
        action works again after an upgrade or after freeing a seat. A locked workspace answers
        `workspace_locked` instead.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TrialOutboundLimit:
      description: >
        Sending this reply would take a trial workspace past 200 people emailed in the last 24 hours,
        where each reply counts its contact and every Cc address (error code `trial_outbound_limit`,
        with `retry_after_seconds` and a `Retry-After` header: the time until enough counted replies
        leave the window). Nothing was stored. Paid plans have no such limit.
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    WorkspaceLocked:
      description: >
        The workspace's trial or subscription ended (error code `workspace_locked`). Nothing was read
        or changed. Choose a plan in billing, or export the data; the same request works after payment.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NameNotAllowed:
      description: >
        The name contains a well-known brand (error code `name_not_allowed`), for example a payment or
        mail provider. On the hosted cloud only; a self-hosted server accepts any name. Nothing was
        created or changed. The match is on whole words, so "Pineapple" is fine and "PayPal Support" is not.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    MailboxClosed:
      description: >
        The workspace no longer accepts this mail. Error code `mailbox_closed`: the workspace is locked.
        Error code `storage_limit_reached`: a trial or locked workspace would pass its 2 GiB attachment
        storage limit (imported files do not count). Both are permanent for the sender: the forwarder
        bounces the message instead of retrying, and nothing was stored. A Founding workspace never gets
        the storage answer for mail: its 20 GiB limit (imported files count) applies to uploads and imports
        only, and mail over it is stored in full. Nothing is deleted, and reading, replying without new
        attachments and export keep working.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error401:
      description: Authentication failed
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error403:
      description: >
        Permission or CSRF check failed. An agent token on a route closed to every token gets error
        code `scope_insufficient`, and `person_only` on a decision only a person makes (approving or
        rejecting an agent request); a token below a route's tier gets 202 instead (an agent request).
        A call with files that would need approval gets `files_need_approval`. On
        `POST /conversations/{id}/messages` a trial workspace gets error code
        `trial_outbound_restricted` for a reply to a conversation the customer did not start
        (unless it verified its sending domain), or for a `cc` address the customer never wrote
        from or copied (then `refused_cc` lists them), or when the customer wrote from another address
        than the contact's after a merge (then `reason` is `contact_address_differs` and `reply_to` names
        the contact's address); nothing was stored.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error404:
      description: Resource not found in this workspace
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    ImportPerson:
      type: object
      required: [external_id, name, email, active, linked_agent_id, linked_by_email, pending, updated_at]
      properties:
        external_id: {type: string, description: The Freshdesk agent id}
        name: {type: string}
        email: {type: string}
        active: {type: boolean, description: An active agent in Freshdesk}
        linked_agent_id: {type: [string, 'null'], format: uuid}
        linked_by_email: {type: boolean, description: 'Linked because the emails match, not by a person'}
        pending: {type: boolean, description: The link changed and the imported replies and tickets are still being moved}
        updated_at: {type: string, format: date-time}
    ImportOptions:
      type: object
      additionalProperties: false
      properties:
        recent_days:
          type: integer
          minimum: 0
          maximum: 365
          description: The tickets updated in these last days are imported first, newest first; 0 skips that pass. Default 90.
        include_personal_canned_responses:
          type: boolean
          description: Also import canned responses from personal folders; they become shared with the whole workspace.
        help_center_portal:
          type: integer
          minimum: 0
          description: On an account with several portals, the portal whose published articles stay published.
    ImportInput:
      type: object
      additionalProperties: false
      required: [source, domain, api_key]
      properties:
        source: {type: string, enum: [freshdesk]}
        domain: {type: string, minLength: 1, maxLength: 255, description: 'Your <account>.freshdesk.com address'}
        api_key: {type: string, minLength: 1, maxLength: 200, writeOnly: true, description: 'A Freshdesk admin''s API key (Profile settings > API key)'}
        options: {$ref: '#/components/schemas/ImportOptions'}
    ImportProgress:
      type: object
      required: [step, done, total, api_calls, updated_at]
      properties:
        step: {type: string, description: 'The importer step, for example importing tickets'}
        done: {type: integer}
        total: {type: integer, description: 0 when the step does not know its total}
        rate_limit_until: {type: string, format: date-time, description: Set while the import waits for the Freshdesk rate limit}
        api_calls: {type: integer, description: Freshdesk requests of this run so far}
        eta_seconds: {type: integer, description: The rest of the step at the pace of the last five minutes; missing when unknown}
        updated_at: {type: string, format: date-time}
    ImportPreview:
      type: object
      description: >-
        What a few reads of the account tell before anything is written. Freshdesk has no ticket count:
        tickets_outside_archive is its search total, which leaves archived tickets out, and archived
        tickets can have ids above highest_listed_ticket_id; neither is an upper bound.
      required: [domain, account_id, source, agents, companies, contacts, tickets_outside_archive, highest_listed_ticket_id, archive, canned_responses, knowledge_base, rate_limit_per_minute, api_calls, checked_at]
      properties:
        domain: {type: string}
        account_id: {type: integer}
        source: {type: string}
        agents:
          type: array
          items:
            type: object
            required: [id, name, email, active]
            properties:
              id: {type: integer}
              name: {type: string}
              email: {type: string}
              active: {type: boolean}
        companies: {type: integer}
        contacts: {type: [integer, 'null'], description: null when Freshdesk search is unavailable}
        tickets_outside_archive: {type: [integer, 'null']}
        highest_listed_ticket_id: {type: integer}
        archive: {$ref: '#/components/schemas/ImportAccess'}
        canned_responses: {$ref: '#/components/schemas/ImportAccess'}
        knowledge_base: {$ref: '#/components/schemas/ImportAccess'}
        rate_limit_per_minute: {type: integer, description: X-Ratelimit-Total; 0 when Freshdesk sent none}
        api_calls: {type: integer}
        checked_at: {type: string, format: date-time}
    ImportAccess:
      type: string
      enum: [readable, none, refused, unknown]
      description: >-
        Whether the key can read this part: none means the account has none; refused (403) for the
        archive means the report can be UNVERIFIED at best.
    ImportJob:
      type: object
      required: [id, kind, source, domain, account_source, undo_of, state, phase, options, preview, progress, status, error_code, error_message, imported_conversations, has_key, has_interim_report, has_report, cancel_requested, next_run_at, created_by, created_at, started_at, finished_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [import, undo]}
        source: {type: string, enum: [freshdesk]}
        domain: {type: string}
        account_source: {type: [string, 'null'], description: 'The Freshdesk account, freshdesk:account:<id>, known after the preview'}
        undo_of: {type: [string, 'null'], format: uuid, description: The import an undo removes}
        state:
          type: string
          enum: [previewing, previewed, queued, running, retry_wait, waiting_key, finished, failed, cancelled, discarded]
        phase: {type: string, enum: [preview, recent, full, undo]}
        options: {$ref: '#/components/schemas/ImportOptions'}
        preview:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ImportPreview'}
        progress:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ImportProgress'}
        status: {type: [string, 'null'], enum: [OK, FAILED, UNVERIFIED, null], description: The reconcile status of a finished import}
        error_code:
          type: [string, 'null']
          description: >-
            Why a job failed or waits: freshdesk_key_rejected, freshdesk_needs_admin_key,
            freshdesk_plan_no_api (the Freshdesk Free plan, or an ended trial of a higher plan, has no
            API calls), freshdesk_unavailable, import_running_elsewhere, retrying_failed_items,
            storage_cap, knowledge_base_limit, key_unavailable, no_progress or import_error.
        error_message: {type: [string, 'null']}
        imported_conversations:
          type: [integer, 'null']
          description: >-
            How many conversations of the Freshdesk account were in the workspace when the import ended
            (what an undo removes, less what the team changed since); null while it runs and for an undo.
        has_key: {type: boolean, description: The server still holds the Freshdesk API key of this job}
        has_interim_report: {type: boolean}
        has_report: {type: boolean}
        cancel_requested: {type: boolean}
        next_run_at: {type: [string, 'null'], format: date-time, description: When a job in retry_wait runs again}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    AgentRequestStatus:
      type: string
      enum: [pending, approved, failed, rejected, cancelled, expired]
    AgentRequestAccepted:
      type: object
      required: [request_id, kind, status, summary, expires_at, message]
      properties:
        request_id: {type: string, format: uuid}
        kind: {type: string, enum: [reply_draft, action]}
        status: {$ref: '#/components/schemas/AgentRequestStatus'}
        summary: {type: string, description: 'What the call does, for the person deciding'}
        expires_at: {type: string, format: date-time}
        message: {type: string}
    AgentRequest:
      type: object
      required: [id, kind, status, method, route, path, body, edited_body, approvable_by, summary, conversation_id, saved_reply, requested_by, decided_by, decided_at, reason, result_status, result, result_note, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [reply_draft, action], description: 'reply_draft: an outgoing reply a token may not send; action: any other call'}
        status: {$ref: '#/components/schemas/AgentRequestStatus'}
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
        route: {type: string, description: 'The route pattern, for example /api/v1/conversations/{id}'}
        path: {type: string, description: The concrete path that runs on approval}
        body: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: 'The JSON body of the call as the token sent it; null when it had none, in a list without detail=full, and 90 days after the decision.'}
        edited_body: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: 'A reply draft as the approver edited it (text changed, copies removed); this is what ran. Null when not edited.'}
        approvable_by: {type: string, enum: [agent, admin, owner], description: 'The lowest role whose person can approve it; a person below it gets 403 and the request keeps waiting. owner: the call changes the settings of the person who owns the token (a /me route), so only that person can approve it (403 owner_only for anyone else).'}
        summary: {type: string}
        conversation_id: {type: [string, 'null'], format: uuid}
        saved_reply:
          description: >
            For a request that edits, deletes or restores a saved reply: the reply as it was when the
            token asked (before) and as it is now (current, null once it is deleted for good), so the
            change can be shown as a difference. Only with detail=full and on a single request; null otherwise.
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, before, current, restores]
              properties:
                id: {type: string, format: uuid}
                before:
                  oneOf:
                    - {type: 'null'}
                    - {$ref: '#/components/schemas/SavedReplyText'}
                restores:
                  description: For a request that restores a version, that version's number, title and text as they were when the token asked; null otherwise.
                  oneOf:
                    - {type: 'null'}
                    - type: object
                      required: [version, title, body]
                      properties:
                        version: {type: integer}
                        title: {type: string}
                        body: {type: string}
                current:
                  oneOf:
                    - {type: 'null'}
                    - type: object
                      required: [title, body, updated_at, deleted_at]
                      properties:
                        title: {type: string}
                        body: {type: string}
                        updated_at: {type: string, format: date-time}
                        deleted_at: {type: [string, 'null'], format: date-time}
        requested_by:
          type: object
          required: [token_id, token_label, token_scope, token_revoked, agent_id, agent_name]
          properties:
            token_id: {type: [string, 'null'], format: uuid}
            token_label: {type: string}
            token_scope: {$ref: '#/components/schemas/TokenScope'}
            token_revoked: {type: boolean, description: A request of a revoked token can only be rejected.}
            agent_id: {type: [string, 'null'], format: uuid}
            agent_name: {type: [string, 'null'], description: The person who owns the token}
        decided_by:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [agent_id, name]
              properties:
                agent_id: {type: [string, 'null'], format: uuid}
                name: {type: string}
        decided_at: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null']}
        result_status: {type: [integer, 'null'], description: HTTP status the approved call answered}
        result: {type: [object, array, string, number, integer, boolean, 'null'], additionalProperties: true, description: 'The JSON answer of the approved call, at most 64 KiB; null when withheld (see result_note) or none.'}
        result_note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    PublicConfig:
      type: object
      required: [cloud_sign_in, billing, signup, limits, product_analytics, ai]
      properties:
        ai:
          type: object
          required: [server_provider]
          properties:
            server_provider: {type: boolean, description: True when the operator configured an AI provider for every workspace (AI_SERVER_*).}
        product_analytics:
          type: object
          description: >
            Where the web app reports which screens and buttons agents use. On by default on the
            cloud and self-hosted; `DISABLE_TELEMETRY` or `DO_NOT_TRACK` (and a development build)
            answer `enabled: false`, and then the web app never loads the analytics library.
          required: [enabled, key, host, realm]
          properties:
            enabled: {type: boolean}
            realm: {type: [string, 'null'], enum: [cloud, self-hosted, null], description: Carried on every event so cloud and self-hosted use are told apart.}
            key: {type: [string, 'null'], description: Public PostHog project key; it can add events but not read them.}
            host: {type: [string, 'null'], description: PostHog ingestion host.}
        version: {type: string, description: 'The running build: a release tag such as `v0.0.1`, `edge-<commit>` for a main build, or `dev`.'}
        limits:
          type: object
          required: [outgoing_attachments_bytes, outgoing_attachments_files]
          properties:
            outgoing_attachments_bytes: {type: integer, description: Most raw bytes of files one reply or note can carry in total.}
            outgoing_attachments_files: {type: integer, description: Most files one reply or note can carry.}
        cloud_sign_in:
          type: object
          required: [enabled, publishable_key]
          properties:
            enabled: {type: boolean}
            publishable_key: {type: [string, 'null']}
        billing:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean, description: False on self-hosted instances; the billing routes answer 404.}
        signup:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean, description: True only where `POST /api/v1/auth/cloud/signup` exists (cloud sign-in and billing both configured).}
    AISlotName: {type: string, enum: [triage, draft]}
    AIProviderKind: {type: string, enum: [anthropic, openai_compatible]}
    AIProvider:
      type: object
      required: [id, kind, label, base_url, auth_kind, key_hint, models, check_status, check_error_code, checked_at, created_by, created_at, updated_at, used_by]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/AIProviderKind'}
        label: {type: string}
        base_url: {type: [string, 'null'], description: Only an OpenAI-compatible provider has one.}
        auth_kind: {type: string, enum: [api_key, none]}
        key_hint: {type: [string, 'null'], description: The key's last four characters; the key itself is never returned.}
        models: {type: array, items: {type: string}, description: The first is the one a check uses.}
        check_status: {type: string, enum: [ok, failing]}
        check_error_code: {type: [string, 'null'], description: 'Why the last check failed: auth, permission, model_not_found, bad_request, too_large, rate_limited, overloaded, quota_exhausted, timeout, unavailable, blocked_address, invalid_response.'}
        checked_at: {type: string, format: date-time}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        used_by: {type: array, items: {$ref: '#/components/schemas/AISlotName'}, description: 'The features set to this provider, on or off.'}
    AISlot:
      type: object
      required: [slot, source, provider_id, model, effort, enabled, active, off_reason, consented_by, consented_at, updated_by, updated_at]
      properties:
        slot: {$ref: '#/components/schemas/AISlotName'}
        source: {type: string, enum: [server, provider, none]}
        provider_id: {type: [string, 'null'], format: uuid}
        model: {type: [string, 'null']}
        effort: {type: string, enum: [low, medium, high]}
        enabled: {type: boolean}
        active: {type: boolean, description: 'On, and its provider and model are still there: the feature runs.'}
        off_reason: {type: [string, 'null'], enum: [server_provider_missing, model_not_offered, null], description: Why a feature that is on cannot run.}
        consented_by: {type: [string, 'null'], format: uuid, description: Who agreed that this feature's data goes to its current provider.}
        consented_at: {type: [string, 'null'], format: date-time}
        updated_by: {type: [string, 'null'], format: uuid}
        updated_at: {type: [string, 'null'], format: date-time}
    AIEvent:
      type: object
      required: [id, kind, actor_agent_id, actor_name, via_token, provider_id, provider_label, slot, detail, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [provider_added, provider_changed, provider_key_changed, provider_removed, slot_changed]}
        actor_agent_id: {type: [string, 'null'], format: uuid}
        actor_name: {type: [string, 'null']}
        via_token: {type: boolean, description: True when an agent token made the change.}
        provider_id: {type: [string, 'null'], format: uuid}
        provider_label: {type: [string, 'null'], description: The provider's name at the time; kept after it is deleted.}
        slot: {anyOf: [{$ref: '#/components/schemas/AISlotName'}, {type: 'null'}]}
        detail: {type: object, additionalProperties: true, description: 'What changed: from and to for a feature, from_hint and to_hint for a key, turned_off for a deleted provider. Never a key.'}
        created_at: {type: string, format: date-time}
    AISettings:
      type: object
      required: [server, providers, slots, events, provider_limit, can_store_keys, allow_private_base_urls]
      properties:
        server:
          description: The server's provider, set by the operator with AI_SERVER_* variables; null when the server has none.
          anyOf:
            - type: 'null'
            - type: object
              required: [kind, label, models]
              properties:
                kind: {$ref: '#/components/schemas/AIProviderKind'}
                label: {type: string}
                models:
                  type: object
                  description: Per feature, the models a workspace may pick; the first is the default.
                  additionalProperties: {type: array, items: {type: string}}
        providers: {type: array, items: {$ref: '#/components/schemas/AIProvider'}}
        slots: {type: array, items: {$ref: '#/components/schemas/AISlot'}}
        events: {type: array, items: {$ref: '#/components/schemas/AIEvent'}, description: 'The newest 50 changes, newest first.'}
        provider_limit: {type: integer}
        can_store_keys: {type: boolean, description: False while the server has no MAILBOX_TOKEN_KEYS; no key can be added.}
        allow_private_base_urls: {type: boolean, description: True when the operator lets workspace providers use private addresses and plain http.}
    AIProviderInput:
      type: object
      additionalProperties: false
      required: [kind, label, models]
      properties:
        kind: {$ref: '#/components/schemas/AIProviderKind'}
        label: {type: string, minLength: 1, maxLength: 80}
        base_url: {type: string, maxLength: 500, description: 'OpenAI-compatible only, with the version path: https://openrouter.ai/api/v1.'}
        api_key: {type: string, maxLength: 500, description: Required except for an OpenAI-compatible server on a private address the operator allowed.}
        models: {type: array, minItems: 1, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
    AIProviderChange:
      type: object
      additionalProperties: false
      properties:
        label: {type: string, minLength: 1, maxLength: 80}
        models: {type: array, minItems: 1, maxItems: 20, items: {type: string, minLength: 1, maxLength: 200}}
    AISlotInput:
      type: object
      additionalProperties: false
      required: [source, enabled]
      properties:
        source: {type: string, enum: [server, provider, none]}
        provider_id: {type: string, format: uuid, description: With source provider.}
        model: {type: string, maxLength: 200}
        effort: {type: string, enum: [low, medium, high], description: Low when left out.}
        enabled: {type: boolean}
    ExportLink:
      type: object
      required: [url, expires_in_seconds]
      properties:
        url: {type: string, description: 'Path on this server, for example /api/v1/export/download/<token>.'}
        expires_in_seconds: {type: integer}
    CheckoutPlan: {type: string, enum: [solo_monthly, solo_yearly, small_monthly, small_yearly, team_monthly, team_yearly, team25_monthly, team25_yearly, founding], description: '`solo_*`, `small_*` and `team25_*` are refused with 400 on a server that has no Polar product for them.'}
    FoundingSlots:
      type: object
      required: [slots, taken, open]
      properties:
        slots: {type: integer, description: Founding slots in total}
        taken: {type: [integer, 'null'], description: 'Slots held by active, trialing or past due subscriptions; null until counted'}
        open: {type: boolean, description: Whether Founding can still be bought}
    WebhookResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [applied, duplicate, stale, ignored]}
    Billing:
      type: object
      required: [plan, trial_ends_at, locked, status, current_period_end, cancel_at_period_end, active_subscriptions, complimentary, complimentary_until, limits, usage, checkout_plans, checkout_refusals, storage_upgrade_plan]
      properties:
        plan:
          type: string
          enum: [trial, solo, small, team, team25, founding, none]
          description: The plan in effect now. `trial` is the free trial; `none` means the trial is over and nothing is paid.
        trial_ends_at: {type: string, format: date-time, description: 'When the free trial ends or ended, whatever the plan.'}
        locked: {type: boolean, description: 'True when `plan` is `none`; the workspace refuses every route outside the locked allowlist.'}
        status:
          type: string
          enum: [none, incomplete, incomplete_expired, trialing, active, past_due, canceled, unpaid, paused, unknown]
          description: >
            The latest subscription status from the provider, `none` when there never was one.
            `past_due` keeps the paid plan while the provider retries the card; `canceled` keeps it
            until `current_period_end`; `unknown` is a status this version does not recognise and
            grants nothing. With several subscriptions the one that decides the plan is shown.
        current_period_end: {type: [string, 'null'], format: date-time}
        cancel_at_period_end: {type: boolean}
        active_subscriptions:
          type: integer
          description: >
            Subscriptions that grant a paid plan now. More than one means the workspace pays twice;
            cancel the extra one in the billing portal.
        complimentary:
          type: boolean
          description: >
            True when the plan in effect was granted by HC Labs instead of bought. Such a workspace
            has no billing account: checkout answers 409 and the portal is not available.
        complimentary_until:
          type: [string, 'null']
          format: date-time
          description: 'When a complimentary plan ends; null when it has no end or the plan is not complimentary.'
        checkout_refusals:
          type: array
          description: The checkout plans this workspace does not fit now, each with the reason checkout would give. The web app disables their buttons.
          items:
            type: object
            required: [plan, reason]
            additionalProperties: false
            properties:
              plan: {$ref: '#/components/schemas/CheckoutPlan'}
              reason: {type: string}
        storage_upgrade_plan:
          type: [string, 'null']
          enum: [solo, small, team, team25, founding, null]
          description: The plan this server sells with more storage and as many agents as the plan in effect, for the storage notice; null on the trial and when none is on sale.
        checkout_plans:
          type: array
          items: {$ref: '#/components/schemas/CheckoutPlan'}
          description: 'The plans this server can sell, in the order to offer them. `solo_*`, `small_*` and `team25_*` appear only for the Polar products this server has configured; the web app shows a purchase button for each plan listed and for no other. `founding` is dropped once Founding is closed.'
        limits:
          type: object
          required: [agents, storage_bytes, storage_warn_bytes, replies_per_24h]
          properties:
            agents: {type: integer, description: 'Seats of the plan; 0 when locked.'}
            replies_per_24h: {type: [integer, 'null'], description: 'People that emailed replies may reach in any 24 hours on the trial, each reply counting its contact and every Cc address; null on every other plan and self-hosted.'}
            storage_bytes:
              type: [integer, 'null']
              format: int64
              description: 'Attachment storage cap in bytes: 2 GiB on the trial and when locked (imported files do not count); 10 GiB on Solo, 30 GiB on Small, 20 GiB on Founding, 100 GiB on Team and 250 GiB on Team 25 (imported files count); null on self-hosted, which has none.'
            storage_warn_bytes:
              type: [integer, 'null']
              format: int64
              description: Usage at which the web app warns, 80% of `storage_bytes`; null when there is no cap.
        usage:
          type: object
          required: [agents, pending_invites, replies_last_24h, storage_bytes]
          properties:
            agents: {type: integer}
            storage_bytes:
              type: integer
              format: int64
              description: Attachment and knowledge base image bytes counted against `limits.storage_bytes`. On the trial files of imported messages are not counted; on a paid plan every file is, imported ones included.
            replies_last_24h:
              type: integer
              description: People reached by the emailed replies of the last 24 hours (the contact plus every Cc address of each reply), which count against the trial cap of 200; 0 on other plans.
            pending_invites:
              type: integer
              description: Unused, unrevoked, unexpired invites. Each holds an agent seat, so agents plus pending invites is compared with `limits.agents`.
    WorkspaceChoice:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
    CloudWorkspaceChoices:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/WorkspaceChoice'}
    Role: {type: string, enum: [admin, agent]}
    ConversationStatus: {type: string, enum: [open, pending, resolved, closed]}
    Priority: {type: string, enum: [low, normal, high, urgent]}
    ConversationChannel:
      type: string
      enum: [email, web_form, imported, agent, problem_report]
      description: >-
        How the conversation started. email: a customer's mail. web_form: the public web form.
        imported: brought over from another helpdesk (its original channel is in origin.source).
        agent: a team member started it in Colliedesk; an older image that does not know this field
        also writes agent. problem_report: an agent's Report a problem.
    ConversationSort: {type: string, enum: [updated_desc, updated_asc, created_desc, created_asc, priority, waiting_longest], default: updated_desc}
    ConversationFilters:
      type: object
      additionalProperties: false
      description: >-
        The filters of `GET /api/v1/conversations` as one object; a list holds the values the query
        string separates with commas. An empty object is every conversation, most recently updated first.
      properties:
        status: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/ConversationStatus'}}
        priority: {type: array, maxItems: 4, uniqueItems: true, items: {$ref: '#/components/schemas/Priority'}}
        assignee:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, description: 'me, unassigned, anyone or a team member id'}
        tag: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, format: uuid}}
        tag_match: {type: string, enum: [any, all]}
        contact: {type: string, format: uuid}
        organization: {type: string, minLength: 1, maxLength: 200}
        awaiting: {type: string, enum: [team, customer]}
        has_pending_draft: {type: boolean}
        delivery_failed: {type: boolean}
        source: {type: string, enum: [imported, native]}
        channel: {type: array, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/ConversationChannel'}}
        created_after: {type: string, format: date-time}
        created_before: {type: string, format: date-time}
        updated_after: {type: string, format: date-time}
        updated_before: {type: string, format: date-time}
        sort: {$ref: '#/components/schemas/ConversationSort'}
        search: {type: string, minLength: 1, maxLength: 200}
    SavedViewScope: {type: string, enum: [personal, shared]}
    SavedViewInput:
      type: object
      required: [name, scope, filters]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        scope: {$ref: '#/components/schemas/SavedViewScope'}
        filters: {$ref: '#/components/schemas/ConversationFilters'}
    SavedViewChange:
      type: object
      required: [updated_at]
      minProperties: 2
      additionalProperties: false
      properties:
        updated_at: {type: string, format: date-time, description: 'The updated_at of the view as the caller last read it. If someone saved it since, nothing changes (409 changed_elsewhere).'}
        name: {type: string, minLength: 1, maxLength: 80}
        scope: {$ref: '#/components/schemas/SavedViewScope'}
        filters: {$ref: '#/components/schemas/ConversationFilters'}
    SavedView:
      type: object
      required: [id, name, scope, filters, owner_agent_id, created_at, updated_at, deleted_at, purges_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scope: {$ref: '#/components/schemas/SavedViewScope'}
        filters: {$ref: '#/components/schemas/ConversationFilters'}
        owner_agent_id: {type: [string, 'null'], format: uuid, description: The person a personal view belongs to; null for a shared view.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
        purges_at: {type: [string, 'null'], format: date-time, description: When a deleted view is removed for good.}
    Workspace:
      type: object
      required: [id, slug, name, timezone]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        timezone: {type: string, default: UTC}
    Agent:
      type: object
      required: [id, email, display_name, role, timezone_override]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        timezone_override: {type: [string, 'null']}
    DisplayNameInput:
      type: string
      maxLength: 80
      description: >
        Leading and trailing spaces are removed; the rest may be at most 80 characters and may not hold
        control characters or text-direction overrides. An empty string clears the name.
    TeamMember:
      type: object
      required: [id, email, display_name, role, timezone_override, deactivated_at, last_active_at, open_conversations]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        timezone_override: {type: [string, 'null']}
        deactivated_at:
          type: [string, 'null']
          format: date-time
          description: Null for an active agent.
        last_active_at:
          type: [string, 'null']
          format: date-time
          description: The last time a session of the agent was used; null when none ever was.
        open_conversations:
          type: integer
          description: Open and pending conversations assigned to the agent; a deactivation moves them.
    Redeemed:
      type: object
      required: [agent, workspace]
      properties:
        token: {type: string}
        agent: {$ref: '#/components/schemas/Agent'}
        workspace: {$ref: '#/components/schemas/Workspace'}
    OnboardingGoal:
      type: string
      enum: [leave_helpdesk, shared_inbox, lower_cost, ai_agents, other]
      description: What the team wants Colliedesk to do first, asked at cloud sign-up.
    OnboardingRole:
      type: string
      enum: [founder, support_lead, support_agent, developer, other]
      description: The role of the person who signed up.
    OnboardingSource:
      type: string
      enum: [x, email, search, reddit, github, referral, other]
      description: Where the person heard of Colliedesk.
    Me:
      type: object
      required: [agent, workspace, timezone, scope, plan, onboarding_goal]
      properties:
        agent: {$ref: '#/components/schemas/Agent'}
        workspace: {$ref: '#/components/schemas/Workspace'}
        timezone: {type: string}
        onboarding_goal:
          description: The goal given at cloud sign-up; the empty inbox starts with the matching step. Null when none was given and on self-hosted instances.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/OnboardingGoal'}
        scope:
          description: The tier of the agent token making the call (read, draft or send); null for a person's own session.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/TokenScope'}
        plan:
          description: The trial and lock state, so every agent sees it. Null on self-hosted instances.
          oneOf:
            - type: 'null'
            - type: object
              required: [plan, trial_ends_at, locked, trial_extended, agents_over, seat_paused]
              properties:
                plan: {type: string, enum: [trial, solo, small, team, team25, founding, none]}
                agents_over: {type: integer, description: How many active agents the workspace has beyond its plan's agent cap; 0 when it fits.}
                seat_paused: {type: boolean, description: 'True when this agent is beyond the cap and paused (requests answer 402 `seat_paused`).'}
                trial_ends_at: {type: string, format: date-time}
                locked: {type: boolean}
                trial_extended: {type: boolean, description: True when a Freshdesk import already extended the trial.}
    TokenScope:
      type: string
      enum: [read, draft, send, admin]
      description: >
        Tier of an agent token. `read`: read what an agent may read, including the session and invite
        lists and the channel settings without links or secrets. `draft`: also change status, priority,
        assignee and tags of a conversation, create tags, add private notes and set the owner's own
        timezone. `send`: also send and retry replies, rename and delete tags, create, rename and merge
        contacts, create conversations, and write saved replies. `admin`: also workspace settings, the team, revoking
        invites, the web form and email channel, and sessions; it acts with the creator's role, so only
        an admin can create it and it loses admin rights when its creator is demoted.
    AgentToken:
      type: object
      required: [token, session]
      properties:
        token: {type: string, description: 'Raw bearer value, starting with cdk_agent_; Colliedesk stores only a hash of it and never shows it again'}
        session: {$ref: '#/components/schemas/Session'}
    Session:
      type: object
      required: [id, agent_id, agent_email, label, scope, current, created_at, last_seen_at, expires_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        agent_email: {type: string, format: email}
        label: {type: string}
        scope:
          description: The tier of an agent token; null for a person's session, which has no tier.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TokenScope'
        current:
          type: boolean
          description: True for the session that made this request, so a client can mark "this device".
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    Invite:
      type: object
      required: [id, email, role_ceiling, created_by_email, created_at, expires_at, used_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role_ceiling: {$ref: '#/components/schemas/Role'}
        created_by_email: {type: string, format: email}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        used_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    Contact:
      type: object
      required: [id, name, email, organization, merged_into_id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        organization: {type: [string, 'null'], description: 'Company or organization name, for example imported from a Freshdesk company'}
        merged_into_id: {type: [string, 'null'], format: uuid, description: 'The contact this one was merged into; null for a contact of its own'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ContactDetail:
      allOf:
        - {$ref: '#/components/schemas/Contact'}
        - type: object
          required: [conversation_count, merged_into, merges]
          properties:
            conversation_count: {type: integer, minimum: 0, description: 'Conversations of the contact, any status, imported ones included'}
            merged_into:
              description: The contact this one was merged into, or null. Its conversations and new mail are there.
              oneOf:
                - {type: 'null'}
                - {$ref: '#/components/schemas/Contact'}
            merges:
              type: array
              description: Contacts merged into this one and not undone, newest first
              items: {$ref: '#/components/schemas/ContactMerge'}
    ContactMerge:
      type: object
      required: [id, contact_id, merged_contact, conversation_ids, merged_by_agent_id, merged_at, undone_at]
      properties:
        id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid, description: The contact that was kept}
        merged_contact: {$ref: '#/components/schemas/Contact'}
        conversation_ids:
          type: array
          description: The conversations the merge moved; undoing it moves back those still on the kept contact
          items: {type: string, format: uuid}
        merged_by_agent_id: {type: [string, 'null'], format: uuid}
        merged_at: {type: string, format: date-time}
        undone_at: {type: [string, 'null'], format: date-time}
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        color: {type: string}
    SavedReplyInput:
      type: object
      required: [title, body]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 20000}
    SavedReply:
      type: object
      required: [id, title, body, created_by_agent_id, created_at, updated_at, last_change]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        created_by_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          description: The latest version of the reply; null only for a reply no history reaches.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyChange'}
    TrashedSavedReply:
      type: object
      required: [id, title, body, created_by_agent_id, created_at, updated_at, last_change, deleted_at, deleted_by, purges_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        created_by_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyChange'}
        deleted_at: {type: string, format: date-time}
        deleted_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        purges_at: {type: string, format: date-time, description: When the reply and its history are deleted for good (30 days after deleted_at).}
    SavedReplyPerson:
      type: object
      required: [agent_id, name]
      properties:
        agent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
    SavedReplyChange:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at]
      properties:
        version: {type: integer, minimum: 1}
        kind:
          type: string
          enum: [baseline, create, edit, delete, restore, undelete]
          description: 'baseline: the reply as it was when history started (edited before, so its author is unknown); restore: an earlier version made current again; undelete: taken out of the trash.'
        restored_from_version: {type: [integer, 'null'], description: The version a restore copied.}
        changed_by:
          description: The person who made the change (or approved the agent request that made it); null for an import or a removed person.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          description: The agent token that made or asked for the change; null when a person made it in the web app.
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid, description: The approved agent request that made the change.}
        created_at: {type: string, format: date-time}
    SavedReplyVersion:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at, title, body]
      properties:
        version: {type: integer, minimum: 1}
        kind: {type: string, enum: [baseline, create, edit, delete, restore, undelete]}
        restored_from_version: {type: [integer, 'null']}
        changed_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        title: {type: string, description: The title after this change.}
        body: {type: string, description: The text after this change.}
    KBCollectionInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        slug: {type: string, minLength: 1, maxLength: 120, description: 'Lowercase letters, digits and hyphens in any script; made from the name when left out.'}
        description: {type: string, maxLength: 2000}
        parent_id: {type: [string, 'null'], format: uuid}
        position: {type: integer, minimum: 0, maximum: 1000000}
    KBCollection:
      type: object
      required: [id, parent_id, name, slug, description, position, article_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        position: {type: integer}
        article_count: {type: integer, description: 'Articles directly in this collection and outside the trash, drafts included.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TrashedKBCollection:
      type: object
      required: [id, parent_id, name, slug, description, position, article_count, created_at, updated_at, deleted_at, deleted_by, purges_at]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        position: {type: integer}
        article_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        deleted_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        purges_at: {type: string, format: date-time, description: When it is deleted for good (30 days after deleted_at).}
    KBArticleInput:
      type: object
      required: [collection_id, title, body_md]
      properties:
        collection_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 300}
        slug: {type: string, minLength: 1, maxLength: 120, description: 'Lowercase letters, digits and hyphens in any script; made from the title when left out.'}
        body_md: {type: string, maxLength: 100000, description: 'The text in Markdown. Of raw HTML the help center shows only a YouTube or Vimeo player, an <iframe> whose src is https://www.youtube.com/embed/<id>, https://www.youtube-nocookie.com/embed/<id> or https://player.vimeo.com/video/<id>; anything else is left out when shown and kept as written.'}
        status: {type: string, enum: [draft, published], default: draft}
    KBArticleStatus:
      type: string
      enum: [draft, published]
      description: 'published: on the public help center while it is on. draft: only agents see it.'
    KBArticleChange:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at]
      properties:
        version: {type: integer, minimum: 1}
        kind:
          type: string
          enum: [create, edit, delete, restore, undelete, import, media_replace]
          description: 'restore: an earlier version made current again; undelete: taken out of the trash; import: written by an import from another help desk; media_replace: a library item was replaced in the text, or the replacement undone.'
        restored_from_version: {type: [integer, 'null'], description: The version a restore copied.}
        changed_by:
          description: The person who made the change (or approved the agent request that made it); null for an import or a removed person.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          description: The agent token that made or asked for the change; null when a person made it in the web app.
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid, description: The approved agent request that made the change.}
        created_at: {type: string, format: date-time}
    KBArticleSummary:
      type: object
      required: [id, number, collection_id, title, slug, status, published_at, author_agent_id, created_at, updated_at, last_change, url]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1, description: 'Never changes and is never reused in the workspace; the help center address is /a/<number>-<slug>.'}
        collection_id: {type: string, format: uuid}
        title: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        published_at: {type: [string, 'null'], format: date-time, description: When it was last published; null for a draft.}
        author_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/KBArticleChange'}
        url:
          type: string
          format: uri
          description: >-
            The public address of the article, `<help center url>/a/<number>-<slug>` (see HelpCenter.url).
            It is the one to put in a reply. The help center shows the article there only while the
            article is published and the help center is on; a new slug is a new address, and the old
            one still leads to the article.
    KBArticleTranslation:
      type: object
      required: [locale, title, body_md, updated_at]
      properties:
        locale: {type: string}
        title: {type: string}
        body_md: {type: string}
        updated_at: {type: string, format: date-time}
    KBArticle:
      type: object
      required: [id, number, collection_id, title, slug, status, published_at, author_agent_id, created_at, updated_at, last_change, url, body_md, has_source_html, translations, deleted_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        collection_id: {type: string, format: uuid}
        title: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        published_at: {type: [string, 'null'], format: date-time}
        author_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/KBArticleChange'}
        url: {type: string, format: uri, description: 'The public address of the article, as in KBArticleSummary.'}
        body_md: {type: string}
        has_source_html: {type: boolean, description: An import kept the original HTML; it is in the workspace export and is never shown on the help center.}
        translations:
          type: array
          description: Translations an import brought in. They are kept and exported; the help center does not show them yet.
          items: {$ref: '#/components/schemas/KBArticleTranslation'}
        deleted_at: {type: [string, 'null'], format: date-time, description: Set while the article is in the trash.}
        missing_media:
          type: array
          description: 'Only in the answer to a save: ids the text names that no item of the media library has (it was purged, or never existed), shown as "Media no longer exists". The save went through.'
          items: {type: string, format: uuid}
    TrashedKBArticle:
      type: object
      required: [id, number, collection_id, title, slug, status, published_at, author_agent_id, created_at, updated_at, last_change, url, deleted_at, deleted_by, purges_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        collection_id: {type: string, format: uuid}
        title: {type: string}
        slug: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        published_at: {type: [string, 'null'], format: date-time}
        author_agent_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_change:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/KBArticleChange'}
        url: {type: string, format: uri, description: 'The public address of the article, as in KBArticleSummary.'}
        deleted_at: {type: string, format: date-time}
        deleted_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        purges_at: {type: string, format: date-time, description: When the article and its history are deleted for good (30 days after deleted_at).}
    KBArticleVersion:
      type: object
      required: [version, kind, restored_from_version, changed_by, token, agent_request_id, created_at, title, slug, body_md, status, collection_id]
      properties:
        version: {type: integer, minimum: 1}
        kind: {type: string, enum: [create, edit, delete, restore, undelete, import, media_replace]}
        restored_from_version: {type: [integer, 'null']}
        changed_by:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SavedReplyPerson'}
        token:
          oneOf:
            - {type: 'null'}
            - type: object
              required: [id, label]
              properties:
                id: {type: [string, 'null'], format: uuid}
                label: {type: string}
        agent_request_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        title: {type: string}
        slug: {type: string}
        body_md: {type: string}
        status: {$ref: '#/components/schemas/KBArticleStatus'}
        collection_id: {type: [string, 'null'], format: uuid, description: Null once that collection was deleted for good.}
    KBMedia:
      type: object
      required: [id, kind, content_type, size, sha256, url, name, alt, width, height, duration_ms, codecs, thumbnail_url, poster_url, kept, deleted_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [image, video]}
        content_type: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp, video/mp4, video/webm]}
        size: {type: integer, description: Bytes of the original.}
        sha256: {type: string}
        url: {type: string, description: 'The path to put in an article: /api/v1/kb/images/<id> for an image, /api/v1/kb/media/<id> for a video.'}
        name: {type: string, maxLength: 200, description: What the library shows; empty when nobody named it.}
        alt: {type: string, maxLength: 500, description: An image's alt text or a video's title; the editor offers it when it inserts the item.}
        width: {type: [integer, 'null'], description: Pixels as shown (a photo turned a quarter has width and height swapped); null until the server read them.}
        height: {type: [integer, 'null']}
        duration_ms: {type: [integer, 'null'], description: A video's length; null for an image or when the file does not say.}
        codecs: {type: array, items: {type: string}, description: A video's codecs; empty for an image.}
        thumbnail_url: {type: [string, 'null'], description: 'The thumbnail, /api/v1/kb/media/<id>/thumbnail?v=<version>; a new thumbnail gets a new version. Null while there is none.'}
        poster_url: {type: [string, 'null'], description: 'A video''s still picture, /api/v1/kb/media/<id>/poster/<version>; a new poster is a new URL. Null for an image or a video without one.'}
        kept: {type: boolean, description: The purge never deletes a kept item.}
        deleted_at: {type: [string, 'null'], format: date-time, description: Set while the item is in the library's trash.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        usage: {$ref: '#/components/schemas/KBMediaUsage'}
        purge_at: {type: string, format: date-time, description: 'When the purge deletes it: set only for an item nobody kept and no article ever saved.'}
    KBMediaUsage:
      type: object
      required: [articles, trashed_articles, older_versions]
      properties:
        articles: {type: integer, description: Live articles whose current text or a translation names it; above 0 means in use.}
        trashed_articles: {type: integer, description: Articles in the trash whose current text names it.}
        older_versions: {type: integer, description: Articles where only an older version names it.}
    KBMediaDetails:
      allOf:
        - {$ref: '#/components/schemas/KBMedia'}
        - type: object
          required: [articles]
          properties:
            articles:
              type: array
              items:
                type: object
                required: [id, number, title, status, in_trash, current]
                properties:
                  id: {type: string, format: uuid}
                  number: {type: integer}
                  title: {type: string}
                  status: {type: string, enum: [draft, published]}
                  in_trash: {type: boolean}
                  current: {type: boolean, description: False when only an older version names the item.}
    KBMediaResult:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [trashed, already_in_trash, in_use, not_found, restored, not_in_trash, purged]}
    KBMediaBatchResult:
      type: object
      required: [results, batch_id]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/KBMediaResult'}}
        batch_id: {type: [string, 'null'], format: uuid, description: 'The trash batch the moved items joined, for Undo; null when nothing moved.'}
    KBMediaReplacement:
      type: object
      required: [id, from_media_id, to_media_id, article_ids, translations, skipped_article_ids, created_at, undone_at]
      properties:
        id: {type: string, format: uuid}
        from_media_id: {type: string, format: uuid}
        to_media_id: {type: string, format: uuid}
        article_ids: {type: array, items: {type: string, format: uuid}, description: The articles that got a new version.}
        translations:
          type: array
          items:
            type: object
            required: [article_id, locale]
            properties:
              article_id: {type: string, format: uuid}
              locale: {type: string}
        skipped_article_ids: {type: array, items: {type: string, format: uuid}, description: 'After an undo: the articles (or their translations) that changed since the replacement and kept their text.'}
        created_at: {type: string, format: date-time}
        undone_at: {type: [string, 'null'], format: date-time}
    KBMediaUpload:
      type: object
      required: [id, kind, name, size, offset, part_size, expires_at, media_id, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [video]}
        name: {type: string}
        size: {type: integer, description: The bytes announced.}
        offset: {type: integer, description: The bytes received; the next part starts here.}
        part_size: {type: integer, description: The most bytes one part may carry (8 MiB).}
        expires_at: {type: string, format: date-time, description: The parts are thrown away after this (24 hours after the start).}
        media_id: {type: [string, 'null'], format: uuid, description: The library item once the upload is complete.}
        created_by:
          description: Who started it; null once they left the workspace. Only they, or an admin, cancel it.
          oneOf: [{$ref: '#/components/schemas/SavedReplyPerson'}, {type: 'null'}]
        created_at: {type: string, format: date-time}
    KBMediaUnusedSummary:
      type: object
      required: [count, bytes, kept_count, kept_bytes]
      description: Every unused item the filter selects, not only the page; kept items apart. Bytes count the original and a video's poster.
      properties:
        count: {type: integer}
        bytes: {type: integer}
        kept_count: {type: integer}
        kept_bytes: {type: integer}
    HelpCenterInput:
      type: object
      required: [enabled, title, locale]
      properties:
        enabled: {type: boolean}
        title: {type: string, maxLength: 200, description: Shown at the top of every page; empty uses the workspace name.}
        locale: {type: string, minLength: 2, maxLength: 35, description: 'BCP 47 language tag of the pages, such as en or pt-BR.'}
    HelpCenter:
      type: object
      required: [enabled, title, locale, content_version, updated_at, url]
      properties:
        enabled: {type: boolean}
        title: {type: string}
        locale: {type: string}
        content_version: {type: integer, minimum: 0}
        updated_at: {type: [string, 'null'], format: date-time, description: Null until the knowledge base or its settings were first changed.}
        url:
          type: string
          format: uri
          description: >-
            The public address of the help center, also while it is off: `<APP_ORIGIN>/help/<slug>` on
            a self-hosted server, `https://<slug>.<HELP_CENTER_DOMAIN>` when the server sets that
            variable and the slug can be a host name. Changing the workspace slug changes it, and links
            to the old address stop working.
    SavedReplyText:
      type: object
      required: [title, body, updated_at]
      properties:
        title: {type: string}
        body: {type: string}
        updated_at: {type: string, format: date-time}
    Conversation:
      type: object
      required: [id, contact_id, contact_name, subject, status, priority, assignee_id, tags, channel, origin, created_at, updated_at, latest_reply_number]
      properties:
        latest_reply_number: {type: integer, minimum: 0, description: 'The reply_number of the newest reply; 0 before the first. Send it as seen_reply_number with a reply.'}
        id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid}
        contact_name: {type: string}
        subject: {type: string}
        status: {$ref: '#/components/schemas/ConversationStatus'}
        priority: {$ref: '#/components/schemas/Priority'}
        assignee_id: {type: [string, 'null'], format: uuid}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        channel: {$ref: '#/components/schemas/ConversationChannel'}
        origin:
          description: Where an imported conversation came from; null for conversations created in Colliedesk.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/ConversationOrigin'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ConversationOrigin:
      type: object
      required: [system, external_id, type, source, due_at, first_response_due_at, cc, forwarded_to]
      properties:
        system: {type: string, description: 'Source system, for example freshdesk'}
        external_id: {type: string, description: Ticket id in the source system}
        responder_external_id:
          type: [string, 'null']
          description: >-
            Id of the source agent the ticket was assigned to, so it can be linked to a Colliedesk agent
            later. Missing or null on imports that predate it and when the ticket had no agent.
        type: {type: [string, 'null'], description: Ticket type in the source system}
        source: {type: [string, 'null'], description: 'Channel the ticket came from: email, portal, phone, chat, feedback_widget, outbound_email or other'}
        due_at: {type: [string, 'null'], format: date-time}
        first_response_due_at: {type: [string, 'null'], format: date-time}
        cc: {type: array, items: {type: string}}
        forwarded_to: {type: array, items: {type: string}}
    BulkConversationUpdate:
      type: object
      required: [ids, changes]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        changes:
          type: object
          minProperties: 1
          properties:
            status: {$ref: '#/components/schemas/ConversationStatus'}
            assignee_id: {type: [string, 'null'], format: uuid}
            add_tag_ids: {type: array, items: {type: string, format: uuid}, maxItems: 50}
            remove_tag_ids: {type: array, items: {type: string, format: uuid}, maxItems: 50}
    BulkConversationUpdateResult:
      type: object
      required: [updated]
      properties:
        updated: {type: integer, minimum: 1}
    ConversationPage:
      type: object
      required: [items, page, page_size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
    ReplyConflict:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, latest_reply_number, newer_replies]
          properties:
            code: {type: string, enum: [reply_conflict]}
            message: {type: string}
            request_id: {type: string}
            latest_reply_number: {type: integer, minimum: 1, description: Send this as seen_reply_number to send anyway.}
            newer_replies:
              type: array
              description: The replies after the sender's seen_reply_number, oldest first by created_at.
              items: {$ref: '#/components/schemas/Message'}
    PresenceClientID:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: A random id a browser tab makes when the page loads (not stored across reloads), or a fixed name an agent token picks.
    PresenceUpdate:
      type: object
      additionalProperties: false
      required: [client_id, writing]
      properties:
        client_id: {$ref: '#/components/schemas/PresenceClientID'}
        writing: {type: boolean, description: The reply box (not a private note) holds text that is not sent yet.}
        edited: {type: boolean, default: false, description: The reply text changed since the last call; keeps `edited_at` current.}
        hidden: {type: boolean, default: false, description: The tab is in the background; the answer then asks for fewer calls.}
    ConversationViewer:
      type: object
      required: [agent_id, name, writing, writing_since, edited_at, agent_token]
      properties:
        agent_id: {type: string, format: uuid}
        name: {type: string, description: 'Display name, or the email when there is none'}
        writing: {type: boolean, description: A reply not sent yet is open in one of their tabs.}
        writing_since:
          type: [string, 'null']
          format: date-time
          description: When that reply was started; null when not writing.
        edited_at:
          type: [string, 'null']
          format: date-time
          description: When that reply last changed; a reply untouched for minutes is a draft left open, not someone typing. Null when not writing.
        agent_token:
          description: The agent token an AI agent has the conversation open with, acting as `agent_id`; null for a person.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageAgentToken'}
    ConversationPresence:
      type: object
      required: [viewers, heartbeat_seconds]
      properties:
        viewers:
          type: array
          description: Everyone else who has the conversation open, once per person and per agent token, people first then by name. The caller's own tabs are left out.
          items: {$ref: '#/components/schemas/ConversationViewer'}
        heartbeat_seconds: {type: integer, minimum: 1, description: Call again after this many seconds to stay listed.}
    InboxActivity:
      type: object
      required: [now, new_conversations, assigned_to_me, updated, viewing]
      properties:
        now: {type: string, format: date-time}
        viewing:
          type: array
          maxItems: 200
          description: >-
            Who else has a conversation open right now, on every call (the first one included), so the
            inbox list can mark those conversations: the same viewers `PUT
            /api/v1/conversations/{id}/presence` answers, per conversation. The caller's own tabs are left
            out; conversations nobody else has open are not listed.
          items:
            type: object
            required: [conversation_id, viewers]
            properties:
              conversation_id: {type: string, format: uuid}
              viewers:
                type: array
                minItems: 1
                items: {$ref: '#/components/schemas/ConversationViewer'}
        new_conversations:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, subject, contact_name, created_at]
            properties:
              id: {type: string, format: uuid}
              subject: {type: string}
              contact_name: {type: string}
              created_at: {type: string, format: date-time}
        assigned_to_me:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, subject, contact_name, assigned_at]
            properties:
              id: {type: string, format: uuid}
              subject: {type: string}
              contact_name: {type: string}
              assigned_at: {type: string, format: date-time}
        updated:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, subject, contact_name, assignee_id, updated_at, incoming_at]
            properties:
              id: {type: string, format: uuid}
              subject: {type: string}
              contact_name: {type: string}
              assignee_id: {type: [string, 'null'], format: uuid}
              updated_at: {type: string, format: date-time}
              incoming_at:
                type: [string, 'null']
                format: date-time
                description: Time of the newest customer message inside the polled window, or null when the change was not a customer message.
    Message:
      type: object
      required: [id, conversation_id, author_agent_id, author_name, agent_token, agent_request_id, kind, body, body_html, origin, attachments, cc, created_at, delivery, email, reply_number]
      properties:
        reply_number:
          type: [integer, 'null']
          minimum: 1
          description: The replies of a conversation numbered 1, 2, 3... in the order they were stored (an imported reply gets the next number whatever its time); null for a note or a customer message.
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        author_agent_id: {type: [string, 'null'], format: uuid}
        author_name: {type: [string, 'null'], description: 'Who wrote the message: the name stored with an imported message, else the team member''s display name (or email), else for incoming mail the conversation contact''s name when the contact sent it; null when none applies'}
        agent_token:
          description: The agent token the message was written with; null for what a person wrote and for incoming mail.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageAgentToken'}
        agent_request_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The agent request whose approval sent this message (a reply draft): `agent_token` drafted it,
            `author_agent_id` approved and sent it. Null otherwise.
        kind: {type: string, enum: [incoming, outgoing, note]}
        body: {type: string}
        body_html:
          type: [string, 'null']
          description: >-
            Original HTML of an imported or incoming email. Untrusted content: render it only in a
            sandboxed frame that runs no scripts. For a signed-in person, every remote `<img src>` is
            rewritten to `/api/v1/mail-image` (the image proxy) and `srcset` is removed, so the frame
            can load images from the Colliedesk origin and nowhere else. An agent token reads the HTML
            as stored.
        origin:
          description: Where an imported message came from; null for messages written in Colliedesk.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageOrigin'}
        attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        cc:
          description: Addresses an outgoing reply was copied to; empty for every other message.
          allOf: [{$ref: '#/components/schemas/CopiedAddresses'}]
        created_at: {type: string, format: date-time}
        delivery:
          description: Email delivery of an outgoing reply; null when the reply was not emailed.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MessageDelivery'}
        email:
          description: Envelope details of an incoming email; null for messages that did not arrive by email.
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/IncomingEmail'}
    MessageAgentToken:
      type: object
      required: [id, label, scope, agent_name]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, description: 'Name the token was given when it was created, for example Claude Code'}
        scope: {$ref: '#/components/schemas/TokenScope'}
        agent_name: {type: string, description: 'Display name, or the email when there is none, of the agent the token acts as'}
    CopiedAddresses:
      type: array
      maxItems: 10
      description: Plain email addresses copied on a reply, lowercase, without duplicates.
      items: {type: string}
    MessageOrigin:
      type: object
      required: [system, external_id, kind, from, to, cc, bcc]
      properties:
        system: {type: string}
        external_id: {type: string}
        author_external_id:
          type: [string, 'null']
          description: >-
            Id of the source agent who wrote the item, so it can be linked to a Colliedesk agent later.
            Missing or null on imports that predate it and when a customer wrote it.
        kind:
          type: string
          enum: [description, reply, incoming, automated_response, private_note, public_note, forward, forwarded_email, other]
          description: >-
            How the source system classified the item. public_note was visible to the customer there;
            forward went to a third party, not to the customer; automated_response is an automatic reply
            from the customer side (an out-of-office or a messenger acknowledgement) that the source
            flagged, which the timeline folds into one line.
        from: {type: [string, 'null']}
        to: {type: array, items: {type: string}}
        cc: {type: array, items: {type: string}}
        bcc: {type: array, items: {type: string}}
    TimeEntry:
      type: object
      required: [id, conversation_id, agent_id, agent_name, minutes, note, billable, executed_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        agent_id: {type: [string, 'null'], format: uuid}
        agent_name: {type: string}
        minutes: {type: integer, minimum: 0}
        note: {type: string}
        billable: {type: boolean}
        executed_at: {type: string, format: date-time}
    Attachment:
      type: object
      required: [id, message_id, filename, content_type, size, sha256, inline, created_at]
      properties:
        id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        filename: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        inline:
          type: boolean
          description: >-
            True when the bytes are embedded in the message's `body_html` (an inline image shown in the
            formatted message), so the message view need not list the file again. The file stays stored and
            downloadable. Set by the server only when the image was actually embedded.
        created_at: {type: string, format: date-time}
    DeliveryStatus: {type: string, enum: [queued, sent, failed]}
    MessageDelivery:
      type: object
      required: [status, attempts, last_error, sent_at]
      properties:
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        attempts: {type: integer, minimum: 0}
        last_error:
          type: [string, 'null']
          description: >
            Why a failed or retried delivery did not go out. On a sent reply, names the copied (Cc)
            addresses it did not reach: refused by the relay or bounced later. A copy that misses
            never fails the reply to the contact.
        sent_at: {type: [string, 'null'], format: date-time}
    EmailAuthentication:
      type: string
      enum: [pass, fail, none]
      description: Upstream SPF/DKIM/DMARC verdict from Authentication-Results; `none` when no verdict was present.
    IncomingEmail:
      type: object
      required: [from, authentication, attachments, original_attachment_id]
      properties:
        from: {type: string}
        authentication: {$ref: '#/components/schemas/EmailAuthentication'}
        via:
          type: string
          enum: [platform, workspace, web_form]
          description: >-
            Door the message came through; absent on mail stored before this was recorded. `web_form`
            is text typed into the public web form: the address is unverified (authentication `none`).
            Trial replies need `platform`.
        cc:
          type: array
          description: >-
            Other addresses on the Cc line of the email (not the sender, not our own addresses), as the
            reply box offers them to copy. Absent on mail stored before Cc was kept.
          items: {type: string}
        original_attachment_id:
          type: [string, 'null']
          format: uuid
          description: >-
            Attachment holding the complete raw message, gzip-compressed (original-message.eml.gz).
            Null for mail received before raw messages were kept.
        attachments:
          type: array
          description: >-
            Names of the files in the message. Their bytes are in the message's `attachments` (mail received
            before attachments were stored lists names only).
          items:
            type: object
            required: [filename, content_type]
            properties:
              filename: {type: string}
              content_type: {type: string}
    EmailChannel:
      type: object
      required: [support_address, sender_name, secret_set, secret_rotated_at, domain, domain_verified_at, dns_record_name, dns_record_value, dns_records, dns_records_expired_at, created_at, updated_at]
      properties:
        support_address: {type: string, format: email}
        sender_name:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            The name customers see in the From line of every reply this channel sends (with " via Colliedesk"
            while the domain is not verified) and in Reply-To. Renaming the workspace does not change it.
        secret_set: {type: boolean}
        dns_records:
          type: array
          description: >
            Records to publish when the server verifies domains through its email provider
            (`domain_verification` is `provider`), with the provider's last reported status for each.
            Empty when it uses the TXT record above, or before the provider has created the domain.
          items: {$ref: '#/components/schemas/EmailDNSRecord'}
        dns_records_expired_at:
          type: [string, 'null']
          format: date-time
          description: >
            Set when the provider domain stayed unverified for 7 days and was released, so `dns_records` is empty.
            Verifying again creates a new one and clears this.
        secret_rotated_at: {type: [string, 'null'], format: date-time}
        domain: {type: string}
        domain_verified_at: {type: [string, 'null'], format: date-time}
        dns_record_name: {type: string, description: TXT record name that proves control of the domain}
        dns_record_value: {type: string, description: Value the TXT record must hold}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EmailSendingPause:
      type: object
      required: [paused_at, reason]
      properties:
        paused_at: {type: string, format: date-time}
        reason: {type: string, description: The complaint count and rate that caused the pause}
    EmailDNSRecord:
      type: object
      required: [record, type, name, value, priority, status]
      properties:
        record: {type: string, description: 'Purpose of the record as the provider names it, for example SPF or DKIM'}
        type: {type: string, description: 'DNS record type, for example TXT, CNAME or MX'}
        name: {type: string, description: Host name to publish the record under}
        value: {type: string}
        priority: {type: [integer, 'null'], description: MX priority; null for other types}
        status: {type: string, description: 'Provider status, for example not_started, pending, verified, failed'}
    SMTPStatus:
      type: object
      required: [configured, host, port, starttls, authenticated]
      properties:
        configured: {type: boolean}
        host: {type: string}
        port: {type: integer}
        starttls: {type: boolean}
        authenticated: {type: boolean}
    EmailChannelSettings:
      type: object
      required: [channel, inbound_url, smtp, from_policy, sending_from, hosted_address, domain_verification, sending_pause, gmail]
      properties:
        gmail: {$ref: '#/components/schemas/GmailSettings'}
        sending_pause:
          description: >
            Set when the workspace's email sending is paused after spam complaints (3 or more in 7 days and
            more than 0.3% of the replies sent). Replies can still be written; they stay queued with a
            note until an operator resumes sending with `collie email resume`. Admins cannot clear it.
          oneOf:
            - {type: 'null'}
            - $ref: '#/components/schemas/EmailSendingPause'
        domain_verification:
          type: string
          enum: [txt, provider]
          description: >
            How the support address domain is verified. `txt`: publish `channel.dns_record_name` and
            `channel.dns_record_value`. `provider`: publish the records in `channel.dns_records`, which
            give replies a DKIM signature for the domain.
        hosted_address:
          type: [string, 'null']
          description: >
            Forwarding address of this workspace on the hosted cloud, `support@<slug>.<HOSTED_MAIL_DOMAIN>`.
            Null when the server has no HOSTED_MAIL_DOMAIN (self-host) or the slug cannot be a mail
            subdomain; change the slug with `PATCH /api/v1/workspace/slug`.
        from_policy:
          type: string
          enum: [verified, any]
          description: '`verified`: send as the support address only after domain verification. `any`: always (operator owns the relay).'
        sending_from:
          type: [string, 'null']
          description: >-
            The From address replies use now; null when replies cannot be emailed. With Gmail connected it is the
            Gmail address, and null while that connection has failed (replies never fall back to SMTP then).
        channel:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/EmailChannel'}
        inbound_url: {type: string, format: uri}
        smtp: {$ref: '#/components/schemas/SMTPStatus'}
    GmailSettings:
      type: object
      required: [available, missing_settings, redirect_uri, connection]
      properties:
        available:
          type: boolean
          description: Whether this server can connect Gmail (its operator set the Google OAuth client and token keys).
        missing_settings:
          type: array
          items: {type: string, enum: [GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, MAILBOX_TOKEN_KEYS]}
          description: The server settings still needed before Gmail can be connected; empty when available.
        redirect_uri:
          type: string
          format: uri
          description: The redirect URI to register on the OAuth client in Google Cloud console.
        connection:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/MailboxConnection'}
    MailboxConnection:
      type: object
      required: [provider, address, status, error_code, error, failed_at, connected_at]
      properties:
        provider: {type: string, enum: [google]}
        address: {type: string, format: email, description: The Google account replies are sent from.}
        status:
          type: string
          enum: [connected, failed]
          description: '`failed` when Google stopped honouring the grant: replies fail with `error` until an admin reconnects.'
        error_code: {type: [string, 'null'], enum: [revoked, permission, null], description: 'revoked: Google refuses the grant. permission: Gmail refuses to send for it.'}
        error: {type: [string, 'null']}
        failed_at: {type: [string, 'null'], format: date-time}
        connected_at: {type: string, format: date-time}
    InboundEmailResult:
      type: object
      required: [status, reason, conversation_id, message_id, authentication]
      properties:
        status: {type: string, enum: [created, threaded, duplicate, dropped]}
        reason: {type: [string, 'null'], description: 'Why a message was dropped: auto_submitted, bulk, mailer_daemon, own_message, own_address, unknown_recipient (no conversation for a reply+<token>@MAIL_FROM_DOMAIN recipient).'}
        conversation_id: {type: [string, 'null'], format: uuid}
        message_id: {type: [string, 'null'], format: uuid}
        authentication: {$ref: '#/components/schemas/EmailAuthentication'}
    WebFormSettings:
      type: object
      required: [enabled, allowed_origins, submit_path]
      properties:
        enabled: {type: boolean}
        allowed_origins: {type: array, items: {type: string}}
        submit_path: {type: string, description: Path a website posts to; the host is this instance}
    ProblemReportInput:
      type: object
      required: [description]
      additionalProperties: false
      properties:
        description: {type: string, minLength: 1, maxLength: 5000}
        diagnostics: {$ref: '#/components/schemas/ProblemReportDiagnostics'}
    ProblemReportDiagnostics:
      type: object
      description: >
        What the web app gathered in the browser. Ids, routes, status codes and error messages only;
        a query string is dropped from every path and long text is cut. Nothing a customer wrote.
      additionalProperties: false
      properties:
        app_version: {type: string, maxLength: 40}
        user_agent: {type: string, maxLength: 300}
        viewport:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 0, maximum: 20000}
            height: {type: integer, minimum: 0, maximum: 20000}
        page_path: {type: string, maxLength: 300, description: Address path without query or fragment}
        client_errors:
          type: array
          maxItems: 20
          items:
            type: object
            required: [message, source, at]
            properties:
              message: {type: string, maxLength: 2000}
              source: {type: string, maxLength: 100}
              at: {type: string, format: date-time}
        failed_api_calls:
          type: array
          maxItems: 20
          items:
            type: object
            required: [method, route, status, at]
            properties:
              method: {type: string, maxLength: 10}
              route: {type: string, maxLength: 300, description: Route template or path without query}
              status: {type: integer, minimum: 100, maximum: 599}
              request_id: {type: string, maxLength: 64, description: The X-Request-Id of the failed response}
              at: {type: string, format: date-time}
        product_events:
          type: array
          maxItems: 30
          items: {type: string, maxLength: 60}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string, description: 'The X-Request-Id of this response; quote it when you report a failure.'}
            fields:
              type: object
              description: 'Present on validation errors (422), one message per bad field name'
              additionalProperties: {type: string}
            retry_after_seconds: {type: integer, description: 'Only on trial_outbound_limit: seconds until a reply can be sent.'}
            check_error_code: {type: string, description: 'Only on ai_check_failed: why the provider check failed (auth, permission, model_not_found, blocked_address, quota_exhausted, timeout, unavailable…).'}
            offset: {type: integer, description: 'Only on upload_offset_mismatch: where the upload stands; send the part that starts there.'}
            articles:
              type: array
              description: 'Only on media_in_use: the live articles whose current text names the item.'
              items:
                type: object
                required: [id, number, title, status]
                properties:
                  id: {type: string, format: uuid}
                  number: {type: integer}
                  title: {type: string}
                  status: {type: string, enum: [draft, published]}
            refused_cc:
              type: array
              items: {type: string}
              description: 'Only on trial_outbound_restricted caused by Cc: exactly the addresses the trial refused to copy.'
            reason:
              type: string
              enum: [contact_address_differs]
              description: >-
                Only on trial_outbound_restricted when the customer wrote first, but from another address than
                the contact's (a contact merged into this one): the reply would go to `reply_to`, which never wrote.
            reply_to: {type: string, description: 'Only with reason contact_address_differs: the address the reply would go to.'}
            contact:
              description: 'Only on contact_exists: the contact to use instead of adding one.'
              allOf: [{$ref: '#/components/schemas/Contact'}]
